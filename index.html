<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Pocket 400"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#EDF0F3" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0F151C" media="(prefers-color-scheme: dark)"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/svg+xml" href="icon.svg"></head><body style="margin:0"><title>Pocket 400</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@87.5,600;87.5,700;87.5,800;100,400;100,500;100,600;100,700&display=swap">
<style>
/* Layout: one phone-width column; a learning path of tier units, a full-screen lesson overlay, and a bottom tab bar. */
:root{
  --bg:#EDF0F3; --sheet:#FFFFFF; --sheet-2:#F6F8FA; --ink:#182230; --ink-2:#3C4B5C; --muted:#6E7D8D; --rule:#D3DAE2; --rule-2:#E6EBF0;
  --accent:#2446A6; --accent-ink:#FFFFFF; --accent-soft:#E4EAF8;
  --got:#1F7A48; --got-soft:#DDF2E5; --part:#B36B00; --part-soft:#FBEBD0; --miss:#B4302A; --miss-soft:#F8DEDC; --none:#D5DCE3;
  --gold:#D08A16; --gold-ink:#FFFFFF;
  --t1:#9CB6E8; --t2:#6F93DD; --t3:#4A6FCB; --t4:#2E4FA8; --t5:#1B3270;
  --u1:#182230; --u2:#FFFFFF; --u3:#FFFFFF; --u4:#FFFFFF; --u5:#FFFFFF;
  --lift:rgba(24,34,48,.22);
  --shadow:0 1px 2px rgba(24,34,48,.06),0 8px 24px -12px rgba(24,34,48,.18);
  --display:"Archivo",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F151C; --sheet:#171F28; --sheet-2:#1D2630; --ink:#E7ECF1; --ink-2:#B9C4CF; --muted:#8694A3; --rule:#2B3743; --rule-2:#222C36;
    --accent:#7F9FF0; --accent-ink:#0F151C; --accent-soft:#1F2C47;
    --got:#5FC388; --got-soft:#163522; --part:#E7A94A; --part-soft:#3A2A10; --miss:#EF7E75; --miss-soft:#40201E; --none:#33404C;
    --gold:#E7A94A; --gold-ink:#1B1205;
    --t1:#3B4F77; --t2:#4C67A3; --t3:#6282CC; --t4:#86A2E6; --t5:#B4C6F3;
    --u1:#E7ECF1; --u2:#FFFFFF; --u3:#0F151C; --u4:#0F151C; --u5:#0F151C;
    --lift:rgba(0,0,0,.45);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F151C; --sheet:#171F28; --sheet-2:#1D2630; --ink:#E7ECF1; --ink-2:#B9C4CF; --muted:#8694A3; --rule:#2B3743; --rule-2:#222C36;
  --accent:#7F9FF0; --accent-ink:#0F151C; --accent-soft:#1F2C47;
  --got:#5FC388; --got-soft:#163522; --part:#E7A94A; --part-soft:#3A2A10; --miss:#EF7E75; --miss-soft:#40201E; --none:#33404C;
  --gold:#E7A94A; --gold-ink:#1B1205;
  --t1:#3B4F77; --t2:#4C67A3; --t3:#6282CC; --t4:#86A2E6; --t5:#B4C6F3;
  --u1:#E7ECF1; --u2:#FFFFFF; --u3:#0F151C; --u4:#0F151C; --u5:#0F151C;
  --lift:rgba(0,0,0,.45);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:var(--ink)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
.app{max-width:600px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}
body.in-session .app,body.in-session .tabs{display:none}

/* top bar */
.tb{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0 10px;background:var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:16;background:var(--bg)}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em;font-variation-settings:"wdth" 87.5;display:flex;align-items:center;gap:8px}
.brand i{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;letter-spacing:-.04em}
.stats{display:flex;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:var(--sheet);border:1px solid var(--rule);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.pill.streak{color:var(--gold)}
.pill.streak.off{color:var(--muted)}
.pill svg{width:18px;height:18px}
.ring circle{fill:none;stroke-width:3.2}
.ring .rb{stroke:var(--none)} .ring .rf{stroke:var(--accent);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
h1.pg{font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:-.02em;margin:6px 0 12px;font-variation-settings:"wdth" 87.5}

/* path */
.cont{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:6px}
.cont b{display:block;font-size:15.5px;line-height:1.25}
.cont small{display:block;color:var(--muted);font-size:12.5px}
.cont .go{margin-left:auto;flex:none;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;border-radius:10px;padding:9px 14px;box-shadow:0 3px 0 var(--lift)}
.unit{display:flex;justify-content:space-between;align-items:center;gap:12px;border-radius:14px;padding:14px 16px;margin:22px 0 6px;box-shadow:0 4px 0 var(--lift)}
.unit small{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.8}
.unit b{display:block;font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:-.015em;line-height:1.15;font-variation-settings:"wdth" 87.5}
.unit span{display:block;font-size:13px;opacity:.85}
.unit .up{flex:none;text-align:right;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.unit .up em{display:block;font-style:normal;font-size:22px;font-family:var(--display);font-variation-settings:"wdth" 87.5}
.u1{background:var(--t1);color:var(--u1)} .u2{background:var(--t2);color:var(--u2)} .u3{background:var(--t3);color:var(--u3)} .u4{background:var(--t4);color:var(--u4)} .u5{background:var(--t5);color:var(--u5)}
.nodes{display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px 0 4px}
.nwrap{position:relative;transform:translateX(var(--x));display:flex;flex-direction:column;align-items:center}
.nwrap.has-bub{margin-top:36px}
.node{width:66px;height:62px;border-radius:50%;display:grid;place-items:center;background:var(--none);color:var(--muted);box-shadow:0 6px 0 var(--lift);transition:transform .08s}
.node:active{transform:translateY(3px);box-shadow:0 3px 0 var(--lift)}
.node svg{width:28px;height:28px}
.node.done{background:var(--tc);color:var(--uc)}
.node.perfect{background:var(--gold);color:var(--gold-ink)}
.node.cur{background:var(--accent);color:var(--accent-ink);outline:5px solid var(--accent-soft);outline-offset:3px}
.node.part{background:var(--sheet);color:var(--accent);border:3px solid var(--accent)}
.bub{position:absolute;bottom:calc(100% + 10px);white-space:nowrap;background:var(--sheet);color:var(--accent);border:2px solid var(--rule);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:5px 11px;border-radius:9px;animation:bob 1.6s ease-in-out infinite}
.bub::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border:7px solid transparent;border-top-color:var(--rule)}
@keyframes bob{50%{transform:translateY(-4px)}}
.pop{position:relative;z-index:4;width:min(300px,86vw);margin-top:12px;background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:14px;box-shadow:var(--shadow);text-align:left}
.pop b{display:block;font-size:16px;line-height:1.3}
.pop small{display:block;color:var(--muted);font-size:13px;margin:2px 0 10px}
.pop .mini{margin-bottom:12px}
.unit-end{display:flex;justify-content:center;padding:6px 0 0;color:var(--muted);font-size:12.5px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:13px 18px;font-weight:700;font-size:15.5px;letter-spacing:.01em;background:var(--sheet);border:2px solid var(--rule);box-shadow:0 4px 0 var(--rule);transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--rule)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 4px 0 var(--lift)}
.btn.got{color:var(--got);border-color:var(--got);box-shadow:0 4px 0 var(--got-soft)}
.btn.part{color:var(--part);border-color:var(--part);box-shadow:0 4px 0 var(--part-soft)}
.btn.miss{color:var(--miss);border-color:var(--miss);box-shadow:0 4px 0 var(--miss-soft)}
.btn.block{width:100%}
.btn.small{padding:8px 12px;font-size:14px;border-radius:10px;box-shadow:0 3px 0 var(--rule)}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{color:var(--accent);font-weight:600;font-size:14px}
.mini{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--none)}
.mini i{display:block;height:100%}

/* cards and lists */
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow)}
.sec-h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 2px 8px}
.act{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;border-radius:14px;background:var(--sheet);border:1px solid var(--rule);box-shadow:var(--shadow)}
.act + .act{margin-top:10px}
.act .ic{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.act .ic svg{width:24px;height:24px}
.act b{display:block;font-size:16px;line-height:1.25}
.act small{display:block;color:var(--muted);font-size:13px}
.act .n{margin-left:auto;font-weight:800;font-size:20px;font-family:var(--display);font-variation-settings:"wdth" 87.5;font-variant-numeric:tabular-nums}
.ic.miss{background:var(--miss-soft);color:var(--miss)} .ic.flag{background:var(--accent-soft);color:var(--accent)} .ic.mix{background:var(--got-soft);color:var(--got)} .ic.card{background:var(--part-soft);color:var(--part)}
.act[disabled]{opacity:.5}
.rows{overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-top:1px solid var(--rule-2)}
.row:first-child{border-top:0}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:14.5px;font-weight:600;line-height:1.3}
.row .tx small{display:block;color:var(--muted);font-size:12.5px}
.row .tx .clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .mini{width:64px;flex:none}
.row .pct{width:40px;text-align:right;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--none)}
.dot.got{background:var(--got)} .dot.partial{background:var(--part)} .dot.missed{background:var(--miss)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;border:1px solid var(--rule);font-size:12px;font-weight:600;color:var(--ink-2);background:var(--sheet);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.chip.warn{border-color:var(--part);color:var(--part)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.filters select{flex:1 1 45%;min-width:0;padding:9px 10px;border-radius:10px;border:1px solid var(--rule);background:var(--sheet);font-size:14px}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--rule);background:var(--sheet);font-size:15px}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;padding:7px 12px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);font-size:13.5px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.count{font-size:13px;color:var(--muted);margin:8px 2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:14px;border-radius:14px;background:var(--sheet);border:1px solid var(--rule);box-shadow:var(--shadow)}
.tile small{display:block;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.tile b{display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:28px;font-weight:800;letter-spacing:-.02em;font-variation-settings:"wdth" 87.5;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:2px}
.tile b svg{width:24px;height:24px;color:var(--gold)}
.tile span{font-size:12.5px;color:var(--muted)}
.goal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.goal button{padding:12px 6px;border-radius:12px;border:2px solid var(--rule);background:var(--sheet);text-align:center}
.goal button b{display:block;font-size:15px}
.goal button small{color:var(--muted);font-size:12px}
.goal button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.week{display:flex;justify-content:space-between;gap:6px;padding:14px}
.week div{flex:1;text-align:center;font-size:11.5px;color:var(--muted);font-weight:600}
.week div i{display:grid;place-items:center;width:30px;height:30px;margin:0 auto 4px;border-radius:50%;background:var(--none);color:var(--sheet)}
.week div i.on{background:var(--gold);color:var(--gold-ink)}
.week div i svg{width:16px;height:16px}
.week div.today{color:var(--ink)}
.note-s{color:var(--muted);font-size:13px;margin:10px 2px}
details.nt{border-top:1px solid var(--rule-2)}
details.nt:first-child{border-top:0}
details.nt summary{padding:13px 14px;font-weight:600;font-size:15px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.nt summary::-webkit-details-marker{display:none}
details.nt summary span{color:var(--muted);font-weight:400;font-size:12.5px}
details.nt .body{padding:0 16px 14px;font-size:14.5px;line-height:1.55}
details.nt .body p{margin:0 0 10px}
details.nt .body ul{margin:0 0 10px;padding-left:20px}
.doc{padding:13px 14px;border-top:1px solid var(--rule-2)}
.doc:first-child{border-top:0}
.doc b{display:block;font-size:15px}
.doc p{margin:2px 0 0;color:var(--muted);font-size:13px}
.ref{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:8px;border:1px solid var(--rule);font-size:12.5px;color:var(--ink-2);text-decoration:none;margin:4px 4px 0 0}
a.ref{color:var(--accent)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}

/* deals */
.dhead{padding:16px}
.dhead small{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--part)}
.dhead h2{margin:2px 0 4px;font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.015em;line-height:1.2;font-variation-settings:"wdth" 87.5}
.dhead p{margin:0;color:var(--muted);font-size:13px}
.dnote{margin:12px 16px 0;padding:10px 12px;border-radius:10px;background:var(--part-soft);color:var(--ink);font-size:13.5px;line-height:1.45}
.dstats{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 16px}
.dstats div{padding:10px 12px;border-radius:10px;background:var(--sheet-2);border:1px solid var(--rule-2)}
.dstats small{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.dstats b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.dstats span{display:block;font-size:12px;color:var(--ink-2);line-height:1.35}
.pitch{padding:0 16px 16px}
.pitch .at{white-space:pre-wrap;font-size:15.5px;line-height:1.6}
.pitch .ask{margin-top:10px;color:var(--ink-2);font-size:14px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:700;font-size:15px;padding:12px 0 6px}

/* lesson session */
.ses{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ses-top{display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:640px;width:100%;margin:0 auto}
.ses-top .x{width:36px;height:36px;display:grid;place-items:center;color:var(--muted);border-radius:10px}
.ses-top .x svg{width:22px;height:22px}
.pbar{flex:1;height:14px;border-radius:7px;background:var(--none);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--got);border-radius:7px;transition:width .3s ease;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.ses-n{font-weight:700;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.ses-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 18px 24px;max-width:640px;width:100%;margin:0 auto}
.ses-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sq{font-family:var(--display);font-size:23px;font-weight:700;line-height:1.3;letter-spacing:-.012em;margin:0;font-variation-settings:"wdth" 87.5;white-space:pre-wrap;text-wrap:pretty}
.rbq{margin:12px 0 0;color:var(--muted);font-size:13.5px}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:13px 14px;border-radius:12px;border:2px solid var(--rule);background:var(--sheet);box-shadow:0 3px 0 var(--rule);font-size:15.5px;line-height:1.4}
.opt b{flex:none;width:24px;height:24px;border-radius:6px;border:2px solid var(--rule);display:grid;place-items:center;font-size:12.5px;color:var(--muted)}
.opt[data-picked="1"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 3px 0 var(--accent)}
.opt[data-res="right"]{border-color:var(--got);background:var(--got-soft);box-shadow:0 3px 0 var(--got)}
.opt[data-res="wrong"]{border-color:var(--miss);background:var(--miss-soft);box-shadow:0 3px 0 var(--miss)}
.ans{margin-top:20px;padding-top:16px;border-top:2px dashed var(--rule)}
.ans h3{margin:0 0 6px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ans .at{white-space:pre-wrap;font-size:16px;line-height:1.62}
.tip{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--part-soft);font-size:14.5px;line-height:1.5}
.tip b{color:var(--part)}
.refs{margin-top:12px}
.ses-foot{border-top:1px solid var(--rule);background:var(--sheet);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));margin-bottom:calc(-1 * env(safe-area-inset-bottom,0px))}
.ses-foot .in{max-width:608px;margin:0 auto}
.ses-foot .q3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ses-foot .q3 .btn{padding:13px 4px}
.ses-foot .sub{display:flex;justify-content:space-between;margin-top:10px}
.ses-foot .sub button{color:var(--muted);font-size:14px;font-weight:600;padding:4px 2px}
.ses-foot.fb-got{background:var(--got-soft);border-color:transparent}
.ses-foot.fb-partial{background:var(--part-soft);border-color:transparent}
.ses-foot.fb-missed{background:var(--miss-soft);border-color:transparent}
.fb{display:flex;align-items:center;gap:12px;font-weight:800;font-size:19px;min-height:52px}
.fb i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;font-style:normal}
.fb i svg{width:22px;height:22px}
.fb small{display:block;font-weight:600;font-size:13.5px;opacity:.85}
.fb-got .fb{color:var(--got)} .fb-got .fb i{background:var(--got);color:var(--sheet)}
.fb-partial .fb{color:var(--part)} .fb-partial .fb i{background:var(--part);color:var(--sheet)}
.fb-missed .fb{color:var(--miss)} .fb-missed .fb i{background:var(--miss);color:var(--sheet)}
.flash{margin-top:30px;min-height:240px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:26px 20px;border-radius:18px;background:var(--sheet);border:2px solid var(--rule);box-shadow:0 5px 0 var(--rule)}
.flash small{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.flash b{font-family:var(--display);font-size:26px;font-weight:800;margin:8px 0;font-variation-settings:"wdth" 87.5}
.flash p{margin:8px 0 0;font-size:16px;line-height:1.55}
.flash p.more{color:var(--part);font-size:14.5px}
.sum{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px 20px;max-width:520px;margin:0 auto;width:100%}
.sum .big{width:96px;height:96px;border-radius:28px;display:grid;place-items:center;background:var(--gold);color:var(--gold-ink);box-shadow:0 6px 0 var(--lift);margin-bottom:18px}
.sum .big svg{width:52px;height:52px}
.sum h2{font-family:var(--display);font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px;font-variation-settings:"wdth" 87.5}
.sum p{margin:0;color:var(--muted)}
.sum .tiles{width:100%;grid-template-columns:repeat(3,1fr);margin:22px 0}
.sum .tile{text-align:center;padding:12px 6px}
.sum .tile b{justify-content:center;font-size:24px}
.sum .goalhit{margin:-6px 0 18px;color:var(--gold);font-weight:700}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sheet);border-top:1px solid var(--rule);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs .in{max-width:600px;margin:0 auto;display:flex}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;color:var(--muted);font-size:11.5px;font-weight:700}
.tabs button svg{width:25px;height:25px}
.tabs button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--sheet);padding:9px 14px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:40}
.toast[data-on="1"]{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
const QUESTIONS = [{"id": "Q001", "src": "400", "section": "Finance Concepts", "q": "Explain the time value of money. Is money today worth more than money next year due to inflation?", "a": "No. The time value of money means you could invest money today and earn something additional with it by next year. Inflation also makes money less valuable over time, but the time value of money is about the potential returns of an investment made today.", "tip": null, "tier": 1, "rank": 1, "links": [{"t": "400Q guide p.46", "h": "", "k": "ref"}, {"t": "Generalist PDF p.3", "h": "", "k": "ref"}, {"t": "BIWS module 01", "h": "", "k": "ref"}, {"t": "Red Book p.45", "h": "", "k": "ref"}], "rbq": ["Could you explain the concept of present value and how it relates to company valuations?"], "n": 1, "so": 0}, {"id": "Q002", "src": "400", "section": "Finance Concepts", "q": "What does the “Discount Rate” mean?", "a": "The Discount Rate represents your opportunity cost or “targeted annualized return.” In other words, if you don’t invest in this company, how much could you earn over the long term by investing in other, similar companies? The Discount Rate represents the potential returns and the risk of other, similar opportunities. If the Discount Rate is higher, both the potential returns and the risk are higher; the opposite is true if the Discount Rate is lower.", "tip": null, "tier": 1, "rank": 2, "links": [{"t": "400Q guide p.46", "h": "", "k": "ref"}, {"t": "Generalist PDF p.3", "h": "", "k": "ref"}, {"t": "BIWS module 01", "h": "", "k": "ref"}, {"t": "Red Book p.54", "h": "", "k": "ref"}, {"t": "Red Book p.59", "h": "", "k": "ref"}], "rbq": ["Conceptually, what does the discount rate represent?", "WACC is an often-used criterion for deciding whether a project should be pursued. Which would have more of an impact on a DCF , the discount rate or sales growt"], "n": 2, "so": 0}, {"id": "Q003", "src": "400", "section": "Finance Concepts", "q": "Why is the Discount Rate higher if the potential returns are higher? Shouldn’t a company with higher potential returns have a lower Discount Rate, making it more valuable?", "a": "No. The Discount Rate is higher because the potential returns and the risk move together: If a stock could potentially go up by 10x, it’s much riskier than a stock that only has the potential to increase by 2x. The point is that there’s no such thing as a “free lunch”: Higher potential returns also mean that your chances of losing money are higher.", "tip": null, "tier": 1, "rank": 3, "links": [{"t": "400Q guide p.47", "h": "", "k": "ref"}, {"t": "Generalist PDF p.4", "h": "", "k": "ref"}, {"t": "BIWS module 01", "h": "", "k": "ref"}, {"t": "Red Book p.54", "h": "", "k": "ref"}, {"t": "Red Book p.57", "h": "", "k": "ref"}], "rbq": ["Conceptually, what does the discount rate represent?", "Does a higher beta translate into a higher or lower valuation?"], "n": 3, "so": 0}, {"id": "Q005", "src": "400", "section": "Finance Concepts", "q": "How much would you pay for a company that generates $100 of cash flow every single year into eternity?", "a": "Company Value = Cash Flow / (Discount Rate – Cash Flow Growth Rate), where Cash Flow Growth Rate < Discount Rate. If the cash flow does not grow at all, Company Value = Cash Flow / Discount Rate. So, if your Discount Rate, or “targeted yield,” is 10%, you’d pay $100 / 10% = $1,000. But if your targeted yield is 20%, you’d pay only $100 / 20% = $500 for this company.", "tip": "Shortcut: Value = CF ÷ r for a flat perpetuity ($100 ÷ 10% = $1,000); Value = CF × (1+g) ÷ (r − g) for a growing one. Interviewers flip between the two — listen for the word 'grows.'", "tier": 1, "rank": 4, "links": [{"t": "400Q guide p.47", "h": "", "k": "ref"}, {"t": "Generalist PDF p.4", "h": "", "k": "ref"}, {"t": "BIWS module 01", "h": "", "k": "ref"}, {"t": "Red Book: Corporate Finance Theory p.45", "h": "", "k": "ref"}], "rbq": [], "n": 4, "so": 0}, {"id": "Q006", "src": "400", "section": "Finance Concepts", "q": "A company generates $100 of cash flow today, and its cash flow is expected to grow at 5% per year for the long term. You could earn 10% per year by investing in other, similar companies. How much would you pay for this company?", "a": "Company Value = Cash Flow / (Discount Rate – Cash Flow Growth Rate), where Cash Flow Growth Rate < Discount Rate. So, this one becomes: $100 / (10% – 5%) = $2,000. A higher Discount Rate makes a company less valuable, and a higher cash flow growth rate makes a company more valuable.", "tip": null, "tier": 1, "rank": 5, "links": [{"t": "400Q guide p.48", "h": "", "k": "ref"}, {"t": "Generalist PDF p.5", "h": "", "k": "ref"}, {"t": "BIWS module 01", "h": "", "k": "ref"}, {"t": "Red Book: Corporate Finance Theory p.45", "h": "", "k": "ref"}], "rbq": [], "n": 5, "so": 0}, {"id": "Q013", "src": "400", "section": "Accounting – Concepts", "q": "What’s the most important financial statement?", "a": "The Cash Flow Statement is the most important single statement because it tells you how much cash a company generates, and almost all valuation is based on cash flow. The Income Statement includes non-cash revenue, expenses, and taxes, and excludes cash spending on major items such as Capital Expenditures, so it does not accurately represent a company’s cash flow.", "tip": null, "tier": 1, "rank": 6, "links": [{"t": "400Q guide p.51", "h": "", "k": "ref"}, {"t": "Generalist PDF p.8", "h": "", "k": "ref"}, {"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book p.13", "h": "", "k": "ref"}, {"t": "Red Book p.18", "h": "", "k": "ref"}], "rbq": ["Which is more important, the income statement or the cash flow statement?", "If you have a balance sheet and must choose between the income statement or cash flow statement, which would you pick?"], "n": 6, "so": 1}, {"id": "Q017", "src": "400", "section": "Accounting – Concepts", "q": "Why is Accounts Receivable (AR) an Asset but Deferred Revenue (DR) a Liability?", "a": "AR is an Asset because it provides a future benefit to the company – the receipt of additional cash from customers in the future. DR is a Liability because it represents future obligations for the company. The company has already collected the cash associated with the sale, so it must spend money in the future to deliver the product or service. AR and DR are opposites: AR has not yet been collected in cash but has been delivered, whereas DR has been collected in cash but has not yet been delivered.", "tip": null, "tier": 1, "rank": 7, "links": [{"t": "400Q guide p.52", "h": "", "k": "ref"}, {"t": "Generalist PDF p.9", "h": "", "k": "ref"}, {"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book p.23", "h": "", "k": "ref"}, {"t": "Red Book p.37", "h": "", "k": "ref"}], "rbq": ["Why is deferred revenue classified as a liability while accounts receivable is an asset?", "Why are increases in accounts receivable a cash reduction on the cash flow statement?"], "n": 7, "so": 1}, {"id": "Q042", "src": "400", "section": "Accounting – Calculations", "q": "A company buys a factory for $200 using $200 of Debt. What happens, INITIALLY, on the statements?", "a": "• IS: No changes. • CFS: There’s no net change in cash because the $200 factory purchase counts as CapEx, which reduces cash flow, and the $200 Debt issuance is a cash inflow. • BS: PP&E is up by $200, so the Assets side is up by $200, and Debt is up by $200, so the L&E side is up by $200, and the Balance Sheet stays balanced. • Intuition: An Asset increases, a Liability increases to balance it, and there are no tax effects.", "tip": null, "tier": 1, "rank": 8, "links": [{"t": "400Q guide p.68", "h": "", "k": "ref"}, {"t": "Generalist PDF p.25", "h": "", "k": "ref"}, {"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book p.24", "h": "", "k": "ref"}], "rbq": ["What happens to the three financial statements if a company initiates a dividend?"], "n": 8, "so": 2}, {"id": "Q047", "src": "400", "section": "Equity Value & Enterprise Value – Concepts", "q": "What do Equity Value and Enterprise Value MEAN? Don’t explain how you calculate them – tell me what they mean!", "a": "Equity Value represents the value of EVERYTHING a company has (its Net Assets) but only to the EQUITY INVESTORS (i.e., the common shareholders). Enterprise Value represents the value of the company’s CORE BUSINESS OPERATIONS (its Net Operating Assets) but to ALL INVESTORS (Equity, Debt, Preferred, and possibly others).", "tip": null, "tier": 1, "rank": 10, "links": [{"t": "400Q guide p.72", "h": "", "k": "ref"}, {"t": "Generalist PDF p.29", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book p.45", "h": "", "k": "ref"}, {"t": "Red Book p.46", "h": "", "k": "ref"}], "rbq": ["What is enterprise value and how do you calculate it?", "Enterprise Value = Equity Value + Net Debt + Preferred Stock + Minority Interest How do you calculate equity value from enterprise value?"], "n": 9, "so": 3}, {"id": "Q048", "src": "400", "section": "Equity Value & Enterprise Value – Concepts", "q": "That sounds complicated. What do these concepts mean in plain English? Can you give a real-life analogy?", "a": "If you buy a house for $500K with a $100K down payment, $500K is the Enterprise Value, and $100K is the Equity Value. Enterprise Value does not change when the capital structure changes, so if you use $250K for the down payment, the Equity Value is now $250K, but the Enterprise Value is still $500K.", "tip": null, "tier": 1, "rank": 11, "links": [{"t": "400Q guide p.72", "h": "", "k": "ref"}, {"t": "Generalist PDF p.29", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Relative Valuation p.65", "h": "", "k": "ref"}], "rbq": [], "n": 10, "so": 3}, {"id": "Q049", "src": "400", "section": "Equity Value & Enterprise Value – Concepts", "q": "Why do you need both Equity Value and Enterprise Value? Can’t you just value companies using one of them?", "a": "We need both because some valuation methodologies and analyses produce Equity Value for the output, but others produce Enterprise Value, so we must be able to move back and forth to make proper comparisons. Enterprise Value has some advantages because it is not affected by capital structure changes (e.g., a company using less Debt and more Equity); people often call it “capital structure- neutral” for this reason. However, Equity Value is still important because most valuations are conducted from the perspective of the common shareholders, who mostly care about what their shares are worth.", "tip": null, "tier": 1, "rank": 12, "links": [{"t": "400Q guide p.72", "h": "", "k": "ref"}, {"t": "Generalist PDF p.29", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book p.45", "h": "", "k": "ref"}, {"t": "Red Book p.46", "h": "", "k": "ref"}], "rbq": ["What is the difference between enterprise value and equity value?", "Could a company have a negative net debt balance and have an enterprise value lower than its equity value?"], "n": 11, "so": 3}, {"id": "Q057", "src": "400", "section": "Equity Value & Enterprise Value – Concepts", "q": "Could Equity Value ever be negative? What about Enterprise Value?", "a": "Since Equity Value is based on Share Price * Share Count, and neither component can be negative, effectively, it cannot be negative (the Implied Equity Value from a valuation methodology could still be negative, but you typically set it to $0 when this happens). Enterprise Value could be negative since Cash could exceed Equity Value for certain types of companies, such as “busted biotech” firms that trade at a discount to their cash.", "tip": null, "tier": 1, "rank": 13, "links": [{"t": "400Q guide p.75", "h": "", "k": "ref"}, {"t": "Generalist PDF p.32", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book p.46", "h": "", "k": "ref"}], "rbq": ["Can the enterprise value of a company turn negative?", "Could a company have a negative net debt balance and have an enterprise value lower than its equity value?"], "n": 12, "so": 3}, {"id": "Q059", "src": "400", "section": "Equity Value & Enterprise Value – Calculations", "q": "A company issues $200 in Common Shares. How do Equity Value and Enterprise Value change?", "a": "CSE increases by $200, so Eq Val increases by $200. NOA does not change because neither Cash nor CSE is operational, so TEV stays the same. Alternatively, in the TEV formula, the extra Cash offsets the higher Equity Value.", "tip": null, "tier": 1, "rank": 14, "links": [{"t": "400Q guide p.77", "h": "", "k": "ref"}, {"t": "Generalist PDF p.34", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book p.45", "h": "", "k": "ref"}, {"t": "Red Book p.46", "h": "", "k": "ref"}], "rbq": ["There is $300 in equity in this business, while the enterprise value is -$200. If a company raises $250 million in additional debt, how would its enterprise val", "What is enterprise value and how do you calculate it?"], "n": 13, "so": 4}, {"id": "Q067", "src": "400", "section": "Equity Value & Enterprise Value – Calculations", "q": "A company purchases $100 of Inventory using Cash. How do Equity Value and Enterprise Value change?", "a": "There are no changes on the Income Statement in this initial step because the Inventory has not yet been sold. Therefore, Net Income does not change. On the Balance Sheet, CSE stays the same in this initial step (no changes to Net Income, Stock Issuances/Repurchases, Dividends, etc.), so Eq Val stays the same. NOA increases by $100 since Inventory is an Operating Asset, and no Operating Liabilities change, so TEV increases by $100.", "tip": null, "tier": 1, "rank": 15, "links": [{"t": "400Q guide p.79", "h": "", "k": "ref"}, {"t": "Generalist PDF p.36", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book p.45", "h": "", "k": "ref"}, {"t": "Red Book p.46", "h": "", "k": "ref"}], "rbq": ["There is $300 in equity in this business, while the enterprise value is -$200. If a company raises $250 million in additional debt, how would its enterprise val", "What is the difference between enterprise value and equity value?"], "n": 14, "so": 4}, {"id": "Q071", "src": "400", "section": "Valuation Methodologies", "q": "Public companies already have Market Caps and Share Prices. Why do you need to “value them” at all? You already know how much they’re worth.", "a": "Because a company’s Market Cap and Share Price reflect its Current Value according to “the market as a whole” – but the market might be wrong! You value companies to see if the market’s views are correct and whether a company’s value might change based on your views. It’s like going home shopping, finding a house with a list price of $500K, but then negotiating a lower price because you believe it is worth only $450K based on your research.", "tip": null, "tier": 1, "rank": 16, "links": [{"t": "400Q guide p.82", "h": "", "k": "ref"}, {"t": "Generalist PDF p.39", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Intrinsic Valuation p.54", "h": "", "k": "ref"}], "rbq": [], "n": 15, "so": 5}, {"id": "Q076", "src": "400", "section": "Valuation Methodologies", "q": "Can you give a few examples of how you might screen for “similar” Comparable Public Companies and Precedent Transactions?", "a": "You screen based on geography, industry, and size (and time for Precedent Transactions). Here are a few example screens: • Comparable Company Screen: U.S.-based steel manufacturing companies with over $500 million in revenue. • Comparable Company Screen: European legacy airlines with over €1 billion in EBITDA. • Precedent Transaction Screen: Latin American M&A transactions over the past 3 years involving consumer/retail sellers with over $1 billion USD in revenue. • Precedent Transaction Screen: Australian M&A transactions over the past 2 years involving infrastructure sellers with over $200 million AUD in revenue.", "tip": null, "tier": 1, "rank": 17, "links": [{"t": "400Q guide p.84", "h": "", "k": "ref"}, {"t": "Generalist PDF p.41", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book p.47", "h": "", "k": "ref"}], "rbq": ["What are the most common valuation methods used in finance?"], "n": 16, "so": 5}, {"id": "Q077", "src": "400", "section": "Valuation Methodologies", "q": "How do you decide which metrics and multiples to use in these methodologies?", "a": "You usually look at a sales-based metric and its corresponding multiple and 1-2 profitability- based metrics and their multiples. For example, you might use Revenue, EBITDA, and Net Income and their corresponding multiples: TEV / Revenue, TEV / EBITDA, and P / E. You do this because you want to value a company in relation to how much it sells and how much it keeps from those sales. Sometimes, you’ll drop the sales-based multiples and focus on the profitability or cash flow- based ones (EBIT, EBITDA, Net Income, Free Cash Flow, etc.).", "tip": null, "tier": 1, "rank": 18, "links": [{"t": "400Q guide p.84", "h": "", "k": "ref"}, {"t": "Generalist PDF p.41", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book p.48", "h": "", "k": "ref"}], "rbq": ["DCF valuation. Which of the valuation methodologies is the most variable in terms of output?"], "n": 17, "so": 5}, {"id": "Q078", "src": "400", "section": "Valuation Methodologies", "q": "Why do you look at BOTH historical and projected metrics in these methodologies?", "a": "Historical metrics are useful because they’re based on what happened in real life, but they can also be deceptive if there were non-recurring items or if the company made acquisitions or divestitures. Projected metrics are useful because they assume the company will operate in a “steady state” without acquisitions, divestitures, or non-recurring items, but they’re also less reliable because they’re based on predictions rather than historical events.", "tip": null, "tier": 1, "rank": 19, "links": [{"t": "400Q guide p.84", "h": "", "k": "ref"}, {"t": "Generalist PDF p.41", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book p.48", "h": "", "k": "ref"}], "rbq": ["DCF valuation. Which of the valuation methodologies is the most variable in terms of output?"], "n": 18, "so": 5}, {"id": "Q086", "src": "400", "section": "Valuation Metrics and Multiples", "q": "What IS a valuation multiple? Explain the theory and give a real-life analogy. A valuation multiple is shorthand for a company’s value based on its Cash Flow, Cash Flow", "a": "Growth Rate, and Discount Rate. You could value a company with this formula: Company Value = Cash Flow / (Discount Rate – Cash Flow Growth Rate), where Cash Flow Growth Rate < Discount Rate Valuation multiples let you use a number like “10x” to express this in a condensed way. You can also think of valuation multiples as “per-square-foot” or “per-square-meter” values when buying a house: They help you compare houses or companies of different sizes and see how expensive or cheap they are relative to similar houses or companies.", "tip": null, "tier": 1, "rank": 21, "links": [{"t": "400Q guide p.88", "h": "", "k": "ref"}, {"t": "Generalist PDF p.45", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Relative Valuation p.65", "h": "", "k": "ref"}], "rbq": [], "n": 19, "so": 6}, {"id": "Q087", "src": "400", "section": "Valuation Metrics and Multiples", "q": "You’re valuing a mid-sized manufacturing company. This company’s TEV / EBITDA multiple is 15x, but the median TEV / EBITDA for the comparable companies is 10x. What’s the most likely explanation?", "a": "The most likely explanation is that the market expects this company’s cash flows to grow faster than comparable companies. For example, other companies might be expected to grow at 5%, but this company might be expected to grow at 15%. The Discount Rate is unlikely to differ significantly because these companies are in a similar size range in the same industry, which means the risk and potential returns should be similar. “Current events” could also affect the multiples, but it’s hard to say what they might be without additional information.", "tip": null, "tier": 1, "rank": 22, "links": [{"t": "400Q guide p.88", "h": "", "k": "ref"}, {"t": "Generalist PDF p.45", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book p.70", "h": "", "k": "ref"}, {"t": "Red Book p.71", "h": "", "k": "ref"}], "rbq": ["When should you value a company using a revenue multiple vs. EBITDA?", "A company is currently trading at 12.5x EBITDA, is it overvalued?"], "n": 20, "so": 6}, {"id": "Q089", "src": "400", "section": "Valuation Metrics and Multiples", "q": "How do you decide whether to use Equity Value or Enterprise Value in valuation multiples?", "a": "If the financial metric in the denominator of the valuation multiple deducts Net Interest Expense, it pairs with Equity Value because the Debt Investors can no longer be “paid” after earning their interest; only Equity Investors can earn something now. If the metric does not deduct Net Interest Expense, it pairs with Enterprise Value. This rule applies to financial metrics (EBIT, EBITDA, etc.) and non-financial ones (Unique Users, Subscribers, etc.).", "tip": null, "tier": 1, "rank": 23, "links": [{"t": "400Q guide p.89", "h": "", "k": "ref"}, {"t": "Generalist PDF p.46", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book p.65", "h": "", "k": "ref"}, {"t": "Red Book p.69", "h": "", "k": "ref"}], "rbq": ["What is the purpose of using multiples in valuation?", "P/E. Which multiples are the most popular in valuation?"], "n": 21, "so": 6}, {"id": "Q096", "src": "400", "section": "Valuation Metrics and Multiples", "q": "If a company is valued mostly based on its cash flow, why do you also use metrics such as EBIT and EBITDA that may not represent its true cash flow?", "a": "You use these metrics mostly for convenience and comparability. Free Cash Flow measures a company’s cash flow more accurately, but it also takes more time to calculate since you need to review the full Cash Flow Statement and make adjustments. Also, the individual items within FCF vary widely for different companies, regions, industries, and accounting systems. As a result, EBIT and EBITDA are better for comparability/normalization purposes since they are based primarily on the Income Statement (and one line of the CFS for EBITDA).", "tip": null, "tier": 1, "rank": 24, "links": [{"t": "400Q guide p.92", "h": "", "k": "ref"}, {"t": "Generalist PDF p.49", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Relative Valuation p.65", "h": "", "k": "ref"}], "rbq": [], "n": 22, "so": 6}, {"id": "Q097", "src": "400", "section": "Valuation Metrics and Multiples", "q": "Give an example of a company change that affects UFCF but not EBITDA.", "a": "Additional spending on CapEx or a higher-than-normal Change in Working Capital (e.g., due to a large Inventory purchase) would affect UFCF but not EBITDA since UFCF deducts CapEx and reflects the Change in Working Capital (which could be either positive or negative).", "tip": null, "tier": 1, "rank": 25, "links": [{"t": "400Q guide p.92", "h": "", "k": "ref"}, {"t": "Generalist PDF p.49", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book p.27", "h": "", "k": "ref"}, {"t": "Red Book p.71", "h": "", "k": "ref"}], "rbq": ["When should you value a company using a revenue multiple vs. EBITDA?", "Is EBITDA a good proxy for operating cash flow?"], "n": 23, "so": 6}, {"id": "Q101", "src": "400", "section": "Discounted Cash Flow (DCF) – Assumptions and Analysis", "q": "Why do you build a DCF analysis to value a company?", "a": "In theory, a company is worth the Present Value of its expected future cash flows: Company Value = Cash Flow / (Discount Rate – Cash Flow Growth Rate), where Cash Flow Growth Rate < Discount Rate But you can’t just use this single formula because a company’s Cash Flow Growth Rate and Discount Rate change over time. So, in a Discounted Cash Flow analysis, you divide the valuation into two periods: One where those assumptions may change (the explicit forecast period) and one where they stay the same (the Terminal Period). You then project the company’s cash flows in both periods and discount them to their Present Values based on the appropriate Discount Rate(s). You compare this sum – the company’s Implied Value – to its Current Value or “Asking Price” to see if it’s valued appropriately.", "tip": null, "tier": 1, "rank": 27, "links": [{"t": "400Q guide p.94", "h": "", "k": "ref"}, {"t": "Generalist PDF p.51", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book p.49", "h": "", "k": "ref"}, {"t": "Red Book p.61", "h": "", "k": "ref"}], "rbq": ["Net Debt/EBITDA would be at lower risk of bankruptcy (and lower cost of debt). When would a DCF be an inappropriate valuation method?", "The unadjusted, period-end assumption may be more appropriate in this scenario. How would raising additional debt impact a DCF analysis?"], "n": 24, "so": 7}, {"id": "Q111", "src": "400", "section": "Discounted Cash Flow (DCF) – Assumptions and Analysis", "q": "What’s the intuition behind the Gordon Growth formula for Terminal Value?", "a": "The typical formula is: Terminal Value = Final Year FCF * (1 + Terminal FCF Growth Rate) / (Discount Rate – Terminal FCF Growth Rate) A company is worth more if its growth rate is higher in the Terminal Period and less if its growth rate is lower; it’s also worth more if its starting FCF in the Terminal Period is higher. If the company’s Discount Rate is higher, the company is worth less because the denominator is bigger (and vice versa).", "tip": null, "tier": 1, "rank": 28, "links": [{"t": "400Q guide p.98", "h": "", "k": "ref"}, {"t": "Generalist PDF p.55", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book p.59", "h": "", "k": "ref"}], "rbq": ["DCF model, but the discount rate's impact would far exceed that of operational assumptions such as the sales growth rate. How is the terminal value calculated?"], "n": 25, "so": 7}, {"id": "Q112", "src": "400", "section": "Discounted Cash Flow (DCF) – Assumptions and Analysis", "q": "If you use the Multiples Method to calculate Terminal Value, do you use the multiples from the Public Comps or Precedent Transactions?", "a": "It’s better to start with the multiples from the Public Comps – ideally, the ones from 1-2 years into the future – because you don’t want to reflect the control premium in the Precedent Transactions if you’re completing a standalone company valuation. If the selected multiples imply a reasonable Terminal FCF Growth Rate, you might stick with your initial guess; if not, adjust it up or down as necessary.", "tip": null, "tier": 1, "rank": 29, "links": [{"t": "400Q guide p.98", "h": "", "k": "ref"}, {"t": "Generalist PDF p.55", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book p.47", "h": "", "k": "ref"}, {"t": "Red Book p.59", "h": "", "k": "ref"}], "rbq": ["If not, then the perpetuity growth rate should be adjusted downward to be more realistic. How can the terminal value be sanity-checked if the exit multiple appr", "DCF model, but the discount rate's impact would far exceed that of operational assumptions such as the sales growth rate. How is the terminal value calculated?"], "n": 26, "so": 7}, {"id": "Q113", "src": "400", "section": "Discounted Cash Flow (DCF) – Assumptions and Analysis", "q": "How do you pick the Terminal Growth Rate when calculating the Terminal Value using the Gordon Growth Method?", "a": "This growth rate should be below the country’s long-term GDP growth rate and in line with other macroeconomic variables like inflation. For example, if you’re in a developed country where the expected long-term GDP growth rate is 3%, you might use numbers ranging from 1% to 2% for the Terminal Growth Rates.", "tip": "Anchor: terminal growth ≤ long-run GDP/inflation (~2–3% for developed markets). Anything above 4-5% implies the company eventually outgrows the economy — say that phrase; it's the expected answer.", "tier": 1, "rank": 30, "links": [{"t": "400Q guide p.99", "h": "", "k": "ref"}, {"t": "Generalist PDF p.56", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book p.59", "h": "", "k": "ref"}, {"t": "Red Book p.60", "h": "", "k": "ref"}], "rbq": ["DCF model, but the discount rate's impact would far exceed that of operational assumptions such as the sales growth rate. How is the terminal value calculated?", "If not, then the perpetuity growth rate should be adjusted downward to be more realistic. How can the terminal value be sanity-checked if the exit multiple appr"], "n": 27, "so": 7}, {"id": "Q114", "src": "400", "section": "Discounted Cash Flow (DCF) – Assumptions and Analysis", "q": "How can you check whether your Terminal Value estimate is reasonable?", "a": "You start by entering a range of assumptions for the Terminal Multiple or Terminal FCF Growth Rate, and you cross-check them by calculating the Growth Rates or Multiples they imply. If these seem wrong, you adjust the range of Terminal Multiples or Terminal FCF Growth Rates until you get more reasonable results. For example, if the multiple you pick implies a Terminal FCF Growth Rate of 5%, that’s too high for developed countries, so you should pick a lower Terminal Multiple.", "tip": null, "tier": 1, "rank": 31, "links": [{"t": "400Q guide p.99", "h": "", "k": "ref"}, {"t": "Generalist PDF p.56", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book p.60", "h": "", "k": "ref"}], "rbq": ["If not, then the perpetuity growth rate should be adjusted downward to be more realistic. How can the terminal value be sanity-checked if the exit multiple appr"], "n": 28, "so": 7}, {"id": "Q115", "src": "400", "section": "Discounted Cash Flow (DCF) – Assumptions and Analysis", "q": "Does it ever make sense to use a negative Terminal FCF Growth Rate?", "a": "Yes. For example, if you’re valuing a biopharmaceutical company, and the patent on its key drug expires within the explicit forecast period, it might be reasonable to assume that the company never replaces the lost revenue from this drug, which results in declining cash flow. A negative Terminal FCF Growth Rate represents your expectation that the company will stop generating cash flow eventually (even if it happens decades into the future). It doesn’t make the company “worthless”; it’s just worth less.", "tip": null, "tier": 1, "rank": 32, "links": [{"t": "400Q guide p.99", "h": "", "k": "ref"}, {"t": "Generalist PDF p.56", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book p.49", "h": "", "k": "ref"}, {"t": "Red Book p.59", "h": "", "k": "ref"}], "rbq": ["If not, then the perpetuity growth rate should be adjusted downward to be more realistic. How can the terminal value be sanity-checked if the exit multiple appr", "DCF model, but the discount rate's impact would far exceed that of operational assumptions such as the sales growth rate. How is the terminal value calculated?"], "n": 29, "so": 7}, {"id": "Q126", "src": "400", "section": "Discounted Cash Flow (DCF) – The Discount Rate", "q": "What does the Cost of Equity mean intuitively?", "a": "It tells you the average percentage a company’s stock “should” return each year over the long term, factoring in both stock-price appreciation and dividends. In a valuation, it represents the average annualized return that equity investors might earn over the long term. To a company, the Cost of Equity represents the cost of funding its operations by issuing additional shares to investors. The company “pays for” Equity via potential Dividends (a real cash expense) and the dilution of existing investors.", "tip": null, "tier": 1, "rank": 33, "links": [{"t": "400Q guide p.103", "h": "", "k": "ref"}, {"t": "Generalist PDF p.60", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book: Corporate Finance Theory p.45", "h": "", "k": "ref"}], "rbq": [], "n": 30, "so": 8}, {"id": "Q127", "src": "400", "section": "Discounted Cash Flow (DCF) – The Discount Rate", "q": "What does WACC mean intuitively?", "a": "WACC is your expected or targeted annualized return if you invest proportionately in all parts of the company’s capital structure – Debt, Equity, and Preferred Stock. To a company, WACC represents the cost of funding its operations by using all its sources of capital and keeping its capital structure percentages the same over time. Investors might invest in a company if the expected IRR exceeds its WACC, and a company might fund a new project, acquisition, or expansion if the expected IRR exceeds its WACC.", "tip": null, "tier": 1, "rank": 34, "links": [{"t": "400Q guide p.104", "h": "", "k": "ref"}, {"t": "Generalist PDF p.61", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book: Corporate Finance Theory p.45", "h": "", "k": "ref"}], "rbq": [], "n": 31, "so": 8}, {"id": "Q131", "src": "400", "section": "Discounted Cash Flow (DCF) – The Discount Rate", "q": "What does Beta mean intuitively?", "a": "Levered Beta tells you how volatile a company’s stock price is relative to the stock market as a whole, factoring in both intrinsic business risk and risk from leverage (i.e., Debt). If Beta is 1.0, when the market goes up 10%, this company’s stock price also increases by 10%. If Beta is 2.0, when the market goes up 10%, this company’s stock price goes up by 20%. If the market drops by 10%, this company’s stock price falls by 10% when the Beta is 1.0 or 20% when the Beta is 2.0. Unlevered Beta excludes the risk from leverage and reflects only the intrinsic business risk, so it’s always less than or equal to Levered Beta.", "tip": null, "tier": 1, "rank": 35, "links": [{"t": "400Q guide p.105", "h": "", "k": "ref"}, {"t": "Generalist PDF p.62", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book p.56", "h": "", "k": "ref"}, {"t": "Red Book p.57", "h": "", "k": "ref"}], "rbq": ["What is the impact of leverage on the beta of a company?", "Explain the concept of beta (β)."], "n": 32, "so": 8}, {"id": "Q134", "src": "400", "section": "Discounted Cash Flow (DCF) – The Discount Rate", "q": "Why is Equity more expensive than Debt?", "a": "Because it offers higher risk and higher potential returns and lacks the tax benefits of Debt. Expected stock market returns usually exceed the Yield to Maturity on Debt, making the Equity cost higher. The interest on Debt is also tax-deductible, further reducing the Debt cost and making Equity even more expensive. In developed markets, the average annualized stock market return is often in the 7 – 10% range, so a company with a Levered Beta of 1.0 will have a Cost of Equity in that range. For the Cost of Debt to be higher, the Pre-Tax Cost would have to be ~9 – 13% at a 25% tax rate. More speculative companies might pay interest rates in that range, but larger/mature companies tend to pay less than that.", "tip": null, "tier": 1, "rank": 36, "links": [{"t": "400Q guide p.106", "h": "", "k": "ref"}, {"t": "Generalist PDF p.63", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book: Corporate Finance Theory p.45", "h": "", "k": "ref"}], "rbq": [], "n": 33, "so": 8}, {"id": "Q161", "src": "400", "section": "LBO Models – Concepts", "q": "What is a leveraged buyout, and why does it work?", "a": "In a leveraged buyout (LBO), a private equity firm acquires a company using a combination of Debt and Equity, operates it for several years, and then sells the company at the end of the period to realize a return on its investment. During the ownership period, the PE firm uses the company’s cash flows to pay for the interest expense on the Debt and to repay the Debt principal. LBOs work because leverage amplifies returns: If the deal performs well, the PE firm will realize higher returns than if it had bought the company with 100% Equity. But leverage also presents risks because the returns will be even worse if the deal does not perform well.", "tip": null, "tier": 1, "rank": 37, "links": [{"t": "400Q guide p.119", "h": "", "k": "ref"}, {"t": "Generalist PDF p.76", "h": "", "k": "ref"}, {"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "Red Book p.91", "h": "", "k": "ref"}, {"t": "Red Book p.99", "h": "", "k": "ref"}], "rbq": ["What is a leveraged buyout (LBO)?", "What is a management buyout (MBO)?"], "n": 34, "so": 11}, {"id": "Q165", "src": "400", "section": "LBO Models – Concepts", "q": "What is an \"ideal\" candidate for an LBO?", "a": "Almost any deal can work at the right price. Assuming the price is reasonable, ideal LBO candidates should also: • Have stable and predictable cash flows (so they can repay Debt); • Have relatively modest requirements for CapEx and other ongoing re-investments; • Operate in an industry that is at least modestly fragmented (to enable add-on acquisitions); • Have opportunities to cut costs and increase margins; • Have strong management teams; • Have solid asset bases to use as collateral for Debt; • Have realistic exit paths, with returns driven by varied sources (e.g., EBITDA growth and Debt repayment rather than only multiple expansion).", "tip": null, "tier": 1, "rank": 38, "links": [{"t": "400Q guide p.121", "h": "", "k": "ref"}, {"t": "Generalist PDF p.78", "h": "", "k": "ref"}, {"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "Red Book p.93", "h": "", "k": "ref"}, {"t": "Red Book p.94", "h": "", "k": "ref"}], "rbq": ["What attributes make a business an ideal LBO candidate?", "What would be the ideal type of products/services of a potential LBO target?"], "n": 35, "so": 11}, {"id": "Q004", "src": "400", "section": "Finance Concepts", "q": "What is WACC?", "a": "WACC stands for the “Weighted Average Cost of Capital,” the most common Discount Rate used to value companies. To calculate it, you multiply the % Equity in a company’s capital structure by the “Cost” of that Equity, multiply the % Debt in the company’s capital structure by the “Cost” of that Debt, and add them up (and, if applicable, Preferred Stock and other long-term funding sources). For example, if a company uses 60% Equity and 40% Debt, its Cost of Equity is 10%, and its Cost of Debt is 5%, then its WACC is 60% * 10% + 40% * 5% = 8%. WACC represents the average annualized return you’d expect to earn if you invested proportionally in the Debt AND Equity of a company and held them for the long term.", "tip": null, "tier": 1, "rank": 39, "links": [{"t": "400Q guide p.47", "h": "", "k": "ref"}, {"t": "Generalist PDF p.4", "h": "", "k": "ref"}, {"t": "BIWS module 01", "h": "", "k": "ref"}, {"t": "Red Book p.55", "h": "", "k": "ref"}, {"t": "Red Book p.59", "h": "", "k": "ref"}], "rbq": ["However, the cost of equity would be the right cost of capital to use for levered DCFs. What is the formula to calculate the weighted average cost of capital (W", "What is the difference between WACC and IRR?"], "n": 36, "so": 0}, {"id": "Q011", "src": "400", "section": "Accounting – Concepts", "q": "What are the three financial statements, and why do we need them?", "a": "The three main financial statements are the Income Statement, Balance Sheet, and Cash Flow Statement. The Income Statement shows the company’s revenue, expenses, and taxes over a period and ends with Net Income, which represents the company’s after-tax profits. The Balance Sheet shows the company’s Assets – its resources – and how it paid for those resources – its Liabilities and Equity – at a specific point in time. Assets must equal Liabilities plus Equity. The Cash Flow Statement begins with Net Income, adjusts for non-cash items and changes in operating assets and liabilities (working capital), and shows the company’s Cash Flow from Investing and Financing activities; the last lines show the net change in cash and the company’s ending cash balance. You need the financial statements because there’s always a difference between the company’s Net Income and the cash flow it generates, and the statements let you estimate and forecast the cash flow more accurately.", "tip": null, "tier": 1, "rank": 44, "links": [{"t": "400Q guide p.50", "h": "", "k": "ref"}, {"t": "Generalist PDF p.7", "h": "", "k": "ref"}, {"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book p.14", "h": "", "k": "ref"}, {"t": "Red Book p.38", "h": "", "k": "ref"}], "rbq": ["Walk me through the three financial statements.", "How does selling a building with a book value of $6 million for $10 million impact the three financial statements?"], "n": 37, "so": 1}, {"id": "Q181", "src": "400ind", "section": "Industrials (400Q industry section)", "q": "Can you explain how industrials is different from other groups and what the main verticals are?", "a": "Industrials companies make machinery or large physical products, transport them, or service them; the customers are usually corporations or governments rather than consumers, and the sector is highly sensitive to the economy and macro conditions, such as credit availability, interest rates, and trade policies.\n\nMany sources divide the industry into capital goods (aerospace/defense, building products, machinery, etc.), transportation (air freight, airlines, maritime, railroads, etc.), and commercial/professional services.\n\nAccounting and valuation are standard in most verticals, but the key drivers and KPIs differ.", "tip": "Chicago framing: name the local bellwethers when you answer this — Deere (machinery), ITW/Dover/IDEX (multi-industrial), Grainger (distribution), Boeing/CAT legacy ops. It turns a generic answer into a 'why Chicago industrials' answer.", "tier": 1, "rank": 9181, "links": [{"t": "400Q guide p.165", "h": "", "k": "ref"}, {"t": "Red Book: Industrials p.246", "h": "", "k": "ref"}], "n": 38, "so": 13}, {"id": "Q190", "src": "400ind", "section": "Financial Sponsors Group (400Q industry section)", "q": "Can you explain the different types of private equity deals that we might advise clients on?", "a": "A few of the most common PE deal types include:\n\n• Carve-Out – A company sells a business unit or division (often a non-core asset). PE firms acquire the carved-out entity and improve it as a standalone business.\n• Founder Succession – When a founder is retiring or transitioning out, a PE firm acquires a majority stake and helps professionalize the management team.\n• Management Buyout (MBO) – The existing management team partners with a PE firm to acquire the company they operate, often using leverage; aligns management and the PE firm and ensures operational continuity.\n• Take-Private – A PE firm acquires a publicly traded company and delists it, allowing operational improvements away from public scrutiny, often to restructure and sell or relist later at a higher valuation.\n• Add-on Acquisition – A PE-owned portfolio company acquires smaller companies to increase market share and potential valuation; the core of buy-and-build platforms.\n• Dividend Recap – A PE-owned company takes on additional debt to pay a dividend to its investors, extracting value before the exit.\n• Secondary Buyout – Not to be confused with a 'secondaries' deal: one buyout fund sells the entire company to another buyout fund.", "tip": "Lower-middle-market Chicago is dominated by founder successions and add-ons — the deals Lincoln, Blair and Baird actually run. Have one add-on example ready (Quanta's four contractor acquisitions; AMETEK/Indicor as a carve-out of a carve-out).", "tier": 1, "rank": 9190, "links": [{"t": "400Q guide p.161", "h": "", "k": "ref"}, {"t": "BIWS module 04 (LBO)", "h": "", "k": "ref"}, {"t": "Red Book: Private Equity Investing p.91", "h": "", "k": "ref"}], "n": 39, "so": 14}, {"id": "Q191", "src": "400ind", "section": "Private Companies (400Q industry section)", "q": "How are private companies different from public companies?", "a": "Private companies do not have shares you can buy and sell on the stock market; as a result, their liquidity is far lower, and they don't have the same reporting requirements as public companies.\n\nPrivate companies often have non-standard financial statements that you must adjust, and you often discount their valuations due to a lack of liquidity, dependence on key people, and, in some cases, a much smaller size than public companies.\n\nIn M&A and leveraged buyout deals, the purchase price for a private company is linked to an Enterprise Value-based valuation multiple rather than a share-price premium, and deals are typically done on a cash-free, debt-free basis. Part of the price may also be deferred or contingent on future performance.", "tip": null, "tier": 1, "rank": 9191, "links": [{"t": "400Q guide p.182", "h": "", "k": "ref"}, {"t": "BIWS module 05 (M&A)", "h": "", "k": "ref"}], "n": 40, "so": 15}, {"id": "R01", "src": "rb", "section": "Industrials (Red Book ch.)", "q": "Why have industrial manufacturers shifted their focus toward the aftermarket?", "a": "Over the past decade industrial manufacturers have become more service-oriented, offering aftermarket services — maintenance, spare-parts delivery and other value-added services. Demand for new equipment is cyclical, so manufacturers mitigate that risk by reducing the share of revenue that depends on new-equipment sales.\n\nOrganic growth through new product development is costly and capital-intensive; aftermarket revenue is a more predictable, recurring stream. In the last recession, companies with a greater share of service revenue fared far better than those 90%+ dependent on new manufacturing sales. Some built service divisions in-house, but most chose vertical integration through M&A.", "tip": "This is the valuation point behind Parker / Filtration Group (85% aftermarket, 19.6x headline) and TransDigm's whole model: recurring replacement revenue gets valued like a toll road. 'Aftermarket mix' is the first thing to ask about any industrial target.", "tier": 1, "rank": 9501, "links": [{"t": "Red Book p.246", "h": "", "k": "ref"}, {"t": "400Q guide: Industrials p.164", "h": "", "k": "ref"}], "n": 41, "so": 16}, {"id": "R02", "src": "rb", "section": "Industrials (Red Book ch.)", "q": "What is the trend of 'servitization' in manufacturing?", "a": "Servitization means building additional revenue streams for manufacturers by providing service offerings themselves rather than relying on third parties: spare parts, repairs, maintenance, overhauls, performance monitoring and customer service.\n\nHistorically the focus was solely on equipment manufacturing, with sales, distribution and support handed off to third parties. Now manufacturers sell 'systems,' focus on the outcome their products deliver, and provide the services themselves — which improves customer retention and increases margins.", "tip": null, "tier": 1, "rank": 9502, "links": [{"t": "Red Book p.246", "h": "", "k": "ref"}, {"t": "400Q guide: Industrials p.164", "h": "", "k": "ref"}], "n": 42, "so": 16}, {"id": "S202", "src": "supp", "section": "Accounting – Concepts", "topic": "Accounting Concepts", "q": "What's the basic accounting equation?", "a": "Assets = Liabilities + Shareholders' Equity. This is why the balance sheet balances. Every transaction must keep this equation true — that's how 'walk me through the three statements' questions work.", "tier": 1, "rank": 5202, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements p.13", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Concepts p.50", "h": "", "k": "ref"}], "type": "recall", "flags": [], "n": 43, "so": 1}, {"id": "S203", "src": "supp", "section": "Accounting – Concepts", "topic": "Accounting Concepts", "q": "What are the major line items on a typical income statement?", "a": "Revenue, Cost of Goods Sold (COGS) → Gross Profit. Operating Expenses (SG&A, R&D, D&A) → Operating Income (EBIT). Interest Expense, Other Income/Expense → Pre-tax Income. Tax Provision → Net Income. Below the line: EPS basic and diluted.", "tier": 1, "rank": 5203, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements p.13", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Concepts p.50", "h": "", "k": "ref"}], "type": "recall", "flags": [], "n": 44, "so": 1}, {"id": "S308", "src": "supp", "section": "Accounting – Calculations", "topic": "Statement Linkages", "q": "Company pays $30 in cash dividends. Walk me through the three statements.", "a": "IS: no change. Dividends are a distribution of equity, not an expense.\n\nCFS: Financing activities down $30.\n\nBS: Cash down $30. Retained Earnings down $30. Balances.", "tier": 1, "rank": 5308, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements p.13", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Calcs p.59", "h": "", "k": "ref"}], "type": "walkthrough", "flags": [], "n": 45, "so": 2}, {"id": "S601", "src": "supp", "section": "Valuation Methodologies", "topic": "Valuation Methods", "q": "What are the three (or four) main valuation methodologies?", "a": "1) Comparable Company Analysis ('comps' or trading multiples)\n2) Precedent Transactions ('deal comps' — multiples paid in past M&A)\n3) Discounted Cash Flow (DCF — intrinsic value from projected cash flows)\n\nLBO Analysis is often added as a fourth — it tells you the maximum price a financial sponsor could pay while hitting return targets, giving a 'floor' on the valuation range.", "tier": 1, "rank": 5601, "links": [{"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Relative Valuation p.65", "h": "", "k": "ref"}, {"t": "400Q guide: Valuation Methodologies p.81", "h": "", "k": "ref"}], "type": "recall", "flags": [], "n": 46, "so": 5}, {"id": "S901", "src": "supp", "section": "Merger Models – Concepts", "topic": "M&A Concepts", "q": "Why would a company want to acquire another company?", "a": "Strategic reasons: gain market share, enter a new geography, acquire IP/technology, vertical integration, eliminate a competitor.\n\nFinancial reasons: realize cost synergies, accretion to EPS, tax benefits (NOLs, jurisdictional arbitrage).\n\nDefensive: block a competitor's acquisition, preempt a disruptor.\n\nCapability: acqui-hire critical talent.\n\nGrowth substitute: bolt-on when organic growth slows.", "tier": 1, "rank": 5901, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book: M&A Concepts p.73", "h": "", "k": "ref"}, {"t": "400Q guide: Merger Models p.107", "h": "", "k": "ref"}], "type": "recall", "flags": [], "n": 47, "so": 9}, {"id": "S902", "src": "supp", "section": "Merger Models – Concepts", "topic": "M&A Concepts", "q": "What's the difference between a strategic and a financial buyer?", "a": "Strategic buyer: an operating company in the same/adjacent industry. Can extract cost or revenue synergies, integrate operations. Often pays higher prices because synergies justify the premium.\n\nFinancial buyer (typically PE): doesn't run the business operationally; uses leverage and operational improvements to generate returns over a 3-7 year hold. Has an IRR target (typically 20%+) that caps what they can pay.", "tier": 1, "rank": 5902, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book: M&A Concepts p.73", "h": "", "k": "ref"}, {"t": "400Q guide: Merger Models p.107", "h": "", "k": "ref"}], "type": "recall", "flags": [], "n": 48, "so": 9}, {"id": "S904", "src": "supp", "section": "Merger Models – Concepts", "topic": "M&A Concepts", "q": "What's a control premium?", "a": "The premium an acquirer pays above the target's unaffected trading price to gain controlling ownership. Typically 20-40% in public deals. It compensates shareholders for relinquishing control and reflects the strategic / synergy value the buyer expects to capture.\n\nIt's the main reason precedent transaction multiples tend to be higher than trading comp multiples.", "tier": 1, "rank": 5904, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book: M&A Concepts p.73", "h": "", "k": "ref"}, {"t": "400Q guide: Merger Models p.107", "h": "", "k": "ref"}], "type": "recall", "flags": [], "n": 49, "so": 9}, {"id": "S912", "src": "supp", "section": "Merger Models – Concepts", "topic": "M&A Concepts", "q": "Which of the following is a COST synergy?", "a": "B. Eliminating duplicate functions = cost synergy. Headcount reductions, back-office consolidation, real estate rationalization, IT consolidation, supplier negotiation leverage — all OpEx and one-time CapEx reductions.\n\nA, C, D are all revenue synergies (cross-sell, geographic expansion, upsell). Revenue synergies are top-line growth from combining customer access or product breadth — they're harder to predict and slower to materialize.", "tier": 1, "rank": 5912, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book: M&A Concepts p.73", "h": "", "k": "ref"}, {"t": "400Q guide: Merger Models p.107", "h": "", "k": "ref"}], "type": "trap", "flags": [], "options": ["Cross-selling the combined product portfolio to both customer bases", "Eliminating one of the two finance departments and consolidating headcount", "Entering a new geography using the acquired company's distribution network", "Upselling premium offerings to the legacy customer base"], "correct": 1, "n": 50, "so": 9}, {"id": "S1101", "src": "supp", "section": "Capital Markets (supplemental)", "topic": "Capital Markets", "q": "What are the main trade-offs between issuing debt vs. equity?", "a": "Debt:\n+ Cheaper (lower required return, tax-deductible interest)\n+ No ownership dilution\n+ Imposes discipline on management\n− Fixed obligation regardless of performance\n− Increases bankruptcy risk\n− Covenants restrict flexibility\n\nEquity:\n+ No fixed payment obligation\n+ No bankruptcy risk\n+ Provides growth capital with risk-sharing\n− More expensive\n− Dilutes ownership and EPS\n− Signals to market may be negative (typically a sign of cash need)", "tier": 1, "rank": 6101, "links": [{"t": "Red Book: Debt & LevFin p.112", "h": "", "k": "ref"}, {"t": "Red Book: Equity Financing p.122", "h": "", "k": "ref"}, {"t": "400Q guide: DCM/LevFin p.131", "h": "", "k": "ref"}, {"t": "400Q guide: ECM p.145", "h": "", "k": "ref"}], "type": "recall", "flags": [], "n": 51, "so": 18}, {"id": "S1103", "src": "supp", "section": "Capital Markets (supplemental)", "topic": "Capital Markets", "q": "What's the basic IPO process?", "a": "1) Selection of underwriters (book-running banks).\n2) Due diligence and S-1 (US) or prospectus drafting.\n3) SEC review and amendments.\n4) Roadshow — management presents to institutional investors over ~2 weeks.\n5) Book-building — banks gather indications of interest, build the order book.\n6) Pricing — typically the night before trading begins, based on demand vs. price range.\n7) First trading day — typical 'IPO pop' if priced below market clearing level.\n8) Lock-up periods (180 days) restrict insider sales.\n9) Follow-on offerings later if more capital is needed.", "tier": 1, "rank": 6103, "links": [{"t": "Red Book: Debt & LevFin p.112", "h": "", "k": "ref"}, {"t": "Red Book: Equity Financing p.122", "h": "", "k": "ref"}, {"t": "400Q guide: DCM/LevFin p.131", "h": "", "k": "ref"}, {"t": "400Q guide: ECM p.145", "h": "", "k": "ref"}], "type": "recall", "flags": [], "n": 52, "so": 18}, {"id": "S1106", "src": "supp", "section": "Capital Markets (supplemental)", "topic": "Capital Markets", "q": "What's a follow-on offering?", "a": "A secondary equity issuance after the IPO. Two flavors:\n\n1) Primary follow-on: company sells new shares, raises new capital. Dilutive.\n\n2) Secondary follow-on: existing
