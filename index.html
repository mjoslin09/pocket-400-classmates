.", "tier": 2, "rank": 8017, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements p.13", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Concepts p.50", "h": "", "k": "ref"}], "type": "trap", "flags": [], "options": ["Nothing is recorded until the cash is deposited", "Revenue is recognized and Accounts Receivable increases; Cash is unchanged", "Revenue is recognized and Cash increases immediately", "Deferred Revenue increases by $1,000"], "correct": 1, "n": 186, "so": 1}, {"id": "S3018", "src": "supp", "section": "Accounting – Concepts", "topic": "Accounting Concepts", "q": "Could a company ever have negative Equity on its Balance Sheet? If so, what does it mean?", "a": "Yes, easily. Sustained negative Net Income erodes Retained Earnings, and after years of losses total Equity can turn negative. It can also happen after a large dividend or share buyback (common after a leveraged buyout) that exceeds accumulated equity.\n\nMeaning: it's usually a warning sign – chronic unprofitability or aggressive returns of capital. But it's also common and benign for early-stage tech/biotech firms burning cash with little revenue.\n\nSo the interpretation depends on the cause; don't reflexively call it 'bad' without asking why.", "tier": 2, "rank": 8018, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements p.13", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Concepts p.50", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 187, "so": 1}, {"id": "S3021", "src": "supp", "section": "Accounting – Concepts", "topic": "Cash Flow Statement", "q": "How do you decide whether an item should appear on the Cash Flow Statement at all?", "a": "An item belongs on the CFS if either:\n\n(1) It already hit the Income Statement and affected Net Income but is non-cash, so you must reverse it to get to real cash flow – e.g., Depreciation, Amortization, write-downs, a Loss on asset sale; OR\n\n(2) It did NOT hit the Income Statement but it does change the cash balance – e.g., CapEx, debt issuance/repayment, dividends, share buybacks.\n\nChanges in Working Capital can fall into either bucket depending on direction. The two-part test – 'non-cash IS item' or 'cash item that skipped the IS' – covers everything.", "tier": 2, "rank": 8021, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements p.13", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Concepts p.50", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 188, "so": 1}, {"id": "S3023", "src": "supp", "section": "Accounting – Concepts", "topic": "Cash Flow Statement", "q": "If a company's Cash Flow Statement starts with Operating Income or 'Cash Received' instead of Net Income, what should you do and why does this happen?", "a": "This is common under IFRS or when a company uses the Direct Method. For modeling and valuation you should convert it to the standard Indirect-Method format that begins with Net Income and makes the usual non-cash and working-capital adjustments.\n\nLarge companies usually provide a reconciliation showing how to get from Net Income (or Operating Income) to Cash Flow from Operations, including working-capital changes – use that to rebuild it.\n\nIf no reconciliation is provided, you may be stuck working with the original format. U.S. GAAP companies technically can use the Direct Method but almost always use Indirect.", "tier": 2, "rank": 8023, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements p.13", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Concepts p.50", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 189, "so": 1}, {"id": "S3025", "src": "supp", "section": "Accounting – Concepts", "topic": "Cash Flow Statement", "q": "A company's Depreciation increases by $10 (40% tax rate). By how much does its cash balance change?", "a": "Correct answer: up $4.\n\nIncome Statement: Pre-Tax Income falls $10, Net Income falls $6 (at 40% tax).\nCash Flow Statement: begin with Net Income –$6, then add back the $10 of non-cash Depreciation → net cash +$4.\n\nMental-math shortcut: a non-cash expense changes cash by Expense × Tax Rate. Here $10 × 40% = +$4. The cash benefit of a non-cash charge is just the tax shield. Don't pick –$6 (that ignores the add-back) or $0 (that ignores taxes).", "tier": 2, "rank": 8025, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements p.13", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Concepts p.50", "h": "", "k": "ref"}], "type": "trap", "flags": [], "options": ["Down $6", "Up $4", "No change", "Up $10"], "correct": 1, "n": 190, "so": 1}, {"id": "S3031", "src": "supp", "section": "Accounting – Calculations", "topic": "Statement Linkages", "q": "When you link items from the Cash Flow Statement back to the Balance Sheet, why do you SUBTRACT on the Assets side but ADD on the Liabilities & Equity side?", "a": "Because the CFS is written from cash's perspective: assets move OPPOSITE to cash, while liabilities & equity move WITH it.\n\nA positive CFS item (a source of cash) means either an asset DECREASED (you collected AR, sold something, or recognized non-cash depreciation against PP&E) or a liability/equity item INCREASED (you issued debt, collected deferred revenue). A negative item (a use of cash) means an asset increased or a liability decreased. So when you carry each CFS line back to the Balance Sheet, you SUBTRACT it from the related asset line and ADD it to the related liability/equity line — the signs then work out automatically.\n\nExamples: Depreciation (+) subtracted from PP&E reduces it; CapEx (−) subtracted from PP&E makes PP&E rise; a debt issuance (+) adds to Debt; a buyback (−) added to Treasury Stock reduces Equity. The check is always the same: after all links, Assets must equal Liabilities + Equity.", "tier": 2, "rank": 8031, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements p.13", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Calcs p.59", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 191, "so": 2}, {"id": "S3033", "src": "supp", "section": "Accounting – Calculations", "topic": "Statement Linkages", "q": "After all the links are built, what single check tells you whether your three-statement model is correct?", "a": "Correct answer: Assets = Liabilities + Equity on the Balance Sheet.\n\nThe Balance Sheet balancing is the master integrity check. If Net Income, non-cash add-backs, working-capital changes, and CFI/CFF items are all linked correctly, the two sides will be equal. If they're off, you've made a sign error, a missing link, or a double-count.\n\nEnding cash matching the CFS is necessary but not sufficient – the full balance check is the definitive test.", "tier": 2, "rank": 8033, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements p.13", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Calcs p.59", "h": "", "k": "ref"}], "type": "trap", "flags": [], "options": ["Net Income is positive", "Cash Flow from Operations exceeds CapEx", "Assets = Liabilities + Equity", "Retained Earnings equals last year's Net Income"], "correct": 2, "n": 192, "so": 2}, {"id": "S3042", "src": "supp", "section": "Accounting – Calculations", "topic": "Accounting Calcs", "q": "How do you calculate (operating) Working Capital, and why exclude Cash, Investments, and Debt?", "a": "Operating Working Capital = Current Assets (excluding Cash and short-term Investments) – Current Liabilities (excluding short-term Debt).\n\nYou exclude these because:\n– Cash: the bottom of the CFS already nets the change in cash; including it in WC would double-count.\n– Investments: their purchases/sales are investing activities, not operating, even if short-term.\n– Debt: issuance/repayment are financing activities, not operating, even if short-term.\n\nYou may also include long-term operating items (e.g., long-term Deferred Revenue). The goal is to isolate the operational drivers of cash.", "tier": 2, "rank": 8042, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statement Analysis p.27", "h": "", "k": "ref"}, {"t": "Red Book: Advanced Accounting p.35", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Calcs p.59", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 193, "so": 2}, {"id": "S3045", "src": "supp", "section": "Accounting – Calculations", "topic": "Accounting Calcs", "q": "A company sells a factory carried at $100 for $80 (40% tax). What is the total change in its cash balance?", "a": "Correct answer: up $88.\n\nThe $20 Loss reduces Net Income by $12 (after 40% tax), but you add the $20 Loss back as non-cash (+$8 net in CFO so far) and record the full $80 of proceeds in Cash Flow from Investing.\n\nTotal: –$12 + $20 + $80 = +$88.\n\nThe trap is answering +$80 (forgetting the tax shield on the Loss) or +$8 (forgetting to include the cash proceeds). The clean way: $80 proceeds + $8 tax savings on the Loss = $88.", "tier": 2, "rank": 8045, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statement Analysis p.27", "h": "", "k": "ref"}, {"t": "Red Book: Advanced Accounting p.35", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Calcs p.59", "h": "", "k": "ref"}], "type": "trap", "flags": [], "options": ["Up $80", "Up $88", "Up $8", "Down $12"], "correct": 1, "n": 194, "so": 2}, {"id": "S3057", "src": "supp", "section": "Equity Value & Enterprise Value – Concepts", "topic": "EV / Equity Value", "q": "A company has Diluted Equity Value of $222,000, Cash of $10,000, Debt of $30,000, and Noncontrolling Interests of $15,000. What is its Enterprise Value?", "a": "Correct answer: $257,000.\n\nEnterprise Value = Equity Value – Cash + Debt + Noncontrolling Interests = $222,000 – $10,000 + $30,000 + $15,000 = $257,000.\n\nThe traps: forgetting to ADD NCI (would give $242,000), or subtracting NCI instead of adding it, or adding Cash instead of subtracting. Remember the bridge – SUBTRACT non-core Assets (Cash, investments), ADD other investor-group claims (Debt, Preferred, NCI).", "tier": 2, "rank": 8057, "links": [{"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Corporate Finance Theory p.45", "h": "", "k": "ref"}, {"t": "400Q guide: EV/Equity Value p.71", "h": "", "k": "ref"}], "type": "trap", "flags": [], "options": ["$242,000", "$257,000", "$227,000", "$272,000"], "correct": 1, "n": 195, "so": 3}, {"id": "S3061", "src": "supp", "section": "Valuation Methodologies", "topic": "Valuation Methods", "q": "People call the DCF an 'intrinsic' valuation and comps/precedents 'relative.' Is that fully accurate?", "a": "Not exactly. The DCF is MORE intrinsic because it's driven by the company's own expected future cash flows. But it isn't purely intrinsic: the Discount Rate (WACC, Cost of Equity, Beta) is derived from peer/market data, and if you use the Multiples Method for Terminal Value, that multiple is also market-linked.\n\nSo the DCF still has market influence baked into its inputs – it's just LESS market-dependent than comps and precedents.\n\nThe precise statement: 'the DCF is more of an intrinsic methodology than the others, not a purely intrinsic one.'", "tier": 2, "rank": 8061, "links": [{"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Relative Valuation p.65", "h": "", "k": "ref"}, {"t": "400Q guide: Valuation Methodologies p.81", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 196, "so": 5}, {"id": "S3065", "src": "supp", "section": "Valuation Metrics and Multiples", "topic": "Valuation Multiples", "q": "A company trades at 13x EV/EBITDA. Is that expensive?", "a": "By itself, 13x means nothing – a multiple is only meaningful relative to comparable companies.\n\nIf similar firms with similar growth trade at ~10x, then 13x suggests this company may be OVERvalued. If peers trade at ~16x, then 13x may signal it's UNDERvalued.\n\nThe right framing: 'A multiple in isolation is like a clue in a murder mystery – it points your investigation somewhere but doesn't solve the case.' Always anchor it to the peer set and to the company's growth and risk profile.", "tier": 2, "rank": 8065, "links": [{"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Relative Valuation p.65", "h": "", "k": "ref"}, {"t": "400Q guide: Metrics & Multiples p.88", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 197, "so": 6}, {"id": "S3069", "src": "supp", "section": "Valuation Metrics and Multiples", "topic": "Valuation Multiples", "q": "Could a valuation multiple like P/E or EV/EBITDA ever be negative, and what would it mean?", "a": "Yes, most multiples can be negative if the denominator metric is negative – e.g., negative Net Income (P/E) or negative EBITDA (EV/EBITDA).\n\nBut a negative multiple is essentially meaningless for comparison – you can't sensibly rank companies on it. When the metric is negative or near zero, that multiple is 'not meaningful' (often shown as NM), and you switch to a more appropriate metric: e.g., EV/Revenue for an unprofitable company.\n\nThe practical takeaway: when a multiple goes negative or absurdly large, it's a signal to use a different denominator further up the income statement.", "tier": 2, "rank": 8069, "links": [{"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Relative Valuation p.65", "h": "", "k": "ref"}, {"t": "400Q guide: Metrics & Multiples p.88", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 198, "so": 6}, {"id": "S3070", "src": "supp", "section": "Valuation Metrics and Multiples", "topic": "Valuation Multiples", "q": "Which of the following is a valid, 'apples-to-apples' valuation multiple?", "a": "Correct answer: EV / EBITDA.\n\nEnterprise Value reflects all investors, and EBITDA is a pre-interest, all-investor metric – so the scopes match. The invalid pairs mix investor groups: EV / Net Income (Net Income is after interest, equity-only), Equity Value / EBITDA (EBITDA is pre-interest, all-investor), and Equity Value / Revenue (Revenue is an all-investor, pre-interest figure).\n\nRule of thumb: EV pairs with pre-interest metrics (Revenue, EBITDA, EBIT, Unlevered FCF); Equity Value pairs with post-interest metrics (Net Income, EPS, Levered FCF).", "tier": 2, "rank": 8070, "links": [{"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Relative Valuation p.65", "h": "", "k": "ref"}, {"t": "400Q guide: Metrics & Multiples p.88", "h": "", "k": "ref"}], "type": "trap", "flags": [], "options": ["EV / Net Income", "Equity Value / EBITDA", "EV / EBITDA", "Equity Value / Revenue"], "correct": 2, "n": 199, "so": 6}, {"id": "S3074", "src": "supp", "section": "Discounted Cash Flow (DCF) – Assumptions and Analysis", "topic": "DCF Mechanics", "q": "Why do you discount the Terminal Value, and why use the LAST forecast year's number (e.g., 10 for a 10-year DCF) rather than 11?", "a": "You discount the Terminal Value because it represents the company's value as of the END of the explicit forecast period – a future value – and valuation must express everything in today's dollars. Failing to discount it would massively overstate Implied Value.\n\nYou use 10 (not 11) because, although the Terminal Value captures cash flows starting in Year 11 onward, it is the present value of those cash flows AS OF the end of Year 10. So you discount it back 10 years to today.\n\nYou'd only use 11 if your explicit forecast ran through Year 11 and the Terminal Period began in Year 12.", "tier": 2, "rank": 8074, "links": [{"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book: Intrinsic Valuation p.54", "h": "", "k": "ref"}, {"t": "400Q guide: DCF p.94", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 200, "so": 7}, {"id": "S3077", "src": "supp", "section": "Discounted Cash Flow (DCF) – Assumptions and Analysis", "topic": "DCF Mechanics", "q": "After summing the PV of Free Cash Flows and PV of Terminal Value in an Unlevered DCF, what do you do next?", "a": "That sum is the Implied ENTERPRISE Value (because you used Unlevered FCF and WACC). You then 'back into' Implied Equity Value:\n\nAdd non-core-business Assets (Cash, investments) and SUBTRACT claims of other investor groups (Debt, Preferred Stock, Noncontrolling Interests). That yields Implied Equity Value.\n\nThen divide by the diluted share count to get the Implied Share Price, which you compare to the current share price to judge over/undervaluation.\n\nContrast: a LEVERED DCF (Levered FCF + Cost of Equity) produces Implied Equity Value directly, so you skip the bridge and go straight to dividing by diluted shares.", "tier": 2, "rank": 8077, "links": [{"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book: Intrinsic Valuation p.54", "h": "", "k": "ref"}, {"t": "400Q guide: DCF p.94", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 201, "so": 7}, {"id": "S3081", "src": "supp", "section": "Discounted Cash Flow (DCF) – Assumptions and Analysis", "topic": "DCF Mechanics", "q": "In an Unlevered DCF, the sum of (PV of Free Cash Flows + PV of Terminal Value) equals which value?", "a": "Correct answer: Implied Enterprise Value.\n\nBecause an Unlevered DCF uses Unlevered FCF (available to all investors) discounted at WACC (representing all investors), the result is Enterprise Value. You must then add Cash/non-core assets and subtract Debt, Preferred, and NCI to get Implied Equity Value, then divide by diluted shares for the share price.\n\nIf this were a LEVERED DCF (Levered FCF + Cost of Equity), the sum would equal Implied Equity Value directly – but that's not what's described here.", "tier": 2, "rank": 8081, "links": [{"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book: Intrinsic Valuation p.54", "h": "", "k": "ref"}, {"t": "400Q guide: DCF p.94", "h": "", "k": "ref"}], "type": "trap", "flags": [], "options": ["Implied Equity Value", "Implied Enterprise Value", "Implied Share Price", "Net Debt"], "correct": 1, "n": 202, "so": 7}, {"id": "S3086", "src": "supp", "section": "Discounted Cash Flow (DCF) – The Discount Rate", "topic": "WACC", "q": "As a company takes on more Debt, what happens to Cost of Equity, Cost of Debt, and WACC?", "a": "Cost of Equity and Cost of Debt BOTH rise as Debt increases – more leverage raises bankruptcy risk, which affects all investors.\n\nWACC is non-monotonic: going from no debt to some debt, WACC FALLS at first because Debt is cheaper than Equity (and tax-deductible). But past a certain point, WACC RISES as the growing bankruptcy risk outweighs the cheaper debt.\n\nSo the answer depends on where you are on the U-shaped curve: at low leverage, more debt lowers WACC; at high leverage, more debt raises it. This U-shape is exactly why the Unlevered DCF implicitly captures the downside of too much debt.", "tier": 2, "rank": 8086, "links": [{"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book: Intrinsic Valuation p.54", "h": "", "k": "ref"}, {"t": "400Q guide: Discount Rate p.103", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 203, "so": 8}, {"id": "S3089", "src": "supp", "section": "Discounted Cash Flow (DCF) – The Discount Rate", "topic": "WACC", "q": "Should you use the company's current capital structure or its 'optimal' structure to calculate WACC?", "a": "You generally want the TARGET/optimal structure, not necessarily the current one. The 'optimal' structure minimizes WACC, but you can't compute it directly because you can't know in advance exactly how the Costs of Equity and Debt will shift as leverage changes.\n\nIn practice, you proxy the optimal structure with the MEDIAN capital-structure weights of comparable public companies – the same logic as un-levering/re-levering Beta to peer medians.\n\nWhy: a DCF values the company on its EXPECTED future cash flows, so the discount rate should reflect its expected/target capital structure, not a possibly temporary current mix.", "tier": 2, "rank": 8089, "links": [{"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book: Intrinsic Valuation p.54", "h": "", "k": "ref"}, {"t": "400Q guide: Discount Rate p.103", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 204, "so": 8}, {"id": "S3200", "src": "supp", "section": "Merger Models – Concepts", "topic": "M&A Concepts", "q": "Why is EPS accretion/dilution the metric bankers focus on in a merger model, when in theory companies should only care about cash flow?", "a": "EPS is the only easy-to-calculate metric that captures the FULL impact of the deal: it reflects the foregone interest on cash, the after-tax interest on new debt, AND the new shares issued, all in one number.\n\nMetrics like EBITDA or NOPAT are computed before net interest and ignore share count, so they can't show the deal's complete effect. FCF per share could capture it but is volatile and slow to calculate.\n\nThe real-world reason: shareholders watch EPS closely, and an unexpected EPS decline hits the share price. So all else equal, companies prefer accretive deals.\n\nThe trap here is answering 'because EPS drives the stock price' and stopping. Lead with the technical point - it is the only simple metric that captures interest AND share count - then add the shareholder-pressure color.", "tier": 2, "rank": 8200, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book: M&A Concepts p.73", "h": "", "k": "ref"}, {"t": "400Q guide: Merger Models p.107", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 205, "so": 9}, {"id": "S3202", "src": "supp", "section": "Merger Models – Concepts", "topic": "M&A Concepts", "q": "An acquirer funds a deal 100% with excess cash earning 2%. The interviewer says: 'That cash is just sitting there earning nothing real, so using it is basically free - the foregone interest is only an opportunity cost we can ignore.' What's the best response?", "a": "The foregone interest is a real cost, not a cost you can ignore.", "tier": 2, "rank": 8202, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book: M&A Concepts p.73", "h": "", "k": "ref"}, {"t": "400Q guide: Merger Models p.107", "h": "", "k": "ref"}], "type": "trap", "flags": [], "options": ["He's right - foregone interest on cash is a pure opportunity cost and shouldn't reduce combined net income", "He's wrong - the buyer's projected net income already includes that interest income, so removing the cash genuinely lowers projected net income and EPS", "He's right, but only because the 2% rate is so low; at higher rates it would matter", "He's wrong because cash always earns the risk-free rate, which is never zero"], "correct": 1, "n": 206, "so": 9}, {"id": "S3219", "src": "supp", "section": "LBO Models – Concepts", "topic": "LBO", "q": "Explain the legal/holding-company structure of an LBO and why it benefits the PE firm.", "a": "The PE firm forms a holding company (HoldCo) that it owns, and that HoldCo acquires the target. Lenders lend to the HoldCo, so the debt sits at the HoldCo level. Management who roll over their stakes also hold shares in the HoldCo.\n\nWhy it benefits the firm: the PE firm is NOT personally on the hook for the debt. The debt is the acquired company's obligation to repay. So the firm (1) uses other people's money to do the deal, and (2) doesn't even borrow that money directly - the company does. This isolates the firm's downside to its equity check.\n\nInterview framing: 'The PE firm borrows other people's money, and the company - not the firm - is responsible for repaying it. The firm's loss is capped at the equity it put in.'", "tier": 2, "rank": 8219, "links": [{"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "Red Book: Private Equity Investing p.91", "h": "", "k": "ref"}, {"t": "Red Book: LBO Modeling p.104", "h": "", "k": "ref"}, {"t": "400Q guide: LBO p.119", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 207, "so": 11}, {"id": "S3223", "src": "supp", "section": "LBO Models – Concepts", "topic": "LBO", "q": "A strategic acquirer usually prefers paying 100% cash. So why would a PE firm deliberately load a deal with debt?", "a": "Two reasons the LBO situation differs:\n\n1) The PE firm plans to SELL in a few years, so it cares less about the ongoing expense of debt and more about using leverage to amplify returns by minimizing the equity it contributes upfront. Less equity in = higher IRR for the same value creation.\n\n2) Risk transfer: in an LBO the acquired company is responsible for repaying the debt (it sits at the HoldCo), so the company bears the leverage risk. In a normal M&A deal the buyer / combined entity carries the debt on its own balance sheet, so the strategic absorbs that risk itself - hence its preference for cash.\n\nLead with: 'Different incentives - the sponsor is optimizing IRR over a short hold and the company, not the firm, carries the debt.'", "tier": 2, "rank": 8223, "links": [{"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "Red Book: Private Equity Investing p.91", "h": "", "k": "ref"}, {"t": "Red Book: LBO Modeling p.104", "h": "", "k": "ref"}, {"t": "400Q guide: LBO p.119", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 208, "so": 11}, {"id": "S3229", "src": "supp", "section": "LBO Models – Concepts", "topic": "LBO", "q": "Give the mental-math rules of thumb for approximating LBO IRRs for 'double your money' and 'triple your money' over various holding periods.", "a": "Double-your-money rule: take 100%, divide by # of years, multiply by ~75%.\n- 2x in 1 year = 100% IRR\n- 2x in 2 years = ~40%\n- 2x in 3 years = ~25%\n- 2x in 4 years = ~20%\n- 2x in 5 years = ~15%\n\nTriple-your-money rule: take 200%, divide by # of years, multiply by ~65%.\n- 3x in 3 years = ~45%\n- 3x in 5 years = ~25%\n\nWhy the haircut (75% / 65%): compounding means the annual rate is less than the simple average. Triple uses a deeper haircut because the compounding effect is larger.\n\nMemorize the 5-year anchors especially: 2x=15%, 2.5x=20%, 3x=25%. Most interview LBOs assume a 5-year hold.", "tier": 2, "rank": 8229, "links": [{"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "Red Book: Private Equity Investing p.91", "h": "", "k": "ref"}, {"t": "Red Book: LBO Modeling p.104", "h": "", "k": "ref"}, {"t": "400Q guide: LBO p.119", "h": "", "k": "ref"}], "type": "recall", "flags": [], "n": 209, "so": 11}, {"id": "S3234", "src": "supp", "section": "LBO Models – Concepts", "topic": "LBO", "q": "What is a dividend recapitalization, and what are its advantages and disadvantages as a way for a PE firm to realize returns?", "a": "A dividend recap is when the portfolio company raises NEW debt and uses the proceeds to pay a special dividend to the PE firm - returning capital to the sponsor without selling the company.\n\nAdvantages: the firm de-risks by pulling cash out early, which boosts IRR (cash received sooner) and locks in some return regardless of the eventual exit. It also keeps the upside if the company later sells well.\n\nDisadvantages: it loads MORE debt onto the company, increasing default risk and interest burden, which can impair growth or even sink the company. It's often viewed as aggressive financial engineering, and lenders/credit markets must be willing to fund it.\n\nWhen used: typically when the company performs well and generates strong cash flow but a clean exit (M&A or IPO) isn't available or attractive yet. Interview tip: stress that a recap boosts IRR via timing but raises risk - it's a lever, not free money.", "tier": 2, "rank": 8234, "links": [{"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "Red Book: Private Equity Investing p.91", "h": "", "k": "ref"}, {"t": "Red Book: LBO Modeling p.104", "h": "", "k": "ref"}, {"t": "400Q guide: LBO p.119", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 210, "so": 11}, {"id": "S3235", "src": "supp", "section": "LBO Models – Concepts", "topic": "LBO", "q": "What is a management rollover (equity rollover) in an LBO, and how does it affect the Sources & Uses schedule and the 'true' purchase price?", "a": "A rollover is when existing owners / management reinvest (roll over) some of their existing equity into the new deal rather than cashing out entirely. Their rolled equity appears as a SOURCE of funds in the Sources & Uses schedule, alongside the PE firm's equity and the debt.\n\nEffect on the true price: because management's rolled stake is funded by their own existing shares (not new cash the sponsor must raise), the PE firm's actual cash outlay - the 'real price' - is REDUCED by the rollover amount. With a large rollover the real price can fall below BOTH the purchase equity value and the purchase enterprise value.\n\nWhy firms like it: a rollover keeps management financially aligned ('skin in the game') and reduces the sponsor's equity check. Typical rollovers run 5-10%; founder-led companies can be much higher (sometimes 40%+).", "tier": 2, "rank": 8235, "links": [{"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "Red Book: Private Equity Investing p.91", "h": "", "k": "ref"}, {"t": "Red Book: LBO Modeling p.104", "h": "", "k": "ref"}, {"t": "400Q guide: LBO p.119", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 211, "so": 11}, {"id": "S3236", "src": "supp", "section": "LBO Models – Concepts", "topic": "LBO", "q": "What is a Returns Attribution Analysis, and what does it tell you about deal quality?", "a": "It decomposes the equity value gain in an LBO into its three sources:\n1) EBITDA Growth - hold the entry multiple constant and measure how much value came purely from EBITDA rising.\n2) Multiple Expansion - hold final EBITDA at the initial level and measure value from the multiple changing.\n3) Debt Paydown and Cash Generation - the plug; value created by reducing net debt and accumulating cash.\n\nWhy it matters for quality: returns driven by EBITDA growth and debt paydown are higher quality and more controllable. Returns that depend heavily on MULTIPLE EXPANSION rely on selling to a 'greater fool' at a richer multiple - that's market-dependent and risky.\n\nInterview takeaway: a deal whose attribution shows most value from operational improvement (EBITDA + paydown) rather than multiple expansion is more defensible. Say: 'I want my returns to come from growth and deleveraging, not from hoping the exit multiple is higher than entry.'", "tier": 2, "rank": 8236, "links": [{"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "Red Book: Private Equity Investing p.91", "h": "", "k": "ref"}, {"t": "Red Book: LBO Modeling p.104", "h": "", "k": "ref"}, {"t": "400Q guide: LBO p.119", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 212, "so": 11}, {"id": "S3241", "src": "supp", "section": "Capital Markets (supplemental)", "topic": "Capital Markets", "q": "Will a 10% coupon bond or a 5% coupon bond be more sensitive to changes in the discount rate, all else equal? Why?", "a": "The 5% (lower-coupon) bond is MORE sensitive.\n\nReason: with a lower coupon, a larger share of the bond's total value comes from the single principal repayment at maturity, which is far in the future. The present value of that distant lump sum is highly sensitive to the discount rate. A higher-coupon bond returns more of its value early via large coupons, so its cash flows are weighted toward the near term and are less affected by rate changes.\n\nThis is the intuition behind DURATION: lower coupon = longer duration = greater price sensitivity to rates. Zero-coupon bonds (all value at maturity) are the most sensitive of all.\n\nInterview phrasing: 'Lower coupon means more value sits in the final principal payment, which has the highest interest-rate sensitivity, so the 5% bond moves more.'", "tier": 2, "rank": 8241, "links": [{"t": "Red Book: Debt & LevFin p.112", "h": "", "k": "ref"}, {"t": "Red Book: Equity Financing p.122", "h": "", "k": "ref"}, {"t": "400Q guide: DCM/LevFin p.131", "h": "", "k": "ref"}, {"t": "400Q guide: ECM p.145", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 213, "so": 18}, {"id": "S3247", "src": "supp", "section": "Capital Markets (supplemental)", "topic": "Capital Markets", "q": "What is a Greenshoe (overallotment) option in an equity offering, and when would a bank use it?", "a": "A Greenshoe lets the underwriters sell MORE shares than originally planned - typically up to 15% extra - if demand is strong.\n\nMechanics/use: if the offering is oversubscribed and the stock trades well, the bank exercises the option to issue additional shares, increasing the deal size and capital raised. Example: planned 10M shares at $10 = $100M; with a 15% Greenshoe, sell 11.5M shares = $115M.\n\nIt also serves a price-stabilization function: underwriters can oversell (go short) into the offering and then either buy shares in the open market if the price falls (supporting it) or exercise the Greenshoe if it rises - covering their short either way.\n\nEffect: a larger deal means a higher percentage of the company sold to new investors. Banks offer it when they expect or see higher-than-planned demand.", "tier": 2, "rank": 8247, "links": [{"t": "Red Book: Debt & LevFin p.112", "h": "", "k": "ref"}, {"t": "Red Book: Equity Financing p.122", "h": "", "k": "ref"}, {"t": "400Q guide: DCM/LevFin p.131", "h": "", "k": "ref"}, {"t": "400Q guide: ECM p.145", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 214, "so": 18}, {"id": "S3250", "src": "supp", "section": "Capital Markets (supplemental)", "topic": "Capital Markets", "q": "A company issued an 8% coupon, 7-year bond. Rates have since fallen ~2%. It wants to refinance with the SAME investors into a new 6% coupon, 10-year bond. Why might the investors refuse?", "a": "The new bond's duration is much higher (lower coupon + longer maturity), so it carries more interest-rate risk than investors want to hold.", "tier": 2, "rank": 8250, "links": [{"t": "Red Book: Debt & LevFin p.112", "h": "", "k": "ref"}, {"t": "Red Book: Equity Financing p.122", "h": "", "k": "ref"}, {"t": "400Q guide: DCM/LevFin p.131", "h": "", "k": "ref"}, {"t": "400Q guide: ECM p.145", "h": "", "k": "ref"}], "type": "trap", "flags": [], "options": ["Because the 6% coupon is below the original 8%, so investors would simply earn less income", "Because a 10-year, 6% coupon bond has much higher duration (interest-rate risk) than the 7-year, 8% bond, and investors manage their portfolios to a target duration", "Because falling rates always make refinancing impossible", "Because the bond would now trade at a discount to par, creating a loss for investors"], "correct": 1, "n": 215, "so": 18}, {"id": "S3251", "src": "supp", "section": "Capital Markets (supplemental)", "topic": "Capital Markets", "q": "What is the Debt Service Coverage Ratio (DSCR), and why might a company have healthy Debt/EBITDA and EBITDA/Interest ratios but a failing DSCR?", "a": "DSCR is roughly (FCF excluding interest and other fixed charges) / (interest and other fixed charges). It's broader than EBITDA-based ratios because it captures actual cash available after CapEx and working capital, and it includes fixed charges like lease payments - not just interest.\n\nWhy the mismatch can happen: a company can look fine on Debt/EBITDA (leverage) and EBITDA/Interest (coverage) yet fail DSCR if:\n- FCF conversion (FCF/EBITDA) is low - heavy CapEx or a negative working-capital swing eats the cash that EBITDA implies.\n- It has large non-interest fixed charges, especially operating LEASES, that EBITDA-based metrics ignore.\n\nFixes: cut CapEx, improve working-capital management, reduce lease obligations, or refinance to a lower rate. The point: EBITDA isn't cash - DSCR catches the gap between accounting EBITDA and real cash available to service fixed obligations.", "tier": 2, "rank": 8251, "links": [{"t": "Red Book: Debt & LevFin p.112", "h": "", "k": "ref"}, {"t": "Red Book: Equity Financing p.122", "h": "", "k": "ref"}, {"t": "400Q guide: DCM/LevFin p.131", "h": "", "k": "ref"}, {"t": "400Q guide: ECM p.145", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 216, "so": 18}, {"id": "S3252", "src": "supp", "section": "Capital Markets (supplemental)", "topic": "Capital Markets", "q": "A company wants a lower coupon, but lenders insist on keeping (or raising) their yield. What levers can the company pull to bridge the gap?", "a": "Offer lenders other forms of value that boost their effective yield in exchange for the lower cash coupon:\n- Original Issue Discount (OID): sell the bond below par, giving lenders an upfront discount that lifts YTM.\n- Call protection / call premiums and Make-Whole Premiums: penalty fees if the company prepays early, compensating lenders for reinvestment risk.\n- Shorter maturity: reduces duration risk lenders bear.\n\nIn a stressed/distressed or restructuring context, add equity sweeteners:\n- Warrants attached to the debt (equity upside).\n- A debt-for-equity swap component.\n\nInterview framing: 'Coupon is only one component of return. To cut the cash coupon, I'd raise yield through an OID or call/make-whole premiums, and in a distressed deal, attach warrants or equity to make lenders whole.'", "tier": 2, "rank": 8252, "links": [{"t": "Red Book: Debt & LevFin p.112", "h": "", "k": "ref"}, {"t": "Red Book: Equity Financing p.122", "h": "", "k": "ref"}, {"t": "400Q guide: DCM/LevFin p.131", "h": "", "k": "ref"}, {"t": "400Q guide: ECM p.145", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 217, "so": 18}, {"id": "S3253", "src": "supp", "section": "Capital Markets (supplemental)", "topic": "Capital Markets", "q": "What is Yield to Worst (YTW), and how does it relate to Yield to Maturity (YTM) and Yield to Call?", "a": "Yield to Worst is the LOWEST yield an investor could realize across all the bond's possible outcomes - the minimum of the Yield to Maturity and the Yield to Call on every possible call date.\n\nFor a callable bond, the issuer will call when it's advantageous to the issuer (typically when rates have fallen and the bond trades at a premium), which is disadvantageous to the investor. So the investor assumes the worst-case scenario: whichever redemption date produces the lowest yield.\n\nRelationship: for a bond trading at a premium, YTW is usually the Yield to Call (the issuer is likely to call early). For a bond at a discount, YTW is usually the Yield to Maturity (no incentive to call). Investors quote YTW as the conservative, 'assume the worst' yield.", "tier": 2, "rank": 8253, "links": [{"t": "Red Book: Debt & LevFin p.112", "h": "", "k": "ref"}, {"t": "Red Book: Equity Financing p.122", "h": "", "k": "ref"}, {"t": "400Q guide: DCM/LevFin p.131", "h": "", "k": "ref"}, {"t": "400Q guide: ECM p.145", "h": "", "k": "ref"}], "type": "recall", "flags": [], "n": 218, "so": 18}, {"id": "S3254", "src": "supp", "section": "Capital Markets (supplemental)", "topic": "Capital Markets", "q": "What would cause a company's credit rating to change, even if its financial statements barely move?", "a": "Two categories drive ratings: quantitative credit stats and qualitative risk factors.\n\nQuantitative: a meaningful shift in Debt/EBITDA, EBITDA/Interest, FCF, or liquidity. If peers rated 'BB+' run 4-5x leverage and this company jumps to 6x, expect a downgrade.\n\nQualitative (the part that can move ratings with flat financials): an industry downturn, a powerful new competitor entering, loss of a key customer or patent, deteriorating growth outlook, regulatory or litigation risk, management/governance concerns, or M&A that changes the business risk profile.\n\nInterview point: ratings are forward-looking views of default risk, not just a snapshot of current ratios. A company can keep identical numbers and still be downgraded if the OUTLOOK for those numbers worsens.", "tier": 2, "rank": 8254, "links": [{"t": "Red Book: Debt & LevFin p.112", "h": "", "k": "ref"}, {"t": "Red Book: Equity Financing p.122", "h": "", "k": "ref"}, {"t": "400Q guide: DCM/LevFin p.131", "h": "", "k": "ref"}, {"t": "400Q guide: ECM p.145", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 219, "so": 18}, {"id": "S3268", "src": "supp", "section": "Market Context (supplemental)", "topic": "Market Context", "q": "It's early 2026. How would you describe the current M&A and financing environment at a high level, without quoting specific statistics?", "a": "Frame it around the drivers, and keep figures GENERAL/illustrative:\n- Rates and financing: after the elevated-rate period of recent years, the cost and availability of debt remains a central swing factor for deal activity - cheaper, more available financing supports leveraged deals and sponsor activity; tighter conditions favor strategics paying with cash or stock.\n- Sponsor dynamics: PE firms hold substantial uninvested capital ('dry powder') and face pressure to deploy and to exit aging portfolio companies, supporting both buyouts and sales.\n- Strategic appetite: corporates with strong balance sheets pursue scale, supply-chain resilience, and technology/AI capabilities.\n- Regulatory backdrop: antitrust scrutiny remains a real consideration for large horizontal deals across jurisdictions.\n- Sector tilt: defense/aerospace, energy/power (including electrification and data-center demand), and industrials are active themes.\n\nThe move: speak to the DRIVERS (rates, dry powder, regulation, sector themes) and say figures are 'broadly' or 'on the order of' rather than inventing precise numbers. Then connect it to why you're excited to join now.", "tier": 2, "rank": 8268, "links": [{"t": "Red Book: General Market Knowledge p.133", "h": "", "k": "ref"}], "type": "concept", "flags": ["dated"], "n": 220, "so": 20}, {"id": "S3272", "src": "supp", "section": "Market Context (supplemental)", "topic": "Market Context", "q": "Why do interest rates matter so much for M&A and LBO activity? Connect rates to deal volumes, valuations, and sponsor behavior.", "a": "Rates are a master variable for deal markets:\n\n1) Cost and availability of debt: higher rates make leveraged financing more expensive and lenders more cautious, shrinking the debt sponsors can raise and the price they can pay. Lower rates do the opposite - cheap, plentiful debt fuels LBOs.\n\n2) Valuations: higher discount rates (WACC) lower DCF values and tend to compress multiples; lower rates lift them. So a rate move re-prices targets broadly.\n\n3) Sponsor math: an LBO's returns depend heavily on leverage. Expensive debt means less leverage and lower IRRs at a given price, so sponsors must pay less or accept thinner returns - dampening buyout volume. Falling rates re-energize sponsor bidding.\n\n4) Strategic vs. sponsor balance: when debt is costly, cash-rich strategics and stock deals gain an edge over leverage-dependent sponsors.\n\n5) Confidence/timing: rate stability matters as much as level - certainty lets buyers and sellers agree on price; volatility freezes deal-making.\n\nOne-liner: 'Rates set the price of leverage and the discount rate - they move financing capacity, valuations, and the balance between strategics and sponsors all at once.'", "tier": 2, "rank": 8272, "links": [{"t": "Red Book: General Market Knowledge p.133", "h": "", "k": "ref"}], "type": "concept", "flags": ["dated"], "n": 221, "so": 20}, {"id": "S3273", "src": "supp", "section": "Market Context (supplemental)", "topic": "Market Context", "q": "What is 'dry powder,' and why does the amount of it in private equity matter for the current deal environment?", "a": "Dry powder is committed but uninvested capital that PE (and other private capital) funds have on hand to deploy.\n\nWhy it matters now:\n1) Deployment pressure: LPs commit capital expecting it to be put to work; funds have finite investment periods, so large dry-powder balances create pressure to do deals, supporting buyout demand and competitive auctions / higher prices.\n2) Exit pressure (the flip side): firms also need to RETURN capital to LPs. After a slower exit stretch, aging portfolio companies must be sold, IPO'd, or recapped - driving sell-side M&A, continuation funds, and dividend recaps.\n3) Floor under valuations: abundant capital chasing deals helps support asset prices even when strategic buyers pull back.\n4) Financing-dependent: dry powder is EQUITY; deploying it at scale still needs debt markets to cooperate, so its impact is gated by the cost/availability of leverage.\n\nBanker framing: 'There's a lot of equity capital that needs to be both deployed and returned, which supports activity on both the buy- and sell-side - but it's only as powerful as the debt markets that lever it.'", "tier": 2, "rank": 8273, "links": [{"t": "Red Book: General Market Knowledge p.133", "h": "", "k": "ref"}], "type": "concept", "flags": ["dated"], "n": 222, "so": 20}, {"id": "S3275", "src": "supp", "section": "Market Context (supplemental)", "topic": "Market Context", "q": "In a rising-interest-rate environment, all else equal, what generally happens to leveraged buyout activity?", "a": "It tends to slow - higher rates make debt costlier and scarcer, so sponsors can raise less leverage and must pay lower prices or accept lower IRRs, dampening buyout volume.", "tier": 2, "rank": 8275, "links": [{"t": "Red Book: General Market Knowledge p.133", "h": "", "k": "ref"}], "type": "trap", "flags": ["dated"], "options": ["It generally accelerates, because sponsors rush to lock in deals before rates rise further", "It generally slows, because pricier and scarcer debt reduces leverage capacity, pressures prices/IRRs, and shifts the edge toward cash-rich strategics", "It is unaffected, since LBOs are driven by EBITDA growth, not financing costs", "It accelerates, because higher rates lower target valuations and make everything a bargain"], "correct": 1, "n": 223, "so": 20}, {"id": "S3276", "src": "supp", "section": "Market Context (supplemental)", "topic": "Market Context", "q": "What makes a 'take-private' (a sponsor buying a public company) attractive, and why have we seen more of them in recent years?", "a": "A take-private is a PE firm acquiring a publicly traded company and delisting it.\n\nWhy attractive:\n1) Valuation gaps: when public markets undervalue a company (especially smaller-cap or out-of-favor sectors), a sponsor can buy at a reasonable multiple and a modest control premium and still hit its return targets.\n2) Operate without quarterly pressure: away from public-market scrutiny, management can pursue longer-term restructuring, margin work, and M&A without managing to quarterly EPS.\n3) Underfollowed / orphaned stocks: companies with thin analyst coverage or stranded in a conglomerate can be worth more standalone or under focused ownership.\n4) Available financing and dry powder: large funds and clubbed-up consortia can write big equity checks; when debt cooperates, even multi-billion-dollar names are reachable.\n\nWhy more lately: persistent gaps between public valuations and private/strategic value, large pools of dry powder needing deployment, and a number of quality companies trading below intrinsic value - all making public targets appealing.\n\nBanker framing: 'Take-privates happen when the public market misprices a company relative to what a focused, patient, levered owner can do with it - and when financing makes the math work.'", "tier": 2, "rank": 8276, "links": [{"t": "Red Book: General Market Knowledge p.133", "h": "", "k": "ref"}], "type": "concept", "flags": ["dated"], "n": 224, "so": 20}, {"id": "S3278", "src": "supp", "section": "Market Context (supplemental)", "topic": "Market Context", "q": "Why might 2026 be an environment where ECM (IPOs and follow-ons) reopens, and how would you describe IPO-market health to an interviewer without inventing numbers?", "a": "Drivers of an IPO-window reopening (speak to conditions, keep figures general):\n1) Lower volatility / rate stability: IPOs need calm, predictable markets so issuers and investors can agree on price; reduced volatility and clearer rate expectations reopen the window.\n2) Backlog of candidates: after slower IPO years, there's a pipeline of mature private companies - including PE- and VC-backed names - that need to go public to provide liquidity to investors (sponsor exit pressure).\n3) Strong recent debut performance: successful, well-traded IPOs build confidence and encourage the next wave - aftermarket performance is the key signal.\n4) Demand for new issuance: institutional investors with capital to deploy seek fresh growth names.\n\nHow to describe market health: cite the SIGNALS, not invented stats - 'the window looks like it's opening / selective' based on volatility (the VIX environment), the cadence and aftermarket performance of recent deals, the depth of the filed/confidential pipeline, and investor appetite. \n\nBanker framing: 'A healthy IPO market needs calm markets, a quality pipeline, and IPOs that trade up after pricing - when those align, the window opens. I'd point to recent deal performance and volatility levels rather than a single statistic.'", "tier": 2, "rank": 8278, "links": [{"t": "Red Book: General Market Knowledge p.133", "h": "", "k": "ref"}], "type": "concept", "flags": ["dated"], "n": 225, "so": 20}, {"id": "S3501", "src": "supp", "section": "Accounting – Calculations", "topic": "Accounting Calcs", "q": "Walk me through the mechanics of the Right-of-Use Asset and Lease Liability after a lease is signed. How does each change over the lease term?", "a": "At signing, both are recorded at the present value of the future lease payments, discounted at the rate implicit in the lease or, more commonly, the company's incremental borrowing rate. Example from the guide: a 10-year lease at $160/year discounted at 5% has a PV of roughly $1,200, so you put $1,200 on both sides of the Balance Sheet.\n\nThe Lease Liability works like amortizing debt: each period it accrues 'interest' at the discount rate (Year 1: 5% x $1,200 = $60), and the cash payment in excess of that interest reduces the principal ($160 - $60 = $100 of 'principal repayment'). So the liability falls by $100 in Year 1, and by progressively larger amounts later as the interest portion shrinks.\n\nThe ROU Asset declines too, but how depends on classification. For a finance lease (and all IFRS leases), it depreciates straight-line: $1,200 / 10 = $120/year. For a US GAAP operating lease, the ROU asset amortization is effectively a plug so that total lease expense stays a flat $160/year — in Year 1 with constant payments, the asset declines by $100, matching the liability.\n\nKey insight for finance leases: because depreciation ($120) plus interest ($60) = $180 exceeds the $160 cash rent early on, finance/IFRS leases are front-loaded — higher total expense in early years, lower in later years, same total over the life.", "tier": 2, "rank": 8501, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statement Analysis p.27", "h": "", "k": "ref"}, {"t": "Red Book: Advanced Accounting p.35", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Calcs p.59", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 226, "so": 2}, {"id": "S3505", "src": "supp", "section": "Accounting – Calculations", "topic": "Accounting Calcs", "q": "What is the 'lease-adjusted leverage' view, and why do credit analysts insist on it when looking at retailers or airlines?", "a": "Lease-adjusted leverage treats lease obligations as debt-like, because economically they are: fixed, contractual, multi-year payment obligations that rank ahead of shareholders. A retailer that leases all 500 stores has committed itself just as firmly as one that mortgaged 500 owned stores — plain Debt/EBITDA makes the lessee look almost unlevered, which is misleading.\n\nThe adjusted view: add lease liabilities to debt in the numerator, and use a lease-consistent earnings measure in the denominator — either EBITDAR (earnings before rent) against debt-plus-capitalized-leases, or an IFRS 16-style EBITDA that excludes lease costs. Now that ASC 842 and IFRS 16 put lease liabilities on the Balance Sheet, the numbers are sitting right there — pre-2019, analysts had to capitalize leases manually from footnote disclosures.\n\nWhy it matters in practice: (1) comparability — an asset-light company that rents everything vs. an asset-heavy one that borrows to own should screen similarly if their economics are similar; (2) credit — rating agencies and lenders size leverage covenants and downside cases on the adjusted basis; (3) M&A/LBO — a sponsor's effective leverage on a lease-heavy target is higher than the headline Debt/EBITDA suggests, which constrains how much actual debt the deal can support.\n\nThe one consistency rule: if lease liabilities are in your debt number, lease costs must be excluded from your earnings number, and vice versa.", "tier": 2, "rank": 8505, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statement Analysis p.27", "h": "", "k": "ref"}, {"t": "Red Book: Advanced Accounting p.35", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Calcs p.59", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 227, "so": 2}, {"id": "S3512", "src": "supp", "section": "Valuation Methodologies", "topic": "Valuation Methods", "q": "How do you actually pick comparable companies — and how would you respond if an interviewer pushed back that comp selection is arbitrary?", "a": "The standard screens are geography, industry, and size — plus time for precedent transactions. Real examples of well-formed screens: 'US-based steel manufacturers with over $500 million in revenue,' 'European legacy airlines with over EUR 1 billion in EBITDA,' or for precedents, 'Latin American consumer/retail sellers with over $1 billion in revenue in deals from the past 3 years.'\n\nThe honest part — and the part that separates good answers: comp selection IS judgment, and it drives the output. There is rarely a perfect comp, so you make trade-offs: a closer business model with a different size, or a same-size company with a slightly different mix. The defense against 'arbitrary' is process, not pretense: (1) set the screening criteria BEFORE looking at the multiples, so you're not reverse-engineering the answer; (2) disclose the full set and the exclusions with reasons (e.g., 'excluded X because half its revenue is a different segment'); (3) use the percentile range (25th–75th), not a cherry-picked single comp; (4) sanity-check whether differences in growth and margins explain differences in multiples — comps are most meaningful when growth and margins are similar but multiples differ, which is what flags potential mispricing.\n\nIt's also fine to acknowledge the institutional reality: bankers chosen to pitch a sale will often select comps that flatter the client. The analytical discipline above is what keeps the analysis defensible in a fairness opinion or in front of a buyer's own bankers.", "tier": 2, "rank": 8512, "links": [{"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Relative Valuation p.65", "h": "", "k": "ref"}, {"t": "400Q guide: Valuation Methodologies p.81", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 228, "so": 5}, {"id": "S3513", "src": "supp", "section": "Merger Models – Concepts", "topic": "M&A Concepts", "q": "What is an earnout, and why do buyers and sellers use them?", "a": "An earnout — formally 'contingent consideration' — is a deal mechanism where a portion of the purchase price is paid later, contingent on the seller hitting pre-agreed financial or operational targets (revenue, EBITDA, synergy realization, regulatory milestones).\n\nWhy it exists: to break valuation deadlocks. The seller believes the business is worth more than the buyer is willing to pay — often because the seller's value rests on an aggressive forecast. The earnout splits the difference: the buyer pays the lower 'certain' price up front, and the seller can earn up to their asking price IF the forecast actually materializes. It's a risk-allocation mechanism — the burden of hitting the numbers shifts to the seller.\n\nTypical structure: one to five years, paid in installments rather than a lump sum, with payouts tiered against escalating targets rather than all-or-nothing.\n\nWhere you see them: overwhelmingly in private company acquisitions (along with escrows and management retention pools), where the buyer has less public information and wants management aligned post-close. They're rare in large public deals — dispersed public shareholders can't operate the business post-close, so contingent value rights (CVRs) are the closest public-market analog.\n\nSecondary benefit for the buyer: if the seller's management stays on, the earnout doubles as an incentive plan — their payday depends on the business performing under the buyer's ownership.", "tier": 2, "rank": 8513, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book: M&A Concepts p.73", "h": "", "k": "ref"}, {"t": "400Q guide: Merger Models p.107", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 229, "so": 9}, {"id": "S3517", "src": "supp", "section": "Capital Markets (supplemental)", "topic": "Capital Markets", "q": "An IPO prices at $10.00 with a 15% greenshoe. Which statement BEST describes how the greenshoe actually works?", "a": "C is correct. The greenshoe (over-allotment option) is a clause in the underwriting agreement letting the syndicate sell up to ~15% more shares than the base deal at the offering price. The elegance is that it works in both directions:\n\nStrong demand / stock trades up: underwriters exercise the option, buy the additional shares from the company at $10.00, and deliver them to investors — the company raises more capital (11.5M shares x $10 = $115M instead of $100M) and a higher percentage of the company is sold.\n\nWeak aftermarket / stock trades down: underwriters do NOT exercise. They've already oversold 115% of the base deal, so they cover that short position by BUYING shares in the open market — and that buying pressure stabilizes the price. Because they sold at $10 and buy back below $10, covering is costless-to-profitable for the syndicate.\n\nThe trap here is options A and B: the greenshoe guarantees nothing (A), and it's the underwriters — never the company — doing the stabilization buying (B). D is unrelated; lock-ups restrict insider sales, and the greenshoe doesn't touch them.", "tier": 2, "rank": 8517, "links": [{"t": "Red Book: Debt & LevFin p.112", "h": "", "k": "ref"}, {"t": "Red Book: Equity Financing p.122", "h": "", "k": "ref"}, {"t": "400Q guide: DCM/LevFin p.131", "h": "", "k": "ref"}, {"t": "400Q guide: ECM p.145", "h": "", "k": "ref"}], "type": "trap", "flags": [], "options": ["It guarantees the company 15% more proceeds regardless of investor demand", "It lets the company buy back up to 15% of the shares to support the price if the stock trades down", "The underwriters oversell by up to 15%; if the stock trades UP, they exercise the option and buy the extra shares from the company at the offering price (upsizing the deal); if it trades DOWN, they instead buy shares in the open market to cover — which supports the price", "It allows insiders to sell an additional 15% of their shares in the aftermarket without violating the lock-up"], "correct": 2, "n": 230, "so": 18}, {"id": "S3519", "src": "supp", "section": "Capital Markets (supplemental)", "topic": "Capital Markets", "q": "Convertible bonds carry lower coupons than straight debt and convert into equity if the stock rises. Are they 'cheaper' financing? Why would anyone buy the common stock instead?", "a": "The CASH cost is lower — the coupon on a convertible is below that of an equivalent straight bond, so the company pays less interest each year. But a convertible is not truly cheaper than traditional debt once you count the embedded conversion option: around and above the conversion price, the bond behaves like equity, and conversion creates dilution for existing shareholders. Total cost (cash interest + the value of the option you gave away + dilution) exceeds the cost of straight debt.\n\nThe correct ordering: convertibles cost MORE than straight debt all-in, but LESS than straight equity — the liability component and downside protection mean investors accept terms a pure equity issuance wouldn't get. That's why the classic use case is a company for which the cash interest on traditional debt is too burdensome but which doesn't want full equity dilution at today's price.\n\nWhy convertibles aren't 'too good to be true' for investors: the downside protection is paid for. With a typical conversion premium of ~30%, getting the same number of shares via the convertible costs at least ~30% more than buying the stock outright. So common shareholders get full upside from dollar one; convert holders get protected downside but pay a premium for it.\n\nOne technical nuance worth knowing: on a payoff diagram, the convertible's market price starts to exceed its bond-floor payoff BELOW the conversion price — the conversion possibility has option value even before it's in the money.", "tier": 2, "rank": 8519, "links": [{"t": "Red Book: Debt & LevFin p.112", "h": "", "k": "ref"}, {"t": "Red Book: Equity Financing p.122", "h": "", "k": "ref"}, {"t": "400Q guide: DCM/LevFin p.131", "h": "", "k": "ref"}, {"t": "400Q guide: ECM p.145", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 231, "so": 18}, {"id": "S3524", "src": "supp", "section": "Market Context (supplemental)", "topic": "Market Context", "q": "Describe the current rate environment and what it means for valuations and LBO activity.", "a": "As of mid-2026 (verify current data before any interview): the Fed funds target sits at 3.50–3.75% after a 25 bp cut in December 2025 — roughly 175 bps of cumulative cuts since September 2024 — with the Fed expected to hold near-term. The 10-year Treasury is around 4.55%. The defining feature is the STEEP CURVE: the front end has come down ~175 bps, but the long end has stayed elevated on term premium and deficit concerns.\n\nValuation implications: the 10-year drives the risk-free rate in CAPM, so a sticky ~4.5% long end keeps Cost of Equity and WACC elevated — that caps DCF values and works against multiple expansion, regardless of what the Fed does at the front end. Rough sensitivity worth carrying: +100 bps on a ~10% WACC in a terminal-value-heavy DCF cuts value on the order of 10–15%.\n\nLBO implications: the opposite end of the curve matters here. LBO debt is largely floating-rate (SOFR-linked), so front-end cuts directly lower debt service for new deals and existing sponsor portfolios. Layer on competitive spread compression in direct lending and all-in financing costs have eased meaningfully from the peak — arguably spread compression has done more for LBO math than the Fed has.\n\nThe synthesis: a steep curve is an unusual setup — friendlier to leveraged, floating-rate buyers (PE) than to long-duration equity valuations (DCFs). That's part of why deal activity recovered before public multiples re-rated.", "tier": 2, "rank": 8524, "links": [{"t": "Red Book: General Market Knowledge p.133", "h": "", "k": "ref"}], "type": "concept", "flags": ["dated"], "n": 232, "so": 20}, {"id": "S3525", "src": "supp", "section": "Market Context (supplemental)", "topic": "Market Context", "q": "How was 2025 as an M&A year, and what's the tone so far in 2026?", "a": "All figures as of mid-2026 — verify current data before an interview.\n\n2025 was the second-busiest M&A year on record, behind only 2021: roughly $4.5–5 trillion of global deal value, up around 40% year-over-year, with a record 43 megadeals over $10 billion announced. Size did the work — the recovery was driven by the largest transactions rather than broad-based volume. Goldman Sachs led global league tables.\n\nThe 2026 tone so far is 'quality over quantity': deal VALUE keeps surging while deal COUNTS stay soft. Early-2026 data showed deals over $100M up roughly 17% in volume but ~65% in value year-over-year, $1B+ announcements up over 50%, and $5B+ megadeal value up dramatically — while small and mid-market activity lagged. Corporates and sponsors are concentrating firepower on large, strategic, thesis-driven transactions.\n\nDrivers to cite: rate cuts at the front end easing financing costs, enormous PE dry powder (~$4.3 trillion) that has to be deployed, a more permissive antitrust posture, and sector-level consolidation logic — especially energy (scale and inventory depth) and anything touching AI/data-center infrastructure.\n\nEnergy-specific color worth volunteering for an energy-group interview: energy/utilities/resources deal value rose ~27% in 2025 with 20 megadeals over $5B (versus 6 in 2024), the Americas taking the large majority — and the 2026 shift is from Permian oil megadeals toward mid-cap stock-for-stock mergers, gas-weighted assets, and midstream/LNG infrastructure.", "tier": 2, "rank": 8525, "links": [{"t": "Red Book: General Market Knowledge p.133", "h": "", "k": "ref"}], "type": "concept", "flags": ["dated"], "n": 233, "so": 20}, {"id": "S3528", "src": "supp", "section": "Market Context (supplemental)", "topic": "Market Context", "q": "An interviewer mentions that private credit now finances the overwhelming majority of LBOs. Which statement most accurately characterizes the financing landscape as of mid-2026?", "a": "B is correct (figures as of mid-2026 — verify current data). The trap here is conflating deal COUNT with deal VALUE. Private credit's ~85% share of LBOs by count is real, but it's concentrated in the middle market, where syndicated execution was never practical. At the large end, the story reversed: banks and the syndicated market clawed back to roughly half of $1B+ buyout financings, up from under 40% in 2023, as the broadly syndicated market reopened and undercut direct lenders on price.\n\nWhy A is wrong: banks retreated during the 2022–23 dislocation but came back aggressively — the headline 85% never meant banks exited. Why C is wrong: direct lenders have written multi-billion-dollar unitranches; the constraint is economics, not capability. Why D is wrong: private credit has historically priced ~100–200 bps WIDE of syndicated paper — sponsors pay that premium for speed (commitments in 2–3 weeks), certainty (no flex risk), privacy, and covenant flexibility — though competition compressed spreads substantially, with most 2025 direct-lending LBOs pricing below SOFR+550.\n\nThe sophisticated close: sponsors now run dual-track financing processes and choose deal-by-deal, and that competition — more than Fed cuts — is what brought all-in LBO financing costs down.", "tier": 2, "rank": 8528, "links": [{"t": "Red Book: General Market Knowledge p.133", "h": "", "k": "ref"}], "type": "trap", "flags": ["dated"], "options": ["Private credit finances ~85% of LBOs and banks have effectively exited leveraged finance", "Private credit dominates by DEAL COUNT (~85% of LBOs, mostly middle-market), but banks have clawed back to roughly half of $1B+ buyout financings — the two markets now genuinely compete, and pricing has converged", "Private credit only operates in the middle market and cannot finance deals above $1 billion", "Sponsors prefer private credit because it is reliably cheaper than the syndicated market"], "correct": 1, "n": 234, "so": 20}, {"id": "J01", "src": "live", "section": "Real interview — Jefferies Round 1", "topic": "Real interview", "type": "walkthrough", "q": "Walk me through how you calculate unlevered free cash flow.", "a": "Start with EBIT and tax-effect it to get NOPAT: EBIT × (1 – tax rate). Add back D&A and other non-cash charges, subtract the increase in net working capital (or add a decrease), and subtract CapEx.\n\nUFCF = EBIT × (1 – t) + D&A – ΔNWC – CapEx\n\nYou can also start from cash flow from operations: add back after-tax interest expense, then subtract CapEx.\n\nIt's 'unlevered' because it's the cash available to all capital providers, debt and equity, before any interest or principal payments. That's why you discount it at WACC and get Enterprise Value.", "tip": "Same core as IB 400 #95 (Q095) and #99 (Q108). Say the formula in one breath, then explain why interest is excluded. That second sentence is what separates a memorized answer from an understood one.", "tier": 2, "rank": 9800, "links": [{"t": "400Q guide: DCF p.95", "h": "", "k": "ref"}, {"t": "400Q guide: UFCF p.97", "h": "", "k": "ref"}, {"t": "Jefferies R1 question list (Google Doc)", "h": "https://docs.google.com/document/d/1FkSL5OiLUkbFibMx5mcNKLGjU26kEgpVamN6fPJXPdw/edit?tab=t.0", "k": "web"}], "n": 235, "so": 22}, {"id": "J02", "src": "live", "section": "Real interview — Jefferies Round 1", "topic": "Real interview", "type": "walkthrough", "q": "Walk me through a discounted cash flow (DCF) analysis.", "a": "1) Project unlevered free cash flow for 5–10 years, driven by revenue growth, margins, taxes, working capital and CapEx.\n2) Calculate the discount rate, usually WACC.\n3) Discount each year's UFCF back to present value.\n4) Calculate a terminal value with either the Gordon Growth method (final-year UFCF × (1 + g) / (WACC – g)) or the exit multiple method (final-year EBITDA × a comps multiple), then discount it back too.\n5) Sum the PV of the cash flows and the PV of the terminal value to get implied Enterprise Value.\n6) Bridge to Equity Value by subtracting debt and debt-like items and adding cash, then divide by diluted shares for an implied share price.\n\nFinish with sensitivity tables on WACC and terminal growth or the exit multiple. The terminal value is usually well over half the value.", "tip": "Asked at nearly every first round. This is IB 400 #126 (Q102). Aim for under 60 seconds, then stop and let them ask the follow-up.", "tier": 2, "rank": 9801, "links": [{"t": "400Q guide: DCF p.95", "h": "", "k": "ref"}, {"t": "Jefferies R1 question list (Google Doc)", "h": "https://docs.google.com/document/d/1FkSL5OiLUkbFibMx5mcNKLGjU26kEgpVamN6fPJXPdw/edit?tab=t.0", "k": "web"}], "n": 236, "so": 22}, {"id": "J03", "src": "live", "section": "Real interview — Jefferies Round 1", "topic": "Real interview", "type": "compare", "q": "How does a DCF compare with comparable-company valuation?", "a": "A DCF is intrinsic. It values the company on its own projected cash flows and risk, independent of what the market is paying today. Comps are relative. They value the company on what the market currently pays for similar companies, using multiples like EV/EBITDA or P/E.\n\nDCF strengths: grounded in fundamentals, and it works for unique companies with no good peers. Weakness: very sensitive to assumptions (WACC, terminal growth, margins), and most of the value sits in the terminal value.\n\nComps strengths: market-based, quick, and they reflect current sentiment. Weaknesses: they depend on a truly comparable peer set, and if the whole sector is mispriced you inherit the error.\n\nIn practice you use both, plus precedent transactions, on a football field. If the DCF lands far from comps, that tells you your assumptions differ from what the market is pricing in.", "tip": "Mention the 'triangulate on a football field' point. It shows you know bankers never rely on one method.", "tier": 2, "rank": 9802, "links": [{"t": "400Q guide: Valuation p.81", "h": "", "k": "ref"}, {"t": "Jefferies R1 question list (Google Doc)", "h": "https://docs.google.com/document/d/1FkSL5OiLUkbFibMx5mcNKLGjU26kEgpVamN6fPJXPdw/edit?tab=t.0", "k": "web"}], "n": 237, "so": 22}, {"id": "J04", "src": "live", "section": "Real interview — Jefferies Round 1", "topic": "Real interview", "type": "concept", "q": "How does the risk premium affect valuation?", "a": "A higher risk premium means investors demand a higher return, which lowers valuation.\n\nIn a DCF, the equity risk premium feeds the cost of equity through CAPM: Ke = Rf + β × ERP. A higher ERP, or a higher beta that magnifies it, raises Ke and WACC, so future cash flows and especially the terminal value are discounted more heavily. Higher credit spreads do the same thing through the cost of debt.\n\nIn comps, a higher perceived risk shows up as lower multiples across the sector, since multiples are essentially the inverse of required return net of growth.\n\nThe effect is non-linear. In Gordon Growth TV = FCF / (WACC – g), a 1-point move in WACC can change value 10–20% when WACC – g is small.", "tip": "Connect it to the current market if you can: a low implied ERP means the market is paying up for risk (see S1303). That turns a textbook answer into a markets answer.", "tier": 2, "rank": 9803, "links": [{"t": "400Q guide: Discount rate p.103", "h": "", "k": "ref"}, {"t": "Jefferies R1 question list (Google Doc)", "h": "https://docs.google.com/document/d/1FkSL5OiLUkbFibMx5mcNKLGjU26kEgpVamN6fPJXPdw/edit?tab=t.0", "k": "web"}], "n": 238, "so": 22}, {"id": "J05", "src": "live", "section": "Real interview — Jefferies Round 1", "topic": "Real interview", "type": "concept", "q": "What is WACC, and how do debt and equity factor into its calculation?", "a": "WACC is the blended required return of all of a company's capital providers, weighted by their share of the capital structure. It's the discount rate for unlevered FCF.\n\nWACC = Ke × E/(D+E) + Kd × (1 – t) × D/(D+E) (+ preferred, if any)\n\nEquity: cost of equity from CAPM, Rf + β × ERP. It's the most expensive capital because equity is last in line.\nDebt: the yield on the company's debt (or a comparable credit), multiplied by (1 – t) because interest is tax-deductible.\nWeights: use market values, and often a target or industry-typical capital structure rather than today's mix.\n\nDebt is cheaper, so adding some lowers WACC at first. But more leverage raises both Ke (levered beta rises) and Kd (default risk rises), so past some point WACC goes back up. That's the U-shaped curve behind 'optimal capital structure.'", "tip": "IB 400 #36 (Q004) and #105 (Q133). The U-shape point at the end is what gets you credit on 'how does debt factor in.'", "tier": 2, "rank": 9804, "links": [{"t": "400Q guide: WACC p.106", "h": "", "k": "ref"}, {"t": "Jefferies R1 question list (Google Doc)", "h": "https://docs.google.com/document/d/1FkSL5OiLUkbFibMx5mcNKLGjU26kEgpVamN6fPJXPdw/edit?tab=t.0", "k": "web"}], "n": 239, "so": 22}, {"id": "J08", "src": "live", "section": "Real interview — Jefferies Round 1", "topic": "Real interview", "type": "concept", "q": "Why would a bond trade at a premium to par value?", "a": "Because its coupon is higher than the current market yield for that credit risk and maturity. Investors pay more than 100 for the above-market coupon, and the premium amortizes toward par, so the bond's yield-to-maturity equals the market yield.\n\nThat happens when:\n• Interest rates fell after issuance, so the fixed coupon now looks rich.\n• The issuer's credit improved (an upgrade, or deleveraging), so its spread tightened.\n\nThe premium is capped if the bond is callable. The price won't rise much above the call price, since the issuer would refinance. That's why you quote yield-to-worst.", "tip": "Bond basics are in the IB 400's DCM/LevFin section (p.131). Price and yield move inversely; say it explicitly.", "tier": 2, "rank": 9807, "links": [{"t": "400Q guide: DCM & LevFin p.131", "h": "", "k": "ref"}, {"t": "Jefferies R1 question list (Google Doc)", "h": "https://docs.google.com/document/d/1FkSL5OiLUkbFibMx5mcNKLGjU26kEgpVamN6fPJXPdw/edit?tab=t.0", "k": "web"}], "n": 240, "so": 22}, {"id": "J12", "src": "live", "section": "Real interview — Jefferies Round 1", "topic": "Real interview", "type": "recall", "q": "What valuation multiples would you use for an upstream E&P company?", "a": "• EV/EBITDAX: EBITDA before exploration expense. It normalizes for accounting differences between successful-efforts and full-cost companies.\n• EV/Proved Reserves ($ per BOE of reserves), often split into proved developed (PDP) vs. total proved.\n• EV/Daily Production ($ per BOE/d).\n• P/CFPS: price to cash flow per share, common for E&Ps.\n• P/NAV: price to net asset value.\n\nThe primary valuation is usually NAV: the PV of the cash flows from producing and undeveloped reserves, risked by category, using a strip or deck price. PV-10 is the SEC-standardized version, discounted at 10%. Multiples cross-check the NAV because E&P assets deplete. A plain DCF with a perpetual terminal value doesn't fit a company whose reserves run out.", "tip": "Saying 'NAV first, multiples to cross-check, and here's why a perpetuity-growth DCF breaks' is the answer that sounds like an energy banker.", "tier": 2, "rank": 9811, "links": [{"t": "400Q guide: Oil & Gas p.172", "h": "", "k": "ref"}, {"t": "Jefferies R1 question list (Google Doc)", "h": "https://docs.google.com/document/d/1FkSL5OiLUkbFibMx5mcNKLGjU26kEgpVamN6fPJXPdw/edit?tab=t.0", "k": "web"}], "n": 241, "so": 22}, {"id": "J15", "src": "live", "section": "Real interview — Jefferies Round 1", "topic": "Real interview", "type": "concept", "q": "Why might an acquirer's stock price decline after announcing an acquisition?", "a": "The market thinks the deal destroys value for the acquirer's shareholders, or adds risk. Common reasons:\n• It overpaid: the premium exceeds the value of the synergies the market believes in.\n• The deal is EPS-dilutive, or synergies look unrealistic.\n• Higher leverage and risk if it's debt-funded, possibly a downgrade.\n• Integration risk, or a strategic misfit or empire-building concerns.\n• In a stock deal, a signal that management thinks its own shares are overvalued. Merger arbitrage funds also short the acquirer's stock while buying the target's.\n\nMeanwhile the target's stock typically jumps toward the offer price.", "tip": "Common follow-ups are 'what if they overpaid?' and 'what about paying in expensive stock?' — next two cards.", "tier": 2, "rank": 9814, "links": [{"t": "400Q guide: Merger Models p.107", "h": "", "k": "ref"}, {"t": "Jefferies R1 question list (Google Doc)", "h": "https://docs.google.com/document/d/1FkSL5OiLUkbFibMx5mcNKLGjU26kEgpVamN6fPJXPdw/edit?tab=t.0", "k": "web"}], "n": 242, "so": 22}, {"id": "Q100", "src": "400", "section": "Valuation Metrics and Multiples", "q": "Suppose you are building a set of “global” comparable companies operating in the logistics/delivery sector in the U.S., Europe, and Asia. What is the SAFEST valuation multiple in this scenario?", "a": "Given the lease accounting differences under U.S. GAAP vs. IFRS, the safest multiple is (Enterprise Value Including All Lease Liabilities) / EBITDAR, where EBITDAR equals EBITDA + Rental Expense. Under IFRS, EBITDA already adds back or excludes the full Lease Expense, so the Rental Expense is minimal. But under U.S. GAAP, there is still Rental Expense for the Operating Leases. Therefore, this multiple normalizes accounting and lease composition differences and allows for a proper comparison.", "tip": null, "tier": 3, "rank": 26, "links": [{"t": "400Q guide p.93", "h": "", "k": "ref"}, {"t": "Generalist PDF p.50", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Relative Valuation p.65", "h": "", "k": "ref"}], "rbq": [], "n": 243, "so": 6}, {"id": "Q116", "src": "400", "section": "Discounted Cash Flow (DCF) – Assumptions and Analysis", "q": "Explain how you deal with leases and lease accounting in a DCF.", "a": "The easiest solution is to treat the full Lease Expense (from both Finance and Operating Leases) as a simple cash operating expense and deduct it in the FCF projections. If you do this, you can ignore the Lease Liabilities in the bridge and the WACC calculation, greatly simplifying the analysis. You could do the opposite and treat Leases as “capital” and add back or exclude the full Lease Expense in t
