var(--amber)' font-weight='600'>Δ in BS items (AR, AP, PP&amp;E, debt) drive CFS lines</text>\n<text x='330' y='245' text-anchor='middle' font-size='9.5' fill='var(--muted)'>Cash and Retained Earnings are the two plugs that tie everything together.</text>\n<defs><marker id='ah' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='var(--accent)'/></marker>\n<marker id='ah2' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='var(--green)'/></marker>\n<marker id='ah3' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='var(--amber)'/></marker></defs></svg>"}, {"topic": "Equity Value & Enterprise Value / Multiples", "pdf": "03 Equity-Value-Enterprise-Value-Metrics-Multiples.pdf", "pages": "85 pp", "href": "03%20Equity-Value-Enterprise-Value-Metrics-Multiples.pdf", "body": "<p>The distinction between Equity Value and Enterprise Value underlies all multiples work. Confusing the two is an instant red flag, so internalize the bridge and which metric pairs with which value.</p><h4>The Core Distinction</h4><p><b>Equity Value</b> is the value of the company to its common shareholders only — market cap. <b>Enterprise Value</b> is the value of the core operating business to <em>all</em> investors (equity, debt, preferred, minority interest), independent of capital structure. EV is the truer measure for comparing companies because it strips out financing choices.</p><h4>The Bridge</h4><table><tr><th>From Equity to Enterprise Value</th></tr><tr><td>Equity Value</td></tr><tr><td>+ Total Debt</td></tr><tr><td>+ Preferred Stock</td></tr><tr><td>+ Noncontrolling (Minority) Interest</td></tr><tr><td>- Cash and Equivalents</td></tr><tr><td>= Enterprise Value</td></tr></table><p>Why add debt and subtract cash? If you bought the whole company you would assume its debt (a cost) but get its cash (which you could use to pay down that debt). Net Debt = Debt minus Cash, so EV = Equity Value + Net Debt + Preferred + Minority Interest.</p><p>Equity Value = Diluted Shares Outstanding x Share Price. Use the <b>Treasury Stock Method</b> for options: in-the-money options add shares, but proceeds from exercise repurchase shares at the current price, so only the net dilution counts.</p><h4>Matching Metrics to the Right Value</h4><p>The rule: if the metric is available to <em>all</em> investors (pre-interest, pre-debt), pair it with Enterprise Value. If it is available only to equity holders (post-interest), pair it with Equity Value.</p><table><tr><th>Enterprise Value multiples</th><th>Equity Value multiples</th></tr><tr><td>EV / Revenue</td><td>P / E</td></tr><tr><td>EV / EBITDA</td><td>Price / Book</td></tr><tr><td>EV / EBIT</td><td>P / E to Growth (PEG)</td></tr></table><p><em>Trap:</em> EBITDA is pre-interest, so EV/EBITDA is correct; pairing Equity Value with EBITDA is wrong. Net Income is post-interest, so P/E is correct. EV/EBITDA is the workhorse multiple because it is capital-structure neutral and ignores D&A policy.</p><h4>EBITDA, EBIT, and Cash Flow</h4><ul><li><b>EBITDA</b> = Operating Income (EBIT) + D&A. A rough proxy for operating cash flow, but it ignores capex, working capital, taxes, and interest — which is exactly why critics call it 'earnings before all the bad stuff.'</li><li>Use EV/EBIT when capital intensity differs (it captures depreciation); use EV/Revenue for early-stage or unprofitable companies.</li></ul><h4>Common Interview Questions</h4><ul><li><b>Can EV be negative?</b> Yes — if a company holds more cash than its debt plus market cap, common in distressed or cash-rich situations.</li><li><b>Company issues $100 of debt to raise cash — what happens to EV?</b> Nothing. Debt rises $100 and cash rises $100, netting to zero. Equity Value is also unchanged. This is the canonical proof that EV is capital-structure independent.</li><li><b>Why might two firms with identical EBITDA trade at different EV/EBITDA?</b> Differences in growth, margins, risk, or industry.</li><li><b>Why do you add noncontrolling (minority) interest to Enterprise Value?</b> When a company consolidates a sub it owns less than 100% of, its financials include 100% of the sub's EBITDA; minority interest is added to EV so the numerator and denominator both reflect the full business.</li></ul><h4>Comparable Companies and Precedent Transactions</h4><p>The two relative-valuation methods both rely on multiples but answer different questions.</p><ul><li><b>Comparable Companies (trading comps):</b> look at how the public market currently values similar businesses. Reflects current market sentiment; no control premium.</li><li><b>Precedent Transactions:</b> look at multiples paid in past M&A deals for similar targets. These include a <b>control premium</b>, so they typically yield higher valuations than trading comps.</li></ul><p>Screen peers by industry, size, growth, and geography, then apply the median or mean multiple to your company's metric. <em>Trap:</em> precedent multiples can be stale if market conditions have shifted since those deals closed.</p><p><em>Interview tip:</em> when you build comps you always sanity-check by asking whether the numerator and denominator 'see' the same set of investors. That phrasing shows mastery.</p><h4>Visual: The Equity Value → Enterprise Value bridge</h4><svg viewBox='0 0 660 230' xmlns='http://www.w3.org/2000/svg' style='width:100%;max-width:660px;font-family:inherit'>\n<rect x='20' y='120' width='110' height='70' fill='var(--navy)' rx='4'/><text x='75' y='150' text-anchor='middle' font-size='11' font-weight='700' fill='white'>Equity Value</text><text x='75' y='166' text-anchor='middle' font-size='9' fill='white'>(diluted market cap)</text>\n<rect x='150' y='85' width='90' height='35' fill='var(--accent)' rx='4'/><text x='195' y='107' text-anchor='middle' font-size='10.5' font-weight='600' fill='white'>+ Debt</text>\n<rect x='260' y='60' width='90' height='25' fill='var(--accent)' rx='4'/><text x='305' y='77' text-anchor='middle' font-size='10' font-weight='600' fill='white'>+ Preferred</text>\n<rect x='370' y='38' width='90' height='22' fill='var(--accent)' rx='4'/><text x='415' y='53' text-anchor='middle' font-size='10' font-weight='600' fill='white'>+ NCI</text>\n<rect x='480' y='62' width='90' height='28' fill='var(--green)' rx='4'/><text x='525' y='80' text-anchor='middle' font-size='10' font-weight='600' fill='white'>− Cash</text>\n<rect x='530' y='100' width='110' height='90' fill='var(--navy-light)' rx='4'/><text x='585' y='138' text-anchor='middle' font-size='11.5' font-weight='700' fill='white'>Enterprise</text><text x='585' y='154' text-anchor='middle' font-size='11.5' font-weight='700' fill='white'>Value</text>\n<line x1='20' y1='195' x2='640' y2='195' stroke='var(--border)' stroke-width='1'/>\n<text x='330' y='212' text-anchor='middle' font-size='10' fill='var(--muted)'>EV = value of core operations to ALL investors — capital-structure neutral</text>\n<text x='330' y='226' text-anchor='middle' font-size='9.5' fill='var(--muted)'>Pair EV with pre-interest metrics (Revenue, EBITDA, EBIT); pair Equity Value with Net Income / P/E.</text></svg>"}, {"topic": "DCF & WACC", "pdf": "06 Valuation-DCF-Analysis.pdf", "pages": "110 pp", "href": "06%20Valuation-DCF-Analysis.pdf", "body": "<p>The DCF is the purest intrinsic valuation: a company is worth the present value of the free cash flows it will generate. Expect to walk through the full mechanics and defend every assumption.</p><h4>The Five Steps of a DCF</h4><ul><li>Project Unlevered Free Cash Flow for 5-10 years.</li><li>Calculate the discount rate (WACC).</li><li>Discount those cash flows to present value.</li><li>Estimate and discount the Terminal Value.</li><li>Sum to get Enterprise Value, then bridge to Equity Value and per-share value.</li></ul><h4>Unlevered Free Cash Flow Build</h4><p>Unlevered FCF (free cash flow to the firm) is pre-financing, so it is discounted at WACC and yields Enterprise Value.</p><table><tr><th>Unlevered FCF</th></tr><tr><td>EBIT</td></tr><tr><td>x (1 - Tax Rate) = NOPAT</td></tr><tr><td>+ Depreciation and Amortization</td></tr><tr><td>- Increase in Net Working Capital</td></tr><tr><td>- Capital Expenditures</td></tr><tr><td>= Unlevered Free Cash Flow</td></tr></table><p><em>Why start from EBIT, not Net Income?</em> Because EBIT is before interest, so the cash flow is available to all capital providers — consistent with discounting at WACC. We tax-affect EBIT directly rather than using the actual tax bill to keep the cash flow unlevered.</p><h4>WACC and CAPM</h4><p>WACC = (E/V) x Cost of Equity + (D/V) x After-tax Cost of Debt, where the after-tax cost of debt is Cost of Debt x (1 - Tax Rate). Cost of Equity comes from CAPM:</p><p><b>Cost of Equity = Risk-Free Rate + Beta x Equity Risk Premium</b></p><ul><li><b>Risk-free rate:</b> yield on the 10-year (or 20-year) Treasury.</li><li><b>Beta:</b> the stock's volatility relative to the market. Pull levered betas from comparables, <em>unlever</em> each to remove their capital structure, take the median, then <em>relever</em> to the target's structure. Unlevered Beta = Levered Beta / (1 + (1 - Tax) x D/E).</li><li><b>Equity Risk Premium:</b> the historical excess return of equities over the risk-free rate, roughly 5-7%.</li></ul><h4>Terminal Value</h4><p>Terminal value usually drives 60-80% of the DCF, so it matters enormously. Two methods, and you cross-check them:</p><ul><li><b>Gordon Growth (Perpetuity):</b> TV = Final Year FCF x (1 + g) / (WACC - g). Keep g below long-run GDP (2-3%).</li><li><b>Exit Multiple:</b> TV = Final Year EBITDA x a peer EV/EBITDA multiple.</li></ul><p>Both terminal value and the explicit cash flows are discounted back. <em>Trap:</em> remember to discount the terminal value too — it sits at the end of the projection period.</p><h4>Common Questions and Sensitivities</h4><ul><li><b>What raises a DCF value?</b> Higher cash flows or growth, lower WACC, higher terminal growth or exit multiple.</li><li><b>WACC goes up — what happens?</b> Valuation falls; future cash flows are discounted harder.</li><li><b>Levered vs. unlevered DCF?</b> Levered uses Free Cash Flow to Equity (after interest), discounts at Cost of Equity, and yields Equity Value directly. Unlevered is the standard.</li><li><b>Biggest weakness of a DCF?</b> Extreme sensitivity to assumptions, especially terminal value and WACC — it is precise but not accurate. Always present a sensitivity table.</li><li><b>Mid-year convention?</b> Assumes cash flows arrive mid-period rather than year-end, so you discount by 0.5, 1.5, 2.5 instead of 1, 2, 3 — this raises the valuation slightly because cash comes sooner.</li><li><b>Why is cost of equity higher than cost of debt?</b> Equity holders are last in line and bear more risk, so they demand a higher return; debt is senior, often secured, and tax-deductible.</li></ul><h4>From Enterprise Value to Per-Share Value</h4><p>The DCF gives you Enterprise Value. To get to a share price you reverse the EV bridge: subtract net debt, preferred, and minority interest to reach Equity Value, then divide by diluted shares outstanding. <em>Trap:</em> a common mistake is comparing the DCF-implied Enterprise Value directly to the current share price — you must walk it all the way down to equity per share first.</p><p><em>Interview tip:</em> if asked which assumption matters most, say terminal growth and WACC, because they compound over the whole forecast and dominate the output.</p><h4>Visual: DCF structure at a glance</h4><svg viewBox='0 0 660 260' xmlns='http://www.w3.org/2000/svg' style='width:100%;max-width:660px;font-family:inherit'>\n<rect x='215' y='10' width='230' height='38' rx='8' fill='var(--navy)'/><text x='330' y='34' text-anchor='middle' font-size='12.5' font-weight='700' fill='white'>Implied EV = PV(FCFs) + PV(TV)</text>\n<path d='M280 48 L160 78' stroke='var(--muted)' stroke-width='1.5'/><path d='M330 48 L330 78' stroke='var(--muted)' stroke-width='1.5'/><path d='M385 48 L505 78' stroke='var(--muted)' stroke-width='1.5'/>\n<rect x='40' y='80' width='240' height='100' rx='8' fill='var(--cream)' stroke='var(--border)'/>\n<text x='160' y='100' text-anchor='middle' font-size='11.5' font-weight='700' fill='var(--navy)'>Unlevered FCF (yrs 1–5/10)</text>\n<text x='160' y='119' text-anchor='middle' font-size='10' fill='var(--ink)'>EBIT × (1 − tax) = NOPAT</text>\n<text x='160' y='135' text-anchor='middle' font-size='10' fill='var(--ink)'>+ D&amp;A  − Capex  − ΔNWC</text>\n<text x='160' y='154' text-anchor='middle' font-size='9.5' fill='var(--muted)'>excludes interest — capital-structure neutral</text>\n<text x='160' y='170' text-anchor='middle' font-size='9.5' fill='var(--muted)'>discount each year at WACC</text>\n<rect x='300' y='80' width='150' height='100' rx='8' fill='var(--cream)' stroke='var(--border)'/>\n<text x='375' y='100' text-anchor='middle' font-size='11.5' font-weight='700' fill='var(--navy)'>WACC</text>\n<text x='375' y='119' text-anchor='middle' font-size='9.5' fill='var(--ink)'>E/V × CoE  +  D/V × CoD × (1−t)</text>\n<text x='375' y='137' text-anchor='middle' font-size='9.5' fill='var(--ink)'>CoE = rf + β × ERP (CAPM)</text>\n<text x='375' y='155' text-anchor='middle' font-size='9.5' fill='var(--muted)'>unlever peers' β → relever at target</text>\n<rect x='470' y='80' width='170' height='100' rx='8' fill='var(--cream)' stroke='var(--border)'/>\n<text x='555' y='100' text-anchor='middle' font-size='11.5' font-weight='700' fill='var(--navy)'>Terminal Value</text>\n<text x='555' y='119' text-anchor='middle' font-size='9.5' fill='var(--ink)'>Gordon: FCF×(1+g)/(WACC−g)</text>\n<text x='555' y='137' text-anchor='middle' font-size='9.5' fill='var(--ink)'>or Exit Multiple × final EBITDA</text>\n<text x='555' y='155' text-anchor='middle' font-size='9.5' fill='var(--muted)'>cross-check one with the other</text>\n<rect x='150' y='205' width='360' height='40' rx='8' fill='var(--paper)' stroke='var(--navy)' stroke-width='1.5'/>\n<text x='330' y='222' text-anchor='middle' font-size='10.5' font-weight='600' fill='var(--navy)'>EV − net debt − preferred − NCI = Implied Equity Value (÷ diluted shares = / share)</text>\n<text x='330' y='238' text-anchor='middle' font-size='9.5' fill='var(--muted)'>TV is often 60–80% of total value — sanity-check growth vs GDP and implied exit multiple</text>\n<path d='M330 180 L330 203' stroke='var(--muted)' stroke-width='1.5'/></svg>"}, {"topic": "M&A & Merger Models", "pdf": "05 MA-Deals-Merger-Models.pdf", "pages": "105 pp", "href": "05%20MA-Deals-Merger-Models.pdf", "body": "<p>A merger model answers one question: does combining two companies make the buyer's shareholders better off, measured by earnings per share. Accretion / dilution is the heartbeat of this section.</p><h4>Accretion vs. Dilution</h4><p>A deal is <b>accretive</b> if the buyer's pro forma EPS rises after the acquisition, and <b>dilutive</b> if it falls. You combine the two companies' net incomes, adjust for financing and deal effects, then divide by the new share count.</p><ul><li>Combined Net Income = Acquirer NI + Target NI + after-tax synergies - after-tax new interest on acquisition debt - foregone after-tax interest on cash used.</li><li>New EPS = Combined Net Income / (Acquirer shares + new shares issued).</li><li>Compare New EPS to the acquirer's standalone EPS.</li></ul><h4>The Yield Rule of Thumb</h4><p>For a quick read without a full model, compare the cost of funding each source against the target's earnings yield (inverse of its P/E).</p><table><tr><th>Funding source</th><th>After-tax cost</th></tr><tr><td>Cash</td><td>Foregone interest x (1 - Tax)</td></tr><tr><td>Debt</td><td>Interest rate x (1 - Tax)</td></tr><tr><td>Stock</td><td>Inverse of acquirer P/E (its earnings yield)</td></tr></table><p>The deal is accretive if the target's earnings yield (1 / target P/E, adjusted for the premium paid) exceeds the weighted after-tax cost of funding. <em>Cleanest shortcut:</em> in an all-stock deal, if the acquirer's P/E is higher than the target's P/E (after premium), the deal is accretive; if lower, dilutive. Whether a cash- or debt-funded deal is accretive depends on where rates sit: the after-tax cost of debt (or the after-tax yield foregone on cash) must be below the target's earnings yield. In the zero-rate era that was nearly automatic; at today's higher rates you must actually run the comparison.</p><h4>Sources, Uses, and Goodwill</h4><p>Sources of funds (cash, new debt, new equity) must equal Uses (purchase equity, refinance target debt, fees). <b>Goodwill</b> = Equity Purchase Price - Fair Value of target's net identifiable assets (write assets up/down to fair value first; the target's existing goodwill is wiped out and excluded). Goodwill is not amortized but is tested for impairment.</p><h4>Strategic Rationale and Deal Types</h4><ul><li><b>Why acquire?</b> Synergies (cost or revenue), market share, new geographies or products, acquiring talent or technology, defensive consolidation, or simply because the target is undervalued.</li><li><b>Stock vs. asset purchase:</b> asset deals let the buyer step up asset bases and get tax depreciation benefits, but can trigger more tax for the seller. Stock deals are simpler and transfer liabilities.</li><li><b>Synergies:</b> cost synergies (headcount, facilities) are more credible than revenue synergies (cross-selling), which interviewers and the market discount heavily.</li></ul><h4>High-Frequency Questions</h4><ul><li><b>When is an all-cash deal accretive?</b> When the after-tax yield foregone on the cash is below the target's earnings yield (1 / purchase P/E). With cash now earning meaningful interest, this is no longer automatic - compare the two yields explicitly.</li><li><b>What makes a stock deal dilutive?</b> The acquirer paying a high premium with a lower P/E currency than the target.</li><li><b>How big is a control premium?</b> Typically 20-40% over the unaffected share price.</li><li><b>Walk me through a merger model:</b> assumptions and purchase price; sources and uses; combine the income statements with adjustments; compute accretion / dilution; then balance sheet adjustments and synergies.</li></ul><h4>Defenses, Process, and Other Concepts</h4><ul><li><b>Hostile vs. friendly:</b> a friendly deal is negotiated with the target board; a hostile bid goes directly to shareholders (tender offer) or via a proxy fight when the board resists.</li><li><b>Takeover defenses:</b> poison pills (flood the market with cheap shares to dilute the raider), staggered boards, golden parachutes, and white knights (a friendlier alternative buyer).</li><li><b>Earnout:</b> contingent future payments tied to the target hitting milestones — bridges a valuation gap between buyer and seller.</li><li><b>Why do most acquisitions fail to create value?</b> Overpaying, overestimating synergies (especially revenue synergies), and integration/culture problems.</li></ul><p><em>Interview tip:</em> always state whether a deal is accretive or dilutive <em>and why</em> in one sentence referencing the cost-of-funding versus yield logic — that is what separates a strong answer.</p><h4>Visual: Accretion / dilution quick logic</h4><svg viewBox='0 0 660 215' xmlns='http://www.w3.org/2000/svg' style='width:100%;max-width:660px;font-family:inherit'>\n<rect x='205' y='10' width='250' height='34' rx='8' fill='var(--navy)'/><text x='330' y='32' text-anchor='middle' font-size='12' font-weight='700' fill='white'>How is the deal funded?</text>\n<path d='M260 44 L150 72' stroke='var(--muted)' stroke-width='1.5'/><path d='M400 44 L510 72' stroke='var(--muted)' stroke-width='1.5'/>\n<rect x='30' y='75' width='250' height='58' rx='8' fill='var(--cream)' stroke='var(--border)'/>\n<text x='155' y='95' text-anchor='middle' font-size='11' font-weight='700' fill='var(--navy)'>100% stock</text>\n<text x='155' y='112' text-anchor='middle' font-size='10' fill='var(--ink)'>Compare P/Es: buyer P/E &gt; seller P/E</text>\n<text x='155' y='126' text-anchor='middle' font-size='10' fill='var(--ink)'>(paid) → accretive, else dilutive</text>\n<rect x='380' y='75' width='250' height='58' rx='8' fill='var(--cream)' stroke='var(--border)'/>\n<text x='505' y='95' text-anchor='middle' font-size='11' font-weight='700' fill='var(--navy)'>Cash / debt / mix</text>\n<text x='505' y='112' text-anchor='middle' font-size='10' fill='var(--ink)'>Weighted after-tax cost of funds</text>\n<text x='505' y='126' text-anchor='middle' font-size='10' fill='var(--ink)'>vs seller's earnings yield (E/P at offer)</text>\n<rect x='150' y='155' width='360' height='34' rx='8' fill='var(--paper)' stroke='var(--green)' stroke-width='1.5'/>\n<text x='330' y='177' text-anchor='middle' font-size='10.5' font-weight='600' fill='var(--green)'>Cost of acquisition &lt; seller's yield → ACCRETIVE (and vice versa)</text>\n<text x='330' y='208' text-anchor='middle' font-size='9.5' fill='var(--muted)'>Then layer synergies, intangible amortization, and forgone interest on cash — they shift the answer at the margin.</text>\n<path d='M155 133 L300 153' stroke='var(--muted)' stroke-width='1.5'/><path d='M505 133 L360 153' stroke='var(--muted)' stroke-width='1.5'/></svg>"}, {"topic": "Leveraged Buyouts (LBO)", "pdf": "04 Leveraged-Buyouts-LBO-Models.pdf", "pages": "105 pp", "href": "04%20Leveraged-Buyouts-LBO-Models.pdf", "body": "<p>An LBO is the acquisition of a company using a large amount of borrowed money, where the target's own cash flows repay the debt. Private equity firms use leverage to amplify returns. Be ready to run a paper LBO by hand.</p><h4>Why Leverage Boosts Returns</h4><p>Think of buying a house with a mortgage: putting down 20% and borrowing the rest magnifies your return on equity if the asset appreciates. In an LBO, debt reduces the equity check, so the same dollar gain produces a much higher return on the smaller equity base. The trade-off is risk — debt must be serviced regardless of performance.</p><h4>The Three Sources of Return</h4><ul><li><b>Debt paydown:</b> the company uses free cash flow to pay down debt, so equity value grows even at a flat enterprise value (you own more of the business).</li><li><b>EBITDA growth:</b> growing revenue or expanding margins increases the value of the business.</li><li><b>Multiple expansion:</b> selling at a higher EV/EBITDA than the purchase multiple. PE firms underwrite conservatively and rarely bank on this.</li></ul><h4>The Paper LBO (do this by hand)</h4><ul><li><b>Step 1 - Entry:</b> Purchase Enterprise Value = Entry EBITDA x Entry Multiple. Split into debt and equity (e.g., 60% debt / 40% equity). The equity is your initial investment.</li><li><b>Step 2 - Project EBITDA:</b> grow EBITDA over the hold (typically 5 years) using a revenue growth and margin assumption.</li><li><b>Step 3 - Free cash flow and debt paydown:</b> from EBITDA subtract D&A, interest, and taxes to get net income; add back D&A, subtract capex and working capital to get FCF; use FCF to pay down debt each year.</li><li><b>Step 4 - Exit:</b> Exit EV = Exit Year EBITDA x Exit Multiple (often assume exit multiple equals entry, to be conservative). Exit Equity = Exit EV - remaining net debt.</li><li><b>Step 5 - Returns:</b> MOIC = Exit Equity / Initial Equity. IRR is the annualized return.</li></ul><p><em>Mental-math IRR shortcuts (memorize the MOIC-to-IRR map over a 5-year hold):</em> 2.0x in 5 years is about 15% IRR; 2.5x is about 20%; 3.0x is about 25%. (Generalize with the Rule of 72: a 2x in n years means IRR is roughly 72/n percent — 2x over 5 years is about 14-15%.)</p><h4>Capital Structure and Debt Tranches</h4><table><tr><th>Tranche</th><th>Feature</th></tr><tr><td>Revolver</td><td>Flexible, lowest cost, secured</td></tr><tr><td>Term Loan A / B</td><td>Senior secured, amortizing (A) or bullet (B)</td></tr><tr><td>Senior Notes / High Yield</td><td>Unsecured, higher coupon, fewer covenants</td></tr><tr><td>Subordinated / Mezzanine</td><td>Most junior, highest cost, may carry equity warrants</td></tr></table><p>Senior debt is cheaper but more restrictive (covenants); junior debt costs more but gives flexibility.</p><h4>What Makes a Good LBO Candidate</h4><ul><li>Stable, predictable free cash flow to service debt.</li><li>Strong market position and low capex needs.</li><li>Opportunities for margin improvement or add-on acquisitions.</li><li>A clear exit path and an under-leveraged starting balance sheet.</li></ul><p><em>Common questions:</em> Which lever matters most to returns? Usually EBITDA growth and debt paydown, since multiple expansion is not in your control. Why does more leverage raise IRR? It shrinks the equity check, magnifying returns — but also increases default risk. What is a dividend recap? Raising new debt to pay yourself a dividend, harvesting returns before exit.</p><h4>Visual: The LBO engine — sources, uses, and the three returns drivers</h4><svg viewBox='0 0 660 250' xmlns='http://www.w3.org/2000/svg' style='width:100%;max-width:660px;font-family:inherit'>\n<rect x='20' y='15' width='180' height='100' rx='8' fill='var(--cream)' stroke='var(--border)'/>\n<text x='110' y='34' text-anchor='middle' font-size='11.5' font-weight='700' fill='var(--navy)'>Sources</text>\n<text x='110' y='53' text-anchor='middle' font-size='10' fill='var(--ink)'>Debt (~50–70%)</text>\n<text x='110' y='70' text-anchor='middle' font-size='10' fill='var(--ink)'>Sponsor equity (~30–50%)</text>\n<text x='110' y='87' text-anchor='middle' font-size='9.5' fill='var(--muted)'>TLB / notes / mezz, by cost</text>\n<text x='110' y='103' text-anchor='middle' font-size='9.5' fill='var(--muted)'>(+ mgmt rollover)</text>\n<rect x='230' y='15' width='180' height='100' rx='8' fill='var(--cream)' stroke='var(--border)'/>\n<text x='320' y='34' text-anchor='middle' font-size='11.5' font-weight='700' fill='var(--navy)'>Uses</text>\n<text x='320' y='53' text-anchor='middle' font-size='10' fill='var(--ink)'>Purchase equity</text>\n<text x='320' y='70' text-anchor='middle' font-size='10' fill='var(--ink)'>Refinance existing debt</text>\n<text x='320' y='87' text-anchor='middle' font-size='10' fill='var(--ink)'>Fees (financing + advisory)</text>\n<path d='M200 65 L226 65' stroke='var(--accent)' stroke-width='2' marker-end='url(#lah)'/>\n<rect x='440' y='15' width='200' height='100' rx='8' fill='var(--navy)'/>\n<text x='540' y='37' text-anchor='middle' font-size='11.5' font-weight='700' fill='white'>Exit (yr 3–7)</text>\n<text x='540' y='58' text-anchor='middle' font-size='10' fill='white'>Exit EV = exit multiple × EBITDA</text>\n<text x='540' y='76' text-anchor='middle' font-size='10' fill='white'>− remaining debt = equity to sponsor</text>\n<text x='540' y='97' text-anchor='middle' font-size='10.5' font-weight='700' fill='white'>MOIC → IRR</text>\n<rect x='20' y='140' width='620' height='66' rx='8' fill='var(--paper)' stroke='var(--navy)' stroke-width='1.5'/>\n<text x='330' y='160' text-anchor='middle' font-size='11' font-weight='700' fill='var(--navy)'>Returns come from only three places</text>\n<text x='130' y='182' text-anchor='middle' font-size='10' fill='var(--ink)'>1. EBITDA growth</text>\n<text x='130' y='197' text-anchor='middle' font-size='9' fill='var(--muted)'>(organic + add-ons)</text>\n<text x='330' y='182' text-anchor='middle' font-size='10' fill='var(--ink)'>2. Multiple expansion</text>\n<text x='330' y='197' text-anchor='middle' font-size='9' fill='var(--muted)'>(buy low, sell high — least controllable)</text>\n<text x='530' y='182' text-anchor='middle' font-size='10' fill='var(--ink)'>3. Debt paydown / deleveraging</text>\n<text x='530' y='197' text-anchor='middle' font-size='9' fill='var(--muted)'>(FCF sweeps → equity builds)</text>\n<text x='330' y='228' text-anchor='middle' font-size='10' fill='var(--muted)'>Mental anchors over 5 yrs: 2.0x ≈ 15% IRR · 2.5x ≈ 20% · 3.0x ≈ 25%  (Rule of 72 for doubling)</text>\n<defs><marker id='lah' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='var(--accent)'/></marker></defs></svg>"}, {"topic": "Capital Markets & Market Knowledge", "pdf": "WSP_RedBook_r_67e2d19c6eb40.pdf", "pages": "300+ pp", "href": "WSP_RedBook_r_67e2d19c6eb40.pdf", "body": "<p>Capital markets is how companies raise money — debt or equity — and how bankers in ECM, DCM, and LevFin advise on it. Associates are expected to understand the products and to have a market view. Always know where the major indices, the 10-year Treasury, and rates stand on interview day.</p><h4>Debt vs. Equity: The Core Trade-off</h4><p>A company funds itself with debt, equity, or a mix.</p><ul><li><b>Debt</b> is cheaper (interest is tax-deductible, and lenders take less risk so demand a lower return) and is non-dilutive, but it must be repaid and adds fixed obligations and covenants. Too much debt raises default risk.</li><li><b>Equity</b> never has to be repaid and adds no fixed cost, but it is more expensive (shareholders demand higher returns) and dilutes existing owners. Firms generally prefer debt up to a prudent leverage level, then turn to equity.</li></ul><h4>The IPO Process</h4><p>An Initial Public Offering is a private company's first sale of stock to the public, run by underwriting banks.</p><ul><li><b>Hire underwriters</b> and file the S-1 registration with the SEC.</li><li><b>Build the valuation and range</b> using comparable companies and DCF.</li><li><b>Roadshow:</b> management pitches institutional investors to gauge demand.</li><li><b>Bookbuilding:</b> the syndicate collects orders and sets the final price.</li><li><b>Pricing and listing:</b> shares begin trading; underwriters may exercise a greenshoe (over-allotment) option to stabilize the price.</li></ul><p>IPOs come with a <b>lock-up period</b> (typically 180 days) during which insiders cannot sell. <em>Trap:</em> companies usually price slightly below fair value so the stock 'pops' on day one — a gift to investors and a signal of strong demand, though it leaves money on the table for the issuer.</p><h4>Follow-Ons and Other Equity Offerings</h4><ul><li><b>Follow-on offering:</b> an already-public company issues additional shares. Primary shares raise new capital and dilute; secondary shares simply let existing holders sell (no new capital, no dilution).</li><li><b>Equity carve-out:</b> a parent IPOs a minority stake in a subsidiary — a 'partial IPO.'</li><li><b>Convertible bonds:</b> debt that can convert to equity, lowering the coupon in exchange for upside.</li></ul><h4>Leveraged Finance and Debt Capital Markets</h4><p>LevFin arranges the debt used in LBOs and for sub-investment-grade borrowers. Know the basic ladder of debt by seniority and cost:</p><table><tr><th>Instrument</th><th>Profile</th></tr><tr><td>Investment-grade bonds</td><td>Low yield, strong issuers, light covenants</td></tr><tr><td>Term Loans (TLA/TLB)</td><td>Senior secured, floating rate</td></tr><tr><td>High-yield bonds</td><td>Below investment grade, higher fixed coupon</td></tr><tr><td>Mezzanine</td><td>Junior, highest cost, equity kicker</td></tr></table><p>High-yield (junk) bonds pay more because the issuer is riskier. Floating-rate loans reprice with benchmark rates, so they benefit lenders when rates rise. Credit ratings (Moody's, S&P, Fitch) split the world at the BBB-/Baa3 line: above it is investment grade, below is high yield.</p><h4>Sell-Side Coverage and the Banks</h4><p>Within an investment bank, deal teams split into <b>product groups</b> (M&A, ECM, DCM, LevFin, Restructuring) and <b>industry/coverage groups</b> (Technology, Healthcare, Industrials, etc.). Coverage bankers own the client relationship and pull in products as needed. Know the bulge-bracket vs. elite-boutique distinction: boutiques (Evercore, Moelis, Centerview, Lazard) are advisory-only and balance-sheet-light, while bulge brackets (Goldman, Morgan Stanley, JPMorgan) offer the full suite including lending. Understand which model the firm you are interviewing with runs.</p><h4>Market Knowledge Framing</h4><p>Interviewers test whether you follow markets. Be ready to discuss: the level and direction of the Fed funds rate and the 10-year Treasury; how higher rates compress valuations (a higher discount rate lowers present values) and chill M&A and IPO activity; a recent deal you found interesting and why; and your view on a sector. <em>Interview tip:</em> have one current stock or deal you can speak to for 60 seconds with a clear thesis — valuation, catalyst, and risk. That single prepared idea signals genuine market interest more than any memorized fact.</p><h4>Visual: The capital structure stack (cheapest → most expensive)</h4><svg viewBox='0 0 660 240' xmlns='http://www.w3.org/2000/svg' style='width:100%;max-width:660px;font-family:inherit'>\n<rect x='120' y='12'  width='420' height='26' rx='4' fill='#1F3864'/><text x='330' y='29' text-anchor='middle' font-size='10.5' fill='white' font-weight='600'>Revolver / Term Loan A — senior secured, floating, maintenance covenants</text>\n<rect x='120' y='42'  width='420' height='26' rx='4' fill='#2E5BAA'/><text x='330' y='59' text-anchor='middle' font-size='10.5' fill='white' font-weight='600'>Term Loan B — senior secured, institutional, light amortization</text>\n<rect x='120' y='72'  width='420' height='26' rx='4' fill='#2E75B6'/><text x='330' y='89' text-anchor='middle' font-size='10.5' fill='white' font-weight='600'>Senior unsecured notes</text>\n<rect x='120' y='102' width='420' height='26' rx='4' fill='#D97706'/><text x='330' y='119' text-anchor='middle' font-size='10.5' fill='white' font-weight='600'>Subordinated / high-yield notes — incurrence covenants</text>\n<rect x='120' y='132' width='420' height='26' rx='4' fill='#BE123C'/><text x='330' y='149' text-anchor='middle' font-size='10.5' fill='white' font-weight='600'>Mezzanine / PIK</text>\n<rect x='120' y='162' width='420' height='26' rx='4' fill='#8B5CF6'/><text x='330' y='179' text-anchor='middle' font-size='10.5' fill='white' font-weight='600'>Preferred equity</text>\n<rect x='120' y='192' width='420' height='26' rx='4' fill='#6B7280'/><text x='330' y='209' text-anchor='middle' font-size='10.5' fill='white' font-weight='600'>Common equity — first loss, highest required return</text>\n<path d='M85 14 L85 216' stroke='var(--green)' stroke-width='2' marker-end='url(#cah)'/>\n<text x='62' y='110' text-anchor='middle' font-size='9.5' fill='var(--green)' transform='rotate(-90 62 110)'>seniority ↓ · cost of capital ↑</text>\n<text x='580' y='30' font-size='9' fill='var(--muted)'>paid first</text>\n<text x='580' y='208' font-size='9' fill='var(--muted)'>paid last</text>\n<defs><marker id='cah' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='var(--green)'/></marker></defs></svg>"}];
const FLASH = [{"cat": "Core", "term": "Time Value of Money", "def": "A dollar today is worth more than a dollar tomorrow, because today's dollar can be invested to earn a return.", "more": "It's primarily about opportunity cost, not inflation — that's the trap."}, {"cat": "Core", "term": "Discount Rate", "def": "The annualized rate used to convert future cash flows into today's dollars; it reflects opportunity cost and risk."}, {"cat": "Core", "term": "Present Value (PV)", "def": "What a future sum of money is worth today, discounted back at a given rate."}, {"cat": "Core", "term": "Net Present Value (NPV)", "def": "The sum of all discounted cash flows minus the upfront investment; positive NPV means value is created."}, {"cat": "Core", "term": "Internal Rate of Return (IRR)", "def": "The discount rate at which an investment's NPV equals zero — its effective annualized return."}, {"cat": "Core", "term": "Opportunity Cost", "def": "The return given up by choosing one use of capital over the next-best alternative."}, {"cat": "Core", "term": "Rule of 72", "def": "A shortcut: 72 divided by the annual return is roughly the number of years for money to double.", "more": "E.g., a 3.0x return over 5 years implies ~25% IRR; 2.0x ≈ 15%, 2.5x ≈ 20%."}, {"cat": "Core", "term": "Compounding", "def": "Earning returns on both your original principal and previously accumulated returns."}, {"cat": "Accounting", "term": "Income Statement", "def": "Shows revenue, expenses, and profit over a period of time, on an accrual basis."}, {"cat": "Accounting", "term": "Balance Sheet", "def": "A point-in-time snapshot of what a company owns and owes: Assets = Liabilities + Equity."}, {"cat": "Accounting", "term": "Cash Flow Statement", "def": "Reconciles net income to actual cash, across operating, investing, and financing activities."}, {"cat": "Accounting", "term": "Accrual Accounting", "def": "Records revenue when earned and expenses when incurred, regardless of when cash changes hands."}, {"cat": "Accounting", "term": "Revenue Recognition", "def": "The rules for when revenue can be booked — generally when goods or services are delivered, not when cash arrives."}, {"cat": "Accounting", "term": "COGS", "def": "Cost of goods sold — the direct costs of producing the goods or services a company sells."}, {"cat": "Accounting", "term": "Gross Profit", "def": "Revenue minus COGS."}, {"cat": "Accounting", "term": "Operating Income (EBIT)", "def": "Profit from core operations before interest and taxes."}, {"cat": "Accounting", "term": "EBITDA", "def": "Earnings before interest, taxes, depreciation, and amortization — a rough proxy for operating cash flow.", "more": "Capital-structure neutral and strips out big non-cash charges, which is why it pairs with Enterprise Value."}, {"cat": "Accounting", "term": "Net Income", "def": "The bottom-line profit after all expenses, interest, and taxes."}, {"cat": "Accounting", "term": "Depreciation", "def": "Spreading the cost of a tangible asset over its useful life; a non-cash expense."}, {"cat": "Accounting", "term": "Amortization", "def": "Like depreciation, but for intangible assets."}, {"cat": "Accounting", "term": "Working Capital", "def": "The capital tied up in day-to-day operations; operationally, non-cash current assets minus non-debt current liabilities.", "more": "A rise in working capital uses cash; a fall frees cash."}, {"cat": "Accounting", "term": "Accounts Receivable", "def": "Money owed to the company by customers for sales already made."}, {"cat": "Accounting", "term": "Accounts Payable", "def": "Money the company owes suppliers for purchases not yet paid."}, {"cat": "Accounting", "term": "Deferred Revenue", "def": "Cash collected before the product or service is delivered; a liability until it's earned."}, {"cat": "Accounting", "term": "Goodwill", "def": "The premium paid above the fair value of a target's net identifiable assets in an acquisition."}, {"cat": "Accounting", "term": "Deferred Taxes", "def": "Timing differences between book and tax accounting that create future tax assets or liabilities."}, {"cat": "Accounting", "term": "Stock-Based Compensation", "def": "A non-cash expense for equity awards to employees; added back on the cash flow statement."}, {"cat": "Accounting", "term": "Right-of-Use Asset (ASC 842)", "def": "The balance-sheet asset representing a lessee's right to use a leased asset, paired with a lease liability.", "more": "Operating vs finance lease changes where the expense lands on the income statement and thus EBITDA."}, {"cat": "EV & Valuation", "term": "Equity Value", "def": "The value of a company attributable to its shareholders — diluted market capitalization."}, {"cat": "EV & Valuation", "term": "Enterprise Value (EV)", "def": "The value of the whole business to all capital providers, independent of capital structure.", "more": "EV = Equity Value + Debt + Preferred + Minority Interest − Cash."}, {"cat": "EV & Valuation", "term": "Market Capitalization", "def": "Share price multiplied by diluted shares outstanding."}, {"cat": "EV & Valuation", "term": "Net Debt", "def": "Total debt minus cash and equivalents."}, {"cat": "EV & Valuation", "term": "Minority Interest (NCI)", "def": "The portion of a consolidated subsidiary the parent doesn't own; added back in the EV bridge.", "more": "Added because EBITDA is consolidated (100%) while equity value only reflects the parent's stake."}, {"cat": "EV & Valuation", "term": "Treasury Stock Method", "def": "A way to count dilution from options and warrants, assuming the proceeds buy back shares at the current price."}, {"cat": "EV & Valuation", "term": "EV/EBITDA", "def": "The most common valuation multiple — enterprise value over EBITDA."}, {"cat": "EV & Valuation", "term": "EV/Revenue", "def": "A multiple used for unprofitable or early-stage companies with no meaningful EBITDA."}, {"cat": "EV & Valuation", "term": "P/E Ratio", "def": "Share price over earnings per share — an equity-value multiple."}, {"cat": "EV & Valuation", "term": "Comparable Companies", "def": "Valuing a company against the trading multiples of similar public peers ('comps')."}, {"cat": "EV & Valuation", "term": "Precedent Transactions", "def": "Valuing a company based on multiples paid in past M&A deals; usually the highest method because it includes a control premium."}, {"cat": "EV & Valuation", "term": "Control Premium", "def": "The extra amount an acquirer pays above market price to gain control of a company."}, {"cat": "EV & Valuation", "term": "LTM vs NTM", "def": "Last-twelve-months (trailing) versus next-twelve-months (forward) figures used in multiples."}, {"cat": "EV & Valuation", "term": "Football Field", "def": "A chart showing the valuation ranges produced by each methodology side by side."}, {"cat": "EV & Valuation", "term": "Sum-of-the-Parts", "def": "Valuing a company by valuing each business segment separately and adding them up."}, {"cat": "DCF & WACC", "term": "Discounted Cash Flow (DCF)", "def": "An intrinsic valuation that projects free cash flows and discounts them to present value."}, {"cat": "DCF & WACC", "term": "Unlevered Free Cash Flow", "def": "Cash flow available to all investors before financing: EBIT×(1−tax) + D&A − Capex − change in working capital."}, {"cat": "DCF & WACC", "term": "Levered Free Cash Flow", "def": "Free cash flow after interest and mandatory debt payments — what's available to equity holders."}, {"cat": "DCF & WACC", "term": "NOPAT", "def": "Net operating profit after tax: EBIT × (1 − tax rate)."}, {"cat": "DCF & WACC", "term": "Terminal Value", "def": "The value of cash flows beyond the explicit forecast period; often 60–80% of a DCF's total value."}, {"cat": "DCF & WACC", "term": "Gordon Growth Method", "def": "Terminal value as final-year FCF × (1 + g) / (WACC − g)."}, {"cat": "DCF & WACC", "term": "Exit Multiple Method", "def": "Terminal value as a multiple (e.g., EV/EBITDA) applied to the final forecast year's metric."}, {"cat": "DCF & WACC", "term": "WACC", "def": "The blended after-tax cost of a company's debt and equity, weighted by their market values."}, {"cat": "DCF & WACC", "term": "Cost of Equity", "def": "The return equity investors require, typically estimated using CAPM."}, {"cat": "DCF & WACC", "term": "CAPM", "def": "Cost of equity = risk-free rate + beta × equity risk premium."}, {"cat": "DCF & WACC", "term": "Beta", "def": "A measure of a stock's volatility relative to the overall market; levered beta also reflects capital structure.", "more": "You unlever peers' betas to strip out their leverage, then relever at the target's capital structure."}, {"cat": "DCF & WACC", "term": "Cost of Debt", "def": "The after-tax interest rate a company pays to borrow; tax-affected because interest is deductible."}, {"cat": "DCF & WACC", "term": "Equity Risk Premium", "def": "The extra return investors demand for holding stocks instead of the risk-free asset."}, {"cat": "DCF & WACC", "term": "Risk-Free Rate", "def": "The return on a no-risk benchmark, usually the 10-year US Treasury yield."}, {"cat": "DCF & WACC", "term": "Mid-Year Convention", "def": "Discounting cash flows as if received mid-period, reflecting that they arrive throughout the year."}, {"cat": "M&A", "term": "Accretion / Dilution", "def": "Whether a deal raises (accretive) or lowers (dilutive) the acquirer's earnings per share.", "more": "Quick test for all-stock: if buyer P/E > seller P/E it's accretive; otherwise dilutive."}, {"cat": "M&A", "term": "Synergies", "def": "The added value from combining two companies — cost savings or incremental revenue."}, {"cat": "M&A", "term": "Purchase Price Allocation", "def": "Assigning the price paid across the target's assets and liabilities, creating write-ups and goodwill."}, {"cat": "M&A", "term": "Asset Write-Up", "def": "Increasing the book value of acquired assets to fair value as part of deal accounting."}, {"cat": "M&A", "term": "Cash vs Stock Consideration", "def": "Whether the buyer pays with cash/debt or its own shares — a key driver of accretion/dilution."}, {"cat": "M&A", "term": "Pro Forma", "def": "The combined financials of buyer and target presented as if the deal had already happened."}, {"cat": "M&A", "term": "Earnout", "def": "Contingent payment to the seller based on the target hitting agreed future performance targets.", "more": "Used to bridge a valuation gap; recorded as contingent consideration and remeasured to fair value."}, {"cat": "M&A", "term": "Breakup Fee", "def": "A penalty paid if a party walks away from an agreed deal."}, {"cat": "M&A", "term": "Exchange Ratio", "def": "The number of acquirer shares issued per target share in a stock deal."}, {"cat": "M&A", "term": "Strategic vs Financial Buyer", "def": "A corporate acquirer pursuing synergies versus a PE firm pursuing returns through leverage."}, {"cat": "M&A", "term": "Hostile Takeover", "def": "An acquisition pursued against the wishes of the target's board."}, {"cat": "M&A", "term": "Tender Offer", "def": "A public offer to buy shareholders' shares directly, often bypassing the board."}, {"cat": "LBO", "term": "Leveraged Buyout (LBO)", "def": "Buying a company using a large amount of borrowed money, repaid by the target's own cash flows."}, {"cat": "LBO", "term": "Financial Sponsor", "def": "The private equity firm that buys, manages, and ultimately exits the company."}, {"cat": "LBO", "term": "Sources & Uses", "def": "A table showing where deal funding comes from and what it pays for."}, {"cat": "LBO", "term": "MOIC", "def": "Multiple on invested capital — total value returned divided by the equity invested."}, {"cat": "LBO", "term": "Leverage Ratio", "def": "Debt divided by EBITDA; how levered a company is."}, {"cat": "LBO", "term": "Term Loan B", "def": "An institutional senior secured loan with light amortization, common in LBO financing."}, {"cat": "LBO", "term": "Mezzanine Debt", "def": "Subordinated, higher-cost debt sitting between senior debt and equity."}, {"cat": "LBO", "term": "PIK", "def": "Payment-in-kind — interest paid by adding to the principal rather than in cash."}, {"cat": "LBO", "term": "Dividend Recapitalization", "def": "Issuing new debt to pay the sponsor a dividend before exit, pulling returns forward."}, {"cat": "LBO", "term": "Management Rollover", "def": "When the target's managers reinvest their existing equity into the new deal."}, {"cat": "LBO", "term": "Covenant", "def": "A lender protection clause — maintenance covenants are tested regularly, incurrence covenants only on specific actions."}, {"cat": "LBO", "term": "Add-On Acquisition", "def": "A smaller acquisition by a sponsor's portfolio company to build scale (a 'roll-up')."}, {"cat": "LBO", "term": "Returns Drivers", "def": "The three sources of LBO returns: EBITDA growth, multiple expansion, and debt paydown."}, {"cat": "Capital Markets", "term": "IPO", "def": "A company's first sale of stock to the public."}, {"cat": "Capital Markets", "term": "S-1", "def": "The SEC registration document filed ahead of a US IPO."}, {"cat": "Capital Markets", "term": "Roadshow", "def": "Management's marketing tour to institutional investors before pricing an offering."}, {"cat": "Capital Markets", "term": "Greenshoe", "def": "An over-allotment option letting underwriters sell up to 15% more shares if demand is strong."}, {"cat": "Capital Markets", "term": "Follow-On Offering", "def": "A sale of additional shares by a company that is already public."}, {"cat": "Capital Markets", "term": "Block Trade", "def": "A large sale of existing shares, often bought by a bank and quickly resold to investors."}, {"cat": "Capital Markets", "term": "Underwriting", "def": "When a bank commits to buy a securities issue and resell it to investors, taking on the risk."}, {"cat": "Capital Markets", "term": "Investment Grade vs High Yield", "def": "Bonds rated BBB-/Baa3 or above versus riskier, higher-yielding 'junk' bonds."}, {"cat": "Capital Markets", "term": "Syndicated Loan", "def": "A loan provided by a group of lenders and arranged by one or more banks."}, {"cat": "Capital Markets", "term": "Private Credit", "def": "Non-bank, directly negotiated lending — increasingly the financing behind LBOs.", "more": "By count it now backs the large majority of sponsor deals, though banks have reclaimed some of the largest financings."}, {"cat": "Capital Markets", "term": "Convertible Bond", "def": "Debt that can convert into equity at a set price, carrying a lower coupon in exchange for the option."}, {"cat": "Capital Markets", "term": "DCM / ECM / LevFin", "def": "Debt Capital Markets, Equity Capital Markets, and Leveraged Finance — the main capital-markets product groups."}, {"cat": "Capital Markets", "term": "Coverage vs Product Group", "def": "Coverage groups own one industry across all products; product groups own one product across all industries."}];

/* ---------- data ---------- */
const byId={}; QUESTIONS.forEach(q=>byId[q.id]=q);
const dealQ={}; DEALS.forEach(s=>s.qs.forEach((q,i)=>{ const id=s.id+'-'+(i+1); dealQ[id]=Object.assign({id,deal:s.id,section:s.bank+' · '+s.title},q); }));
function item(id){ return byId[id]||dealQ[id]; }
function isDeal(id){ return !byId[id] && !!dealQ[id]; }
function shortSec(s){ return String(s).replace(/\s*\((supplemental|400Q industry section|Red Book ch\.)\)/,'').replace(/ — added for Chicago mid-cap/,' (Chicago)').replace(/Discounted Cash Flow \(DCF\)/,'DCF').replace(/Equity Value & Enterprise Value/,'Equity & Enterprise Value').replace(/^Real interview — /,''); }
const SECTIONS=[...new Set(QUESTIONS.slice().sort((a,b)=>a.so-b.so).map(q=>q.section))];

// Units are the five tiers; each unit's lessons follow section order, up to 8 questions each,
// with sections too small for their own lesson merged into a mixed lesson at the end.
const UNITS=[1,2,3,4,5].map(t=>{
  const qs=QUESTIONS.filter(q=>q.tier===t); if(!qs.length) return null;
  const lessons=[], spare=[];
  SECTIONS.forEach(sec=>{
    const ids=qs.filter(q=>q.section===sec).map(q=>q.id);
    if(ids.length<4){ spare.push(...ids); return; }
    const parts=Math.ceil(ids.length/LESSON_SIZE), size=Math.ceil(ids.length/parts);
    for(let p=0;p<parts;p++) lessons.push({name:shortSec(sec)+(parts>1?' '+(p+1):''),ids:ids.slice(p*size,(p+1)*size)});
  });
  for(let p=0;p<spare.length;p+=LESSON_SIZE){
    const ids=spare.slice(p,p+LESSON_SIZE);
    if(ids.length<3&&lessons.length) lessons[lessons.length-1].ids.push(...ids);
    else lessons.push({name:'Mixed review'+(spare.length>LESSON_SIZE?' '+(p/LESSON_SIZE+1):''),ids});
  }
  lessons.forEach((l,i)=>{ l.id='t'+t+'-'+(i+1); l.tier=t; });
  return {tier:t,lessons,ids:qs.map(q=>q.id)};
}).filter(Boolean);
const LESSONS=UNITS.flatMap(u=>u.lessons);

/* ---------- state ---------- */
let S=load();
function load(){
  let s=null; try{ s=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!s||typeof s!=='object') s={};
  const st=Object.assign({tab:'learn',goal:50},s,{g:s.g||{},f:s.f||{},d:s.d||{},days:s.days||{}});
  // first run after the redesign: rebuild daily XP history from existing grades so the streak starts right
  if(!Object.keys(st.days).length) [st.g,st.d].forEach(m=>Object.values(m).forEach(v=>{ if(v&&v.t&&XP[v.s]){ const k=dayKey(v.t); st.days[k]=(st.days[k]||0)+XP[v.s]; } }));
  return st;
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function dayKey(t){ const d=new Date(t); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayXP(){ return S.days[dayKey(Date.now())]||0; }
function streak(){ const d=new Date(); let n=0; if(!(S.days[dayKey(d)]>0)) d.setDate(d.getDate()-1); while(S.days[dayKey(d)]>0){ n++; d.setDate(d.getDate()-1); } return n; }
function totalXP(){ return Object.values(S.days).reduce((a,b)=>a+b,0); }
function st(id){ const g=(isDeal(id)?S.d:S.g)[id]; return g?g.s:'none'; }
function counts(ids){ const c={got:0,partial:0,missed:0,none:0}; ids.forEach(id=>c[st(id)]++); return c; }
function lessonState(l){ const c=counts(l.ids); return {c,done:c.none===0,perfect:c.got===l.ids.length,started:c.none<l.ids.length}; }
function currentLesson(){ return LESSONS.find(l=>!lessonState(l).done)||null; }
function bar(c,n){ return `<div class="mini"><i style="width:${100*c.got/n}%;background:var(--got)"></i><i style="width:${100*c.partial/n}%;background:var(--part)"></i><i style="width:${100*c.missed/n}%;background:var(--miss)"></i></div>`; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
let tt; function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.dataset.on='1'; clearTimeout(tt); tt=setTimeout(()=>t.dataset.on='0',1800); }

/* ---------- shell ---------- */
const TABS=[['learn','Learn',I.path],['review','Review',I.redo]].concat(DEALS.length?[['deals','Deals',I.case]]:[]).concat([['library','Library',I.book],['progress','Progress',I.chart]]);
let pop=null, dealOpen=null, libQ='', libSt='', libTier='', libSec='', pitchOpen=false, resetAsk=false;
function topbar(){
  const n=streak(), x=todayXP(), g=S.goal, f=Math.min(1,x/g), C=2*Math.PI*9;
  return `<header class="tb"><div class="brand"><i>400</i>Pocket 400</div><div class="stats">
    <span class="pill streak${n?'':' off'}" title="Day streak">${I.flame}${n}</span>
    <span class="pill" title="Today's XP toward your daily goal"><svg class="ring" viewBox="0 0 24 24" width="20" height="20"><circle class="rb" cx="12" cy="12" r="9"/><circle class="rf" cx="12" cy="12" r="9" stroke-dasharray="${C*f} ${C}"/></svg>${x}/${g}</span></div></header>`;
}
function renderAll(){
  if(!TABS.some(t=>t[0]===S.tab)) S.tab='learn';
  document.querySelector('#tabs .in').innerHTML=TABS.map(([k,l,ic])=>`<button role="tab" data-act="tab" data-k="${k}" aria-selected="${S.tab===k}">${ic}${l}</button>`).join('');
  const el=document.getElementById('app');
  el.innerHTML=topbar()+({learn:viewLearn,review:viewReview,deals:viewDeals,library:viewLibrary,progress:viewProgress}[S.tab])();
  if(S.tab==='library') wireLibrary();
}

/* ---------- learn ---------- */
function viewLearn(){
  const cur=currentLesson();
  let h=cur?`<button class="cont" data-act="lesson" data-id="${cur.id}"><div><small>Up next · Unit ${cur.tier}</small><b>${esc(cur.name)}</b><small>${cur.ids.length} questions${lessonState(cur).started?' · in progress':''}</small></div><span class="go">${lessonState(cur).started?'Continue':'Start'}</span></button>`
    :`<div class="cont"><div><b>Every lesson complete</b><small>Keep sharp in Review, or replay any lesson for a perfect score.</small></div></div>`;
  UNITS.forEach(u=>{
    const c=counts(u.ids);
    h+=`<section aria-label="Unit ${u.tier}"><div class="unit u${u.tier}"><div><small>Unit ${u.tier}</small><b>${TIERS[u.tier][0]}</b><span>${TIERS[u.tier][1]}</span></div><div class="up"><em>${c.got}</em>of ${u.ids.length}</div></div><div class="nodes">`;
    u.lessons.forEach((l,i)=>{
      const s=lessonState(l), isCur=cur&&cur.id===l.id, x=Math.round(Math.sin(i*0.9)*76);
      const cls=isCur?'cur':s.perfect?'perfect':s.done?'done':s.started?'part':'';
      const ic=s.perfect?I.star:s.done?I.check:isCur?I.play:s.started?I.play:I.book;
      h+=`<div class="nwrap${isCur&&pop!==l.id?' has-bub':''}" style="--x:${x}px;--tc:var(--t${u.tier});--uc:var(--u${u.tier})">${isCur&&pop!==l.id?`<span class="bub">${s.started?'Continue':'Start'}</span>`:''}
        <button class="node ${cls}" data-act="pop" data-id="${l.id}" aria-label="${esc(l.name)}, ${s.c.got} of ${l.ids.length} got it">${ic}</button>
        ${pop===l.id?`<div class="pop"><b>${esc(l.name)}</b><small>Unit ${u.tier} · ${l.ids.length} questions · ${s.c.got} got it${s.c.partial+s.c.missed?` · ${s.c.partial+s.c.missed} to review`:''}</small>${bar(s.c,l.ids.length)}<button class="btn primary block" data-act="lesson" data-id="${l.id}">${s.done?'Practice again':s.started?'Continue lesson':'Start lesson'}</button></div>`:''}</div>`;
    });
    h+=`</div></section>`;
  });
  return h+`<div class="unit-end">${QUESTIONS.length} questions · ${LESSONS.length} lessons</div>`;
}

/* ---------- review ---------- */
function misses(){ const all=[...Object.entries(S.g),...Object.entries(S.d)].filter(([,v])=>v.s==='partial'||v.s==='missed'); return all.sort((a,b)=>a[1].t-b[1].t).map(e=>e[0]).filter(item); }
function viewReview(){
  const m=misses(), fl=Object.keys(S.f).filter(item);
  let h=`<h1 class="pg">Review</h1>
  <button class="act" data-act="practice" data-k="misses" ${m.length?'':'disabled'}><span class="ic miss">${I.redo}</span><span><b>Practice mistakes</b><small>${m.length?'Partial and missed, oldest first':'Nothing to review yet'}</small></span><span class="n">${m.length}</span></button>
  <button class="act" data-act="practice" data-k="flagged" ${fl.length?'':'disabled'}><span class="ic flag">${I.flag}</span><span><b>Flagged questions</b><small>${fl.length?'The ones you marked to revisit':'Flag a question during a lesson'}</small></span><span class="n">${fl.length}</span></button>
  <button class="act" data-act="practice" data-k="quick"><span class="ic mix">${I.shuffle}</span><span><b>Quick 10</b><small>A random mix from every tier</small></span></button>
  <button class="act" data-act="flash"><span class="ic card">${I.cards}</span><span><b>Flashcards</b><small>${FLASH.length} key terms</small></span></button>
  <div class="sec-h">Practice by section</div><div class="card rows">`;
  SECTIONS.forEach(sec=>{ const ids=QUESTIONS.filter(q=>q.section===sec).map(q=>q.id), c=counts(ids);
    h+=`<button class="row" data-act="practice" data-k="sec" data-sec="${esc(sec)}"><span class="tx"><b>${esc(shortSec(sec))}</b><small>${c.got} of ${ids.length} got it${c.partial+c.missed?` · ${c.partial+c.missed} to review`:''}</small></span>${bar(c,ids.length)}</button>`; });
  return h+`</div>`;
}

/* ---------- deals ---------- */
function dealIds(s){ return s.qs.map((q,i)=>s.id+'-'+(i+1)); }
function viewDeals(){
  const s=DEALS.find(x=>x.id===dealOpen);
  if(s) return viewSheet(s);
  const all=DEALS.flatMap(dealIds), c=counts(all);
  let h=`<h1 class="pg">Deals</h1><div class="tile" style="margin-bottom:12px"><small>Pitch practice</small><b>${c.got}<span style="font-size:15px;font-weight:600;color:var(--muted)">&nbsp;of ${all.length} got it</span></b>${bar(c,all.length)}</div><div class="card rows">`;
  DEALS.forEach(s=>{ const ids=dealIds(s), sc=counts(ids);
    h+=`<button class="row" data-act="deal" data-id="${s.id}"><span class="tx"><small style="color:var(--part);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:11.5px">${esc(s.bank)}${s.note?' · note':''}</small><b>${esc(s.title)}</b></span>${bar(sc,ids.length)}<span class="pct">${sc.got}/${ids.length}</span></button>`; });
  return h+`</div>`;
}
function viewSheet(s){
  const ids=dealIds(s), c=counts(ids);
  return `<button class="back" data-act="deal" data-id="">${I.back}All sheets</button>
  <div class="card"><div class="dhead"><small>${esc(s.bank)}</small><h2>${esc(s.title)}</h2><p>${esc(s.tag)}</p><p>${esc(s.when)}</p></div>
  ${s.note?`<div class="dnote">${esc(s.note)}</div>`:''}
  <div class="dstats">${s.stats.map(([l,v,sub])=>`<div><small>${esc(l)}</small><b>${esc(v)}</b><span>${esc(sub)}</span></div>`).join('')}</div>
  <div class="pitch"><div class="sec-h" style="margin-top:4px">30-second pitch</div>${pitchOpen?`<div class="at">${esc(s.pitch)}</div>${s.ask?`<p class="ask"><b>Ask them:</b> “${esc(s.ask)}”</p>`:''}<button class="link" data-act="pitch">Hide pitch</button>`:`<p class="note-s" style="margin-top:0">Say it out loud first, then check yourself.</p><button class="btn small" data-act="pitch">Show pitch</button>`}</div></div>
  <div style="margin:16px 0 10px"><button class="btn primary block" data-act="practice" data-k="deal" data-id="${s.id}">Practice ${ids.length} questions</button></div>
  <div class="card rows">${ids.map(id=>{ const q=item(id), x=st(id); return `<button class="row" data-act="one" data-id="${id}"><span class="dot ${x}"></span><span class="tx"><b class="clamp">${esc(q.q)}</b></span></button>`; }).join('')}</div>
  <p class="note-s">${c.got} of ${ids.length} got it · from ${esc(s.file)}</p>`;
}

/* ---------- library ---------- */
function libList(){
  const q=libQ.trim().toLowerCase();
  return QUESTIONS.filter(x=>(!libTier||x.tier===+libTier)&&(!libSec||x.section===libSec)&&(!libSt||(libSt==='flag'?S.f[x.id]:st(x.id)===libSt))&&(!q||(x.q+' '+x.a).toLowerCase().includes(q)));
}
function libRows(){
  const list=libList();
  return `<div class="count">${list.length} question${list.length===1?'':'s'}</div><div class="card rows">${list.slice(0,150).map(x=>`<button class="row" data-act="one" data-id="${x.id}"><span class="dot ${st(x.id)}"></span><span class="tx"><b class="clamp">${esc(x.q)}</b><small>Tier ${x.tier} · ${esc(shortSec(x.section))}</small></span></button>`).join('')||'<p class="note-s" style="padding:0 14px">No questions match.</p>'}</div>${list.length>150?'<p class="note-s">Showing the first 150. Narrow the search to see more.</p>':''}`;
}
function viewLibrary(){
  return `<h1 class="pg">Library</h1>
  <input class="search" id="lib-q" type="search" placeholder="Search questions and answers" value="${esc(libQ)}" aria-label="Search">
  <div class="filters"><select id="lib-tier" aria-label="Tier"><option value="">All tiers</option>${[1,2,3,4,5].map(t=>`<option value="${t}"${+libTier===t?' selected':''}>Tier ${t} · ${TIERS[t][0]}</option>`).join('')}</select>
  <select id="lib-sec" aria-label="Section"><option value="">All sections</option>${SECTIONS.map(s=>`<option value="${esc(s)}"${libSec===s?' selected':''}>${esc(shortSec(s))}</option>`).join('')}</select></div>
  <div class="seg" id="lib-st">${[['','All'],['none','Not done'],['got','Got it'],['partial','Partial'],['missed','Missed'],['flag','Flagged']].map(([k,l])=>`<button data-st="${k}" aria-pressed="${libSt===k}">${l}</button>`).join('')}</div>
  <div id="lib-rows">${libRows()}</div>
  <div class="sec-h">Source documents</div><div class="card">${LIBRARY.map(d=>`<div class="doc"><b>${esc(d.title)}</b><p>${esc(d.desc)}</p></div>`).join('')}</div>
  ${NOTES.length?`<div class="sec-h">Study notes</div><div class="card">${NOTES.map(n=>`<details class="nt"><summary>${esc(n.topic)}<span>${esc(n.pages)}</span></summary><div class="body">${n.body}</div></details>`).join('')}</div>`:''}
  <div class="sec-h">About</div><div class="card"><div class="doc"><p style="color:var(--ink-2)">${CHANGES.summary}</p></div></div>`;
}
function wireLibrary(){
  const upd=()=>{ document.getElementById('lib-rows').innerHTML=libRows(); };
  document.getElementById('lib-q').addEventListener('input',e=>{ libQ=e.target.value; upd(); });
  document.getElementById('lib-tier').addEventListener('change',e=>{ libTier=e.target.value; upd(); });
  document.getElementById('lib-sec').addEventListener('change',e=>{ libSec=e.target.value; upd(); });
}

/* ---------- progress ---------- */
function viewProgress(){
  const all=QUESTIONS.map(q=>q.id), c=counts(all), graded=all.length-c.none, n=streak();
  const days=[...Array(7)].map((_,i)=>{ const d=new Date(); d.setDate(d.getDate()-6+i); return d; });
  let h=`<h1 class="pg">Progress</h1>
  <div class="tiles"><div class="tile"><small>Day streak</small><b>${I.flame}${n}</b><span>${n?'Keep it going today':'Do a lesson to start one'}</span></div>
  <div class="tile"><small>Total XP</small><b>${totalXP()}</b><span>${todayXP()} today</span></div>
  <div class="tile"><small>Got it</small><b>${c.got}</b><span>of ${all.length} questions</span></div>
  <div class="tile"><small>Accuracy</small><b>${graded?Math.round(100*c.got/graded):0}%</b><span>${graded} answered</span></div></div>
  <div class="card week" style="margin-top:10px">${days.map(d=>{ const on=(S.days[dayKey(d)]||0)>0, today=dayKey(d)===dayKey(Date.now()); return `<div class="${today?'today':''}"><i class="${on?'on':''}">${on?I.flame:''}</i>${'SMTWTFS'[d.getDay()]}</div>`; }).join('')}</div>
  <div class="sec-h">Daily goal</div><div class="goal">${GOALS.map(([v,l,s])=>`<button data-act="goal" data-v="${v}" aria-pressed="${S.goal===v}"><b>${l}</b><small>${v} XP a day</small><small style="display:block">${s}</small></button>`).join('')}</div>
  <div class="sec-h">By tier</div><div class="card rows">${UNITS.map(u=>{ const uc=counts(u.ids); return `<div class="row"><span class="tx"><b>Unit ${u.tier} · ${TIERS[u.tier][0]}</b><small>${uc.got} of ${u.ids.length} got it</small></span>${bar(uc,u.ids.length)}</div>`; }).join('')}</div>`;
  const secs=SECTIONS.map(sec=>{ const ids=QUESTIONS.filter(q=>q.section===sec).map(q=>q.id), sc=counts(ids), gr=ids.length-sc.none; return {sec,ids,sc,gr,acc:gr?sc.got/gr:-1}; }).filter(x=>x.gr>0).sort((a,b)=>a.acc-b.acc);
  if(secs.length) h+=`<div class="sec-h">Weakest sections</div><div class="card rows">${secs.slice(0,6).map(x=>`<button class="row" data-act="practice" data-k="sec" data-sec="${esc(x.sec)}"><span class="tx"><b>${esc(shortSec(x.sec))}</b><small>${Math.round(100*x.acc)}% got it of ${x.gr} answered</small></span>${bar(x.sc,x.ids.length)}</button>`).join('')}</div>`;
  if(DEALS.length){ const dc=counts(DEALS.flatMap(dealIds)), dn=DEALS.flatMap(dealIds).length; h+=`<div class="sec-h">Deals</div><div class="card rows"><div class="row"><span class="tx"><b>Deal and trend sheets</b><small>${dc.got} of ${dn} got it</small></span>${bar(dc,dn)}</div></div>`; }
  h+=`<p class="note-s"><span id="sync-note">${typeof SYNC!=='undefined'&&SYNC.msg?esc(SYNC.msg):'Progress is saved in this browser.'}</span></p>
  <div class="confirm" style="margin:6px 2px 10px">${resetAsk?`Clear all grades, flags and XP? <button class="btn small miss" data-act="reset-yes">Yes, clear</button><button class="btn small" data-act="reset-no">Keep</button>`:`<button class="link" data-act="reset">Reset progress</button>`}</div>`;
  return h;
}

/* ---------- sessions ---------- */
let SES=null;
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function startSession(kind,ids,title,opts){
  ids=ids.filter(item); if(!ids.length){ toast('Nothing to practise here yet.'); return; }
  SES=Object.assign({kind,title,queue:ids.slice(),i:0,phase:'ask',picked:null,res:{},first:{},retry:[],second:new Set(),xp:0,start:Date.now(),xp0:todayXP()},opts||{});
  document.body.classList.add('in-session'); document.getElementById('session').hidden=false; renderSession();
}
function endSession(){ SES=null; document.body.classList.remove('in-session'); document.getElementById('session').hidden=true; renderAll(); }
function renderSession(){
  const el=document.getElementById('session'), s=SES;
  if(s.kind==='flash') return el.innerHTML=flashCard();
  if(s.phase==='done') return el.innerHTML=summary();
  const id=s.queue[s.i], q=item(id), total=s.queue.length, rev=s.phase!=='ask';
  const correct=q.options?(typeof q.correct==='number'?q.correct:'ABCD'.indexOf(q.correct)):-1;
  const chips=[q.tier?`<span class="chip"><i style="background:var(--t${q.tier})"></i>Tier ${q.tier}</span>`:'',`<span class="chip">${esc(shortSec(q.section))}</span>`,q.src?`<span class="chip">${SRC_NAMES[q.src]||q.src}</span>`:'',s.second.has(id)?'<span class="chip warn">Second look</span>':'',(q.flags||[]).includes('dated')?'<span class="chip warn">Dated</span>':''].join('');
  let body=`<div class="ses-chips">${chips}</div><h2 class="sq">${esc(q.q)}</h2>${q.rbq&&q.rbq.length?`<p class="rbq">Red Book asks it as: “${esc(q.rbq[0])}”</p>`:''}`;
  if(q.options) body+=`<div class="opts">${q.options.map((o,i)=>{ let r=''; if(rev) r=i===correct?' data-res="right"':(s.picked===i?' data-res="wrong"':''); return `<button class="opt" data-act="pick" data-i="${i}"${!rev&&s.picked===i?' data-picked="1"':''}${r}><b>${'ABCD'[i]}</b><span>${esc(String(o).replace(/^[A-D][\.\)]\s*/,''))}</span></button>`; }).join('')}</div>`;
  if(rev) body+=`<div class="ans"><h3>Answer</h3><div class="at">${esc(q.a)}</div>${q.tip?`<div class="tip"><b>Tip · </b>${esc(q.tip)}</div>`:''}${(q.links||[]).length?`<div class="refs">${q.links.map(l=>l.k==='web'?`<a class="ref" href="${esc(l.h)}" target="_blank" rel="noopener">${I.doc}${esc(l.t)}</a>`:`<span class="ref">${I.doc}${esc(l.t)}</span>`).join('')}</div>`:''}</div>`;
  let foot;
  if(s.phase==='ask') foot=q.options?`<button class="btn primary block" data-act="reveal" ${s.picked==null?'disabled':''}>Check</button><div class="sub"><button data-act="reveal">Show answer</button><button data-act="skip">Skip</button></div>`
    :`<button class="btn primary block" data-act="reveal">Reveal answer</button><div class="sub"><button data-act="flag">${S.f[id]?'Unflag':'Flag'}</button><button data-act="skip">Skip</button></div>`;
  else if(s.phase==='answer') foot=`<div class="q3"><button class="btn got" data-act="grade" data-g="got">Got it</button><button class="btn part" data-act="grade" data-g="partial">Partial</button><button class="btn miss" data-act="grade" data-g="missed">Missed</button></div><div class="sub"><button data-act="flag">${S.f[id]?'Unflag':'Flag'}</button><span style="color:var(--muted);font-size:13px">${q.options?(s.picked===correct?'You picked the right answer':'Compare with your pick'):'How close were you?'}</span></div>`;
  else { const g=s.res[id], msg={got:['Nice work','+10 XP'],partial:['Almost','+5 XP · it comes back later'],missed:["You'll get it next time",'+2 XP · it comes back later']}[g]; foot=`<div class="fb"><i>${g==='got'?I.check:g==='partial'?I.dash:I.x}</i><div>${msg[0]}<small>${s.kind==='one'?msg[1].split(' · ')[0]:msg[1]}</small></div></div>`; }
  el.innerHTML=`<div class="ses" role="dialog" aria-label="${esc(s.title)}"><div class="ses-top"><button class="x" data-act="quit" aria-label="Close">${I.x}</button><div class="pbar" aria-hidden="true"><i style="width:${100*(s.i+(s.phase==='fb'?1:0))/total}%"></i></div><span class="ses-n">${Math.min(s.i+1,total)}/${total}</span></div>
    <div class="ses-body" id="ses-body">${body}</div><div class="ses-foot${s.phase==='fb'?' fb-'+s.res[id]:''}"><div class="in">${foot}</div></div></div>`;
}
function reveal(){ if(!SES||SES.phase!=='ask') return; SES.phase='answer'; renderSession(); const b=document.getElementById('ses-body'); const a=b&&b.querySelector('.ans'); if(a) b.scrollTo({top:Math.max(0,a.offsetTop-90),behavior:'smooth'}); }
function grade(g){
  const s=SES; if(!s||s.phase!=='answer') return;
  const id=s.queue[s.i], map=isDeal(id)?S.d:S.g, prev=map[id]||{n:0};
  map[id]={s:g,t:Date.now(),n:(prev.n||0)+1};
  const k=dayKey(Date.now()); S.days[k]=(S.days[k]||0)+XP[g]; s.xp+=XP[g];
  s.res[id]=g; if(!(id in s.first)) s.first[id]=g;
  if(g!=='got'&&!s.second.has(id)&&s.kind!=='one'&&!s.retry.includes(id)) s.retry.push(id);
  save(); s.phase='fb'; renderSession();
  setTimeout(next,g==='got'?650:900);
}
function next(){
  const s=SES; if(!s) return;
  if(s.kind==='one') return endSession();
  s.i++; s.phase='ask'; s.picked=null;
  if(s.i>=s.queue.length&&s.retry.length){ s.retry.forEach(id=>s.second.add(id)); s.queue.push(...s.retry); s.retry=[]; }
  if(s.i>=s.queue.length) s.phase='done';
  renderSession(); const b=document.getElementById('ses-body'); if(b) b.scrollTop=0;
}
function summary(){
  const s=SES, ids=[...new Set(s.queue)], got=ids.filter(id=>s.first[id]==='got').length, left=ids.filter(id=>s.res[id]&&s.res[id]!=='got').length;
  const answered=ids.filter(id=>s.first[id]).length, mins=Math.max(1,Math.round((Date.now()-s.start)/60000)), hit=s.xp0<S.goal&&todayXP()>=S.goal;
  return `<div class="ses"><div class="sum"><div class="big">${got===answered&&answered?I.star:I.check}</div><h2>${s.kind==='lesson'?'Lesson complete!':'Practice complete!'}</h2><p>${esc(s.title)}</p>
  <div class="tiles"><div class="tile"><small>XP</small><b>+${s.xp}</b></div><div class="tile"><small>First try</small><b>${answered?Math.round(100*got/answered):0}%</b></div><div class="tile"><small>Time</small><b>${mins}m</b></div></div>
  ${hit?`<p class="goalhit">Daily goal reached · ${streak()} day streak</p>`:''}${left?`<p style="margin-bottom:18px">${left} question${left>1?'s':''} saved to Review.</p>`:''}
  <button class="btn primary block" data-act="quit">Continue</button></div></div>`;
}
function flashCard(){
  const s=SES, f=FLASH[s.queue[s.i]], total=s.queue.length;
  if(!f){ s.phase='done'; return `<div class="ses"><div class="sum"><div class="big">${I.cards}</div><h2>Deck complete</h2><p>${total} terms reviewed${s.known?` · ${s.known} you knew`:''}</p><div style="height:22px"></div><button class="btn primary block" data-act="quit">Continue</button></div></div>`; }
  return `<div class="ses"><div class="ses-top"><button class="x" data-act="quit" aria-label="Close">${I.x}</button><div class="pbar"><i style="width:${100*s.i/total}%"></i></div><span class="ses-n">${s.i+1}/${total}</span></div>
  <div class="ses-body"><div class="flash"><small>${esc(f.cat)}</small><b>${esc(f.term)}</b>${s.phase!=='ask'?`<p>${esc(f.def)}</p>${f.more?`<p class="more">${esc(f.more)}</p>`:''}`:''}</div></div>
  <div class="ses-foot"><div class="in">${s.phase==='ask'?`<button class="btn primary block" data-act="fflip">Show definition</button>`:`<div class="q3" style="grid-template-columns:1fr 1fr"><button class="btn part" data-act="fnext" data-k="0">Still learning</button><button class="btn got" data-act="fnext" data-k="1">Knew it</button></div>`}</div></div></div>`;
}

/* ---------- actions ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const a=b.dataset.act, id=b.dataset.id;
  if(a==='tab'){ S.tab=b.dataset.k; pop=null; dealOpen=null; resetAsk=false; save(); renderAll(); window.scrollTo({top:0}); }
  else if(a==='pop'){ pop=pop===id?null:id; renderAll(); }
  else if(a==='lesson'){ const l=LESSONS.find(x=>x.id===id); pop=null; const s=lessonState(l); const ids=s.done?l.ids:l.ids.filter(x=>st(x)==='none').concat(l.ids.filter(x=>st(x)!=='none')); startSession('lesson',ids,l.name); }
  else if(a==='practice'){ const k=b.dataset.k;
    if(k==='misses') startSession('practice',misses().slice(0,10),'Mistakes');
    else if(k==='flagged') startSession('practice',Object.keys(S.f).slice(0,10),'Flagged questions');
    else if(k==='quick') startSession('practice',shuffle(QUESTIONS.map(q=>q.id)).slice(0,10),'Quick 10');
    else if(k==='sec'){ const ids=QUESTIONS.filter(q=>q.section===b.dataset.sec).map(q=>q.id); const order=ids.filter(x=>st(x)==='none').concat(ids.filter(x=>st(x)==='missed'||st(x)==='partial'),ids.filter(x=>st(x)==='got')); startSession('practice',order.slice(0,10),shortSec(b.dataset.sec)); }
    else if(k==='deal'){ const s=DEALS.find(x=>x.id===id); startSession('practice',dealIds(s),s.bank+' · '+s.title); } }
  else if(a==='one') startSession('one',[id],'Question');
  else if(a==='flash'){ SES={kind:'flash',title:'Flashcards',queue:shuffle(FLASH.map((_,i)=>i)),i:0,phase:'ask',known:0}; document.body.classList.add('in-session'); document.getElementById('session').hidden=false; renderSession(); }
  else if(a==='fflip'){ SES.phase='answer'; renderSession(); }
  else if(a==='fnext'){ if(b.dataset.k==='1') SES.known++; SES.i++; SES.phase='ask'; renderSession(); }
  else if(a==='deal'){ dealOpen=id||null; pitchOpen=false; renderAll(); window.scrollTo({top:0}); }
  else if(a==='pitch'){ pitchOpen=!pitchOpen; renderAll(); }
  else if(a==='goal'){ S.goal=+b.dataset.v; save(); renderAll(); }
  else if(a==='reset'){ resetAsk=true; renderAll(); }
  else if(a==='reset-no'){ resetAsk=false; renderAll(); }
  else if(a==='reset-yes'){ S.g={}; S.f={}; S.d={}; S.days={}; resetAsk=false; save(); renderAll(); toast('Progress cleared'); }
  else if(a==='quit') endSession();
  else if(a==='reveal') reveal();
  else if(a==='pick'){ if(SES.phase==='ask'){ SES.picked=+b.dataset.i; renderSession(); } }
  else if(a==='grade') grade(b.dataset.g);
  else if(a==='skip') next();
  else if(a==='flag'){ const q=SES.queue[SES.i]; if(S.f[q]) delete S.f[q]; else S.f[q]=1; save(); renderSession(); toast(S.f[q]?'Flagged for review':'Flag removed'); }
});
document.addEventListener('click',e=>{ if(e.target.closest('#lib-st button')){ libSt=e.target.closest('button').dataset.st; renderAll(); } });
document.addEventListener('keydown',e=>{
  if(!SES||e.target.matches('input,select,textarea')) return;
  if(e.key==='Escape') return endSession();
  if(SES.kind==='flash'){ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); if(SES.phase==='ask'){ SES.phase='answer'; renderSession(); } else { SES.i++; SES.phase='ask'; renderSession(); } } return; }
  if(SES.phase==='ask'&&(e.key===' '||e.key==='Enter')){ e.preventDefault(); reveal(); }
  else if(SES.phase==='answer'&&['1','2','3'].includes(e.key)) grade(['got','partial','missed'][+e.key-1]);
  else if(SES.phase==='done'&&e.key==='Enter') endSession();
});
renderAll();
</script>
<script>if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});</script></body></html>
