"h": "", "k": "ref"}], "type": "trap", "flags": [], "options": ["Nothing is recorded until it's paid — when paid, the $50M runs through the Income Statement as an acquisition expense", "Record the full $50M maximum payout as debt at close, and reduce it if targets are missed", "Record the earnout at its FAIR VALUE at close as a contingent consideration liability — it's part of total purchase consideration and feeds Goodwill; each period it's remeasured to fair value with changes flowing through the Income Statement; the eventual payment settles the liability rather than hitting earnings at face value", "Add it to Goodwill only when and if it's actually paid out"], "correct": 2, "n": 370, "so": 9}, {"id": "S3515", "src": "supp", "section": "Merger Models – Concepts", "topic": "M&A Concepts", "q": "Which side does an earnout help more — buyer or seller? And under what circumstances should a seller actually be willing to accept one?", "a": "Generally the buyer. The seller takes on the burden of hitting the targets and the risk of underperformance, while the buyer is protected against overpaying: if the targets are missed, the buyer effectively bought at the lower price, which was the point. The earnout also aligns the seller's management with the buyer post-close, since their payout depends on performance — again, a buyer benefit.\n\nThat said, sellers should rationally accept earnouts when:\n\n1. The deal won't close otherwise. If the valuation gap is unbridgeable with cash at close, an earnout may be the only path to a transaction — and a seller confident in its own forecast gives up little in expected value.\n\n2. The seller keeps operational control of the levers. The biggest seller risk is hitting targets while someone else runs the business — the buyer controls integration, cost allocation, and strategy post-close. Sellers should negotiate for metrics they can influence and protective covenants on how the business is operated during the earnout period.\n\n3. The metrics are clean and hard to manipulate. Revenue-based targets are harder for a buyer to suppress than EBITDA (which integration costs and allocated overhead can distort). Clear definitions, tiered payouts rather than cliffs, and shorter measurement windows all favor the seller.\n\nDesign matters as much as size — a token earnout can be almost pointless. In the Celsius/Alani Nu deal discussed in the 400Q guide, a $25M earnout tied to just one year of performance was under ~2% of deal value: too small to change accretion/dilution or returns, and too short to prove out the growth story. A multi-year earnout tied to EBITDA growth or synergy realization would have actually allocated risk.", "tier": 3, "rank": 8515, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book: M&A Concepts p.73", "h": "", "k": "ref"}, {"t": "400Q guide: Merger Models p.107", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 371, "so": 9}, {"id": "S3516", "src": "supp", "section": "Capital Markets (supplemental)", "topic": "Capital Markets", "q": "Walk me through the IPO process end-to-end, from the decision to go public through the first day of trading.", "a": "The goals: get the client a good valuation, recruit solid institutional investors, and support the share price after it goes public.\n\n1. Bank selection. The company holds a 'bake-off' where banks pitch; selection rests on long-term relationships, track record in the sector, and the quality of the recommendations. Lead banks become bookrunners.\n\n2. Organization and diligence. Bankers meet the client and gather financial, industry, and customer information; lawyers and auditors join an organizational meeting and kick off due diligence.\n\n3. The S-1. The working group drafts the IPO registration statement — the 'S-1' in the US — which both registers the shares and markets the company to investors. The SEC reviews it and sends comment letters; you revise and refile until the document is acceptable. (Most issuers file confidentially first and flip public later.)\n\n4. Valuation and structure. Valuation is set off FORWARD multiples from comparable public companies (a DCF as support) — the IPO model itself just determines shares sold, the pricing discount (typically 10–20% to compensate IPO investors for risk), primary vs. secondary split, and post-deal ownership.\n\n5. Roadshow and book-building. Management spends roughly two weeks pitching institutional investors; the banks build the order book and collect pricing indications.\n\n6. Pricing and trading. The night before trading, the company and banks set the IPO price off the book, sell shares to the investors, and the stock opens on the exchange the next day. Underwriters can use the greenshoe to stabilize or upsize. A lock-up (typically ~180 days) restricts insider selling.\n\nThe hardest part — and a great closing line: balancing the client's expectations against investors'. The best outcome is a modest first-day gain — price 'too low' and the company left money on the table; 'too high' and the deal breaks issue price, souring investors.", "tier": 3, "rank": 8516, "links": [{"t": "Red Book: Debt & LevFin p.112", "h": "", "k": "ref"}, {"t": "Red Book: Equity Financing p.122", "h": "", "k": "ref"}, {"t": "400Q guide: DCM/LevFin p.131", "h": "", "k": "ref"}, {"t": "400Q guide: ECM p.145", "h": "", "k": "ref"}], "type": "walkthrough", "flags": [], "n": 372, "so": 18}, {"id": "S3518", "src": "supp", "section": "Capital Markets (supplemental)", "topic": "Capital Markets", "q": "A public company wants to raise additional equity. Compare a marketed follow-on offering with a block trade / bought deal — and explain primary vs. secondary shares along the way.", "a": "First, the share-type distinction that runs through all equity offerings. PRIMARY shares are newly issued by the company — investors' cash goes to the company, and existing holders are diluted. SECONDARY shares are existing shares sold by current holders — no dilution, but the company receives nothing. The mix matters for optics: an offering that's overwhelmingly secondary makes new investors ask why insiders are rushing for the exit.\n\nMarketed follow-on: works like a mini-IPO. The key model drivers are the CURRENT share price and a range of discounts to it — a higher discount means more shares for the same proceeds. The deal may be publicly announced and marketed over one or more days, with the greenshoe and primary/secondary split layered in; net proceeds = primary shares sold x offering price minus fees. Marketing builds the book but exposes the deal to market risk and a price slide while it's open.\n\nBlock trade / bought deal: speed over marketing. A bank (or small group) BUYS the entire block from the seller at a negotiated discount to the last close — often overnight — and resells it to institutional investors. The seller gets certainty of execution and price in hours; the bank takes principal risk: if it can't resell above its purchase price, the loss is the bank's. Banks compete for blocks on the tightness of the discount, which is why these are aggressive, sharp-pencil trades. Blocks are most common for secondary sales — a sponsor exiting a stake post-lock-up is the classic case.\n\nRule of thumb: marketed deals maximize proceeds when the story needs telling; bought deals/blocks minimize execution risk when the stock is liquid and the seller values speed and certainty.", "tier": 3, "rank": 8518, "links": [{"t": "Red Book: Debt & LevFin p.112", "h": "", "k": "ref"}, {"t": "Red Book: Equity Financing p.122", "h": "", "k": "ref"}, {"t": "400Q guide: DCM/LevFin p.131", "h": "", "k": "ref"}, {"t": "400Q guide: ECM p.145", "h": "", "k": "ref"}], "type": "compare", "flags": [], "n": 373, "so": 18}, {"id": "S3520", "src": "supp", "section": "Capital Markets (supplemental)", "topic": "Capital Markets", "q": "Compare the covenant packages on bank loans versus high-yield bonds. What's the difference between maintenance and incurrence covenants, and what does 'covenant-lite' mean?", "a": "Covenants are the contractual protections lenders build in; breaching them can trigger default. Three families: AFFIRMATIVE (things the borrower must do — file financials, pay taxes, stay insured), NEGATIVE (things it can't do — pledge collateral elsewhere, sell key assets), and FINANCIAL covenants, which split into the two types interviewers care about.\n\nMAINTENANCE covenants live in credit agreements (bank loans). They're tested PERIODICALLY — typically every quarter — regardless of what the company does: Total Debt/EBITDA must stay below 5.0x, interest coverage can't fall below 3.0x, and so on. The borrower must continuously prove compliance, so deteriorating performance alone can trip a default and bring lenders to the table early.\n\nINCURRENCE covenants live in bond indentures (high-yield). They're tested only when the company TAKES AN ACTION — issuing new debt, paying dividends, making acquisitions, selling major assets. A company can perform terribly and never breach an incurrence covenant as long as it doesn't do anything on the restricted list.\n\nSo the traditional mapping: loans = secured, floating-rate, amortizing, maintenance covenants, conservative investors; high-yield = unsecured, fixed-rate, no amortization, call protection, incurrence covenants only.\n\n'Covenant-lite' is the erosion of that mapping: leveraged LOANS packaged with incurrence-style covenants instead of traditional maintenance tests — compliance is only checked when the borrower acts, not quarterly. The trend was driven by competition: banks loosening terms to compete with more flexible institutional lenders and private credit funds. Most of the broadly syndicated leveraged loan market is now cov-lite, which weakens lenders' early-warning tripwires in a downturn.", "tier": 3, "rank": 8520, "links": [{"t": "Red Book: Debt & LevFin p.112", "h": "", "k": "ref"}, {"t": "Red Book: Equity Financing p.122", "h": "", "k": "ref"}, {"t": "400Q guide: DCM/LevFin p.131", "h": "", "k": "ref"}, {"t": "400Q guide: ECM p.145", "h": "", "k": "ref"}], "type": "compare", "flags": [], "n": 374, "so": 18}, {"id": "S3521", "src": "supp", "section": "Capital Markets (supplemental)", "topic": "Capital Markets", "q": "A leveraged company needs $500M of debt. Walk me through the trade-offs between a syndicated term loan and a high-yield bond.", "a": "Think of it as six axes:\n\n1. Rate: loans are FLOATING (a spread over SOFR), bonds are FIXED. Floating helps when rates fall, hurts when they rise; bonds lock in today's coupon for the full tenor.\n\n2. Security and seniority: term loans are typically senior SECURED — first claim on collateral — which is why they price tighter. High-yield bonds are typically unsecured (or junior), pricing wider for the risk.\n\n3. Repayment flexibility: loans amortize (mandatory principal payments) and are PREPAYABLE at little or no penalty — ideal for an LBO sponsor planning to sweep cash flow into debt paydown. Bonds have no amortization but carry CALL PROTECTION — non-call periods and premiums — so early refinancing is expensive; investors are compensated for reinvestment risk.\n\n4. Covenants: loans traditionally carry maintenance covenants tested quarterly (though much of the market is now cov-lite); bonds carry incurrence covenants tested only on actions like new debt or dividends.\n\n5. Tenor and investor base: loans run shorter (~5–7 years) and sit with banks and CLOs; bonds run longer (~7–10+ years) and sit with institutional bond funds, hedge funds, and insurers.\n\n6. Process: a syndicated loan is arranged by lead banks that 'syndicate' commitments from a lender group off a confidential information memo — private, no SEC registration. A bond issuance involves an offering memorandum and a public-style marketing process (most HY is sold under Rule 144A).\n\nThe practical answer for a CFO or sponsor: start with the cheapest money — secured loans — and test whether the company can live with amortization and maintenance covenants in downside cases. If it needs more leverage, longer money, or covenant headroom than loans allow, layer in bonds and pay up for the flexibility. Most large LBOs use both: a term loan B plus secured/unsecured notes.", "tier": 3, "rank": 8521, "links": [{"t": "Red Book: Debt & LevFin p.112", "h": "", "k": "ref"}, {"t": "Red Book: Equity Financing p.122", "h": "", "k": "ref"}, {"t": "400Q guide: DCM/LevFin p.131", "h": "", "k": "ref"}, {"t": "400Q guide: ECM p.145", "h": "", "k": "ref"}], "type": "compare", "flags": [], "n": 375, "so": 18}, {"id": "S3522", "src": "supp", "section": "Capital Markets (supplemental)", "topic": "Capital Markets", "q": "A sponsor is financing a new LBO and asks whether to use private credit or the syndicated market. As of mid-2026, how would you frame that decision?", "a": "This is the defining capital markets story of 2025–26, so know the landscape and the trade-offs. (Figures below are as of mid-2026 — verify current data before an interview.)\n\nThe landscape: private credit — direct lending funds with roughly $1.7 trillion of AUM, about a third of all leveraged credit — now finances on the order of ~85% of LBOs by DEAL COUNT, with a record ~$81B of direct-lending buyout volume in 2025. But the syndicated market has fought back at the large end: banks have clawed back to roughly half of $1B+ buyout financings, versus under 40% in 2023. So the practical split: private credit dominates middle-market deals; the two markets genuinely compete for large ones, and sponsors increasingly run 'dual-track' financing processes to play them against each other.\n\nThe trade-offs:\n\nPrivate credit / unitranche: speed and certainty — a direct lender can commit in 2–3 weeks with no flex risk, no ratings process, no public disclosure, and one (or few) counterparties to negotiate with in a downturn. A unitranche collapses the TLB + junior debt stack into a single facility. The cost: historically ~100–200 bps wider than syndicated paper — though competition has compressed that sharply (a large majority of 2025 direct-lending LBOs priced below SOFR+550).\n\nSyndicated TLB + high-yield: typically cheaper at scale, deeper capacity for the largest deals, and prepayable loan tranches — but with syndication/flex risk (pricing can move against you during marketing), a ratings requirement, and slower execution.\n\nThe synthesis an interviewer wants: it's no longer either/or. Pricing convergence and hybrid structures mean sponsors choose deal-by-deal on size, speed, certainty, and covenant flexibility — and the competition itself is why spreads compressed, which has arguably done more for LBO math recently than Fed cuts have.", "tier": 3, "rank": 8522, "links": [{"t": "Red Book: Debt & LevFin p.112", "h": "", "k": "ref"}, {"t": "Red Book: Equity Financing p.122", "h": "", "k": "ref"}, {"t": "400Q guide: DCM/LevFin p.131", "h": "", "k": "ref"}, {"t": "400Q guide: ECM p.145", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 376, "so": 18}, {"id": "S3523", "src": "supp", "section": "Capital Markets (supplemental)", "topic": "Capital Markets", "q": "Walk me through a debt issuance deal from the bank's perspective.", "a": "First, the objective — it differs from equity: you want the LOWEST interest rate and the LEAST restrictive covenants and deal terms for the client, not the highest valuation.\n\n1. Kickoff. Meet the client and gather basic financial and market information — existing capital structure, maturities, ratings, use of proceeds.\n\n2. Credit work. Work closely with DCM or Leveraged Finance to build a credit model. The emphasis is the opposite of an equity story: you analyze credit stats and ratios — Debt/EBITDA, EBITDA/Interest — across scenarios, focusing on the PESSIMISTIC cases, because lenders' first priority is not losing money. This analysis drives the appropriate structure, size, covenants, and pricing.\n\n3. Investor memo. Draft the memo describing the issuance and selling the credit to potential investors. Where it goes depends on the execution path:\n\nBalance-sheet deal (bank keeps the debt): the memo goes to the bank's INTERNAL credit committee to win approval.\n\nSyndicated deal (debt sold to investors — common for senior, subordinated, and mezzanine issuances): you contact potential investors and win commitments to purchase the entire issuance.\n\n4. Allocation and close. Build the book, set final pricing and terms off investor demand, allocate, fund, and close.\n\nUseful contrast to volunteer: in an IPO you balance the issuer's valuation hopes against investors' return expectations; in a debt deal you balance the issuer's desire for cheap, flexible money against lenders' downside protection — which is why the modeling lives in the downside cases, not the upside ones.", "tier": 3, "rank": 8523, "links": [{"t": "Red Book: Debt & LevFin p.112", "h": "", "k": "ref"}, {"t": "Red Book: Equity Financing p.122", "h": "", "k": "ref"}, {"t": "400Q guide: DCM/LevFin p.131", "h": "", "k": "ref"}, {"t": "400Q guide: ECM p.145", "h": "", "k": "ref"}], "type": "walkthrough", "flags": [], "n": 377, "so": 18}, {"id": "S3527", "src": "supp", "section": "Market Context (supplemental)", "topic": "Market Context", "q": "What makes this a good or bad market for IPOs right now?", "a": "Start with the framework, then apply it to today.\n\nThe framework — what makes ANY market good for IPOs: (1) stable or rising equity indices, since IPO valuations key off public comps' forward multiples; (2) LOW volatility — a deal in the market for weeks can't survive violent swings, and the IPO discount widens when investors are nervous; (3) strong aftermarket performance of recent IPOs — nothing markets the next deal like the last one trading up; (4) receptive sector sentiment for the issuer's industry; (5) a tolerable rate environment, since rates set the discount rate on the growth that IPO candidates are selling.\n\nApplied to today (as of mid-2026 — verify current data): the window is open but selective. Q1 2026 was the strongest first quarter for US IPOs in five years — about 22 traditional IPOs raising over $9B, with deal count and proceeds up sharply year-over-year. Front-end rate cuts have helped, and the backlog of sponsor-owned companies needing exits is enormous. But the recovery is 'quality-selective': investors are rewarding profitable, scaled issuers and pushing back on speculative stories; a steep curve with a ~4.5% 10-year still pressures long-duration growth valuations; and SPACs accounting for a large share of deal count flatters the headline numbers.\n\nThe answer an interviewer wants: not 'good' or 'bad,' but WHO it's good for — a profitable category leader can get a deal done at a fair price today; a cash-burning story stock likely still waits. And mention the practical tell: bankers watch how recent deals priced versus their ranges and traded after — that's the real-time market thermometer.", "tier": 3, "rank": 8527, "links": [{"t": "Red Book: General Market Knowledge p.133", "h": "", "k": "ref"}], "type": "scenario", "flags": ["dated"], "n": 378, "so": 20}, {"id": "J06", "src": "live", "section": "Real interview — Jefferies Round 1", "topic": "Real interview", "type": "trap", "q": "Which valuation multiple would be inappropriate to use, and why?", "a": "Any multiple where the numerator and denominator don't represent the same investors.\n\nEV/Net Income or Equity Value/EBITDA are the classic examples. Enterprise Value belongs to all capital providers, so it must pair with a pre-interest metric (Revenue, EBITDA, EBIT, UFCF). Equity Value belongs to common shareholders only, so it pairs with post-interest metrics (Net Income, EPS, levered FCF).\n\nOther context-specific answers:\n• EV/EBITDA for banks and insurers. Interest is an operating item for them, so EBITDA is meaningless. Use P/E and P/TBV.\n• P/E for a company with negative or depressed earnings. Use EV/Revenue or EV/EBITDA.\n• EV/EBITDA for an E&P company without adjusting for exploration expense. Use EBITDAX.", "tip": "Lead with the matching rule (the principle), then give one industry example. A principle plus an example sounds senior.", "tier": 3, "rank": 9805, "links": [{"t": "400Q guide: Multiples p.88", "h": "", "k": "ref"}, {"t": "Jefferies R1 question list (Google Doc)", "h": "https://docs.google.com/document/d/1FkSL5OiLUkbFibMx5mcNKLGjU26kEgpVamN6fPJXPdw/edit?tab=t.0", "k": "web"}], "n": 379, "so": 22}, {"id": "J07", "src": "live", "section": "Real interview — Jefferies Round 1", "topic": "Real interview", "type": "compare", "q": "What are the primary valuation methodologies, and how would you rank them from highest to lowest valuation?", "a": "The three primary methods are comparable companies, precedent transactions and the DCF. LBO analysis, the 52-week trading range and analyst price targets are often shown alongside them on the football field.\n\nThere's no fixed ranking, but the typical pattern:\n1) Precedent transactions: usually highest, because they include a control premium and often synergies.\n2) DCF: most variable. It can be highest or lowest depending on assumptions. It often lands high when management's projections are optimistic.\n3) Comps: minority, non-control trading values, so below precedents.\n4) LBO analysis: often the floor, since it's the price a sponsor could pay and still hit its target IRR.\n\nThe ranking moves with markets. In a frothy market, comps can exceed older precedents.", "tip": "Say 'it depends' only after you've given the typical order. Interviewers want the default answer first, then the nuance.", "tier": 3, "rank": 9806, "links": [{"t": "400Q guide: Valuation p.81", "h": "", "k": "ref"}, {"t": "Jefferies R1 question list (Google Doc)", "h": "https://docs.google.com/document/d/1FkSL5OiLUkbFibMx5mcNKLGjU26kEgpVamN6fPJXPdw/edit?tab=t.0", "k": "web"}], "n": 380, "so": 22}, {"id": "J09", "src": "live", "section": "Real interview — Jefferies Round 1", "topic": "Real interview", "type": "scenario", "q": "If a bond falls from 100 to 65, what does that tell you?", "a": "The market now sees serious credit risk. A 35-point drop means the yield has jumped and the bond is priced at or near distressed levels. A common rule of thumb for distressed is a price below roughly 70–80, or a spread above about 1,000 bps.\n\nWhat it implies:\n• Investors assign a meaningful probability of default or restructuring, and are pricing in partial recovery rather than full repayment.\n• The company will struggle to refinance, and new debt would be very expensive.\n• The equity has likely fallen even more, since it sits below the bonds.\n• Distressed and restructuring investors become the natural buyers. A restructuring, exchange offer or liability management deal becomes a live possibility.\n\nOne caveat: a very long-dated, low-coupon bond can fall this far from rates alone, as some 30-year bonds did in 2022. So check the duration and coupon before blaming credit. For a normal corporate bond, though, 65 means credit.", "tip": "Name the rates-vs-credit distinction. It's the 'demonstrate your thinking' moment the gotcha is testing for.", "tier": 3, "rank": 9808, "links": [{"t": "400Q guide: DCM & LevFin p.131", "h": "", "k": "ref"}, {"t": "400Q guide: Distressed p.138", "h": "", "k": "ref"}, {"t": "Jefferies R1 question list (Google Doc)", "h": "https://docs.google.com/document/d/1FkSL5OiLUkbFibMx5mcNKLGjU26kEgpVamN6fPJXPdw/edit?tab=t.0", "k": "web"}], "n": 381, "so": 22}, {"id": "J10", "src": "live", "section": "Real interview — Jefferies Round 1", "topic": "Real interview", "type": "scenario", "q": "What could explain the deterioration in the issuer's creditworthiness?", "a": "Anything that shrinks cash flow, raises debt, or brings maturities forward.\n\nOperations: falling revenue or EBITDA from a downturn, lost customers, margin pressure from costs or tariffs, or commodity prices collapsing (especially relevant for energy issuers).\nBalance sheet: a debt-funded acquisition, LBO or dividend recap that pushed up leverage; a big cash burn.\nLiquidity: a maturity wall with no refinancing path, a shrinking revolver borrowing base, or covenant breaches.\nRates: floating-rate debt becoming unaffordable as rates rise, so interest coverage collapses.\nEvents: litigation, fraud or accounting issues, a ratings downgrade forcing selling, or a liability management deal by other creditors that subordinates or 'primes' these bonds.\n\nIn the interview, structure it as: is it a cash flow problem, a leverage problem, or a liquidity/timing problem?", "tip": "The three-bucket structure (cash flow / leverage / liquidity) is the answer. The examples are support.", "tier": 3, "rank": 9809, "links": [{"t": "400Q guide: Distressed p.138", "h": "", "k": "ref"}, {"t": "Jefferies R1 question list (Google Doc)", "h": "https://docs.google.com/document/d/1FkSL5OiLUkbFibMx5mcNKLGjU26kEgpVamN6fPJXPdw/edit?tab=t.0", "k": "web"}], "n": 382, "so": 22}, {"id": "J13", "src": "live", "section": "Real interview — Jefferies Round 1", "topic": "Real interview", "type": "compare", "q": "How would you compare valuation multiples for upstream E&P, oilfield services, and midstream companies?", "a": "Multiples follow cash-flow stability and commodity exposure.\n\nUpstream E&P: direct commodity price exposure and depleting assets, so the lowest multiples, typically mid-single-digit EV/EBITDAX. Valued on NAV, reserves and production metrics.\n\nOilfield services: indirect exposure through customers' drilling budgets, rig counts and completion activity. Highly cyclical with operating leverage, so low-to-mid single-digit EV/EBITDA that swings sharply through the cycle. Also backlog and fleet utilization.\n\nMidstream (pipelines, storage, processing): fee-based, long-term contracts and volume rather than price exposure, so utility-like cash flows and the highest multiples, roughly high-single to low-double-digit EV/EBITDA. Also valued on distributable cash flow (DCF yield) and dividend yield.\n\nOrder: midstream > OFS ≈ E&P, with the exact levels moving with the cycle. Quote ranges, not points, and check current comps before an interview.", "tip": "The one-line framework: the further from the commodity price and the more contracted the cash flow, the higher the multiple.", "tier": 3, "rank": 9812, "links": [{"t": "400Q guide: Oil & Gas p.172", "h": "", "k": "ref"}, {"t": "Jefferies R1 question list (Google Doc)", "h": "https://docs.google.com/document/d/1FkSL5OiLUkbFibMx5mcNKLGjU26kEgpVamN6fPJXPdw/edit?tab=t.0", "k": "web"}], "n": 383, "so": 22, "flags": ["dated"]}, {"id": "J14", "src": "live", "section": "Real interview — Jefferies Round 1", "topic": "Real interview", "type": "scenario", "q": "How would you evaluate financing a company through equity versus debt?", "a": "Weigh cost against risk and flexibility.\n\nDebt: cheaper (interest is tax-deductible, and lenders demand less than equity holders) and no dilution. But it adds fixed payments, covenants and default risk.\nEquity: no required payments and no covenants, but it's the most expensive capital and dilutes existing owners.\n\nWhat I'd look at:\n• Cash flow stability: stable, predictable cash flow can support debt; volatile or early-stage businesses need equity.\n• Current leverage and ratings: pro forma Debt/EBITDA, interest coverage, and whether new debt risks a downgrade.\n• Valuation: if the stock trades at a high multiple, equity is cheap 'currency'; if it's depressed, issuing locks in dilution.\n• EPS impact: compare the after-tax cost of debt with the cost of equity (roughly the inverse of P/E).\n• Use of proceeds: funding stable, cash-generating assets suits debt; funding risky growth suits equity.\n• Market conditions: credit spreads, the rate environment, and whether the ECM window is open.\n\nOften the answer is a mix, or a hybrid like converts or preferred.", "tip": "Give the framework first (cost vs. risk), then 3 of the bullets. Don't list all six unless asked.", "tier": 3, "rank": 9813, "links": [{"t": "400Q guide: DCM & LevFin p.131", "h": "", "k": "ref"}, {"t": "Jefferies R1 question list (Google Doc)", "h": "https://docs.google.com/document/d/1FkSL5OiLUkbFibMx5mcNKLGjU26kEgpVamN6fPJXPdw/edit?tab=t.0", "k": "web"}], "n": 384, "so": 22}, {"id": "J16", "src": "live", "section": "Real interview — Jefferies Round 1", "topic": "Real interview", "type": "scenario", "q": "Follow-up: What if investors believe the buyer overpaid?", "a": "Then value is transferred from the acquirer's shareholders to the target's. The acquirer's market cap tends to fall by roughly the amount the market thinks it overpaid: the premium minus the present value of credible synergies.\n\nExample: it pays a $2B premium and the market believes $1.2B of synergies. Expect about an $800M drop in the acquirer's market value.\n\nLonger term: the overpayment sits in goodwill and may lead to impairment write-downs. Returns on the deal come in below the cost of capital, and activists may push back or argue against the vote if shareholder approval is needed.", "tip": "The 'premium minus PV of synergies' line is the crisp answer. Use the number example to prove you understand it.", "tier": 3, "rank": 9815, "links": [{"t": "400Q guide: Merger Models p.107", "h": "", "k": "ref"}, {"t": "Jefferies R1 question list (Google Doc)", "h": "https://docs.google.com/document/d/1FkSL5OiLUkbFibMx5mcNKLGjU26kEgpVamN6fPJXPdw/edit?tab=t.0", "k": "web"}], "n": 385, "so": 22}, {"id": "J17", "src": "live", "section": "Real interview — Jefferies Round 1", "topic": "Real interview", "type": "scenario", "q": "Follow-up: How does using an expensive stock currency affect the analysis?", "a": "If the acquirer's stock trades at a high multiple, paying in stock is cheap for it. It issues fewer shares to hit the purchase price, so dilution is smaller.\n\nEPS rule of thumb: an all-stock deal is accretive when the acquirer's P/E is above the P/E it's paying for the target. Think of the cost of stock as the earnings yield, 1 / P/E. A 30x P/E stock 'costs' about 3.3%, cheaper than most debt after tax.\n\nThe catch:\n• Target shareholders receive shares that may be overvalued, so they may push for cash or a collar.\n• Paying in stock signals the acquirer thinks its shares are fully valued, which can pressure the price.\n• Target holders now share in the combined risk, and the deal value moves with the acquirer's stock until close.\n\nSo expensive stock makes the accretion math look good, but it doesn't make a bad deal good.", "tip": "Use the 1/P/E 'cost of stock' line. It connects this answer to the accretion/dilution section (IB 400 Merger Models).", "tier": 3, "rank": 9816, "links": [{"t": "400Q guide: Accretion/dilution p.114", "h": "", "k": "ref"}, {"t": "Jefferies R1 question list (Google Doc)", "h": "https://docs.google.com/document/d/1FkSL5OiLUkbFibMx5mcNKLGjU26kEgpVamN6fPJXPdw/edit?tab=t.0", "k": "web"}], "n": 386, "so": 22}, {"id": "J20", "src": "live", "section": "Real interview — Jefferies Round 1", "topic": "Real interview", "type": "concept", "q": "How do you adjust EBITDA after selling the asset?", "a": "Remove the divested business's EBITDA, on an LTM basis as if the sale happened at the start of the period, so pro forma EBITDA reflects only RemainCo.\n\nThen refine:\n• Stranded costs: corporate overhead that was allocated to the sold unit but doesn't go away. RemainCo EBITDA falls by these too, unless management has a credible plan to cut them.\n• TSA income: if you provide transition services to the buyer, that's temporary, so don't capitalize it.\n• Dis-synergies: lost shared purchasing, cross-selling, or customer relationships.\n• The gain or loss on the sale is non-recurring. Exclude it from EBITDA.", "tip": "Stranded costs are the detail most candidates miss. Mention them and you've shown real-deal awareness.", "tier": 3, "rank": 9819, "links": [{"t": "400Q guide: Asset sale (#8) p.91", "h": "", "k": "ref"}, {"t": "Jefferies R1 question list (Google Doc)", "h": "https://docs.google.com/document/d/1FkSL5OiLUkbFibMx5mcNKLGjU26kEgpVamN6fPJXPdw/edit?tab=t.0", "k": "web"}], "n": 387, "so": 22}, {"id": "G02", "src": "live", "section": "Real interview — gotchas (MS, Guggenheim)", "topic": "Brainteaser / gotcha", "type": "trap", "q": "(Guggenheim) Two identical businesses with the same underlying economics: Company A owns its fleet, Company B leases its fleet. Which company reports higher EBITDA?", "a": "Company A, the owner, assuming US GAAP with B's leases classified as operating leases.\n\nA's cost of the fleet shows up as depreciation (and interest on any debt used to buy it), both below EBITDA.\nB's operating lease cost is a single straight-line rent expense inside operating expenses, so it reduces EBITDA.\n\nSame economics, but A's EBITDA is higher by roughly B's rent.\n\nCaveats that earn points:\n• Under IFRS 16, or for a finance lease under US GAAP, lease cost splits into depreciation plus interest, both below EBITDA. The EBITDA gap mostly disappears.\n• That's why lease-heavy industries (airlines, retail, trucking) look at EBITDAR, which adds back rent.", "tip": "State your assumption (US GAAP, operating lease) up front. The accounting regime is the gotcha. Related: Q021 (#412) and Q055 (#398) on lease accounting.", "tier": 3, "rank": 9823, "links": [{"t": "400Q guide: Lease accounting p.54", "h": "", "k": "ref"}, {"t": "400Q guide: Leases in EV p.74", "h": "", "k": "ref"}], "n": 388, "so": 23}, {"id": "Q107", "src": "400", "section": "Discounted Cash Flow (DCF) – Assumptions and Analysis", "q": "A client company plans to change its capital structure. Currently, it has 10% Debt / Total Capital, but it wants to increase this to 30%. Your co-worker claims that if you use an Unlevered DCF to value this company, it won’t be affected by this change in capital structure. Are they correct?", "a": "No. It’s true that the Unlevered Free Cash Flow won’t be affected by this change in capital structure and the higher Interest Expense, but the Discount Rate will be affected. To account for this difference, you should calculate WACC under both capital structure percentages and use a changing Discount Rate each year in the analysis as the company progresses from 10% to 30% Debt / Total Capital over the forecast period.", "tip": null, "tier": 4, "rank": 119, "links": [{"t": "400Q guide p.97", "h": "", "k": "ref"}, {"t": "Generalist PDF p.54", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book p.50", "h": "", "k": "ref"}, {"t": "Red Book p.55", "h": "", "k": "ref"}], "rbq": ["What is the appropriate cost of capital when doing an unlevered DCF?", "The unadjusted, period-end assumption may be more appropriate in this scenario. How would raising additional debt impact a DCF analysis?"], "n": 389, "so": 7}, {"id": "Q123", "src": "400", "section": "Discounted Cash Flow (DCF) – Assumptions and Analysis", "q": "The government has just decided to cut the corporate tax rate in your country from 35% to 20%. How will WACC and the DCF output of your valuation change?", "a": "The tax rate affects both the FCF and the Discount Rate. If a company has Debt, a lower tax rate will increase its Cost of Debt because the interest paid on Debt will produce a reduced tax benefit; the Cost of Equity will also be higher because that same tax rate also factors in when levering and re-levering Beta. So, WACC tends to increase slightly from this tax rate reduction, but FCF also increases, which tends to be more significant than the increase in WACC. So, the company’s Implied Value should most likely increase. If the company has no Debt, its Implied Value definitely increases.", "tip": null, "tier": 4, "rank": 123, "links": [{"t": "400Q guide p.102", "h": "", "k": "ref"}, {"t": "Generalist PDF p.59", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book p.48", "h": "", "k": "ref"}, {"t": "Red Book p.64", "h": "", "k": "ref"}], "rbq": ["How does a lower tax rate impact the valuation from a DCF?", "DCF valuation. Which of the valuation methodologies is the most variable in terms of output?"], "n": 390, "so": 7}, {"id": "Q031", "src": "400", "section": "Accounting – Calculations", "q": "A company’s CEO has decided to sell all its assets, starting with a factory recorded at a book value of $100 on its Balance Sheet. If this factory sells for $140, how do the statements change?", "a": "This is a Realized Gain of $140 – $100 = $40, which is recorded as follows: • IS: The $40 Realized Gain appears here and increases Pre-Tax Income by $40; Net Income is up by $30 at a 25% tax rate. • CFS: Net Income is up by $30, but you reverse the $40 Gain in CFO. Then, in the CFI section, you reflect the *total amount* of proceeds, or $140. Therefore, Cash changes by +$30 – $40 + $140 = +$130. • BS: Cash is up by $130, and Net PP&E is down by its book value of $100, so Total Assets are up by $30. On the L&E side, Equity is up by $30 due to the increased Net Income, so both sides balance. • Intuition: The company sells the factory for $140 but pays taxes only on the $40 representing the Gain, so its Cash is up by $130 rather than $140.", "tip": null, "tier": 4, "rank": 133, "links": [{"t": "400Q guide p.60", "h": "", "k": "ref"}, {"t": "Generalist PDF p.17", "h": "", "k": "ref"}, {"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book p.22", "h": "", "k": "ref"}], "rbq": ["If the share price of a company increases by 10%, what is the balance sheet impact?"], "n": 391, "so": 2}, {"id": "Q032", "src": "400", "section": "Accounting – Calculations", "q": "Walk me through the financial statements when a customer orders a product for $100 and receives it but hasn’t yet paid for it. Then, walk me through the cash collection, combining it with the first step. Ignore COGS and other delivery costs for simplicity.", "a": "The first step corresponds to Accounts Receivable increasing by $100, and the second step represents AR decreasing by $100. Here’s the first step: • IS: Revenue increases by $100, so Pre-Tax Income is up by $100, and Net Income is up by $75 at a 25% tax rate. • CFS: Net Income is up by $75, but the increase in AR reduces cash flow by $100, so Cash at the bottom is down by $25. • BS: Cash is down by $25, but AR is up by $100, so the Assets side is up by $75. On the L&E side, CSE is up by $75 due to the increased Net Income, so both sides are up by $75 and balance. • Intuition: The company must pay $25 in taxes on Revenue it hasn’t yet collected in cash, so its Cash balance falls by $25. And when the AR is collected, combining it with the first step: • IS: Net Income is still up by $75, and there are no other changes. • CFS: Net Income is still up by $75, but now the AR increase is reversed, so the Change in AR is $0. Therefore, Cash at the bottom is now up by $75. • BS: Cash is now up by $75, and AR goes back to its original level, so the Assets side is up by $75. The L&E side is still up by $75 because of the CSE increase due to the increased Net Income in the first step, so both sides balance. • Intuition: This is a simple cash collection of a $100 payment owed to the company. Initially, Cash was down by $25 because the company had to pay taxes in advance; it’s up by $75 in the end because it’s a $100 sale minus $25 of taxes.", "tip": null, "tier": 4, "rank": 134, "links": [{"t": "400Q guide p.61", "h": "", "k": "ref"}, {"t": "Generalist PDF p.18", "h": "", "k": "ref"}, {"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements & Accrual Concepts p.13", "h": "", "k": "ref"}], "rbq": [], "n": 392, "so": 2}, {"id": "Q033", "src": "400", "section": "Accounting – Calculations", "q": "A company hires a marketing agency to run an online advertising campaign for its services. The marketing agency charges $10,000 for this initial campaign, delivers it, and invoices the company, which has 60 days to pay. Walk me through the statements.", "a": "This is an expense for the delivery of a service that the company has not yet paid in cash, and there is a specific invoice attached, so this is a $10K increase in Accounts Payable: • IS: Operating Expenses increase by $10K, so Pre-Tax Income falls by $10K, and Net Income falls by $7.5K at a 25% tax rate. • CFS: Net Income is down by $7.5K, but the increase in Accounts Payable is a $10K cash inflow because the company has not paid the invoice in cash yet. Cash at the bottom is up by $2.5K. • BS: Cash is up by $2.5K, so Total Assets are up by $2.5K. On the L&E side, AP is up by $10K, and Equity is down by $7.5K due to the reduced Net Income, so both sides are up by $2.5K and balance. • Intuition: The company gets a $2.5K tax benefit on this expense that it has not yet paid in cash.", "tip": null, "tier": 4, "rank": 135, "links": [{"t": "400Q guide p.62", "h": "", "k": "ref"}, {"t": "Generalist PDF p.19", "h": "", "k": "ref"}, {"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements & Accrual Concepts p.13", "h": "", "k": "ref"}], "rbq": [], "n": 393, "so": 2}, {"id": "Q034", "src": "400", "section": "Accounting – Calculations", "q": "Now, walk me through what happens ONLY in Step 2, when the company finally makes payment after 60 days. Also, explain intuitively what happens from start to finish.", "a": "This corresponds to the payment of a previous Accounts Payable line. In ONLY this cash payment step: • IS: No changes. • CFS: Net Income is the same, but Accounts Payable now decreases by $10K, which is a cash outflow on the CFS. Cash is down by $10K. • BS: Cash is down by $10K on the Assets side, and AP is down by $10K on the L&E side, so both sides are down by $10K, and the Balance Sheet balances. • Intuition: The company has finally paid this $10K bill. It received the tax benefit for this expense in a previous period, so it’s not part of this step. From start to finish, the company’s Cash balance is down by $7.5K because it paid $10K for this marketing campaign but also received a $2.5K tax deduction. There are no permanent changes to AP because it increased by $10K and then decreased by $10K as the payment was made.", "tip": null, "tier": 4, "rank": 136, "links": [{"t": "400Q guide p.62", "h": "", "k": "ref"}, {"t": "Generalist PDF p.19", "h": "", "k": "ref"}, {"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book p.24", "h": "", "k": "ref"}], "rbq": ["What happens to the three financial statements if a company initiates a dividend?"], "n": 394, "so": 2}, {"id": "Q035", "src": "400", "section": "Accounting – Calculations", "q": "Your friend’s e-commerce company orders $200 of products from its main supplier. A month later, it sells these products for $500. Walk me through each step of this process SEPARATELY. The initial step is an Inventory purchase, and the second step is a recognition of Revenue and", "a": "COGS and the removal of the Inventory. Here’s Step 1: • IS: No changes because no product has been sold or delivered yet. • CFS: The Inventory increase reduces cash flow by $200, so Cash is down by $200. • BS: Cash is down by $200 on the Assets side, and Inventory is up by $200. Nothing changes on the L&E side, so the BS remains in balance. • Intuition: The company has spent $200 of Cash on Inventory. And Step 2: • IS: Revenue is up by $500, and COGS is up by $200, so Pre-Tax Income is up by $300, and Net Income is up by $225 at a 25% tax rate. • CFS: Net Income is up by $225, and Inventory now decreases by $200, which is a positive cash flow, so Cash is up by $425 in just this step. • BS: Cash is up by $425, and Inventory is down by $200, so the Assets side is up by $225. On the L&E side, Equity is up by $225 due to the increased Net Income, so both sides balance. • Intuition: In just this step, the company recovers $200 in cash from the sale of the Inventory, earns a $300 pre-tax profit, and pays $75 in taxes, so its Cash is up by $425. This scenario makes more sense when you combine the steps: Over both steps, Inventory goes up and then down, and Cash is up by $225. The company bought some Inventory, turned it into a product, sold and delivered it, profited $300 from it, paid $75 in taxes, and now has $225 in additional Cash.", "tip": null, "tier": 4, "rank": 137, "links": [{"t": "400Q guide p.63", "h": "", "k": "ref"}, {"t": "Generalist PDF p.20", "h": "", "k": "ref"}, {"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements & Accrual Concepts p.13", "h": "", "k": "ref"}], "rbq": [], "n": 395, "so": 2}, {"id": "Q036", "src": "400", "section": "Accounting – Calculations", "q": "A Software-as-a-Service (SaaS) company bills customers upfront for an entire year of service and collects the cash before the contract begins. Walk me through the process for a $250 contract with a $50 delivery cost between January 1 and December 31 of the year. COMBINE the cash collection and revenue recognition.", "a": "On January 1, Deferred Revenue and Cash both increase by $250 on the Balance Sheet, so the BS remains in balance. For the rest of the year, the company recognizes $250 in Revenue and $50 in Cost of Sales, so the combined steps look like this: • IS: Revenue is up by $250, and COGS is up by $50, so Pre-Tax Income is up by $200, and Net Income is up by $150 at a 25% tax rate. • CFS: Net Income is up by $150, and Deferred Revenue is initially up by $250 but decreases by $250 over the year, reversing this initial increase. So, on December 31, Cash is up by $150. • BS: Cash is up by $150, so Total Assets are up by $150. On the L&E side, Deferred Revenue increases by $250 but then falls by $250, so on December 31, Equity is up by $150 due to the increased Net Income, and both sides balance. • Intuition: The company has earned $200 over the year and paid $50 in taxes, so its Cash is up by $150. The Deferred Revenue changes are temporary and get reversed by the end of the year.", "tip": null, "tier": 4, "rank": 138, "links": [{"t": "400Q guide p.64", "h": "", "k": "ref"}, {"t": "Generalist PDF p.21", "h": "", "k": "ref"}, {"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements & Accrual Concepts p.13", "h": "", "k": "ref"}], "rbq": [], "n": 396, "so": 2}, {"id": "Q039", "src": "400", "section": "Accounting – Calculations", "q": "How does this change if, in addition to the 10% interest rate, the Debt now has a 20% principal repayment each year? Combine both steps and assume the principal repayment occurs on December 31.", "a": "The main difference is that 20% * $200 = $40 of the Debt must be repaid at year-end. However, this principal repayment does not appear on the IS and is not tax-deductible, so very little changes. The Interest Expense stays the same because this principal is only repaid at the end of the year. So, the IS stays the same, but on the CFS, there’s an additional cash outflow for this $40 principal repayment. Therefore, Cash is up by $145 rather than $185. On the BS, Cash is up by $145 on the Assets side. On the L&E side, Debt is up by $160, and Equity is down by $15 due to the Net Income reduction, so both sides are up by $145 and balance.", "tip": null, "tier": 4, "rank": 139, "links": [{"t": "400Q guide p.66", "h": "", "k": "ref"}, {"t": "Generalist PDF p.23", "h": "", "k": "ref"}, {"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book p.34", "h": "", "k": "ref"}], "rbq": ["DSCR = (EBITDA − Capex) (Mandatory Principal Repayment + Interest Expense) How do you calculate the fixed charge coverage ratio (FCCR) and what does it mean?"], "n": 397, "so": 2}, {"id": "Q043", "src": "400", "section": "Accounting – Calculations", "q": "One year passes. The company pays 10% interest on its Debt, and it depreciates 10% of the factory. It also repays 5% of the Debt principal. What happens on the statements in this first year?", "a": "A 10% interest rate means $20 in Interest Expense, the 10% depreciation means $200 * 10% = $20 of Depreciation, and 5% * $200 = $10 of the Debt principal is repaid. So: • IS: You record $20 in Interest and $20 in Depreciation, so Pre-Tax Income falls by $40, and Net Income falls by $30 at a 25% tax rate. • CFS: Net Income is down by $30, but you add back the $20 of Depreciation and record $10 in Debt Principal Repayments, so Cash at the bottom is down by $20. • BS: Cash is down by $20, and Net PP&E is down by $20, so the Assets side is down by $40. On the L&E side, Debt is down by $10 due to the principal repayment, and CSE is down by $30 due to the reduced Net Income, so both sides are down by $40 and balance. • Intuition: Cash declines because of the Interest Expense and Debt Principal Repayment, offset by the tax savings from the Interest and Depreciation.", "tip": null, "tier": 4, "rank": 140, "links": [{"t": "400Q guide p.68", "h": "", "k": "ref"}, {"t": "Generalist PDF p.25", "h": "", "k": "ref"}, {"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements & Accrual Concepts p.13", "h": "", "k": "ref"}], "rbq": [], "n": 398, "so": 2}, {"id": "Q046", "src": "400", "section": "Accounting – Calculations", "q": "Now walk through Step 2 – the sale and delivery of the products and the supplier payments – SEPARATELY from Step 1.", "a": "In this step, Walmart recognizes the additional Revenue, COGS, and OpEx: • IS: Revenue is up by $400, COGS is up by $200, and OpEx is up by $100, so Pre-Tax Income is up by $100. Net Income is up by $75 at a 25% tax rate. • CFS: Net Income is up by $75. The Change in Inventory is now +$200 because it falls by $200 in this step, and the Change in AP is now –$200 because it also falls in this step. They cancel each out, so the Cash at the bottom is up by $75. • BS: Cash is up by $75 on the Assets side, and Inventory is now down by $200, so the Total Assets are down by $125 in just this step. On the L&E side, AP is now down by $200 in just this step, and Equity is up by $75 due to the increased Net Income, so both sides are down by $125, and the BS balances. • Intuition: Cash is up by $75 because the company earns $100 in pre-tax profits and pays $25 in taxes. The Inventory and AP changes in this step are temporary and represent reversals of Step 1; if you combine the steps, Total Assets and Total Liabilities & Equity are up by $75 cumulatively.", "tip": null, "tier": 4, "rank": 141, "links": [{"t": "400Q guide p.70", "h": "", "k": "ref"}, {"t": "Generalist PDF p.27", "h": "", "k": "ref"}, {"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements & Accrual Concepts p.13", "h": "", "k": "ref"}], "rbq": [], "n": 399, "so": 2}, {"id": "Q055", "src": "400", "section": "Equity Value & Enterprise Value – Concepts", "q": "Should you add Operating Leases in the Enterprise Value calculation? What about Finance Leases?", "a": "This is a question of comparability and the valuation multiples you’re using. Generally, you should add Finance Leases because metrics such as EBITDA exclude the Finance Lease Interest and Finance Lease Depreciation. If a metric excludes certain expenses, then the Enterprise Value paired with this metric should add or include the corresponding Liability. Operating Leases are trickier because the accounting differs under U.S. GAAP vs. IFRS. Under U.S. GAAP, it’s best not to add them because the corresponding expense is “Rent” on the Income Statement, which is deducted to calculate EBIT, EBITDA, etc. If you add them to Enterprise Value, you must pair it with a metric like EBITDAR that adds back the Rental Expense. Under IFRS, it’s easiest to add Operating Leases because metrics like EBITDA exclude the full Lease Interest and Lease Depreciation from all Lease types, so the corresponding Lease Liabilities should be in Enterprise Value. NOTE: We do not view Leases as true “financial” items representing “outside investor groups”; this treatment is for comparability and ease of calculation.", "tip": null, "tier": 4, "rank": 143, "links": [{"t": "400Q guide p.74", "h": "", "k": "ref"}, {"t": "Generalist PDF p.31", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book p.46", "h": "", "k": "ref"}, {"t": "Red Book p.47", "h": "", "k": "ref"}], "rbq": ["Why do we add minority interest to equity value in the calculation of enterprise value?", "Net Debt = Total Debt – Cash & Equivalents When calculating enterprise value, why do we add net debt?"], "n": 400, "so": 3}, {"id": "Q093", "src": "400", "section": "Valuation Metrics and Multiples", "q": "A company is currently trading at 10x TEV / EBITDA. It wants to sell an Operating Asset for 2x the Asset’s EBITDA. Will that transaction increase or decrease the company’s Enterprise Value and its TEV / EBITDA multiple?", "a": "The sale will reduce the company’s Enterprise Value because the company is trading an Operating Asset for Cash, which is a Non-Operating Asset. Even though the company’s Enterprise Value decreases, its TEV / EBITDA multiple increases because the Asset’s multiple was lower than the entire company’s multiple. To understand this, pretend the company’s total EBITDA was $100, and this Asset contributed $20 of that EBITDA. Therefore, the company’s Enterprise Value before the sale was $1,000. The company now sells the Asset for 2x * $20 = $40. After the sale, the company’s Enterprise Value falls by $40, and its EBITDA falls by $20. So, its new TEV / EBITDA is $960 / $80, or 12x.", "tip": null, "tier": 4, "rank": 146, "links": [{"t": "400Q guide p.91", "h": "", "k": "ref"}, {"t": "Generalist PDF p.48", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book p.27", "h": "", "k": "ref"}, {"t": "Red Book p.70", "h": "", "k": "ref"}], "rbq": ["A company is currently trading at 12.5x EBITDA, is it overvalued?", "When should you value a company using a revenue multiple vs. EBITDA?"], "n": 401, "so": 6}, {"id": "Q094", "src": "400", "section": "Valuation Metrics and Multiples", "q": "What happens to the company’s Equity Value and P / E multiple in this scenario?", "a": "We can’t say for sure, but based on the information provided here, Equity Value does not change because the Net Assets stay the same (Operating vs. Non-Operating Assets do not matter for Equity Value). It would change only if there were a Gain or Loss recorded on the sale, as that would flow into Common Shareholders’ Equity via Net Income. Most likely, the P / E multiple would increase because this company is most likely trading at a higher P / E multiple than this specific asset if it’s a 10x vs. 2x difference for the EBITDA multiples. However, we can’t say for sure because there could be a huge capital structure difference between the company and this specific asset.", "tip": null, "tier": 4, "rank": 147, "links": [{"t": "400Q guide p.91", "h": "", "k": "ref"}, {"t": "Generalist PDF p.48", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Relative Valuation p.65", "h": "", "k": "ref"}], "rbq": [], "n": 402, "so": 6}, {"id": "Q120", "src": "400", "section": "Discounted Cash Flow (DCF) – Assumptions and Analysis", "q": "Suppose that a company goes from using 0% Debt in its capital structure to 20%. How will its WACC and Implied Value from a DCF change?", "a": "Most likely, its WACC will decrease because Debt is cheaper than Equity due to the lower expected/targeted returns and the tax-deductibility of interest paid on Debt. So, when most companies go from 0% Debt to a low/moderate amount of Debt, their WACCs tend to decrease, which means their Implied Values from a DCF increase. Above this moderate Debt level, WACC will start to increase as the Cost of Debt and Cost of Equity begin to increase, which will reduce the company’s Implied Value.", "tip": "Shape: WACC vs. leverage is a U-curve — cheap tax-shielded debt lowers it first, then rising distress risk (higher cost of equity AND debt) pulls it back up. 'Moderate debt lowers WACC; too much raises it.'", "tier": 4, "rank": 151, "links": [{"t": "400Q guide p.101", "h": "", "k": "ref"}, {"t": "Generalist PDF p.58", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book p.59", "h": "", "k": "ref"}, {"t": "Red Book p.61", "h": "", "k": "ref"}], "rbq": ["The unadjusted, period-end assumption may be more appropriate in this scenario. How would raising additional debt impact a DCF analysis?", "What is the difference between WACC and IRR?"], "n": 403, "so": 7}, {"id": "Q124", "src": "400", "section": "Discounted Cash Flow (DCF) – Assumptions and Analysis", "q": "You’re building a 10-year DCF for a growth-oriented tech company. Your VP reviews your model and asks you to extend the forecast period to 20 years. How will the output change?", "a": "The main difference with a longer forecast period is that the PV of the Terminal Value should now account for a reduced percentage of the company’s total Implied Value from the DCF (e.g., 50% vs. 70%). We can’t say if the Implied Value will go up or down because it depends on the specific numbers and the relative weight of the Terminal Value vs. everything else.", "tip": null, "tier": 4, "rank": 152, "links": [{"t": "400Q guide p.103", "h": "", "k": "ref"}, {"t": "Generalist PDF p.60", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book: Intrinsic Valuation p.54", "h": "", "k": "ref"}], "rbq": [], "n": 404, "so": 7}, {"id": "Q147", "src": "400", "section": "Merger Models – Concepts", "q": "Give me an example of how you might estimate the Revenue and Expense Synergies in an M&A deal.", "a": "With Revenue Synergies, you might assume that the Seller can sell its products to some of the Buyer’s customer base. So, if the Buyer has 100,000 customers, 1,000 of them might buy widgets from the Seller. Each widget costs $10.00, which is $10,000 in extra Revenue. There will also be COGS and Operating Expenses associated with these extra sales, so you must factor those in. For example, if each widget costs $5.00, the Combined Company will earn only $5,000 in extra Pre-Tax Income. With Expense Synergies, you might assume that the Combined Company can close several offices or lay off redundant employees, particularly in administrative functions such as IT, accounting, and HR. For example, if the Combined Company has 10 offices, management might believe only 8 will be required after the merger. If each office costs $100,000 per year, there will be 2 * $100,000 = $200,000 in Expense Synergies, boosting the Combined Pre-Tax Income by $200,000.", "tip": null, "tier": 4, "rank": 155, "links": [{"t": "400Q guide p.113", "h": "", "k": "ref"}, {"t": "Generalist PDF p.70", "h": "", "k": "ref"}, {"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book p.75", "h": "", "k": "ref"}, {"t": "Red Book p.85", "h": "", "k": "ref"}], "rbq": ["What are some of the most common reasons that M&A deals fail to create value?", "Debt Issuance Costs,\" and embedded as a non-cash expense within interest expense. ?"], "n": 405, "so": 9}, {"id": "Q149", "src": "400", "section": "Merger Models – Calculations", "q": "Company A has 10 shares outstanding at a share price of $25.00, and its Net Income is $10. It acquires Company B for a Purchase Equity Value of $150. Company B has a Net Income of $10 as well. Both companies have 25% tax rates. How accretive is a 100% Stock deal?", "a": "Company A’s EPS is $10 / 10 = $1.00. Company A must issue 6 new shares to do the deal since $150 / $25.00 = 6, so the Combined Share Count is 10 + 6 = 16. Since no Cash or Debt is used and the tax rates are the same, the Combined Net Income = Company A Net Income + Company B Net Income = $10 + $10 = $20. Therefore, the Combined EPS is $20 / 16 = $1.25, so it’s accretive by 25% (mental math: 25% of 16 is 4, and 20 is 4 greater than 16, so take the $1.00 EPS and increase it by 25%).", "tip": null, "tier": 4, "rank": 156, "links": [{"t": "400Q guide p.114", "h": "", "k": "ref"}, {"t": "Generalist PDF p.71", "h": "", "k": "ref"}, {"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book p.83", "h": "", "k": "ref"}], "rbq": ["P/E of 20x and acquires a company trading at a forward P/E of 13x. If the deal is 100% stock-for-stock and a 20% premium was paid, will the deal be accretive in", "Offer Value = Fully Diluted Shares Outstanding × Offer Price Per Share Why is a “normalized” share price used when calculating the offer value?"], "n": 406, "so": 10}, {"id": "Q150", "src": "400", "section": "Merger Models – Calculations", "q": "Suppose that Company A now decides to use 100% Cash or 100% Debt to do this deal. If the Cash interest rate is 4%, and the Debt interest rate is 10%, will this deal be accretive or dilutive under these financing structures?", "a": "The After-Tax Cost of Cash is 4% * (1 – 25%) = 3%, and the After-Tax Cost of Debt is 10% * (1 – 25%) = 7.5%. The Seller’s Purchase Yield is $10 / $150 = ~6.7%. Therefore, a 100% Cash deal will be accretive, and a 100% Debt deal will be dilutive.", "tip": "Mental math: after-tax cost = rate × (1 − t). Breakeven goes the other way: divide the yield by (1 − t). Dividing when you should multiply is the most common slip under pressure.", "tier": 4, "rank": 157, "links": [{"t": "400Q guide p.115", "h": "", "k": "ref"}, {"t": "Generalist PDF p.72", "h": "", "k": "ref"}, {"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book p.81", "h": "", "k": "ref"}, {"t": "Red Book p.83", "h": "", "k": "ref"}], "rbq": ["EPS – which is ultimately the question being answered: \"Will this deal be accretive or dilutive?", "In all-stock deals, how can you determine whether an acquisition will be accretive or dilutive?"], "n": 407, "so": 10}, {"id": "Q156", "src": "400", "section": "Merger Models – Calculations", "q": "An Acquirer with an Equity Value of $500 million and an Enterprise Value of $600 million buys another company for a Purchase Equity Value of $100 million and a Purchase Enterprise Value of $150 million. What are the Combined Equity Value and Enterprise Value in a 100% Stock deal?", "a": "The Combined Enterprise Value equals the Enterprise Value of the Buyer plus the Purchase Enterprise Value of the Seller, so it’s $600 + $150 = $750 million. If it’s a 100% Stock deal, the Combined Equity Value = Acquirer’s Equity Value + Value of Stock Issued = $500 + $100 = $600 million.", "tip": null, "tier": 4, "rank": 158, "links": [{"t": "400Q guide p.117", "h": "", "k": "ref"}, {"t": "Generalist PDF p.74", "h": "", "k": "ref"}, {"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book p.82", "h": "", "k": "ref"}], "rbq": ["Since the acquirer doesn't have to assume the debt on the seller’s balance sheet or get to use its cash, the acquirer is just paying the seller for the company'"], "n": 408, "so": 10}, {"id": "Q157", "src": "400", "section": "Merger Models – Calculations", "q": "How do these figures change if it’s a 50% Cash / 50% Stock deal instead?", "a": "The Combined Enterprise Value stays the same regardless of the deal financing, so it’s still $750 million. The Combined Equity Value changes based on the financing because it equals the Acquirer’s Equity Value + Value of Stock Issued. So, in a 50% Cash / 50% Stock deal, the Combined Equity Value is $500 + $50 = $550 million.", "tip": null, "tier": 4, "rank": 159, "links": [{"t": "400Q guide p.118", "h": "", "k": "ref"}, {"t": "Generalist PDF p.75", "h": "", "k": "ref"}, {"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book: Accretion/Dilution Modeling p.81", "h": "", "k": "ref"}], "rbq": [], "n": 409, "so": 10}, {"id": "Q158", "src": "400", "section": "Merger Models – Calculations", "q": "An Acquirer with an Equity Value of $500 million and an Enterprise Value of $600 million has a Net Income of $50 million and an EBITDA of $100 million. The Target, with a Purchase Equity Value of $100 million and a Purchase Enterprise Value of $150 million, has a Net Income of $10 million and an EBITDA of $15 million. What are the Combined P / E and TEV / EBITDA multiples in a 100% Stock deal? Assume 25% tax rates for the Acquirer and Target.", "a": "The Combined Equity Value in a 100% Stock deal is $500 + $100 = $600 million, and the Combined Enterprise Value is $600 + $150 = $750 million. The Combined EBITDA is $115 million, and the Combined Net Income, assuming the same tax rates and no interest effects since it’s a 100% Stock deal, is $50 + $10 = $60 million. Therefore, the Combined P / E multiple is $600 million / $60 million = 10x, and the Combined TEV / EBITDA multiple is $750 million / $115 million = ~6.5x.", "tip": null, "tier": 4, "rank": 160, "links": [{"t": "400Q guide p.118", "h": "", "k": "ref"}, {"t": "Generalist PDF p.75", "h": "", "k": "ref"}, {"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book p.82", "h": "", "k": "ref"}, {"t": "Red Book p.88", "h": "", "k": "ref"}], "rbq": ["For earn-outs, why is EBITDA the most common metric to use as the target?", "Since the acquirer doesn't have to assume the debt on the seller’s balance sheet or get to use its cash, the acquirer is just paying the seller for the company'"], "n": 410, "so": 10}, {"id": "Q159", "src": "400", "section": "Merger Models – Calculations", "q": "How do the multiples change if this is a 100% Debt deal funded with an 8% interest rate issuance?", "a": "The Combined EBITDA and Enterprise Value stay the same because they do not depend on the deal financing, so the Combined TEV / EBITDA is still ~6.5x. The Combined Equity Value is now just the Acquirer’s Equity Value of $500 million. The Combined Net Income equals $50 + $10 – $100 * 8% * (1 – 25%) = $50 + $10 – $6 = $54. Therefore, the Combined P / E multiple is now $500 million / $54 million = ~9.3x, which you can estimate as “between 9x and 10x” (since $500 / $50 = 10x and $500 / ~$56 = 9x).", "tip": null, "tier": 4, "rank": 161, "links": [{"t": "400Q guide p.118", "h": "", "k": "ref"}, {"t": "Generalist PDF p.75", "h": "", "k": "ref"}, {"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book: Accretion/Dilution Modeling p.81", "h": "", "k": "ref"}], "rbq": [], "n": 411, "so": 10}, {"id": "Q160", "src": "400", "section": "Merger Models – Calculations", "q": "Will the Combined TEV / EBITDA and P / E multiples always be between the Acquirer’s multiples and the Target’s purchase multiples in a deal?", "a": "Ignoring synergies and acquisition effects, the Combined Enterprise Value-based Multiples will be between the Buyer’s standalone multiples and the Seller’s purchase multiples. The Combined Equity Value-based Multiples are often in that range as well, but they do not have to be because the two companies could have very different capital structures. Generally, the combined multiples will be closer to the larger company’s multiples (normally the Acquirer), but you can’t use a simple average because the company sizes and financial contribution percentages could be very different.", "tip": null, "tier": 4, "rank": 162, "links": [{"t": "400Q guide p.119", "h": "", "k": "ref"}, {"t": "Generalist PDF p.76", "h": "", "k": "ref"}, {"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book: Accretion/Dilution Modeling p.81", "h": "", "k": "ref"}], "rbq": [], "n": 412, "so": 10}, {"id": "Q176", "src": "400", "section": "LBO Models – Calculations", "q": "A PE firm acquires a $100 million EBITDA company for a 10x purchase multiple and funds the deal with 60% Debt. The company’s EBITDA grows to $150 million by Year 5, but the exit multiple drops to 9x. The company repays $250 million of Debt in this time and generates no extra Cash. What’s the IRR?", "a": "Initially, the PE firm uses 40% Equity, which means $100 million * 10x * 40% = $400 million. The Exit Enterprise Value = $150 million * 9x = $1,350 million (Mental Math: $150 million * 10x = $1.5 billion and subtract $150 million). The initial Debt amount was $600 million, and the company repaid $250 million, so $350 million of Debt remains upon exit. The Equity Proceeds to the PE firm are $1,350 million – $350 million = $1 billion. $1 billion / $400 million = 2.5x. Since a 2x multiple over 5 years is 15% and 3x is 25%, this IRR is approximately 20%.", "tip": "Anchor on the equity check ($400M) as your denominator and never forget remaining net debt at exit — forgetting the $350M is the single most common paper-LBO error.", "tier": 4, "rank": 163, "links": [{"t": "400Q guide p.126", "h": "", "k": "ref"}, {"t": "Generalist PDF p.83", "h": "", "k": "ref"}, {"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "Red Book: LBO Modeling p.104", "h": "", "k": "ref"}], "rbq": [], "n": 413, "so": 12}, {"id": "Q021", "src": "400", "section": "Accounting – Concepts", "q": "Explain lease accounting on the financial statements under IFRS 16 / ASC 842, including the differences between Operating Leases and Finance Leases.", "a": "Assets and Liabilities associated with leases that last for more than 12 months now appear directly on companies’ Balance Sheets. Operating Lease Assets are sometimes called “Right-of- Use Assets,” and Operating Lease Liabilities initially match them (or are very close). The rental expense for Finance Leases, which give companies an element of ownership or a “bargain purchase option” at the end, is split into Interest and Depreciation elements on the Income Statement. On the Cash Flow Statement, Depreciation is added back, and under Cash Flow from Financing, the company records a negative for the “Lease Principal Repayments” (or a similar name). On the Balance Sheet, the Lease Assets and Lease Liabilities decrease each year until the lease ends. These decreases are based on the Lease Depreciation and Lease Principal Repayments. Under IFRS, Operating Leases and Finance Leases are treated the same way, so the Operating Lease Expense is also split into Interest and Depreciation elements, and the same BS and CFS line items change. For Operating Leases under U.S. GAAP, companies record a simple Rental Expense on the Income Statement, so there is no Depreciation/Interest split. However, the Lease Assets and Lease Liabilities on the Balance Sheet still decrease each year based on the company’s estimates for “Lease Depreciation” and “Lease Principal Repayments,” which do not appear explicitly on the statements under U.S. GAAP.", "tip": "IFRS/GAAP asymmetry worth stating: under IFRS (or U.S. finance leases) rent splits into depreciation + interest, so EBITDA is HIGHER than under U.S. GAAP operating treatment for the identical lease. Cross-border comps must adjust for this.", "tier": 4, "rank": 164, "links": [{"t": "400Q guide p.54", "h": "", "k": "ref"}, {"t": "Generalist PDF p.11", "h": "", "k": "ref"}, {"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book p.39", "h": "", "k": "ref"}, {"t": "Red Book p.40", "h": "", "k": "ref"}], "rbq": ["What is the accounting treatment for operating leases?", "What is the accounting treatment for finance leases?"], "n": 414, "so": 1}, {"id": "Q183", "src": "400ind", "section": "Industrials (400Q industry section)", "q": "What are some accounting and valuation differences in the maritime/shipping sector within the transportation vertical?", "a": "First, many companies in this vertical, such as 'dry bulk' shipping firms that own huge fleets and transport cargo around the world, have a General Partner / Limited Partner structure (like PE firms), which means that cash flows may be split up for distribution to each group.\n\nDistributable Cash Flow, or EBITDA minus CapEx, is a common valuation metric and multiple because CapEx is so high for many of these companies that EBITDA is not always useful.\n\nLeases are very important, and since shipping companies operate globally under different accounting systems, you may use metrics like EBITDAR or EBITDAR minus CapEx to normalize the financials for different systems and lease mixes.\n\nFinally, the Net Asset Value (NAV) model is an important valuation methodology; in this version, you estimate the market value of the company's ships and other assets and subtract its liabilities to determine its Implied Equity Value. P / NAV, based on Equity Value / Net Asset Value, is also a common multiple.", "tip": null, "tier": 4, "rank": 9183, "links": [{"t": "400Q guide p.165", "h": "", "k": "ref"}, {"t": "Red Book: Industrials p.246", "h": "", "k": "ref"}], "n": 415, "so": 13}, {"id": "R12", "src": "rb", "section": "Industrials (Red Book ch.)", "q": "Walk me through a NAV valuation for a shipping company.", "a": "1. Value the EBITDA-generating assets (the vessels). Market values of vessels are readily available in industry trade journals based on sale and purchase activity. Start with the 'steel value' of each vessel from market benchmarks — the bulk of the valuation. Then run a DCF on the company's time-charter profile: the difference between the daily rate fixed on each vessel and the forward curve of expected charter rates, typically at a ~10% WACC. Add that PV of embedded contract value to the steel value to get a 'charter-adjusted' value per vessel. That is the enterprise value based solely on vessel value.\n\n2. Subtract debt and other non-equity claims not yet valued — usually at book value, unless there's reason to believe market values differ.\n\n3. Add non-operating assets not already in the build-up, such as cash and construction in progress (at book or projected market value).\n\n4. The result is the NAV-derived equity value. Compare it to market cap, or divide by shares to compare against the share price and compute Price / NAV. Trading at a premium to NAV is a positive for the stock.", "tip": null, "tier": 4, "rank": 9512, "links": [{"t": "Red Book p.255", "h": "", "k": "ref"}, {"t": "400Q guide: Industrials p.164", "h": "", "k": "ref"}], "n": 416, "so": 16}, {"id": "S403", "src": "supp", "section": "Accounting – Calculations", "topic": "Accounting Calcs", "q": "Company issues $200 of debt at 10% annual interest. Walk through Year 1 impact. (40% tax)", "a": "At issuance — IS: no change. CFS: financing up $200. BS: Cash up $200, Debt up $200.\n\nYear 1 interest — IS: interest expense $20, pre-tax income down $20, taxes down $8, Net Income down $12. CFS: NI down $12. BS: Cash down $12, RE down $12.\n\nCombined Year 1: Cash up $188, Debt up $200, RE down $12. Balances.", "tier": 4, "rank": 5403, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statement Analysis p.27", "h": "", "k": "ref"}, {"t": "Red Book: Advanced Accounting p.35", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Calcs p.59", "h": "", "k": "ref"}], "type": "walkthrough", "flags": [], "n": 417, "so": 2}, {"id": "S405", "src": "supp", "section": "Accounting – Calculations", "topic": "Accounting Calcs", "q": "$200 goodwill impairment, assume NOT tax-deductible. Walk through the statements.", "a": "IS: impairment charge $200, pre-tax income down $200. But the charge isn't deductible — book tax provision stays the same. Net Income down $200 (no tax shield).\n\nCFS: NI down $200, + add back $200 non-cash impairment = cash up $0.\n\nBS: Cash unchanged. Goodwill down $200 (left side down $200). Retained Earnings down $200 (right side down $200). Balances.", "tier": 4, "rank": 5405, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statement Analysis p.27", "h": "", "k": "ref"}, {"t": "Red Book: Advanced Accounting p.35", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Calcs p.59", "h": "", "k": "ref"}], "type": "walkthrough", "flags": [], "n": 418, "so": 2}, {"id": "S406", "src": "supp", "section": "Accounting – Calculations", "topic": "Accounting Calcs", "q": "Company writes off $40 of bad debt from its existing AR allowance. Walk through the statements.", "a": "If the allowance was already booked in a prior period, no IS impact today — it's just a balance sheet reclassification.\n\nIS: no change. CFS: no change. BS: AR (gross) down $40, Allowance for Doubtful Accounts down $40. Net AR unchanged. Balances.\n\nThe expense already hit the IS in the period the allowance was originally provisioned. Don't double-count.", "tier": 4, "rank": 5406, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statement Analysis p.27", "h": "", "k": "ref"}, {"t": "Red Book: Advanced Accounting p.35", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Calcs p.59", "h": "", "k": "ref"}], "type": "walkthrough", "flags": [], "n": 419, "so": 2}, {"id": "S411", "src": "supp", "section": "Accounting – Calculations", "topic": "Accounting Calcs", "q": "Company sells $100 of inventory (cost) on credit for $150 (i.e., gross margin 33%). 40% tax rate. Walk through all three statements.", "a": "IS: Revenue up $150, COGS up $100, gross profit up $50. Pre-tax income up $50, taxes up $20, Net Income up $30.\n\nCFS: NI up $30. WC adjustments: AR up $150 (use of cash $150), Inventory down $100 (source of cash $100). Net WC change: -$50. Cash from Ops up $30 - $50 = -$20.\n\nBS: Cash down $20, AR up $150, Inventory down $100 (left side up $30). RE up $30 (right side up $30). Balances.\n\nKey lesson: profitable sales can REDUCE cash when paid on credit. Growth eats cash.", "tier": 4, "rank": 5411, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statement Analysis p.27", "h": "", "k": "ref"}, {"t": "Red Book: Advanced Accounting p.35", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Calcs p.59", "h": "", "k": "ref"}], "type": "walkthrough", "flags": [], "n": 420, "so": 2}, {"id": "S706", "src": "supp", "section": "Discounted Cash Flow (DCF) – Assumptions and Analysis", "topic": "DCF Mechanics", "q": "Year 5 UFCF is $30M, perpetuity growth rate is 2.5%, WACC is 10%. What's the Gordon Growth Terminal Value (at end of Year 5)?", "a": "TV = [$30 × (1 + 0.025)] / (0.10 − 0.025) = $30.75 / 0.075 = $410M.\n\nNote: this is the TV at end of Year 5. To get the present value, divide by (1 + WACC)⁵ = (1.10)⁵ ≈ 1.61. PV ≈ $410 / 1.61 ≈ $255M.", "tier": 4, "rank": 5706, "links": [{"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book: Intrinsic Valuation p.54", "h": "", "k": "ref"}, {"t": "400Q guide: DCF p.94", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 421, "so": 7}, {"id": "S709", "src": "supp", "section": "Discounted Cash Flow (DCF) – Assumptions and Analysis", "topic": "DCF Mechanics", "q": "Walk through building Unlevered FCF starting from EBIT for a company with: EBIT $100, tax rate 25%, D&A $20, Capex $30, ΔWC +$5.", "a": "Start with EBIT: $100\nApply taxes: $100 × (1 − 0.25) = $75. This is NOPAT (Net Operating Profit After Tax).\nAdd back D&A: $75 + $20 = $95 (non-cash charge).\nSubtract Capex: $95 − $30 = $65 (reinvestment in PP&E).\nSubtract ΔWC: $65 − $5 = $60 (positive ΔWC = use of cash).\n\nUFCF = $60. Note: we use the unlevered tax (apply tax to EBIT, not EBT) because UFCF is pre-interest.", "tier": 4, "rank": 5709, "links": [{"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book: Intrinsic Valuation p.54", "h": "", "k": "ref"}, {"t": "400Q guide: DCF p.94", "h": "", "k": "ref"}], "type": "walkthrough", "flags": [], "n": 422, "so": 7}, {"id": "S910", "src": "supp", "section": "Merger Models – Calculations", "topic": "M&A Calcs", "q": "A deal is 50% cash / 50% stock. How do you analyze accretion / dilution?", "a": "Apply each rule to the relevant portion:\n\nCash portion: accretive if target earnings yield > after-tax cost of debt (or after-tax foregone interest on cash used).\n\nStock portion: accretive if acquirer's P/E > target's P/E.\n\nBlend the weighted impacts. If both halves are accretive, deal is accretive. If both halves are dilutive, dilutive. If they conflict, you have to do the actual EPS math: combined pro forma NI / combined pro forma share count vs standalone acquirer EPS.", "tier": 4, "rank": 5910, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book: Accretion/Dilution p.81", "h": "", "k": "ref"},
