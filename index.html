shareholders (founders, PE) sell their shares. Not dilutive to new investors (no new shares created), but increases public float.\n\nFollow-ons are typically priced at a small discount (3-5%) to the prior day's close. Marketed faster than IPOs (a few days vs. weeks).", "tier": 1, "rank": 6106, "links": [{"t": "Red Book: Debt & LevFin p.112", "h": "", "k": "ref"}, {"t": "Red Book: Equity Financing p.122", "h": "", "k": "ref"}, {"t": "400Q guide: DCM/LevFin p.131", "h": "", "k": "ref"}, {"t": "400Q guide: ECM p.145", "h": "", "k": "ref"}], "type": "recall", "flags": [], "n": 53, "so": 18}, {"id": "S1301", "src": "supp", "section": "Market Context (supplemental)", "topic": "Market Context", "q": "What is the approximate risk-free rate you'd use in a DCF today, and where do you get it?", "a": "Use the current 10-year US Treasury yield - it has been in the low-to-mid 4% range recently - as your risk-free rate in CAPM / WACC. Don't quote a stale 2-3%: anchoring to the actual current 10-year signals you follow markets. Pull the live yield the morning of any interview rather than memorizing a figure; it moves.", "tier": 1, "rank": 6301, "links": [{"t": "Red Book: General Market Knowledge p.133", "h": "", "k": "ref"}], "type": "recall", "flags": ["dated"], "n": 54, "so": 20}, {"id": "S1302", "src": "supp", "section": "Market Context (supplemental)", "topic": "Market Context", "q": "Where is the Fed funds target rate right now, and what's the trajectory?", "a": "The federal funds target range is 3.50%-3.75% as of early-to-mid 2026: the Fed cut through late 2025 and has since paused. The read: the easing cycle is on hold, not reversed. Knowing the level and the 'on hold' stance is enough - you don't need to predict the next move. (Verify the current range and the most recent FOMC action the week of your interview; this is the one number you cannot get wrong.)", "tier": 1, "rank": 6302, "links": [{"t": "Red Book: General Market Knowledge p.133", "h": "", "k": "ref"}], "type": "recall", "flags": ["dated"], "n": 55, "so": 20}, {"id": "S3011", "src": "supp", "section": "Accounting – Concepts", "topic": "Accounting Concepts", "q": "How can you tell whether an item belongs in Assets, Liabilities, or Equity on the Balance Sheet?", "a": "Asset: it will generate future cash or can be sold for cash (e.g., Cash, AR, PP&E, Inventory).\n\nLiability: it will cost the company cash in the future and cannot be sold – it represents owed payments (e.g., Debt, Accounts Payable, Deferred Revenue).\n\nEquity: like Liabilities, it's a funding source, but it will NOT require a future cash cost. It represents money the company saved internally (Retained Earnings) or raised from investors with no cash obligation (Common Stock & APIC).\n\nThe quick test: 'Does it bring cash in (Asset), cost cash later (Liability), or fund the business with no cash obligation (Equity)?'", "tier": 1, "rank": 8011, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements p.13", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Concepts p.50", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 56, "so": 1}, {"id": "S3019", "src": "supp", "section": "Accounting – Concepts", "topic": "Accounting Concepts", "q": "Why must you look at the Cash Flow Statement to find a company's full Depreciation, rather than the Income Statement?", "a": "Because companies often embed portions of Depreciation inside other Income Statement line items like COGS and Operating Expenses, rather than showing it as one clean line.\n\nThe reason: depreciation of assets used by different functions (sales, R&D, support) gets allocated to those functions' expense lines. The IS line called 'Depreciation' may be only part of the total.\n\nThe full, true Depreciation figure is added back in Cash Flow from Operations, so the CFS is the reliable source. Implication: never assume the IS shows total D&A.", "tier": 1, "rank": 8019, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements p.13", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Concepts p.50", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 57, "so": 1}, {"id": "S3020", "src": "supp", "section": "Accounting – Concepts", "topic": "Cash Flow Statement", "q": "What are the three sections of the Cash Flow Statement, and what does each capture?", "a": "Cash Flow from Operations (CFO): starts with Net Income, adds back non-cash items (D&A, SBC, write-downs), and reflects changes in working capital (AR, Inventory, AP, Deferred Revenue, etc.).\n\nCash Flow from Investing (CFI): capital expenditures, purchases/sales of investments, and acquisitions/divestitures.\n\nCash Flow from Financing (CFF): debt issuance/repayment, equity issuance/buybacks, and dividends.\n\nThe three sum to the Net Change in Cash, which links to the Cash line on the Balance Sheet.", "tier": 1, "rank": 8020, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements p.13", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Concepts p.50", "h": "", "k": "ref"}], "type": "recall", "flags": [], "n": 58, "so": 1}, {"id": "S3206", "src": "supp", "section": "Merger Models – Concepts", "topic": "M&A Concepts", "q": "Give three 'financial' reasons and three 'fuzzy' reasons a company acquires another.", "a": "Financial reasons (justifiable with numbers): consolidation / economies of scale; geographic expansion into faster-growing markets; gaining market share instantly; acquiring an undervalued seller; acquiring customers or distribution channels; tax reduction (e.g., an inversion); product expansion / diversification into a faster-growing industry.\n\nFuzzy reasons (harder to quantify): acquiring IP / a key patent / technology; defensive acquisition to neutralize a fast-growing competitor; acqui-hire to get talent quickly; 'the intangibles' / wanting to be cool; ego, pride, and office politics (empire-building, CEO ambition).\n\nInterview tip: most real deals are driven by fuzzy reasons but justified with financial ones. Naming both categories and that dynamic signals maturity.", "tier": 1, "rank": 8206, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book: M&A Concepts p.73", "h": "", "k": "ref"}, {"t": "400Q guide: Merger Models p.107", "h": "", "k": "ref"}], "type": "recall", "flags": [], "n": 59, "so": 9}, {"id": "S3526", "src": "supp", "section": "Market Context (supplemental)", "topic": "Market Context", "q": "Who led the M&A league tables for 2025, and why do league tables matter in your interview prep?", "a": "For full-year 2025 (as of mid-2026 — verify before interviews, and note H1 2026 tables may now be available): Goldman Sachs ranked #1 globally with roughly $1.48 trillion of announced deals advised — on the order of a 30%+ share of global activity. In US M&A, Goldman was also #1 (~$600B) with JPMorgan #2 (~$409B).\n\nWhy you should know this: (1) 'Why our bank?' — if you're interviewing at a top-3 M&A house, citing its league table position (and ideally its position in YOUR sector) shows you did the work; if you're interviewing at a non-bulge firm, know what it IS known for instead — league tables by sector, by deal size band, or in restructuring can tell a very different story than the global headline table. (2) Credibility — bankers live in this competitive landscape; a candidate who knows who's winning mandates sounds like a colleague, not a tourist. (3) Deal sourcing — the league table tells you which banks advised on the deals you've prepped, so connect them: if you're discussing a major energy deal in an interview at a bank that advised on it, say so.\n\nCaveats to keep yourself honest: league tables are announced-deal credit, often with multiple advisors per deal claiming full credit, and rankings shift by how you cut them (announced vs. completed, global vs. US, fee-based vs. volume-based). Treat them as directional, and refresh the numbers the week of your interview.", "tier": 1, "rank": 8526, "links": [{"t": "Red Book: General Market Knowledge p.133", "h": "", "k": "ref"}], "type": "recall", "flags": ["dated"], "n": 60, "so": 20}, {"id": "S3531", "src": "supp", "section": "Market Context (supplemental)", "topic": "Market Context", "q": "How should a candidate keep market knowledge current in the weeks before interviews — and what do you actually need to carry into the room?", "a": "Build a small, repeatable system rather than cramming.\n\nDaily (15–20 minutes): one general source — WSJ, FT, or a markets newsletter — plus one sector source for your target group (for energy: trade press covering upstream M&A, power markets, and LNG). You're scanning for deals, not memorizing.\n\nWeekly: update a one-page 'market sheet' with the handful of numbers interviewers expect: Fed funds target and the latest FOMC action, the 10-year Treasury, equity market tone, and for energy groups, WTI and Henry Hub levels. Date every number — saying 'as of this week' signals discipline, and stale figures are worse than none.\n\nDeal prep — depth over breadth: the guides are explicit that ONE deal known deeply beats ten known shallowly. Pick 2–3: one large recent deal in your target sector, one that carries the cycle's big theme, and ideally one your interviewing bank advised on. For each, know the four-part structure cold: background (parties, size), rationale, terms and multiples, and your OPINION — would you have done it, what would you change, what are the risks. The opinion is what separates candidates.\n\nDay-of hygiene: re-verify every number the morning of the interview — rates move, deals re-price, league tables update. Hedge naturally in the room: 'as of this morning, the 10-year was around X' is exactly how bankers talk.\n\nAnd connect it to your story: market knowledge lands hardest when it ties to why you're there — for an energy-focused candidate, fluency in the AI-power-demand theme, gas consolidation, and LNG buildout isn't trivia; it's evidence the sector choice is real.", "tier": 1, "rank": 8531, "links": [{"t": "Red Book: General Market Knowledge p.133", "h": "", "k": "ref"}], "type": "concept", "flags": ["dated"], "n": 61, "so": 20}, {"id": "J11", "src": "live", "section": "Real interview — Jefferies Round 1", "topic": "Real interview", "type": "concept", "q": "What are the differences between conventional and unconventional drilling?", "a": "Conventional: drilling, often vertically, into permeable reservoirs where oil and gas are trapped and flow fairly freely to the well. Wells are cheaper per well and decline slowly, but the discoveries are lumpy, with long lead times and exploration risk.\n\nUnconventional: producing from low-permeability shale or tight rock (Permian, Bakken, Eagle Ford) using horizontal drilling plus hydraulic fracturing. Higher cost per well, but low geological risk and a repeatable, 'manufacturing-style' process.\n\nThe finance implications:\n• Shale wells have steep decline curves. Production can fall 60–70% in the first year, so companies must keep drilling (spending CapEx) just to hold production flat.\n• Short-cycle: production responds to price within months, which makes US shale the swing supplier.\n• Valuation leans on reserves and NAV, and on inventory: how many years of good drilling locations are left.", "tip": "Jefferies Energy is Houston-based; tie the decline-curve point to why shale companies are valued on remaining inventory.", "tier": 1, "rank": 9810, "links": [{"t": "400Q guide: Oil & Gas p.172", "h": "", "k": "ref"}, {"t": "Jefferies R1 question list (Google Doc)", "h": "https://docs.google.com/document/d/1FkSL5OiLUkbFibMx5mcNKLGjU26kEgpVamN6fPJXPdw/edit?tab=t.0", "k": "web"}], "n": 62, "so": 22}, {"id": "J18", "src": "live", "section": "Real interview — Jefferies Round 1", "topic": "Real interview", "type": "recall", "q": "How do you calculate a company's stock price using its dividend and dividend yield?", "a": "Price = annual dividend per share ÷ dividend yield.\n\nExample: a $2.00 annual dividend at a 4% yield implies a $50 share price.\n\nConnection to valuation: the Gordon growth / dividend discount model says P = D₁ / (r – g), so dividend yield = r – g. A low yield means investors expect growth or require a low return; a high yield can signal risk or a possible dividend cut.", "tip": "Answer with the formula and a quick example in one breath. The Gordon growth link is the bonus point if they keep going.", "tier": 1, "rank": 9817, "links": [{"t": "400Q guide: DCF p.95", "h": "", "k": "ref"}, {"t": "Jefferies R1 question list (Google Doc)", "h": "https://docs.google.com/document/d/1FkSL5OiLUkbFibMx5mcNKLGjU26kEgpVamN6fPJXPdw/edit?tab=t.0", "k": "web"}], "n": 63, "so": 22}, {"id": "G01", "src": "live", "section": "Real interview — gotchas (MS, Guggenheim)", "topic": "Brainteaser / gotcha", "type": "trap", "q": "(Morgan Stanley) A lily pad doubles in size every day and covers the whole lake in 28 days. On what day does it cover half the lake?", "a": "Day 27. It doubles each day, so the day before it covers the whole lake, it covered half.\n\nThe trap is answering 14 by halving the days linearly. Growth is exponential, not linear.", "tip": "Pause, say 'it doubles daily, so work backwards one day,' then answer. Thinking out loud is the point of a brainteaser.", "tier": 1, "rank": 9822, "links": [], "n": 64, "so": 23}, {"id": "Q045", "src": "400", "section": "Accounting – Calculations", "q": "Walmart purchases $200 of Inventory “on credit,” sells it for $400, and records an additional $100 in Operating Expenses to support the sale. Walk me through ONLY Step 1 of this process with the Inventory purchase.", "a": "Accounts Payable is not necessarily linked to a specific Income Statement line item in a case like this! It could just correspond to the company paying for Inventory on credit. In the first step: • IS: No changes. • CFS: Accounts Payable increases, boosting cash flow by $200, and Inventory also increases, reducing cash flow by $200; the changes offset each other, and Cash at the bottom stays the same. • BS: Inventory on the Assets side is up by $200, and Accounts Payable on the L&E side is up by $200, so both sides are up by $200 and balance. • Intuition: The company receives the parts and materials but has not paid for them in cash yet, so the Balance Sheet changes, but Cash stays the same.", "tip": null, "tier": 2, "rank": 9, "links": [{"t": "400Q guide p.69", "h": "", "k": "ref"}, {"t": "Generalist PDF p.26", "h": "", "k": "ref"}, {"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book p.24", "h": "", "k": "ref"}], "rbq": ["Do inventories get captured on the income statement?"], "n": 65, "so": 2}, {"id": "Q079", "src": "400", "section": "Valuation Methodologies", "q": "When calculating the forward multiples for the comparable companies, should you use each company’s Current Equity Value or Current Enterprise Value, or should you project them to get the Year 1 or Year 2 values?", "a": "You always use the Current Equity Value or Current Enterprise Value. NEVER “project” either one. A company’s share price, and, therefore, both Current Equity Value and Current Enterprise Value, reflects past performance and future expectations. So, to “project” these metrics, you’d have to jump into the future and see what future expectations are at that point in time and then time travel back to the present.", "tip": null, "tier": 2, "rank": 20, "links": [{"t": "400Q guide p.85", "h": "", "k": "ref"}, {"t": "Generalist PDF p.42", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book p.47", "h": "", "k": "ref"}, {"t": "Red Book p.65", "h": "", "k": "ref"}], "rbq": ["What is the purpose of using multiples in valuation?", "How are convertible bonds and preferred equity with a convertible feature accounted for when calculating enterprise value?"], "n": 66, "so": 5}, {"id": "Q007", "src": "400", "section": "Finance Concepts", "q": "What does “Present Value” mean, and what makes it change? How does it differ from Net Present Value?", "a": "The Present Value (PV) of an asset or company equals its future cash flows discounted at the appropriate Discount Rate (e.g., ~10% for many stocks). “Discount” means that you take a future cash flow, such as $100, and divide it by ((1 + Discount Rate) ^ Year #), assuming a constant Discount Rate in each period. The PV tells you what a company or asset is worth today based on its potential future performance and your returns expectations. The PV increases if the company’s expected future cash flow or growth rate increases or the Discount Rate decreases. The PV decreases if the opposite happens. “Net Present Value” means that you take the PV of these future cash flows and subtract the upfront cost or “asking price” of the company. If the NPV is positive, the company is worth more than its current price.", "tip": null, "tier": 2, "rank": 40, "links": [{"t": "400Q guide p.48", "h": "", "k": "ref"}, {"t": "Generalist PDF p.5", "h": "", "k": "ref"}, {"t": "BIWS module 01", "h": "", "k": "ref"}, {"t": "Red Book p.45", "h": "", "k": "ref"}, {"t": "Red Book p.60", "h": "", "k": "ref"}], "rbq": ["Could you explain the concept of present value and how it relates to company valuations?", "EBITDA) in the terminal year. The multiple reflects the multiple of a comparable company in a mature state. Why is it necessary to discount the terminal value b"], "n": 67, "so": 0}, {"id": "Q008", "src": "400", "section": "Finance Concepts", "q": "What does the internal rate of return (IRR) mean? How do you calculate it?", "a": "In technical terms, the IRR represents the Discount Rate at which the Net Present Value of an investment equals 0. Colloquially, you can think of it as “the effective compounded rate of return on an investment.” For example, if you invest $1,000 today and end up with $2,000 after 5 years, the IRR represents the return you’d have to earn on that $1,000, compounded each year, to reach $2,000 in 5 years. It’s 14.9% in this example, which you can verify with a calculator or Excel. To calculate the IRR, enter the upfront investment as a negative in Excel and the future cash flows and sale value as positives and apply the IRR function to the whole range.", "tip": "Shortcut: Rule of 72 — money doubles when rate × years ≈ 72. Doubling in 5 years ≈ 15% IRR; in 3 years ≈ 24%. Use it to sanity-check any IRR before you say it out loud.", "tier": 2, "rank": 41, "links": [{"t": "400Q guide p.48", "h": "", "k": "ref"}, {"t": "Generalist PDF p.5", "h": "", "k": "ref"}, {"t": "BIWS module 01", "h": "", "k": "ref"}, {"t": "Red Book p.52", "h": "", "k": "ref"}, {"t": "Red Book p.59", "h": "", "k": "ref"}], "rbq": ["What is the difference between WACC and IRR?", "What is the difference between CAGR and IRR?"], "n": 68, "so": 0}, {"id": "Q009", "src": "400", "section": "Finance Concepts", "q": "What affects the IRR? How do these factors differ from the ones that affect the Present Value?", "a": "Many factors are the same: Higher cash flows, growth rates, or future sale values for the asset increase both the Present Value and the IRR. Lower values for these assumptions reduce both the Present Value and the IRR. One major difference is that the Discount Rate does NOT affect the IRR – because you are solving for the Discount Rate when you calculate the IRR! The whole point of the calculation is that you can compare the IRR to the Discount Rate to determine if the investment is worth your time and money. Another major difference is that the upfront price or “asking price” affects the IRR since it’s entered as a negative for the first value in the series, but it does not impact the Present Value. You should compare the Present Value to this upfront price to see if the investment is worth more or less than its price.", "tip": null, "tier": 2, "rank": 42, "links": [{"t": "400Q guide p.49", "h": "", "k": "ref"}, {"t": "Generalist PDF p.6", "h": "", "k": "ref"}, {"t": "BIWS module 01", "h": "", "k": "ref"}, {"t": "Red Book: Corporate Finance Theory p.45", "h": "", "k": "ref"}], "rbq": [], "n": 69, "so": 0}, {"id": "Q010", "src": "400", "section": "Finance Concepts", "q": "How do you use the IRR, Discount Rate, and Present Value to make investment decisions?", "a": "Normally, you calculate the IRR and compare it to the Discount Rate of a project, investment, or company. If the IRR exceeds the Discount Rate, investing makes sense; if not, you should not invest. Comparing the Present Value to the upfront price does the same thing: If the PV of the future cash flows exceeds this upfront price, invest; otherwise, do not invest.", "tip": null, "tier": 2, "rank": 43, "links": [{"t": "400Q guide p.49", "h": "", "k": "ref"}, {"t": "Generalist PDF p.6", "h": "", "k": "ref"}, {"t": "BIWS module 01", "h": "", "k": "ref"}, {"t": "Red Book p.54", "h": "", "k": "ref"}, {"t": "Red Book p.59", "h": "", "k": "ref"}], "rbq": ["What is the difference between WACC and IRR?", "Conceptually, what does the discount rate represent?"], "n": 70, "so": 0}, {"id": "Q014", "src": "400", "section": "Accounting – Concepts", "q": "How might the financial statements of a company in the U.K. or Germany be different from those of a company based in the U.S.?", "a": "Income Statements and Balance Sheets tend to be similar across different regions, but companies that use IFRS often start the Cash Flow Statement with something other than Net Income: Operating Income, Pre-Tax Income, or, if they are using the Direct Method, Cash Received and Cash Paid. IFRS-based companies also tend to place items in more “random” locations on the CFS, so you may need to rearrange it. Finally, the Operating Lease Expense is split into Interest and Depreciation elements under IFRS, but it’s recorded as a simple Rental Expense under U.S. GAAP.", "tip": null, "tier": 2, "rank": 45, "links": [{"t": "400Q guide p.51", "h": "", "k": "ref"}, {"t": "Generalist PDF p.8", "h": "", "k": "ref"}, {"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements & Accrual Concepts p.13", "h": "", "k": "ref"}], "rbq": [], "n": 71, "so": 1}, {"id": "Q015", "src": "400", "section": "Accounting – Concepts", "q": "How do you know when a revenue or expense line item should appear on the Income Statement?", "a": "To appear on the Income Statement, an item must: 1) Correspond 100% to the period shown – Revenue and expenses are based on the delivery of products or services, so an item delivered in Year 1 can count only in Year 1. And if a company buys a factory, it can’t list the entire purchase price on the Income Statement in one year because it will be useful for many years. It corresponds to more than just this period. 2) Affect the business income available to common shareholders (Net Income to Common) – If something does not affect the owners of the business, it should not appear on the Income Statement. The second point explains why Preferred Dividends appear on the Income Statement: They reduce the after-tax profits that could potentially go to common shareholders.", "tip": null, "tier": 2, "rank": 46, "links": [{"t": "400Q guide p.52", "h": "", "k": "ref"}, {"t": "Generalist PDF p.9", "h": "", "k": "ref"}, {"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book p.14", "h": "", "k": "ref"}, {"t": "Red Book p.21", "h": "", "k": "ref"}], "rbq": ["Walk me through the three financial statements.", "Thus, an increase in accounts payable is reflected as an inflow of cash on the cash flow statement. Which section of the cash flow statement captures interest e"], "n": 72, "so": 1}, {"id": "Q016", "src": "400", "section": "Accounting – Concepts", "q": "A company collects cash payments from customers for a monthly subscription service one year in advance. Why do companies do this, and what is the cash flow impact?", "a": "A company collects cash payments for a monthly service long in advance if it has the market and pricing power to do so. Because of the time value of money, it’s better to collect cash today rather than several months or a year into the future. This practice always boosts the company’s cash flow. It corresponds to Deferred Revenue, and on the CFS, an increase in Deferred Revenue is a positive entry that boosts cash flow. When this cash is finally recognized as Revenue, Deferred Revenue declines, which appears as a negative entry on the CFS.", "tip": null, "tier": 2, "rank": 47, "links": [{"t": "400Q guide p.52", "h": "", "k": "ref"}, {"t": "Generalist PDF p.9", "h": "", "k": "ref"}, {"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements & Accrual Concepts p.13", "h": "", "k": "ref"}], "rbq": [], "n": 73, "so": 1}, {"id": "Q024", "src": "400", "section": "Accounting – Concepts", "q": "What is Working Capital? What does it mean if it’s positive or negative?", "a": "The official definition of Working Capital is “Current Assets minus Current Liabilities,” but the more useful definition is: Working Capital = Current Operational Assets – Current Operational Liabilities “Operational” means that you exclude items such as Cash, Investments, and Debt that are related to the company’s capital structure, not its core business. This version is sometimes called Operating Working Capital. It may also include Long-Term Assets and Liabilities related to the company’s business operations (Long-Term Deferred Revenue is a good example). Working Capital tells you whether a company needs more in Operational Assets or Operational Liabilities to run its business, and how big the difference is. The meaning of positive or negative Working Capital depends on why it has that sign. For example, if the company has minimal Inventory and Receivables but a large Deferred Revenue balance, that is usually seen as positive and indicates high efficiency. But if Working Capital is positive because of a high Receivables balance due to difficulties collecting cash from customers, that is a bad sign.", "tip": "Follow-up trap: 'Is negative Working Capital bad?' No — for subscription/retail models (deferred revenue, payables float) it means customers and suppliers fund operations. Context beats sign.", "tier": 2, "rank": 48, "links": [{"t": "400Q guide p.56", "h": "", "k": "ref"}, {"t": "Generalist PDF p.13", "h": "", "k": "ref"}, {"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book p.28", "h": "", "k": "ref"}, {"t": "Red Book p.29", "h": "", "k": "ref"}], "rbq": ["Neither is operations-related, and both are thereby excluded in the calculation of NWC. ?", "Working Capital = Current Assets − Current Liabilities ?"], "n": 74, "so": 1}, {"id": "Q025", "src": "400", "section": "Accounting – Concepts", "q": "What does the Change in Working Capital mean?", "a": "The Change in Working Capital tells you if the company needs to spend in ADVANCE of its growth or if it generates more cash flow as a RESULT of its growth. It’s also a component of Free Cash Flow and contributes to the difference between “Cash Flow Generated” and Net Income in the period. The Change in Working Capital is often negative for retailers because they must spend money on Inventory before being able to sell and deliver products. But the Change in Working Capital is often positive for subscription companies that collect cash in advance because Deferred Revenue increases when they do that, which boosts cash flow. The Change in Working Capital could increase or decrease Free Cash Flow, which directly affects the company’s valuation.", "tip": "Sign rule: operating asset up → cash down; operating liability up → cash up. Say the rule, then apply it — MDs hear instantly whether you're reasoning or reciting.", "tier": 2, "rank": 49, "links": [{"t": "400Q guide p.57", "h": "", "k": "ref"}, {"t": "Generalist PDF p.14", "h": "", "k": "ref"}, {"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book p.28", "h": "", "k": "ref"}, {"t": "Red Book p.29", "h": "", "k": "ref"}], "rbq": ["AR. This company would need to find external financing as early as possible to stay afloat. What does change in net working capital tell you about a company's c", "Working Capital = Current Assets − Current Liabilities ?"], "n": 75, "so": 1}, {"id": "Q027", "src": "400", "section": "Accounting – Concepts", "q": "How do you calculate Return on Invested Capital (ROIC), and what does it tell you?", "a": "ROIC is defined as NOPAT / Average Invested Capital, where NOPAT (Net Operating Profit After Taxes) = Operating Income * (1 – Tax Rate), and Invested Capital = Common Shareholders’ Equity + Debt + Preferred Stock – Cash. (Various other adjustments and line items are possible; this is just the basic definition.) ROIC tells you how efficiently a company uses its capital from all sources (both external and internal) to generate after-tax profits from its core business. If two companies are in the same industry and have similar financial profiles, the one with the higher ROIC should be valued more highly because all the investor groups earn more for each $1.00 they invest in the company.", "tip": null, "tier": 2, "rank": 50, "links": [{"t": "400Q guide p.57", "h": "", "k": "ref"}, {"t": "Generalist PDF p.14", "h": "", "k": "ref"}, {"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book p.33", "h": "", "k": "ref"}], "rbq": ["What is the return on invested capital (ROIC) metric used to measure?", "Return on Invested Capital (ROIC) = NOPAT Invested Capital ?"], "n": 76, "so": 1}, {"id": "Q050", "src": "400", "section": "Equity Value & Enterprise Value – Concepts", "q": "What is the difference between “Current” and “Implied” Enterprise Value? Can you give a real-life example to explain it?", "a": "“Current” means that you are calculating the Enterprise Value based on the company’s current share price, share count, and Balance Sheet (subtract Cash, add Debt, add Preferred Stock, etc.). “Implied” means that you are using a valuation methodology, such as the DCF, to value the company and determine what you think it should be worth. Let’s say that you search for houses in real life and find one you like with a “list price” of $500K. However, you research the area, similar properties, and demographic trends, and believe it’s worth more like $450K. $500K is the Current Enterprise Value of the house, and $450K is the Implied Enterprise Value.", "tip": null, "tier": 2, "rank": 51, "links": [{"t": "400Q guide p.72", "h": "", "k": "ref"}, {"t": "Generalist PDF p.29", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book p.46", "h": "", "k": "ref"}], "rbq": ["What is the difference between enterprise value and equity value?"], "n": 77, "so": 3}, {"id": "Q051", "src": "400", "section": "Equity Value & Enterprise Value – Concepts", "q": "What is the difference between Basic Equity Value and Diluted Equity Value?", "a": "Basic Equity Value is Common Shares Outstanding * Current Share Price, while Diluted Equity Value includes the impact of dilutive securities, such as options, warrants, restricted stock units (RSUs), and convertible bonds; it equals Diluted Shares Outstanding * Current Share Price. Companies create and issue these dilutive securities to incentivize employees to stay at the company (and to raise funds, in the case of convertible bonds). You factor in these dilutive securities via different methods, such as the Treasury Stock Method for options and warrants and the “If Converted” method for convertible bonds. Diluted Equity Value more accurately measures what the company’s Net Assets are worth to the common shareholders.", "tip": null, "tier": 2, "rank": 52, "links": [{"t": "400Q guide p.73", "h": "", "k": "ref"}, {"t": "Generalist PDF p.30", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book p.45", "h": "", "k": "ref"}, {"t": "Red Book p.46", "h": "", "k": "ref"}], "rbq": ["What is the difference between enterprise value and equity value?", "Equity Value = Latest Closing Share Price × Total Diluted Shares Outstanding How do you calculate the fully diluted number of shares outstanding?"], "n": 78, "so": 3}, {"id": "Q052", "src": "400", "section": "Equity Value & Enterprise Value – Concepts", "q": "Let’s say you have a company’s Diluted Equity Value. How do you move from Equity Value to Enterprise Value?", "a": "At a basic level, Enterprise Value = Equity Value – Cash + Debt + Preferred Stock + Noncontrolling Interests, so you could say that in an interview and be fine. The more technical answer is that you should take Equity Value and subtract Non-Operating Assets and add Liability & Equity lines that represent other investor groups beyond the common shareholders. Examples of Non-Operating Assets include Cash, Investments, Equity Investments (Associate Companies), Assets Held for Sale, and Net Operating Losses. Examples of L&E lines representing other investor groups include Debt, Preferred Stock, Underfunded Pensions, Noncontrolling Interests, and sometimes Leases (it’s complicated).", "tip": null, "tier": 2, "rank": 53, "links": [{"t": "400Q guide p.73", "h": "", "k": "ref"}, {"t": "Generalist PDF p.30", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book p.45", "h": "", "k": "ref"}, {"t": "Red Book p.46", "h": "", "k": "ref"}], "rbq": ["What is the difference between enterprise value and equity value?", "Enterprise Value = Equity Value + Net Debt + Preferred Stock + Minority Interest How do you calculate equity value from enterprise value?"], "n": 79, "so": 3}, {"id": "Q056", "src": "400", "section": "Equity Value & Enterprise Value – Concepts", "q": "Can you give examples of company actions that affect Equity Value but NOT Enterprise Value, Enterprise Value but NOT Equity Value, and BOTH Enterprise Value and Equity Value?", "a": "This “compound question” tests how well you understand these concepts beyond simple definitions. There are many possible answers, but a few simple ones include: • Affects Equity Value But Not Enterprise Value: A company issues $100 of Stock and lets it sit in Cash on its Balance Sheet (Net Operating Assets are unchanged). • Affects Enterprise Value But Not Equity Value: A company issues $100 of Debt and uses it to buy a factory, boosting its Net PP&E (Net Operating Assets increase by $100). • Affects Both Equity Value and Enterprise Value: A company issues $100 of Stock and uses it to buy a factory, boosting its Net PP&E (Net Operating Assets increase by $100, and Common Shareholders’ Equity is also up by $100).", "tip": null, "tier": 2, "rank": 54, "links": [{"t": "400Q guide p.75", "h": "", "k": "ref"}, {"t": "Generalist PDF p.32", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book p.45", "h": "", "k": "ref"}, {"t": "Red Book p.46", "h": "", "k": "ref"}], "rbq": ["What is the difference between enterprise value and equity value?", "Enterprise Value = Equity Value + Net Debt + Preferred Stock + Minority Interest How do you calculate equity value from enterprise value?"], "n": 80, "so": 3}, {"id": "Q060", "src": "400", "section": "Equity Value & Enterprise Value – Calculations", "q": "This same company decides to use the $200 in Common Stock proceeds to acquire another business for $100 instead. How does everything change?", "a": "CSE increases by $200 from this issuance, so Eq Val increases by $200. Of this $200 in proceeds, $100 remains in Cash, and $100 is allocated to Acquired Assets from the other business. These Acquired Assets are Operating Assets, and no Operating Liabilities change, so NOA increases by $100. TEV, therefore, increases by $100.", "tip": null, "tier": 2, "rank": 55, "links": [{"t": "400Q guide p.77", "h": "", "k": "ref"}, {"t": "Generalist PDF p.34", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Relative Valuation p.65", "h": "", "k": "ref"}], "rbq": [], "n": 81, "so": 4}, {"id": "Q061", "src": "400", "section": "Equity Value & Enterprise Value – Calculations", "q": "What if the company uses that same $100 from the $200 of new Common Stock to acquire an Asset rather than an entire company?", "a": "CSE still increases by $200, so Eq Val is up by $200. If this Asset is considered “Operating” or “Core,” such as a factory, then NOA increases by $100, so TEV also increases by $100. If not – for example, the Asset is a short-term investment – then NOA does not change, and TEV stays the same.", "tip": null, "tier": 2, "rank": 56, "links": [{"t": "400Q guide p.77", "h": "", "k": "ref"}, {"t": "Generalist PDF p.34", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Relative Valuation p.65", "h": "", "k": "ref"}], "rbq": [], "n": 82, "so": 4}, {"id": "Q062", "src": "400", "section": "Equity Value & Enterprise Value – Calculations", "q": "A company issues $100 in Debt to purchase a new factory. How do Equity Value and Enterprise Value change?", "a": "CSE does not change because Debt, not Equity, is the financing source here. Therefore, Eq Val stays the same. The new factory is a Net Operating Asset, so NOA increases by $100, and TEV, therefore, also increases by $100. Alternatively, in the TEV formula, Equity Value stays the same, and Debt increases, so TEV goes up.", "tip": null, "tier": 2, "rank": 57, "links": [{"t": "400Q guide p.78", "h": "", "k": "ref"}, {"t": "Generalist PDF p.35", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book p.45", "h": "", "k": "ref"}, {"t": "Red Book p.46", "h": "", "k": "ref"}], "rbq": ["There is $300 in equity in this business, while the enterprise value is -$200. If a company raises $250 million in additional debt, how would its enterprise val", "Enterprise Value = Equity Value + Net Debt + Preferred Stock + Minority Interest How do you calculate equity value from enterprise value?"], "n": 83, "so": 4}, {"id": "Q063", "src": "400", "section": "Equity Value & Enterprise Value – Calculations", "q": "A company issues $100 of Common Stock and $100 of Preferred Stock and lets the proceeds sit in Cash. How do Equity Value and Enterprise Value change?", "a": "CSE increases by $100 due to the Common Stock issuances, so Eq Val is up by $100. The Preferred Stock issuance does not affect Common Shareholders’ Equity! Net Operating Assets are unchanged, so TEV stays the same. In the TEV formula, Equity Value is up by $100, Cash is $200 more negative, and Preferred Stock is up by $100, so TEV stays the same.", "tip": null, "tier": 2, "rank": 58, "links": [{"t": "400Q guide p.78", "h": "", "k": "ref"}, {"t": "Generalist PDF p.35", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book p.45", "h": "", "k": "ref"}, {"t": "Red Book p.46", "h": "", "k": "ref"}], "rbq": ["Enterprise Value = Equity Value + Net Debt + Preferred Stock + Minority Interest How do you calculate equity value from enterprise value?", "What is the difference between enterprise value and equity value?"], "n": 84, "so": 4}, {"id": "Q064", "src": "400", "section": "Equity Value & Enterprise Value – Calculations", "q": "This same company now issues $10 in Common Dividends and $10 in Preferred Dividends. What happens in JUST THIS STEP?", "a": "CSE decreases by $20 due to these Dividend issuances. Yes, both Common and Preferred Dividends flow into Common Shareholders’ Equity on the Balance Sheet. Therefore, Eq Val is down by $20. Net Operating Assets are unchanged, so TEV stays the same.", "tip": null, "tier": 2, "rank": 59, "links": [{"t": "400Q guide p.78", "h": "", "k": "ref"}, {"t": "Generalist PDF p.35", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Relative Valuation p.65", "h": "", "k": "ref"}], "rbq": [], "n": 85, "so": 4}, {"id": "Q065", "src": "400", "section": "Equity Value & Enterprise Value – Calculations", "q": "A company issues $150 of Debt and $50 of Common Stock to acquire $175 of PP&E and $25 of Short-Term Investments. How do Equity Value and Enterprise Value change?", "a": "CSE increases by $50 because of the Common Stock Issuance, so Eq Val increases by $50. The $175 of PP&E counts as an Operating Asset, and no Operating Liabilities change, so NOA increases by $175, and TEV also increases by $175.", "tip": null, "tier": 2, "rank": 60, "links": [{"t": "400Q guide p.79", "h": "", "k": "ref"}, {"t": "Generalist PDF p.36", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book p.45", "h": "", "k": "ref"}, {"t": "Red Book p.46", "h": "", "k": "ref"}], "rbq": ["There is $300 in equity in this business, while the enterprise value is -$200. If a company raises $250 million in additional debt, how would its enterprise val", "Enterprise Value = Equity Value + Net Debt + Preferred Stock + Minority Interest How do you calculate equity value from enterprise value?"], "n": 86, "so": 4}, {"id": "Q066", "src": "400", "section": "Equity Value & Enterprise Value – Calculations", "q": "A company issues $50 of Debt to buy a new factory. However, AFTER this purchase, its Enterprise Value increases by $100 rather than $50. Your co-worker claims it is because the company issued Debt to make this purchase, and Debt increases Enterprise Value. Is he correct?", "a": "No. The purchase method does not matter when determining how Enterprise Value changes. All that matters is how the Net Operating Assets change. The most likely explanation here is that the book value of this factory is $50, but its market value is $100 because market participants believe the Present Value of its future cash flows is closer to $100. Therefore, Enterprise Value increases by $100 rather than $50. The company effectively got a discount on a new asset.", "tip": null, "tier": 2, "rank": 61, "links": [{"t": "400Q guide p.79", "h": "", "k": "ref"}, {"t": "Generalist PDF p.36", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book p.45", "h": "", "k": "ref"}, {"t": "Red Book p.46", "h": "", "k": "ref"}], "rbq": ["Enterprise Value = Equity Value + Net Debt + Preferred Stock + Minority Interest How do you calculate equity value from enterprise value?", "There is $300 in equity in this business, while the enterprise value is -$200. If a company raises $250 million in additional debt, how would its enterprise val"], "n": 87, "so": 4}, {"id": "Q073", "src": "400", "section": "Valuation Methodologies", "q": "Which of the 3 main methodologies will produce the highest Implied Values?", "a": "This is a trick question because almost any methodology could produce the highest Implied Values depending on the industry, time period, and assumptions. That said, Precedent Transactions often produce higher Implied Values than Public Comps because of the control premium – the extra amount that buyers must pay to acquire sellers. But it’s tough to say how a DCF compares because it’s far more dependent on the long-term assumptions used. The safest answer is: “A DCF tends to produce the most variable output since it’s so dependent on your assumptions, and Precedent Transactions tend to produce higher values than the Public Comps because of the control premium.”", "tip": null, "tier": 2, "rank": 62, "links": [{"t": "400Q guide p.82", "h": "", "k": "ref"}, {"t": "Generalist PDF p.39", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book p.48", "h": "", "k": "ref"}], "rbq": ["DCF valuation. Which of the valuation methodologies is the most variable in terms of output?"], "n": 88, "so": 5}, {"id": "Q074", "src": "400", "section": "Valuation Methodologies", "q": "Which one should be worth more: A $500 million EBITDA healthcare company or a $500 million EBITDA industrials company?", "a": "Assume the growth rates and margins are the same. In all likelihood, the healthcare company will be worth more because healthcare is a less asset- intensive industry. That means the company’s CapEx and Working Capital requirements will be lower, and its cash flow will be higher. Healthcare, at least in some sectors, also tends to be more of a “growth industry” than industrials. The Discount Rate might also be higher for the healthcare company, but the lower asset intensity and higher expected growth rates could offset that. This answer is an extreme generalization, so you would need more information to give a detailed answer.", "tip": null, "tier": 2, "rank": 63, "links": [{"t": "400Q guide p.83", "h": "", "k": "ref"}, {"t": "Generalist PDF p.40", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Intrinsic Valuation p.54", "h": "", "k": "ref"}], "rbq": [], "n": 89, "so": 5}, {"id": "Q080", "src": "400", "section": "Valuation Methodologies", "q": "How do you interpret the Public Comps? What does it mean if the median multiples are above or below the ones of the company you’re valuing?", "a": "The interpretation depends on how your company's growth rates and margins compare to those of the comparable companies. Public Comps are most meaningful when the growth rates and margins are similar, but the multiples are different. This could mean that the company you’re valuing is mispriced. For example, maybe all the companies are growing at 10 – 15%, and they all have EBITDA margins of 10 – 15%. Your company also has growth rates and margins in these ranges. However, your company trades at TEV / EBITDA multiples of 6x to 8x, while the comparable companies all trade at multiples of 10x to 12x. This result could indicate that your company is undervalued since its multiples are lower, but its growth rates, margins, industry, and size are comparable.", "tip": null, "tier": 2, "rank": 64, "links": [{"t": "400Q guide p.85", "h": "", "k": "ref"}, {"t": "Generalist PDF p.42", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book p.53", "h": "", "k": "ref"}, {"t": "Red Book p.71", "h": "", "k": "ref"}], "rbq": ["How does valuing a private company differ from valuing a public company?", "If the market matters most when valuing public companies, do we even need a comps analysis?"], "n": 90, "so": 5}, {"id": "Q081", "src": "400", "section": "Valuation Methodologies", "q": "What is a Liquidation Valuation, and when is it useful and not so useful?", "a": "In a Liquidation Valuation, you value a company by estimating the market values of all its Assets, adding them up, and subtracting its Liabilities (i.e., you assume full repayment of all Liabilities based on the proceeds from the sale of all its Assets). It gives you the company’s Implied Equity Value because you’re valuing its Net Assets, not its Net Operating Assets. This methodology is useful for distressed companies because it tells you how much they might be worth if they liquidate and how much different lender groups might receive. It’s less useful for healthy, growing companies because it undervalues them significantly; assets like Net PP&E are always worth more to “going concern” companies.", "tip": null, "tier": 2, "rank": 65, "links": [{"t": "400Q guide p.86", "h": "", "k": "ref"}, {"t": "Generalist PDF p.43", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Intrinsic Valuation p.54", "h": "", "k": "ref"}], "rbq": [], "n": 91, "so": 5}, {"id": "Q082", "src": "400", "section": "Valuation Methodologies", "q": "How does a Dividend Discount Model (DDM) differ from a DCF?", "a": "In a DDM, rather than projecting Free Cash Flow, you project the company’s Dividends, usually based on a per-share figure or a percentage of Net Income. You then discount the Dividends to their Present Value using the Cost of Equity and add them up. To calculate the Terminal Value, you use an Equity Value-based multiple such as P / E, and you discount it to Present Value using the Cost of Equity. You add the PV of the Terminal Value to the PV of the Dividends to calculate the company’s Implied Equity Value rather than its Implied Enterprise Value (there’s no “bridge”), and you divide it by the diluted share count to get the company’s Implied Share Price. The DDM is essential in some industries, such as commercial banks and insurance, useful in other industries that pay regular dividends, such as utilities, and not so useful for most others.", "tip": null, "tier": 2, "rank": 66, "links": [{"t": "400Q guide p.86", "h": "", "k": "ref"}, {"t": "Generalist PDF p.43", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book p.59", "h": "", "k": "ref"}, {"t": "Red Book p.64", "h": "", "k": "ref"}], "rbq": ["DCF model to see if the increased FCF offsets the increased WACC. How does a dividend discount model (DDM) differ from a discounted cash flow model (DCF)?", "DCFs, but different from unlevered DCFs). What are the major drawbacks of the dividend discount model (DDM)?"], "n": 92, "so": 5}, {"id": "Q083", "src": "400", "section": "Valuation Methodologies", "q": "Why might you use an M&A Premiums analysis to value a company?", "a": "The M&A Premiums analysis applies only to public companies because you look at acquisitions of similar public companies and calculate the “premium” each buyer paid for each seller. For example, if the seller’s share price was $12.00 before the deal, and the buyer paid $15.00 per share, that represents a 25% premium. You then use these percentages to value your company. If the median premium in a set of deals is 20%, and your company’s share price is $10.00, it’s worth $12.00 per share. This analysis is typically a supplement to Precedent Transactions and gives you another way to value your company besides the standard multiples. But it’s also limited because M&A Premiums cannot indicate that a company is currently undervalued.", "tip": null, "tier": 2, "rank": 67, "links": [{"t": "400Q guide p.86", "h": "", "k": "ref"}, {"t": "Generalist PDF p.43", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book p.48", "h": "", "k": "ref"}], "rbq": ["Among the DCF , comparable companies analysis, and transaction comps, which approach yields the highest valuation?"], "n": 93, "so": 5}, {"id": "Q084", "src": "400", "section": "Valuation Methodologies", "q": "What are the advantages and disadvantages of a Sum-of-the-Parts Valuation?", "a": "The Sum-of-the-Parts methodology, in which you value each division of a company separately and add them to determine the company’s Implied Value, works well for conglomerates that have very different divisions (e.g., retail vs. transportation vs. digital media segments). The divisions operate in such different industries that it would be meaningless to value the company as a whole – no other public company would be comparable. But Sum-of-the-Parts also takes far more time and effort to set up because you must find comparable companies and transactions for each division, build a separate DCF for each division, and so on. Also, you might not have enough information to use it. Companies sometimes don’t disclose EBIT, CapEx, or Working Capital by division, and they may not disclose the corporate overhead expenses that must be counted in the final step.", "tip": null, "tier": 2, "rank": 68, "links": [{"t": "400Q guide p.87", "h": "", "k": "ref"}, {"t": "Generalist PDF p.44", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book p.50", "h": "", "k": "ref"}, {"t": "Red Book p.53", "h": "", "k": "ref"}], "rbq": ["When would it be appropriate to use a sum-of-the-parts approach to valuing a company?", "Could you define what the capital structure of a company represents?"], "n": 94, "so": 5}, {"id": "Q085", "src": "400", "section": "Valuation Methodologies", "q": "How do you set up an LBO valuation, and when is it useful?", "a": "You set up the LBO valuation by creating a leveraged buyout model in which a private equity firm acquires a company using Debt and Equity, holds it for several years, and then sells it for a certain multiple of EBITDA. Most private equity firms target an internal rate of return (IRR) in a specific range, so you work backward and determine the maximum price the PE firm could pay to achieve a targeted IRR. You could use the “Goal Seek” function in Excel to do this, and you solve for the purchase price based on constraints for the IRR, exit multiple, and Debt / Equity split. This methodology is most useful for screening LBO candidates; it can also help a company understand what PE firms vs. normal companies might pay for it.", "tip": null, "tier": 2, "rank": 69, "links": [{"t": "400Q guide p.87", "h": "", "k": "ref"}, {"t": "Generalist PDF p.44", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Intrinsic Valuation p.54", "h": "", "k": "ref"}], "rbq": [], "n": 95, "so": 5}, {"id": "Q088", "src": "400", "section": "Valuation Metrics and Multiples", "q": "Walk me through how you calculate EBIT and EBITDA for a public company.", "a": "With EBIT, you start with the company’s Operating Income on its Income Statement and then add back any non-recurring charges that have reduced Operating Income. With EBITDA, you do the same thing and then add Depreciation & Amortization from the company’s Cash Flow Statement to get the all-inclusive number (since D&A on the Income Statement may be embedded in other line items there).", "tip": null, "tier": 2, "rank": 70, "links": [{"t": "400Q guide p.89", "h": "", "k": "ref"}, {"t": "Generalist PDF p.46", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book p.68", "h": "", "k": "ref"}], "rbq": ["If the industry is cyclical (or seasonal), did the transaction close at a high or low point in the cycle?", "When valuing a company using multiples, what are the trade-offs of using L TM vs. forward multiples?"], "n": 96, "so": 6}, {"id": "Q095", "src": "400", "section": "Valuation Metrics and Multiples", "q": "How do you calculate and use Unlevered FCF and Levered FCF?", "a": "Unlevered Free Cash Flow equals Net Operating Profit After Taxes (NOPAT) + D&A and sometimes other non-cash adjustments +/- Change in Working Capital – CapEx. Levered Free Cash Flow equals Net Income to Common + D&A and sometimes other non-cash adjustments +/- Change in Working Capital – CapEx +/- Net Change in Debt. You normally use UFCF in DCF-based valuations because it lets you evaluate a company independently of its capital structure, which produces more consistent numbers. LFCF is far less widely used (and people disagree about the basic definition), but it is more common in certain specialized contexts/industries (e.g., equity REITs).", "tip": null, "tier": 2, "rank": 71, "links": [{"t": "400Q guide p.91", "h": "", "k": "ref"}, {"t": "Generalist PDF p.48", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Relative Valuation p.65", "h": "", "k": "ref"}], "rbq": [], "n": 97, "so": 6}, {"id": "Q103", "src": "400", "section": "Discounted Cash Flow (DCF) – Assumptions and Analysis", "q": "How do you move from Revenue to Free Cash Flow in a DCF?", "a": "First, confirm that the interviewer is asking for Unlevered Free Cash Flow (AKA Free Cash Flow to Firm). If so: Subtract COGS and Operating Expenses from Revenue to get Operating Income (EBIT). Then, multiply Operating Income by (1 – Tax Rate), add back Depreciation & Amortization, and factor in the Change in Working Capital (which could be either positive or negative). If Working Capital increases, the Change in WC is negative, and if it decreases, the Change in WC is positive. Finally, subtract Capital Expenditures to calculate Unlevered Free Cash Flow.", "tip": null, "tier": 2, "rank": 72, "links": [{"t": "400Q guide p.95", "h": "", "k": "ref"}, {"t": "Generalist PDF p.52", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book p.49", "h": "", "k": "ref"}, {"t": "Red Book p.50", "h": "", "k": "ref"}], "rbq": ["What does free cash flow (FCF) represent?", "Define free cash flow yield and compare it to dividend yield and P/E ratios."], "n": 98, "so": 7}, {"id": "Q105", "src": "400", "section": "Discounted Cash Flow (DCF) – Assumptions and Analysis", "q": "Suppose you build a Levered DCF instead of an Unlevered DCF. What changes?", "a": "First, you use Levered FCF instead of Unlevered FCF, which means you deduct the Net Interest Expense from EBIT before multiplying it by (1 – Tax Rate); you also factor in new Debt issuances and Debt principal repayments, which could make a net positive or negative impact. Second, you use the Cost of Equity rather than WACC for the Discount Rate because Levered FCF is available only to the common shareholders. Third, you calculate the Terminal Value using an Equity Value-based multiple such as P / E or Equity Value / Levered FCF. Finally, there is no “bridge” at the end because in a Levered DCF, you calculate the company’s Implied Equity Value directly based on the PV of the cash flows and the Terminal Value.", "tip": null, "tier": 2, "rank": 73, "links": [{"t": "400Q guide p.96", "h": "", "k": "ref"}, {"t": "Generalist PDF p.53", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book p.55", "h": "", "k": "ref"}, {"t": "Red Book p.58", "h": "", "k": "ref"}], "rbq": ["FCFE = Cash from Operations – Capex – Debt Principal Payment What is the difference between the unlevered DCF and the levered DCF?", "What is the appropriate cost of capital when doing an unlevered DCF?"], "n": 99, "so": 7}, {"id": "Q106", "src": "400", "section": "Discounted Cash Flow (DCF) – Assumptions and Analysis", "q": "Will you get the same results from an Unlevered DCF and a Levered DCF?", "a": "No. The simplest explanation is that an Unlevered DCF does not directly factor the Cost of Debt into the FCF projections, while a Levered FCF does. The Unlevered DCF indirectly accounts for it via the WACC calculation, but it won’t be equivalent to the Levered version. That alone creates differences, but the more volatile cash flow in a Levered DCF (due to the Change in Net Debt) also plays a role. It’s difficult to pick equivalent assumptions, and it’s not worth considering because almost no one uses the Levered DCF in real life.", "tip": null, "tier": 2, "rank": 74, "links": [{"t": "400Q guide p.96", "h": "", "k": "ref"}, {"t": "Generalist PDF p.53", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book p.55", "h": "", "k": "ref"}, {"t": "Red Book p.58", "h": "", "k": "ref"}], "rbq": ["FCFE = Cash from Operations – Capex – Debt Principal Payment What is the difference between the unlevered DCF and the levered DCF?", "What is the appropriate cost of capital when doing an unlevered DCF?"], "n": 100, "so": 7}, {"id": "Q108", "src": "400", "section": "Discounted Cash Flow (DCF) – Assumptions and Analysis", "q": "What is the logic behind the main components of Unlevered Free Cash Flow? For example, why does it include the Change in Working Capital but not the Net Interest Expense?", "a": "Unlevered FCF reflects the core, recurring line items available to ALL investor groups. That’s because Unlevered FCF corresponds to Enterprise Value, which represents the value of the company’s core business available to all the investor groups. So, if an item is NOT recurring, NOT related to the company’s core business, or NOT available to all investor groups, you ignore it in UFCF. The Change in Working Capital is recurring, related to the core business, and available to all the investor groups, so it is included. The Net Interest Expense is related to the company’s financing, not its core business, and is only available to the lenders, so it is not included.", "tip": "Structure the answer as: start with EBIT (capital-structure-neutral), tax it, add back non-cash D&A, subtract CapEx and the Change in WC — and say WHY each adjustment exists. The 'why' is what separates associate answers from analyst answers.", "tier": 2, "rank": 75, "links": [{"t": "400Q guide p.97", "h": "", "k": "ref"}, {"t": "Generalist PDF p.54", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book: Intrinsic Valuation p.54", "h": "", "k": "ref"}], "rbq": [], "n": 101, "so": 7}, {"id": "Q109", "src": "400", "section": "Discounted Cash Flow (DCF) – Assumptions and Analysis", "q": "What’s the relationship between subtracting an expense in the FCF projections and the Enterprise-Value-to-Equity-Value “bridge” at the end of the DCF?", "a": "If you subtract a certain expense in FCF, then you ignore its corresponding Liability in the “bridge” at the end (i.e., the place where you add Cash, subtract Debt, etc., to move from Enterprise Value to Equity Value). But if you ignore or exclude a certain expense, you should subtract its corresponding Liability in the bridge. The perfect example is Debt: In an Unlevered DCF, you ignore the Interest Expense, so you subtract the Debt as a Liability in the bridge.", "tip": null, "tier": 2, "rank": 76, "links": [{"t": "400Q guide p.97", "h": "", "k": "ref"}, {"t": "Generalist PDF p.54", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book: Intrinsic Valuation p.54", "h": "", "k": "ref"}], "rbq": [], "n": 102, "so": 7}, {"id": "Q121", "src": "400", "section": "Discounted Cash Flow (DCF) – Assumptions and Analysis", "q": "Let’s say that the central bank has just raised short-term interest rates from 2% to 5% to fight inflation. How will this affect the WACC and the DCF valuation of a company?", "a": "Most likely, WACC will increase, and the company’s Implied Value from the DCF will decrease because the Discount Rate is now higher due to a higher Risk-Free Rate. A higher Risk-Free Rate increases both the Cost of Equity and the Cost of Debt, as the Cost of Equity is based on Risk-Free Rate + Equity Risk Premium * Levered Beta, and the Cost of Debt is based on the cost of issuing additional Debt today. However, higher short-term rates do not always translate into higher long-term government bond yields, so we hedged this answer with the “most likely” part. If the 10-year yield you’re using for the Risk-Free Rate stays the same, and the other parameters also stay the same, nothing changes.", "tip": null, "tier": 2, "rank": 78, "links": [{"t": "400Q guide p.102", "h": "", "k": "ref"}, {"t": "Generalist PDF p.59", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book: Intrinsic Valuation p.54", "h": "", "k": "ref"}], "rbq": [], "n": 103, "so": 7}, {"id": "Q125", "src": "400", "section": "Discounted Cash Flow (DCF) – Assumptions and Analysis", "q": "Two companies have the same financial profiles and operate in the same industry, but one is in an emerging market, and the other is in a developed market. How will their DCF outputs differ?", "a": "The one in the emerging market should have a higher Discount Rate and, therefore, a lower Implied Value because the geopolitical risk, equity risk, and credit default risk are all higher. This might not always be true if the emerging market company is also growing more quickly, as the higher growth could offset the higher Discount Rate – but the question says these companies have “the same financial profiles.”", "tip": null, "tier": 2, "rank": 79, "links": [{"t": "400Q guide p.103", "h": "", "k": "ref"}, {"t": "Generalist PDF p.60", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book: Intrinsic Valuation p.54", "h": "", "k": "ref"}], "rbq": [], "n": 104, "so": 7}, {"id": "Q129", "src": "400", "section": "Discounted Cash Flow (DCF) – The Discount Rate", "q": "If a company operates in the EU, U.S., and U.K., what should you use for its Risk-Free Rate?", "a": "You should use the appropriate yield on the government bonds denominated in the currency of the company’s cash flows. So, if the company reports its financials in USD, you might use the yield on 10-year U.S. Treasuries; if it reports them in EUR or GBP, you might use the yield on 10-year bonds issued by the European Central Bank or the Bank of England.", "tip": null, "tier": 2, "rank": 80, "links": [{"t": "400Q guide p.105", "h": "", "k": "ref"}, {"t": "Generalist PDF p.62", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book p.56", "h": "", "k": "ref"}], "rbq": ["How do you determine the risk-free rate?", "US treasury notes the preferred proxy for the risk-free rate for US-based companies. What effect does a low-interest-rate environment have on DCF-derived valuat"], "n": 105, "so": 8}, {"id": "Q130", "src": "400", "section": "Discounted Cash Flow (DCF) – The Discount Rate", "q": "How do you calculate the Equity Risk Premium for a multinational company operating in many geographies?", "a": "You might take the percentage of revenue earned in each country, multiply it by the ERP for that country’s stock market, and then add the terms to get the weighted average ERP. To calculate the ERP in each market, you would calculate the average annualized returns of the country’s stock market vs. the Risk-Free Rate in that country over the long term. If that is not feasible or the data does not exist, you could also take the U.S. stock market ERP and add a default spread to represent the additional risk of the other country.", "tip": null, "tier": 2, "rank": 81, "links": [{"t": "400Q guide p.105", "h": "", "k": "ref"}, {"t": "Generalist PDF p.62", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book: Corporate Finance Theory p.45", "h": "", "k": "ref"}], "rbq": [], "n": 106, "so": 8}, {"id": "Q133", "src": "400", "section": "Discounted Cash Flow (DCF) – The Discount Rate", "q": "How do you calculate WACC, and why does it pair with Unlevered Free Cash Flow?", "a": "The formula for WACC is simple: WACC = Cost of Equity * % Equity + Cost of Debt * (1 – Tax Rate) * % Debt + Cost of Preferred Stock * % Preferred Stock There is some disagreement around the different ways to calculate each component, but the basic formula is straightforward. It pairs with UFCF because they both represent all the investors in the company. It is not “capital structure-neutral” because no Discount Rate can be. Each investor group affects the others!", "tip": null, "tier": 2, "rank": 82, "links": [{"t": "400Q guide p.106", "h": "", "k": "ref"}, {"t": "Generalist PDF p.63", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book p.49", "h": "", "k": "ref"}, {"t": "Red Book p.55", "h": "", "k": "ref"}], "rbq": ["What is the appropriate cost of capital when doing an unlevered DCF?", "What does free cash flow (FCF) represent?"], "n": 107, "so": 8}, {"id": "Q137", "src": "400", "section": "Merger Models – Concepts", "q": "Why might an M&A deal be accretive or dilutive?", "a": "A deal is accretive if the extra Pre-Tax Income from a Seller exceeds the cost of the acquisition in the form of the Foregone Interest on Cash, Interest Paid on New Debt, and New Shares Issued. For example, if the Seller contributes $100 in Pre-Tax Income, but the deal costs the Buyer only $70 in additional Interest Expense, and the Buyer doesn’t issue any new shares, the deal will be accretive because the Buyer’s Earnings per Share (EPS) will increase. A deal will be dilutive if the opposite happens. For example, if the Seller contributes $100 in Pre-Tax Income, but the deal costs the Buyer $130 in additional Interest Expense, and its share count remains the same, its EPS will decrease.", "tip": null, "tier": 2, "rank": 83, "links": [{"t": "400Q guide p.108", "h": "", "k": "ref"}, {"t": "Generalist PDF p.65", "h": "", "k": "ref"}, {"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book p.81", "h": "", "k": "ref"}, {"t": "Red Book p.83", "h": "", "k": "ref"}], "rbq": ["In all-stock deals, how can you determine whether an acquisition will be accretive or dilutive?", "EPS – which is ultimately the question being answered: \"Will this deal be accretive or dilutive?"], "n": 108, "so": 9}, {"id": "Q138", "src": "400", "section": "Merger Models – Concepts", "q": "How can you tell whether an M&A deal will be accretive or dilutive?", "a": "You compare the Weighted Cost of Acquisition to the Seller’s Yield at the Purchase Price. • Cost of Cash = Foregone Interest Rate on Cash * (1 – Buyer’s Tax Rate) • Cost of Debt = Interest Rate on New Debt * (1 – Buyer’s Tax Rate) • Cost of Stock = Reciprocal of the Buyer’s P / E multiple, i.e., Net Income / Equity Value. • Seller’s Yield = Reciprocal of the Seller’s P / E multiple, calculated using the Purchase Equity Value. Weighted Cost of Acquisition = % Cash Used * Cost of Cash + % Debt Used * Cost of Debt + % Stock Used * Cost of Stock. If the Weighted Cost is less than the Seller’s Yield, the deal will be accretive; if the Weighted Cost is greater than the Seller’s Yield, the deal will be dilutive.", "tip": "The two rules: 100% stock — accretive if acquirer P/E > target purchase P/E. Cash/debt — accretive if target earnings yield (1 ÷ purchase P/E) > after-tax cost of cash/debt. Give the rule, then the caveat: ignores synergies and write-up D&A.", "tier": 2, "rank": 84, "links": [{"t": "400Q guide p.109", "h": "", "k": "ref"}, {"t": "Generalist PDF p.66", "h": "", "k": "ref"}, {"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book p.81", "h": "", "k": "ref"}, {"t": "Red Book p.83", "h": "", "k": "ref"}], "rbq": ["In all-stock deals, how can you determine whether an acquisition will be accretive or dilutive?", "EPS – which is ultimately the question being answered: \"Will this deal be accretive or dilutive?"], "n": 109, "so": 9}, {"id": "Q140", "src": "400", "section": "Merger Models – Concepts", "q": "How do you determine the Purchase Price in an M&A deal?", "a": "If the Seller is public, you assume a premium to the Seller’s current share price based on the average premiums for similar deals in the market (usually between 10% and 30%). You can also use the DCF, Public Comps, and other valuation methodologies to cross-check this figure. The Purchase Price for private Sellers is based on the standard valuation methodologies, and you usually link it to a multiple of EBITDA, EBIT, or Revenue since private companies don’t have easy-to-determine share prices. If the Buyer expects to realize significant Synergies, it is often willing to pay a higher premium for the Seller because the Present Value of the Synergies might exceed this premium.", "tip": null, "tier": 2, "rank": 85, "links": [{"t": "400Q guide p.110", "h": "", "k": "ref"}, {"t": "Generalist PDF p.67", "h": "", "k": "ref"}, {"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book p.74", "h": "", "k": "ref"}, {"t": "Red Book p.82", "h": "", "k": "ref"}], "rbq": ["What does purchase consideration refer to in M&A?", "Describe a recent M&A deal."], "n": 110, "so": 9}, {"id": "Q141", "src": "400", "section": "Merger Models – Concepts", "q": "What is the “true price” in an M&A deal: The Purchase Equity Value or Purchase Enterprise Value? Why?", "a": "The “true price” is the Purchase Enterprise Value (or something close to it) because that represents what the Buyer pays all the Seller’s investors for its core assets. However, the Purchase Enterprise Value is not necessarily what the Buyer pays in “upfront capital.” Also, the Purchase Equity Value often drives the Cash, Debt, and Stock used to fund a deal. The Purchase Equity Value is also what the selling shareholders receive in the deal. Therefore, even though the Purchase Enterprise Value is the true price, both metrics are important in M&A analysis.", "tip": null, "tier": 2, "rank": 86, "links": [{"t": "400Q guide p.110", "h": "", "k": "ref"}, {"t": "Generalist PDF p.67", "h": "", "k": "ref"}, {"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book p.82", "h": "", "k": "ref"}, {"t": "Red Book p.83", "h": "", "k": "ref"}], "rbq": ["What does purchase consideration refer to in M&A?", "How do you calculate the transaction value?"], "n": 111, "so": 9}, {"id": "Q145", "src": "400", "section": "Merger Models – Concepts", "q": "What’s the purpose of a Purchase Price Allocation schedule in a merger model?", "a": "The main purpose is to estimate the Goodwill created in a deal. Goodwill exists because the Purchase Equity Value in deals almost always exceeds the Seller’s Common Shareholders’ Equity (CSE). When this happens, the Combined Balance Sheet will go out of balance because the Seller’s CSE is written down to $0, but the total amount of Cash, Debt, and Stock used in the deal is greater than the CSE that was written down. Goodwill exists to “plug the gap” and ensure the Balance Sheet balances. So, you estimate the new Goodwill with this schedule, factor in write-ups of Assets such as PP&E and Intangibles, and include other acquisition effects such as the creation of a new Deferred Tax Liability and changes to the existing Deferred Tax items.", "tip": null, "tier": 2, "rank": 87, "links": [{"t": "400Q guide p.112", "h": "", "k": "ref"}, {"t": "Generalist PDF p.69", "h": "", "k": "ref"}, {"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book: M&A Concepts p.73", "h": "", "k": "ref"}], "rbq": [], "n": 112, "so": 9}, {"id": "Q146", "src": "400", "section": "Merger Models – Concepts", "q": "Why do Deferred Tax Liabilities get created in many M&A deals?", "a": "A Deferred Tax Liability, or DTL, represents the expectation that Cash Taxes will exceed Book Taxes in the future. DTLs get created because the Depreciation & Amortization on Asset Write-Ups is not deductible for cash-tax purposes in a Stock Purchase (i.e., a standard M&A deal where the Buyer purchases all the Seller’s common shares and acquires everything the Seller has). As a result, the Buyer will pay more in Cash Taxes than Book Taxes until the Write-Ups are fully depreciated/amortized. Each time the Buyer pays more in Cash Taxes than Book Taxes, the DTL decreases until it eventually reaches 0.", "tip": null, "tier": 2, "rank": 88, "links": [{"t": "400Q guide p.112", "h": "", "k": "ref"}, {"t": "Generalist PDF p.69", "h": "", "k": "ref"}, {"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book p.86", "h": "", "k": "ref"}, {"t": "Red Book p.87", "h": "", "k": "ref"}], "rbq": ["Why are deferred tax liabilities (DTLs) created in transactions?", "An M&A deal has an adjustment for a deferred revenue write-down. Why would this occur?"], "n": 113, "so": 9}, {"id": "Q148", "src": "400", "section": "Merger Models – Concepts", "q": "Why do many merger models tend to overstate the impact of Synergies?", "a": "First, many merger models do not include the costs associated with Revenue Synergies. Even if the Buyer or Seller can sell more products after the deal closes, those extra units cost something to produce and deliver, so you must include the extra COGS and OpEx. Second, realizing Synergies takes time. Even if a company expects $10 million in “long-term synergies,” it won’t realize all of them in Year 1; it might take several years, and the percentage realized will increase gradually over time. Finally, realizing Synergies costs money. There will always be “integration costs” associated with a deal, and certain types of Synergies, such as headcount reductions, will cost even more due to severance costs.", "tip": null, "tier": 2, "rank": 89, "links": [{"t": "400Q guide p.113", "h": "", "k": "ref"}, {"t": "Generalist PDF p.70", "h": "", "k": "ref"}, {"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book: M&A Concepts p.73", "h": "", "k": "ref"}], "rbq": [], "n": 114, "so": 9}, {"id": "Q163", "src": "400", "section": "LBO Models – Concepts", "q": "Which assumptions impact a leveraged buyout the most?", "a": "The Purchase Price and Exit assumptions, usually based on EBITDA multiples, impact a leveraged buyout the most. A lower Purchase Multiple results in higher returns, and a higher Exit Multiple results in higher returns. After those, the Debt used, based on a percentage of the Purchase Price or a multiple of the initial EBITDA, makes the biggest impact. If the deal performs well, more leverage will make the numbers even better, and vice versa if it does not perform well. Next, the company’s revenue growth, EBITDA margins, and cash flow profile also make an impact because they influence the exit proceeds and the Debt repaid in the holding period. Finally, the interest rates, principal repayments, and other terms attached to the Debt may make a difference, but they tend to be less significant than the other drivers.", "tip": null, "tier": 2, "rank": 90, "links": [{"t": "400Q guide p.120", "h": "", "k": "ref"}, {"t": "Generalist PDF p.77", "h": "", "k": "ref"}, {"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "Red Book p.91", "h": "", "k": "ref"}, {"t": "Red Book p.99", "h": "", "k": "ref"}], "rbq": ["What is a leveraged buyout (LBO)?", "What is a management buyout (MBO)?"], "n": 115, "so": 11}, {"id": "Q164", "src": "400", "section": "LBO Models – Concepts", "q": "How do you select the Purchase Multiple and Exit Multiple in an LBO model?", "a": "Typically, you assume a share-price premium for public companies and check the implied Purchase Multiple against the valuation methodologies to ensure it’s reasonable. For example, you might assume a 30% premium to the company’s share price of $10.00, which implies an EBITDA multiple of 10x. For private companies, you determine the Purchase Multiple via the standard valuation methodologies (comparable companies, precedent transactions, and the DCF analysis). The Exit Multiple is often close to the Purchase Multiple but could be higher or lower depending on the company’s growth rates, margins, and ROIC upon exit. In robust models, you always sensitize these assumptions and consider the outcomes across different ranges.", "tip": null, "tier": 2, "rank": 91, "links": [{"t": "400Q guide p.121", "h": "", "k": "ref"}, {"t": "Generalist PDF p.78", "h": "", "k": "ref"}, {"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "Red Book p.97", "h": "", "k": "ref"}, {"t": "Red Book p.105", "h": "", "k": "ref"}], "rbq": ["IRRs are presented in a range of various exit scenarios. If you had to choose two variables to sensitize in an LBO model, which ones would you pick?", "DCF and comps approaches. When analyzing the viability of undertaking an LBO, how do private equity firms estimate the company's value in the exit year?"], "n": 116, "so": 11}, {"id": "Q166", "src": "400", "section": "LBO Models – Concepts", "q": "Walk me through the Free Cash Flow calculation in an LBO model. How is it different from EBITDA, and why do we need both?", "a": "In an LBO, Free Cash Flow = Net Income + D&A +/- Change in Working Capital – CapEx. You could also calculate it starting from EBITDA like this: Free Cash Flow = EBITDA – Net Interest Expense – Cash Taxes +/- Change in Working Capital – CapEx. FCF differs from EBITDA because EBITDA ignores Interest Income, Interest Expense, Taxes, Working Capital, and Capital Expenditures – but all these items affect a company’s cash flow in real life and, therefore, how much Debt it can repay. EBITDA is a quick proxy for cash flow from operations for the core business, ignoring capital structure, but FCF is “the real thing” and factors in the capital structure because of the Net Interest Expense deduction.", "tip": null, "tier": 2, "rank": 92, "links": [{"t": "400Q guide p.121", "h": "", "k": "ref"}, {"t": "Generalist PDF p.78", "h": "", "k": "ref"}, {"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "Red Book p.104", "h": "", "k": "ref"}, {"t": "Red Book p.105", "h": "", "k": "ref"}], "rbq": ["EBITDA margin. What are the capex and net working capital requirement considerations for a private equity firm looking at a potential investment?", "What is the purpose of the minimum cash balance in an LBO model?"], "n": 117, "so": 11}, {"id": "Q167", "src": "400", "section": "LBO Models – Concepts", "q": "Explain how a company’s Free Cash Flow and the Debt principal it can repay in an LBO are related.", "a": "A company’s repayment of
