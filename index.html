 Debt principal is related to its Free Cash Flow, but it is not the same thing because all companies have Minimum Cash requirements and start with different amounts of Cash in each period. The general formula is: Cash Flow Available for Optional Debt Repayment = Beginning Cash + Free Cash Flow – Minimum Cash – Mandatory Debt Repayments. You can ignore the last part if there are no required principal repayments.", "tip": null, "tier": 2, "rank": 93, "links": [{"t": "400Q guide p.122", "h": "", "k": "ref"}, {"t": "Generalist PDF p.79", "h": "", "k": "ref"}, {"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "Red Book p.92", "h": "", "k": "ref"}, {"t": "Red Book p.108", "h": "", "k": "ref"}], "rbq": ["What are the main levers in an LBO that drive returns?", "This question is specifically regarding the purchase accounting on the closing date of the transaction. What does a cash sweep refer to in LBO modeling?"], "n": 118, "so": 11}, {"id": "Q168", "src": "400", "section": "LBO Models – Concepts", "q": "What are the different exit strategies in an LBO? Which one do most PE firms prefer?", "a": "The main strategies are M&A and IPO exits. In an M&A exit, the PE firm sells the company to another PE firm or a normal company in the industry (called a “strategic”). In an IPO exit, the PE firm takes the company public and sells off its stake gradually over time (selling the entire stake upfront in the IPO would be a huge negative signal). In certain emerging and frontier markets, some PE firms also use Dividend Recapitalization strategies to “exit” by having the company issue ever-increasing Dividends, but this works only if the company’s Dividend Yield reaches very high levels. PE firms almost always prefer M&A exits because they are clean and simple and result in immediate proceeds. IPO exits take longer and carry more risk because of the need to sell the stake over several years.", "tip": null, "tier": 2, "rank": 94, "links": [{"t": "400Q guide p.122", "h": "", "k": "ref"}, {"t": "Generalist PDF p.79", "h": "", "k": "ref"}, {"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "Red Book p.99", "h": "", "k": "ref"}, {"t": "Red Book p.105", "h": "", "k": "ref"}], "rbq": ["DCF and comps approaches. When analyzing the viability of undertaking an LBO, how do private equity firms estimate the company's value in the exit year?", "When might a PE firm prefer to use term loans rather than subordinated notes in an LBO?"], "n": 119, "so": 11}, {"id": "Q169", "src": "400", "section": "LBO Models – Concepts", "q": "How could a private equity firm boost its returns in an LBO?", "a": "The main returns drivers are Multiple Expansion, EBITDA Growth, and Debt Paydown and Cash Generation, so a PE firm could boost its returns by improving any of these. In practice, this means: • Multiple Expansion – Reduce the Purchase Multiple (e.g., by negotiating a lower price) or increase the Exit Multiple (likely via higher ROIC or growth rates). • EBITDA Growth – Increase the company’s revenue growth rate or boost its EBITDA margins by cutting expenses. • Debt Paydown and Cash Generation – Boost Free Cash Flow by reducing CapEx and Working Capital requirements, cutting expenses, and aiming for higher growth. In some cases, using more initial Debt could improve returns from this source (e.g., if the company comfortably repays all the initial Debt currently).", "tip": null, "tier": 2, "rank": 95, "links": [{"t": "400Q guide p.123", "h": "", "k": "ref"}, {"t": "Generalist PDF p.80", "h": "", "k": "ref"}, {"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "Red Book p.92", "h": "", "k": "ref"}, {"t": "Red Book p.101", "h": "", "k": "ref"}], "rbq": ["What are the main levers in an LBO that drive returns?", "If a business that underwent an LBO has been operating as intended, why does the private equity firm not hold on to the investment for a longer duration (e.g., "], "n": 120, "so": 11}, {"id": "Q170", "src": "400", "section": "LBO Models – Concepts", "q": "How do you determine how much Debt a PE firm might use in an LBO and how many tranches there would be?", "a": "You look at recent, similar LBOs and use the median Debt / EBITDA levels from them as references; you could also look at highly leveraged public companies in the industry and check their Debt / EBITDA levels. For example, if the median Debt / EBITDA for LBOs has been 5x, with 2x Term Loans and 3x Subordinated Notes, you might use these figures for your deal. Then, you would test these assumptions by projecting the company’s leverage and coverage ratios (Debt / EBITDA and EBITDA / Interest) over time. If they hold up reasonably well – e.g., the company’s interest coverage ratio always stays above 2x – you might use the original numbers. If not, you would try different assumptions.", "tip": null, "tier": 2, "rank": 96, "links": [{"t": "400Q guide p.123", "h": "", "k": "ref"}, {"t": "Generalist PDF p.80", "h": "", "k": "ref"}, {"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "Red Book p.92", "h": "", "k": "ref"}, {"t": "Red Book p.99", "h": "", "k": "ref"}], "rbq": ["Thus, the increased leverage enables the firm to reach its returns threshold easier. What is the typical capital structure prevalent in LBO transactions?", "When might a PE firm prefer to use term loans rather than subordinated notes in an LBO?"], "n": 121, "so": 11}, {"id": "Q171", "src": "400", "section": "LBO Models – Concepts", "q": "Can you describe the different types of Debt a PE firm might use in a leveraged buyout?", "a": "Broadly speaking, Debt is split into Secured Debt and Unsecured Debt, which some people also label “Bank Debt” and “High-Yield Debt” or “Senior Debt” and “Junior Debt.” Secured Debt consists of Term Loans and Revolvers, is backed by collateral, tends to have lower, floating interest rates, may have amortization (required principal repayments), and uses maintenance covenants such as limits on the company’s Debt / EBITDA and EBITDA / Interest. Early principal repayment is allowed, maturity periods tend to be shorter (~5 years up to 10 years), and the investors tend to be more conservative. Unsecured Debt consists of Senior Notes, Subordinated Notes, and Mezzanine and is not backed by collateral; interest rates tend to be higher and fixed rather than floating, there is no amortization, and it uses incurrence covenants (the company is restricted from taking specific actions, such as selling certain assets). Early repayment is not allowed, maturity periods tend to be longer (8-10+ years), and the investors tend to be hedge funds, merchant banks, and mezzanine funds.", "tip": null, "tier": 2, "rank": 97, "links": [{"t": "400Q guide p.124", "h": "", "k": "ref"}, {"t": "Generalist PDF p.81", "h": "", "k": "ref"}, {"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "Red Book p.91", "h": "", "k": "ref"}, {"t": "Red Book p.97", "h": "", "k": "ref"}], "rbq": ["What is a leveraged buyout (LBO)?", "What is a management buyout (MBO)?"], "n": 122, "so": 11}, {"id": "Q172", "src": "400", "section": "LBO Models – Concepts", "q": "How do you use a Revolver in an LBO model?", "a": "You draw on the Revolver when the company doesn’t have enough cash flow to make its Mandatory Debt Repayments while maintaining its Minimum Cash balance. For example, let’s say the Beginning Cash is $50, the Mandatory Repayments are $100, the FCF is $75, and the Minimum Cash is $100. In this case, Cash Flow Available for Debt Repayment = $50 + $75 – $100 – $100 = ($75). Therefore, the company must draw on its Revolver for $75 to boost its cash flow to make the $100 in Mandatory Repayments while maintaining the $100 in Minimum Cash. The company will then pay interest and fees on this additional borrowing and repay the Revolver balance as soon as possible.", "tip": null, "tier": 2, "rank": 98, "links": [{"t": "400Q guide p.124", "h": "", "k": "ref"}, {"t": "Generalist PDF p.81", "h": "", "k": "ref"}, {"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "Red Book p.92", "h": "", "k": "ref"}, {"t": "Red Book p.104", "h": "", "k": "ref"}], "rbq": ["Walk me through the mechanics of building an LBO model.", "LBO equity value based on explicit sponsor hurdle rates and operating assumptions. What is the purpose of the “Sources & Uses” section of an LBO model?"], "n": 123, "so": 11}, {"id": "Q173", "src": "400", "section": "LBO Models – Concepts", "q": "How do you set up the Mandatory and Optional Debt Repayments in an LBO model?", "a": "Mandatory Principal Repayment for a tranche of Debt is based on the percentage that amortizes each year, the initial amount of Debt raised, and the amount of Debt remaining. You should take the minimum between Amortization % * Initial Amount and the Debt Remaining because you never want to repay more than the remaining balance (e.g., 20% * $100 million = $20 million per year, but if only $10 million is left, repay only $10 million). The Optional Debt Repayment formula is similar, but it’s based on the minimum between the Cash Flow Available right now and the Debt balance remaining right now. For example, if, after Mandatory Repayments, the company has $100 million in cash flow and $250 million of Debt remaining, it would repay $100 million. But if it had only $50 million remaining, it would repay the remaining $50 million.", "tip": null, "tier": 2, "rank": 99, "links": [{"t": "400Q guide p.124", "h": "", "k": "ref"}, {"t": "Generalist PDF p.81", "h": "", "k": "ref"}, {"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "Red Book p.99", "h": "", "k": "ref"}, {"t": "Red Book p.109", "h": "", "k": "ref"}], "rbq": ["This question is specifically regarding the purchase accounting on the closing date of the transaction. What does a cash sweep refer to in LBO modeling?", "When might a PE firm prefer to use term loans rather than subordinated notes in an LBO?"], "n": 124, "so": 11}, {"id": "Q012", "src": "400", "section": "Accounting – Concepts", "q": "How do the financial statements link together?", "a": "To link the statements, make Net Income from the Income Statement the top line of the Cash Flow Statement. Then, adjust this Net Income number for non-cash items such as Depreciation & Amortization. Next, reflect changes to operational Balance Sheet items such as Accounts Receivable, which may increase or reduce the company’s cash flow. This gets you to Cash Flow from Operations. Next, include the investing and financing activities, which may increase or reduce cash flow, and sum up Cash Flow from Operations, Investing, and Financing to get the net change in cash and ending cash balance. Cash at the bottom of the CFS becomes Cash on the Balance Sheet, and Net Income, Stock Issuances/Repurchases, Stock-Based Compensation, and Dividends link into Common Shareholders’ Equity. Next, link the separate line items on the CFS to their corresponding Balance Sheet line items; for example, CapEx and Depreciation link into Net PP&E. On the Assets side of the Balance Sheet, subtract CFS links; add them on the L&E side. Finally, check that Assets equals Liabilities plus Equity at the end.", "tip": "Delivery: give the 30-second version first (NI → top of CFS; ending Cash → BS; NI − Dividends → Retained Earnings), then stop. Expanding unprompted invites interruption; a crisp close invites the follow-up you've already prepped.", "tier": 2, "rank": 100, "links": [{"t": "400Q guide p.50", "h": "", "k": "ref"}, {"t": "Generalist PDF p.7", "h": "", "k": "ref"}, {"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book p.14", "h": "", "k": "ref"}, {"t": "Red Book p.21", "h": "", "k": "ref"}], "rbq": ["Walk me through the three financial statements.", "How would a $10 increase in depreciation flow through the financial statements?"], "n": 125, "so": 1}, {"id": "Q029", "src": "400", "section": "Accounting – Calculations", "q": "A company hires a new employee for a total cost of $100,000 per year. Walk me through how the financial statements change, assuming a 25% tax rate.", "a": "This is a simple OpEx increase: • Income Statement: Operating Expenses increase by $100K, so Pre-Tax Income is $100K lower. At a 25% tax rate, Net Income is $75K lower. • Cash Flow Statement: Net Income is down by $75K, and there are no other changes, so Cash at the bottom is also down by $75K. • Balance Sheet: Cash is down by $75K on the Assets side, so Total Assets are down by $75K. On the L&E side, Equity is down by $75K due to the Net Income reduction, so both sides are down by $75K and balance. • Intuition: The company spends $100K more but saves $25K in taxes.", "tip": null, "tier": 2, "rank": 108, "links": [{"t": "400Q guide p.59", "h": "", "k": "ref"}, {"t": "Generalist PDF p.16", "h": "", "k": "ref"}, {"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book p.21", "h": "", "k": "ref"}, {"t": "Red Book p.38", "h": "", "k": "ref"}], "rbq": ["How would a $10 increase in depreciation flow through the financial statements?", "How would a $100 inventory write-down impact the three financial statements?"], "n": 126, "so": 2}, {"id": "Q072", "src": "400", "section": "Valuation Methodologies", "q": "What are the advantages and disadvantages of the 3 main valuation methodologies?", "a": "Public Comps are useful because they’re based on real market data, are quick to calculate and explain, and do not depend on far-in-the-future assumptions. However, there may not be truly comparable companies, the analysis will be less accurate for volatile or thinly traded companies, and it may undervalue companies’ long-term potential. Precedent Transactions are useful because they’re based on the real prices that companies have paid for other companies, and they may better reflect industry trends than Public Comps. However, the data is often spotty and misleading, there may not be truly comparable transactions, and specific deal terms and market conditions might distort the multiples. DCF Analysis is the most “correct” methodology according to finance theory, it’s less subject to market fluctuations, and it better reflects company-specific factors and long-term trends. However, it’s also very dependent on far-in-the-future assumptions, and there’s disagreement over the proper calculations for key figures like the Cost of Equity and WACC.", "tip": null, "tier": 2, "rank": 114, "links": [{"t": "400Q guide p.82", "h": "", "k": "ref"}, {"t": "Generalist PDF p.39", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book p.48", "h": "", "k": "ref"}, {"t": "Red Book p.50", "h": "", "k": "ref"}], "rbq": ["DCF valuation. Which of the valuation methodologies is the most variable in terms of output?", "What are the main disadvantages of performing trading comps?"], "n": 127, "so": 5}, {"id": "Q102", "src": "400", "section": "Discounted Cash Flow (DCF) – Assumptions and Analysis", "q": "Walk me through a DCF analysis.", "a": "A DCF values a company based on the Present Value of its Cash Flows in the explicit forecast period plus the Present Value of its Terminal Value. You start by projecting the company’s Free Cash Flows over the next 5 – 10 years by making assumptions for the revenue growth, margins, Working Capital, and CapEx. Then, you discount the cash flows using the Discount Rate, usually the Weighted Average Cost of Capital, and sum up everything. Next, you estimate the Terminal Value using the Multiples Method or the Gordon Growth Method; it represents the company’s value after those first 5 – 10 years into perpetuity. You then discount the Terminal Value to Present Value using the Discount Rate and add it to the sum of the company’s discounted cash flows to get its Implied Enterprise Value. Finally, you add Cash and subtract Debt (and add/subtract all other relevant line items) to get the Implied Equity Value, divide by the share count to get the Implied Share Price, and compare this to the company’s Current Share Price.", "tip": "Timing: this walkthrough should run ~60 seconds. Practice it aloud against a clock — it's the single most-asked technical question in banking interviews.", "tier": 2, "rank": 117, "links": [{"t": "400Q guide p.95", "h": "", "k": "ref"}, {"t": "Generalist PDF p.52", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book p.48", "h": "", "k": "ref"}, {"t": "Red Book p.61", "h": "", "k": "ref"}], "rbq": ["Net Debt/EBITDA would be at lower risk of bankruptcy (and lower cost of debt). When would a DCF be an inappropriate valuation method?", "Among the DCF , comparable companies analysis, and transaction comps, which approach yields the highest valuation?"], "n": 128, "so": 7}, {"id": "Q104", "src": "400", "section": "Discounted Cash Flow (DCF) – Assumptions and Analysis", "q": "How do you calculate the Terminal Value in a DCF, and which method is best?", "a": "You can use the Multiples Method or the Gordon Growth Method (AKA Long-Term Growth Method, Perpetuity Growth Method, etc.). With the first one, you apply a Terminal Multiple to the company’s EBITDA, EBIT, NOPAT, or FCF in the final year of the forecast period. For example, if you apply a 10x TEV / EBITDA multiple to the company’s Year 10 EBITDA of $500, its Terminal Value is $5,000. With the Gordon Growth Method, you assign a “Terminal Growth Rate” to the company’s Free Cash Flows in the Terminal Period and assume they’ll grow at that rate forever. Terminal Value = Final Year Free Cash Flow * (1 + Terminal Growth Rate) / (Discount Rate – Terminal Growth Rate) The Gordon Growth Method is better from a theoretical perspective because growth always slows down over time; all companies’ cash flows eventually grow more slowly than GDP. If you use the Multiples Method, it’s easy to pick a multiple that makes no logical sense because it implies a growth rate that’s too high. However, many bankers still use and prefer the Multiples Method because it’s “easier” or because they don’t understand the issues with Terminal Multiples.", "tip": "Proactive line: state that TV is usually 60–80% of implied EV and that you'd cross-check Gordon Growth against the implied exit multiple (and vice versa). Saying it unprompted preempts the standard follow-up.", "tier": 2, "rank": 118, "links": [{"t": "400Q guide p.95", "h": "", "k": "ref"}, {"t": "Generalist PDF p.52", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book p.59", "h": "", "k": "ref"}, {"t": "Red Book p.60", "h": "", "k": "ref"}], "rbq": ["DCF model, but the discount rate's impact would far exceed that of operational assumptions such as the sales growth rate. How is the terminal value calculated?", "Implied TV Exit Multiple = Terminal Value Perpetuity Method EBITDA Final Year What is the argument against using the exit multiple approach in a DCF?"], "n": 129, "so": 7}, {"id": "Q128", "src": "400", "section": "Discounted Cash Flow (DCF) – The Discount Rate", "q": "How do you calculate the Cost of Equity?", "a": "Cost of Equity = Risk-Free Rate + Equity Risk Premium * Levered Beta The Risk-Free Rate represents the yield on \"risk-free\" government bonds denominated in the same currency as the company’s cash flows. You usually use 10-year or 20-year bonds to match the explicit forecast period of the DCF. Levered Beta represents the volatility of this stock relative to the market as a whole, factoring in both intrinsic business risk and risk from leverage. And the Equity Risk Premium represents how much the stock market in the company’s country will return above the “risk-free” government bond yield in the long term. Stocks are riskier and have higher potential returns than government bonds, so you take the yield on the bonds, add the extra returns you could get from the stock market, and then adjust for this company’s specific risk and potential returns.", "tip": null, "tier": 2, "rank": 124, "links": [{"t": "400Q guide p.104", "h": "", "k": "ref"}, {"t": "Generalist PDF p.61", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book p.55", "h": "", "k": "ref"}], "rbq": ["However, the cost of equity would be the right cost of capital to use for levered DCFs. What is the formula to calculate the weighted average cost of capital (W", "What is the appropriate cost of capital when doing an unlevered DCF?"], "n": 130, "so": 8}, {"id": "Q135", "src": "400", "section": "Discounted Cash Flow (DCF) – The Discount Rate", "q": "How do you determine the Cost of Debt and Cost of Preferred Stock in the WACC calculation, and what do they mean?", "a": "These Costs represent what the company would pay if it issued additional Debt or Preferred Stock. To an outside investor, these Costs represent their expected annualized returns if they held the Debt or Preferred Stock through their maturities. You can estimate the Cost of Debt by calculating the Yield to Maturity (YTM), which reflects the coupon rates on the company’s bonds and their market values (e.g., a bond with a coupon rate of 5% that’s trading at a discount to par value will have a YTM higher than 5%). If you can’t find this information, you could also use a simple weighted average interest rate for the issuances or take the Risk-Free Rate and add a default spread based on the company’s expected credit rating. The Cost of Preferred Stock is similar, but Preferred Dividends are not tax-deductible, so you do not multiply by the (1 – Tax Rate) term in the WACC calculation.", "tip": null, "tier": 2, "rank": 125, "links": [{"t": "400Q guide p.107", "h": "", "k": "ref"}, {"t": "Generalist PDF p.64", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book p.55", "h": "", "k": "ref"}, {"t": "Red Book p.59", "h": "", "k": "ref"}], "rbq": ["However, the cost of equity would be the right cost of capital to use for levered DCFs. What is the formula to calculate the weighted average cost of capital (W", "Requity = Cost of Equity Rdebt = Cost of Debt, and must be tax-affected since interest is tax-deductible t = Tax Rate % If a company carries no debt, what is it"], "n": 131, "so": 8}, {"id": "Q162", "src": "400", "section": "LBO Models – Concepts", "q": "Walk me through a basic LBO model (without the full financial statements).", "a": "In an LBO model, in Step 1, you make assumptions for the Purchase Price, Debt and Equity, Interest Rate on Debt, and other drivers such as the company’s revenue growth and margins. In Step 2, you create a Sources & Uses schedule to show how much Investor Equity the PE firm contributes and how items like the transaction fees and the company’s Cash balance affect this contribution. In Step 3, you project the company’s Income Statement and its partial Cash Flow Statement down to Free Cash Flow. Then, in Step 4, you use the Free Cash Flow, Beginning Cash, and Minimum Cash to determine how much Debt principal the company repays each year. You then link the Interest Expense on this changing Debt balance to the Income Statement so that FCF deducts the Interest. Finally, in Step 5, you make the exit calculations based on an assumed EBITDA Exit Multiple, and you calculate the IRR and Money-on-Money multiple based on the proceeds the PE firm earns at the end vs. its Investor Equity in the beginning.", "tip": null, "tier": 2, "rank": 130, "links": [{"t": "400Q guide p.120", "h": "", "k": "ref"}, {"t": "Generalist PDF p.77", "h": "", "k": "ref"}, {"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "Red Book: Private Equity Investing p.91", "h": "", "k": "ref"}], "rbq": [], "n": 132, "so": 11}, {"id": "Q184", "src": "400ind", "section": "Industrials (400Q industry section)", "q": "Many industrials companies, such as plane and railroad manufacturers, have long lead times to produce and deliver orders. What differences does this create in their key metrics and financial statements?", "a": "These timing differences mean that you need to track the Backlog as a key metric, add the Order Intake each year, and subtract the Revenue Recognized from deliveries.\n\nThe Book-to-Bill Ratio, defined as Order Intake / Revenue Recognized in a year, is a key driver that determines how quickly these orders turn into sales.\n\nFulfilling these orders over time also creates assets and liabilities linked to them, such as Work in Progress and Deferred Expenses; they could significantly impact the company's Change in Working Capital in the cash flow projections.", "tip": "Book-to-bill > 1.0 means backlog is growing (orders outpacing revenue). Quanta's record ~$53B backlog and Vertiv's +109% backlog are the 2026 examples to cite; a shrinking backlog in a 'strong' quarter is the warning sign interviewers want you to catch.", "tier": 2, "rank": 9184, "links": [{"t": "400Q guide p.166", "h": "", "k": "ref"}, {"t": "Red Book: Industrials p.246", "h": "", "k": "ref"}], "n": 133, "so": 13}, {"id": "Q185", "src": "400ind", "section": "Industrials (400Q industry section)", "q": "In which verticals within industrials is the Sum-of-the-Parts (SOTP) valuation most and least useful?", "a": "SOTP valuation is most useful when you're valuing a conglomerate that has multiple business segments in very different markets or a maritime/shipping company with a huge variety of ships or fleet types.\n\nIn both these cases, it's useful to assign different values to each asset type or different multiples to income from each segment.\n\nIt is least useful for a focused single-segment manufacturer or distributor, where all the revenue shares one comp set and one multiple — there's nothing to split apart.", "tip": "Tie this to the 2025–26 conglomerate breakups (Honeywell's three-way split, DuPont, Fortive): a SOTP that shows the parts are worth more than the whole is the analytical case behind every spin-off pitch.", "tier": 2, "rank": 9185, "links": [{"t": "400Q guide p.166", "h": "", "k": "ref"}, {"t": "Red Book: Industrials p.246", "h": "", "k": "ref"}], "n": 134, "so": 13}, {"id": "Q188", "src": "400ind", "section": "Financial Sponsors Group (400Q industry section)", "q": "Suppose you are an FSG banker advising a private equity client. How would you decide when to pitch the client on bringing one of its portfolio companies to the market for a sale or IPO?", "a": "It depends on the holding period of the asset, the timing of the client's next fund, and the current M&A and IPO markets.\n\nGenerally, General Partners (GPs) at PE firms want to hold assets for 5 – 7 years to maximize their value, so you would normally wait close to that long before pitching anything. But GPs also want to show evidence of strong performance when they raise their next funds, so if they plan to raise a new fund soon, you might be more likely to pitch an M&A or IPO process.\n\nIf the M&A and IPO markets are currently weaker, you might be less likely to pitch one of these processes, but it depends heavily on the context (e.g., is this a short-term downturn or a prolonged, multi-year slow period?).", "tip": "Chicago sponsor angle: GTCR, Madison Dearborn, Wind Point and CHS are the clients Blair, Baird and Lincoln pitch. Sponsor-owned electrical/thermal assets selling to strategics at 15–29x (Boyd, CoolIT, NSI) are the live 2026 example of 'the right moment to pitch a sale.'", "tier": 2, "rank": 9188, "links": [{"t": "400Q guide p.160", "h": "", "k": "ref"}, {"t": "BIWS module 04 (LBO)", "h": "", "k": "ref"}, {"t": "Red Book: Private Equity Investing p.91", "h": "", "k": "ref"}], "n": 135, "so": 14}, {"id": "Q189", "src": "400ind", "section": "Financial Sponsors Group (400Q industry section)", "q": "Again, pretend you are an FSG banker advising a private equity client. When is the ideal time to suggest that the client review its investments and deploy its remaining committed capital?", "a": "This type of review is most appropriate when the GPs are preparing to raise their next fund – because they want to show their Limited Partners (LPs) that they have deployed as much capital as possible from their previous funds. LPs might be skeptical if it seems like the PE firm is raising significant capital but not investing all of it.\n\nSometimes, GPs currently raising a new fund might even invest in new companies before they finish fundraising to illustrate what the new investments might look like and win commitments from more LPs. For example, if the GPs plan to raise a new $1 billion fund over 18 months, they might start investing within 6 months if they've raised $300 million so far – as that could be enough for several deals, depending on the strategy. If prospective LPs like these early deals, they might be more likely to commit capital.", "tip": null, "tier": 2, "rank": 9189, "links": [{"t": "400Q guide p.160", "h": "", "k": "ref"}, {"t": "BIWS module 04 (LBO)", "h": "", "k": "ref"}, {"t": "Red Book: Private Equity Investing p.91", "h": "", "k": "ref"}], "n": 136, "so": 14}, {"id": "Q192", "src": "400ind", "section": "Private Companies (400Q industry section)", "q": "How might you adjust a private company's financial statements in a valuation or deal analysis?", "a": "First, note that you make major adjustments mostly for 'small business' private companies; venture-backed startups and large, established private companies should already have GAAP/IFRS-compliant statements.\n\nFor small businesses, you often re-classify revenue and expenses into more standard categories (e.g., Revenue, COGS, SG&A, R&D, and S&M), you re-classify the 'Owner's Draw' or 'Dividends' as employee compensation, and you remove intermingled personal expenses.\n\nYou may also apply a different tax rate, such as the acquirer's or the standard rate for public companies in the country, if the small business has been paying taxes at the owner's personal rate.\n\nFinally, you might apply a 'Key Person Discount' to the future cash flows under the assumption that the most important person(s) might leave in the future, resulting in lower sales.", "tip": "In middle-market practice this is the Quality of Earnings (QoE) report: 'Adjusted EBITDA' = reported EBITDA + owner comp normalization + one-time items ± pro forma run-rate adjustments. Expect the follow-up 'which add-backs would you push back on?' — anything recurring dressed up as one-time.", "tier": 2, "rank": 9192, "links": [{"t": "400Q guide p.183", "h": "", "k": "ref"}, {"t": "BIWS module 05 (M&A)", "h": "", "k": "ref"}], "n": 137, "so": 15}, {"id": "Q193", "src": "400ind", "section": "Private Companies (400Q industry section)", "q": "At a high level, how is private company valuation different?", "a": "Assuming you are valuing a 'small business,' you start the valuation after making the financial statement adjustments described in the previous question.\n\nIn the valuation itself, you often discount the output of certain methodologies because private companies have illiquid shares, tend to be smaller than public companies, and are often dependent on key individuals.\n\nThis translates into literal discounts on the multiples from the Public Comps (e.g., 20 – 40% reductions), a higher Discount Rate in the DCF, and a 'haircut' Terminal Value to reflect the risk of the company shutting down or declining.\n\nTrue small businesses are worth significantly less than public companies with Boards and professional managers, so the EBITDA and cash flow multiples should be much lower. You would not make these adjustments to the same degree for VC-backed startups or large/mature private companies.", "tip": null, "tier": 2, "rank": 9193, "links": [{"t": "400Q guide p.183", "h": "", "k": "ref"}, {"t": "BIWS module 05 (M&A)", "h": "", "k": "ref"}], "n": 138, "so": 15}, {"id": "R03", "src": "rb", "section": "Industrials (Red Book ch.)", "q": "Why is there such a high level of M&A activity in the industrial manufacturing space?", "a": "Industrial manufacturing has historically been one of the most active areas for M&A because of constant innovation in product development and the highly specialized nature of the industry — there are hundreds of niches, each providing differentiated capabilities. The more specialized niches there are within an industry, the higher M&A activity will generally be.\n\nIncumbents acquire companies with proven technologies and an existing customer list rather than incurring high R&D expense to build it in-house.\n\nFinancial sponsors are active in the industry: they acquire niche players, grow them through add-ons, and exit to large strategics such as Honeywell, Siemens, ABB, ASSA ABLOY and Johnson Controls. For many industrial conglomerates, recent revenue growth has been almost entirely inorganic.", "tip": "Your 2026 version of this answer: sponsors bought the niches (Boyd, CoolIT, NSI, Indicor) and are now selling to strategics at 15–29x. Lower-middle-market buy-and-build is what Chicago banks run; 'why so much industrial M&A' is really 'why Lincoln / Blair / Baird have a job.'", "tier": 2, "rank": 9503, "links": [{"t": "Red Book p.246", "h": "", "k": "ref"}, {"t": "400Q guide: Industrials p.164", "h": "", "k": "ref"}], "n": 139, "so": 16}, {"id": "R04", "src": "rb", "section": "Industrials (Red Book ch.)", "q": "Which valuation multiples are most often used to value companies in industrials?", "a": "The most common multiple for industrials is EV / EBITDA, especially for industrial technology. EV / (EBITDA – CapEx) is often used for manufacturing companies, where capital intensity makes EBITDA alone misleading, while EV / EBITDAR can be used for transportation and logistics if equipment such as trucks is rented.\n\nA few multiples specific to transportation and logistics: EV / Total Freight Tonnage or Volume, EV / Miles Driven, and EV / Average Revenue per Mile or per Weight Unit.", "tip": "When two industrials trade at the same EV/EBITDA but one needs 8% of sales in CapEx and the other 2%, EV/(EBITDA – CapEx) shows the second is far cheaper. It's the industrials version of 'EBITDA ignores CapEx' (Q092) — have the one-line example ready.", "tier": 2, "rank": 9504, "links": [{"t": "Red Book p.246", "h": "", "k": "ref"}, {"t": "400Q guide: Industrials p.164", "h": "", "k": "ref"}], "n": 140, "so": 16}, {"id": "R05", "src": "rb", "section": "Industrials (Red Book ch.)", "q": "You're looking at an industrials company. What business and industry characteristics would you first consider?", "a": "End Markets: the customers served and their diversification determine how cyclical revenue is; the relationship with customers and how essential the products are determine how recurring it is.\n\nSupply Chain: how many suppliers the company depends on and how well integrated it is; also the distribution network — how much reach it has and whether there's room to sell through more channels.\n\nProduct Value / Upgrade Cycles: how valuable the offering is and how often upgrades or recurring services such as maintenance are required.\n\nCompetitive Landscape: the strength of the industry's barriers to entry and how the company's products compare to competitors — these drive revenue stability and pricing power over end markets.", "tip": "This is the 'tell me about a company you're following' checklist in four words: end markets, supply chain, upgrade cycle, competition. Run Quanta or Madison Air through it out loud.", "tier": 2, "rank": 9505, "links": [{"t": "Red Book p.247", "h": "", "k": "ref"}, {"t": "400Q guide: Industrials p.164", "h": "", "k": "ref"}], "n": 141, "so": 16}, {"id": "R06", "src": "rb", "section": "Industrials (Red Book ch.)", "q": "An industrials company has shown impaired revenue in a downturn. What metric would you look at to assess the damage and predict the pace of recovery?", "a": "The metric is the build-up of backlog (or the lack of it). Ideally the company's backlog should have increased significantly despite the decrease in revenue, because customers have delayed projects into the future rather than cancelled them.\n\nBacklog represents customer contracts that have been secured but not yet earned. In early 2020 the leading industrial conglomerates pointed to healthy backlog on earnings calls as evidence that a swift recovery was underway. The absence of backlog, or lagging backlog growth versus competitors, is a negative sign — the company couldn't secure commitments from new customers and/or existing customers cancelled projects or went bankrupt.", "tip": null, "tier": 2, "rank": 9506, "links": [{"t": "Red Book p.247", "h": "", "k": "ref"}, {"t": "400Q guide: Industrials p.164", "h": "", "k": "ref"}], "n": 142, "so": 16}, {"id": "R09", "src": "rb", "section": "Industrials (Red Book ch.)", "q": "Would you consider distribution and transportation service providers to be a low-margin business?", "a": "Historically, yes — distribution and transportation services sit in the bottom tier of margins.\n\nHowever, software developments such as route optimization (using geographic information systems to find the most efficient routing) improve each transport and let providers charge for improved capabilities. Asset location tracking — real-time monitoring of parts and components via bar code / QR scanning — improves data accuracy and gives clients more information, and helps satisfy compliance requirements (e.g., pharmaceutical drugs).\n\nThese developments are opportunities to improve the service offering, differentiate from competitors, and improve margins.", "tip": "Distributors (Grainger, Fastenal, Ferguson) are the exception that proves the rule: thin gross margins but high returns on capital because inventory turns fast and CapEx is small. ROIC, not margin, is the metric to lead with for a distributor.", "tier": 2, "rank": 9509, "links": [{"t": "Red Book p.249", "h": "", "k": "ref"}, {"t": "400Q guide: Industrials p.164", "h": "", "k": "ref"}], "n": 143, "so": 16}, {"id": "R10", "src": "rb", "section": "Industrials (Red Book ch.)", "q": "Why does the airline industry have such low margins?", "a": "Airlines have a high fixed-cost structure: purchasing new fleets is very expensive, and constant fleet maintenance, repairs and the geographic footprint all cut into margins. They also carry high variable costs — certified pilots, flight crews, key personnel, airport customer-service agents, security.\n\nAirlines are constrained in cutting costs because each expenditure is high-stakes: skipping a repair, spending less on security, or cutting flights can have significant reputational repercussions and wipe out current and future bookings. Very few costs are 'unnecessary.'\n\nFinally, the industry is highly competitive — rivals compete on pricing, flight availability and geographic reach — which reduces pricing power and the ability to improve margins.", "tip": null, "tier": 2, "rank": 9510, "links": [{"t": "Red Book p.250", "h": "", "k": "ref"}, {"t": "400Q guide: Industrials p.164", "h": "", "k": "ref"}], "n": 144, "so": 16}, {"id": "R11", "src": "rb", "section": "Industrials (Red Book ch.)", "q": "List a few manufacturing KPIs you would look at to measure the efficiency of a factory.", "a": "• Throughput = Total Units Produced / Time — the production capability of a machine, line or plant over a period (usually an hour or a day).\n• On-Time Delivery (OTD) = Work Orders Delivered on Original Schedule / Original Schedule Work Orders Due — the percentage of orders delivered on time, often tied to logistics performance.\n• Capacity Utilization = Actual Utilization / Total Production Capacity — the proportion of potential output being used; the target is to run as close to 100% as possible.\n• First Pass Yield (FPY) = Quality Units / Total Units Produced — the percentage of products made to specification the first time, with no rework or scrap.\n• Machine Downtime Rate = Downtime Hours / (Downtime Hours + Operational Hours) — scheduled plus unscheduled downtime against a factory-set target.", "tip": null, "tier": 2, "rank": 9511, "links": [{"t": "Red Book p.252", "h": "", "k": "ref"}, {"t": "400Q guide: Industrials p.164", "h": "", "k": "ref"}], "n": 145, "so": 16}, {"id": "S106", "src": "supp", "section": "Finance Concepts", "topic": "Core Concepts", "q": "What's the difference between NPV and IRR?", "a": "NPV tells you the absolute dollar value created (in today's dollars) given a fixed discount rate. IRR tells you the percentage return given the cash flows. NPV requires you to pick a discount rate upfront; IRR doesn't, but it can mislead with non-conventional cash flows (multiple sign changes can yield multiple IRRs). In M&A and PE you usually want both — NPV for size of the prize, IRR for the return rate.", "tier": 2, "rank": 5106, "links": [{"t": "BIWS module 01", "h": "", "k": "ref"}, {"t": "Red Book: Corporate Finance Theory p.45", "h": "", "k": "ref"}, {"t": "400Q guide: Finance Concepts p.46", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 146, "so": 0}, {"id": "S108", "src": "supp", "section": "Finance Concepts", "topic": "Core Concepts", "q": "Which of these BEST describes WACC?", "a": "B is correct. WACC is the weighted blend of the after-tax cost of debt and the cost of equity, weighted by market values of debt and equity.\n\nA describes pre-tax cost of debt only. C describes Cost of Equity only. D describes the CAPM formula for cost of equity. The 'weighted' and 'blended' nature is the key — WACC must include both sides of the capital structure.", "tier": 2, "rank": 5108, "links": [{"t": "BIWS module 01", "h": "", "k": "ref"}, {"t": "Red Book: Corporate Finance Theory p.45", "h": "", "k": "ref"}, {"t": "400Q guide: Finance Concepts p.46", "h": "", "k": "ref"}], "type": "trap", "flags": [], "options": ["The interest rate the company pays on its outstanding debt", "The blended after-tax cost of all capital providers, weighted by market value", "The return shareholders demand on their equity investment", "The risk-free rate plus an equity risk premium"], "correct": 1, "n": 147, "so": 0}, {"id": "S204", "src": "supp", "section": "Accounting – Concepts", "topic": "Accounting Concepts", "q": "Why is depreciation a non-cash expense?", "a": "Because the cash outflow happened upfront when the asset was purchased — depreciation just spreads that cost across the asset's useful life for matching purposes on the IS. No new cash leaves the company in any given year of depreciation. That's why it's added back on the cash flow statement.", "tier": 2, "rank": 5204, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements p.13", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Concepts p.50", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 148, "so": 1}, {"id": "S205", "src": "supp", "section": "Accounting – Concepts", "topic": "Accounting Concepts", "q": "Why doesn't issuing $100 of new equity show up on the income statement?", "a": "Because issuing stock isn't an operating event — it's a financing transaction with shareholders. The company exchanges shares for cash; it doesn't earn revenue or incur an expense. The transaction shows up as: Cash up $100 on the BS, Common Stock / APIC up $100 on the BS, and a $100 inflow in financing activities on the CFS. IS untouched.", "tier": 2, "rank": 5205, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements p.13", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Concepts p.50", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 149, "so": 1}, {"id": "S208", "src": "supp", "section": "Accounting – Concepts", "topic": "Accounting Concepts", "q": "Which of these is NOT typically classified as a current asset?", "a": "Goodwill. Current assets are expected to be converted to cash within 12 months. Goodwill is a long-term intangible — it's never converted to cash; it sits on the BS until impaired or the underlying business is sold. AR (collected in days/weeks), Inventory (sold in months), and Prepaid Expenses (consumed within a year) are all current.", "tier": 2, "rank": 5208, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements p.13", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Concepts p.50", "h": "", "k": "ref"}], "type": "trap", "flags": [], "options": ["Accounts Receivable", "Inventory", "Goodwill", "Prepaid Expenses"], "correct": 2, "n": 150, "so": 1}, {"id": "S209", "src": "supp", "section": "Accounting – Concepts", "topic": "Accounting Concepts", "q": "Why does GAAP require accrual accounting instead of cash accounting?", "a": "Because accrual matches revenue with the expenses incurred to produce it, giving a truer picture of period performance. Cash accounting can be wildly misleading — a company that builds inventory in December and sells it in January would look horrible in Q4 (huge cash outflow, no revenue) and amazing in Q1 (all revenue, no cost), when the reality is steady operations. Accrual smooths that distortion.", "tier": 2, "rank": 5209, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements p.13", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Concepts p.50", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 151, "so": 1}, {"id": "S301", "src": "supp", "section": "Accounting – Concepts", "topic": "Cash Flow Statement", "q": "Walk me through the cash flow statement.", "a": "Start with Net Income. Add back non-cash items (D&A, stock-based comp, deferred taxes). Adjust for working capital changes (increase in AR/inventory = cash out; increase in AP = cash in). That gives you Cash From Operations.\n\nThen Investing activities — primarily Capex and acquisitions/divestitures. Then Financing — debt issuance/repayment, equity issuance/buyback, dividends. Sum all three: net change in cash. Add to beginning cash to get ending cash.", "tier": 2, "rank": 5301, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements p.13", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Concepts p.50", "h": "", "k": "ref"}], "type": "recall", "flags": [], "n": 152, "so": 1}, {"id": "S302", "src": "supp", "section": "Accounting – Concepts", "topic": "Cash Flow Statement", "q": "Why does the cash flow statement start with Net Income instead of just listing all cash movements?", "a": "Because the indirect method (which is what's used in the US) is a reconciliation: it shows the gap between accounting profit and actual cash generated. Starting from Net Income makes the linkage between the IS and the CFS explicit, and it's far less work than tracking every individual cash transaction. The direct method (listing every cash flow) is rarely used because it's tedious to produce.", "tier": 2, "rank": 5302, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements p.13", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Concepts p.50", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 153, "so": 1}, {"id": "S303", "src": "supp", "section": "Accounting – Concepts", "topic": "Cash Flow Statement", "q": "Why do we add back Depreciation & Amortization on the CFS?", "a": "Because D&A reduced Net Income on the IS but didn't involve any actual cash outflow this period. The cash already left when the asset was purchased (showing up in Investing activities as Capex). Adding D&A back reverses the non-cash deduction so the CFS reflects real cash.", "tier": 2, "rank": 5303, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements p.13", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Concepts p.50", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 154, "so": 1}, {"id": "S409", "src": "supp", "section": "Accounting – Calculations", "topic": "Accounting Calcs", "q": "Which of these would cause the LARGEST cash decrease in Year 1?", "a": "A. $100 capex = $100 cash out in investing activities, no tax shield in Year 1 (no depreciation yet).\n\nB: $100 write-down = +$40 cash (you save taxes; the write-down itself is non-cash).\nC: $100 depreciation = +$40 cash (tax shield on non-cash charge).\nD: the credit sale books $100 of revenue → Net Income up $60 after tax, but the full $100 sits in AR uncollected → net cash down $40.\n\nKey insight: capex hurts cash the most because it's a direct cash outflow with no offsetting tax benefit until depreciation kicks in.", "tier": 2, "rank": 5409, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statement Analysis p.27", "h": "", "k": "ref"}, {"t": "Red Book: Advanced Accounting p.35", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Calcs p.59", "h": "", "k": "ref"}], "type": "trap", "flags": [], "options": ["$100 capex on equipment (no depreciation in Year 1)", "$100 inventory write-down (40% tax rate)", "$100 of depreciation on existing equipment (40% tax rate)", "$100 increase in accounts receivable from booking a $100 credit sale (40% tax rate)"], "correct": 0, "n": 155, "so": 2}, {"id": "S410", "src": "supp", "section": "Accounting – Calculations", "topic": "Accounting Calcs", "q": "Why does $10 of depreciation reduce cash by less than $10?", "a": "It doesn't reduce cash at all in isolation — depreciation is non-cash. Where it 'helps' cash is the tax shield. $10 depreciation reduces pre-tax income by $10, which saves $4 in taxes (at 40% rate). So cash actually goes UP by $4 net.\n\nThe trap in this question: candidates confuse 'reduces NI' with 'reduces cash.' They're different. NI down $6 (after-tax effect), cash up $4 (tax savings).", "tier": 2, "rank": 5410, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statement Analysis p.27", "h": "", "k": "ref"}, {"t": "Red Book: Advanced Accounting p.35", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Calcs p.59", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 156, "so": 2}, {"id": "S412", "src": "supp", "section": "Accounting – Calculations", "topic": "Accounting Calcs", "q": "Why does $100 of capex reduce cash by $100, but $100 of operating expense reduces cash by only $60 (at 40% tax)?", "a": "Because operating expense is deductible for taxes IN THE PERIOD INCURRED. $100 of opex reduces pre-tax income by $100, saves $40 in taxes → net cash impact is -$60.\n\nCapex isn't expensed immediately — it's capitalized and depreciated over the asset's life. So there's no Year 1 tax shield. Full $100 cash out, no tax offset. The tax benefit comes later, spread across years 1-N as depreciation.\n\nThis is why GAAP vs. tax timing differences create Deferred Tax Liabilities — tax accelerates the deduction (Section 179, bonus depreciation) so the company defers tax now but pays more later.", "tier": 2, "rank": 5412, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statement Analysis p.27", "h": "", "k": "ref"}, {"t": "Red Book: Advanced Accounting p.35", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Calcs p.59", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 157, "so": 2}, {"id": "S503", "src": "supp", "section": "Equity Value & Enterprise Value – Concepts", "topic": "EV / Equity Value", "q": "Why do you subtract cash when bridging from Equity Value to Enterprise Value?", "a": "Because cash isn't part of the operating business — it's a financing asset. If you acquired the company, you'd effectively get the cash back, which reduces your net purchase price. EV is meant to represent operating value, so we strip out cash to compare companies on operating performance regardless of how much cash they're sitting on.", "tier": 2, "rank": 5503, "links": [{"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Corporate Finance Theory p.45", "h": "", "k": "ref"}, {"t": "400Q guide: EV/Equity Value p.71", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 158, "so": 3}, {"id": "S504", "src": "supp", "section": "Equity Value & Enterprise Value – Concepts", "topic": "EV / Equity Value", "q": "Why do you add Minority (Non-controlling) Interest to Enterprise Value?", "a": "Because under consolidation accounting, the parent company puts 100% of a controlled subsidiary's revenue, EBITDA, and operations on its statements, even if it owns only, say, 70%. The 30% it doesn't own is the 'minority interest' on the BS.\n\nIf EV is going to be compared against fully-consolidated EBITDA (which includes 100% of the sub), then EV must reflect 100% of the sub's value too. Adding minority interest gets you there — keeps numerator and denominator consistent.", "tier": 2, "rank": 5504, "links": [{"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Corporate Finance Theory p.45", "h": "", "k": "ref"}, {"t": "400Q guide: EV/Equity Value p.71", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 159, "so": 3}, {"id": "S507", "src": "supp", "section": "Equity Value & Enterprise Value – Concepts", "topic": "EV / Equity Value", "q": "Which of these should NOT be added when going from Equity Value to Enterprise Value?", "a": "D. Cash is SUBTRACTED in the Equity Value → Enterprise Value bridge, never added — it's a non-core asset that effectively reduces the purchase price.\n\nA: debt is added (acquirer assumes or refinances it). B: preferred is added (it's a senior claim above common). C: operating lease liabilities ARE typically added under ASC 842 because they represent a debt-like financing claim (this is post-2019 treatment that catches a lot of candidates).\n\nKey: cash subtracts, claims on operations add. (Side note: truly restricted cash — e.g., posted as collateral — is often excluded from the netting because it isn't freely available to offset the price.)", "tier": 2, "rank": 5507, "links": [{"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Corporate Finance Theory p.45", "h": "", "k": "ref"}, {"t": "400Q guide: EV/Equity Value p.71", "h": "", "k": "ref"}], "type": "trap", "flags": [], "options": ["Total debt (short-term + long-term)", "Preferred stock", "Operating lease liabilities (post-ASC 842)", "Excess cash and cash equivalents"], "correct": 3, "n": 160, "so": 3}, {"id": "S508", "src": "supp", "section": "Equity Value & Enterprise Value – Concepts", "topic": "EV / Equity Value", "q": "Why use diluted shares (not basic) when calculating Equity Value?", "a": "Because options, warrants, RSUs, and convertibles can become common stock, diluting existing holders. Equity Value should reflect the cost to acquire ALL economic ownership claims. Using basic shares understates the price.\n\nThe Treasury Stock Method handles options: assume in-the-money options are exercised, company receives strike-price proceeds, uses them to buy back shares at current market price — net dilution is added to basic shares.", "tier": 2, "rank": 5508, "links": [{"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Corporate Finance Theory p.45", "h": "", "k": "ref"}, {"t": "400Q guide: EV/Equity Value p.71", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 161, "so": 3}, {"id": "S603", "src": "supp", "section": "Valuation Metrics and Multiples", "topic": "Valuation Multiples", "q": "Why use EV/EBITDA instead of P/E?", "a": "Three reasons:\n\n1) Capital structure neutral. EV includes all capital providers; EBITDA is pre-interest. So EV/EBITDA isn't distorted by how leveraged a company is. P/E uses Net Income (post-interest) and Equity Value — leverage skews the ratio.\n\n2) Excludes D&A. Useful for comparing companies with different capex intensity or accounting policies.\n\n3) Pre-tax. EBITDA is before taxes, so different tax jurisdictions don't muddy the comparison.", "tier": 2, "rank": 5603, "links": [{"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Relative Valuation p.65", "h": "", "k": "ref"}, {"t": "400Q guide: Metrics & Multiples p.88", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 162, "so": 6}, {"id": "S604", "src": "supp", "section": "Valuation Metrics and Multiples", "topic": "Valuation Multiples", "q": "When would you use EV/Revenue instead of EV/EBITDA?", "a": "When EBITDA is negative, near zero, or meaningless — early-stage growth companies, distressed companies, biotech without commercial revenue. Also common in industries where investors prioritize top-line growth over current profitability (SaaS, marketplaces, consumer internet).\n\nIt's a weaker comparison than EV/EBITDA because it ignores profitability, but sometimes it's the only multiple that produces a meaningful number.", "tier": 2, "rank": 5604, "links": [{"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Relative Valuation p.65", "h": "", "k": "ref"}, {"t": "400Q guide: Metrics & Multiples p.88", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 163, "so": 6}, {"id": "S608", "src": "supp", "section": "Valuation Metrics and Multiples", "topic": "Valuation Multiples", "q": "What's the most appropriate multiple to value a pre-revenue biotech with one drug in Phase 2 trials?", "a": "D. Pre-revenue biotech has no revenue, no EBITDA, no NI — every standard multiple breaks. The industry approach is risk-adjusted NPV: project the cash flows IF each drug succeeds, multiply by the probability of success at each clinical stage (Phase 2 success rates ~30%, Phase 3 ~60%, FDA ~85% historically), sum, and discount.\n\nMultiples-based methods just don't work pre-revenue. Don't try to force-fit them in an interview.", "tier": 2, "rank": 5608, "links": [{"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Relative Valuation p.65", "h": "", "k": "ref"}, {"t": "400Q guide: Metrics & Multiples p.88", "h": "", "k": "ref"}], "type": "trap", "flags": [], "options": ["EV/EBITDA", "P/E", "EV/Revenue", "None — use a risk-adjusted NPV of the drug pipeline (rNPV)"], "correct": 3, "n": 164, "so": 6}, {"id": "S708", "src": "supp", "section": "Discounted Cash Flow (DCF) – Assumptions and Analysis", "topic": "DCF Mechanics", "q": "Why is the DCF projection period usually 5 years and not 30?", "a": "Forecasts beyond ~5 years lose meaningful accuracy. Revenue, margin, capex, and working capital projections that far out are essentially educated guesses. Adding more years doesn't add precision — it adds false confidence.\n\nThe terminal value already captures everything beyond the explicit period in one number. So beyond 5 years, you're just splitting cash flow between two buckets (explicit and terminal) without making the analysis more accurate.\n\nExceptions: very long-duration projects (mining, infrastructure) or businesses in transition where 5 years isn't enough to reach steady state.", "tier": 2, "rank": 5708, "links": [{"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book: Intrinsic Valuation p.54", "h": "", "k": "ref"}, {"t": "400Q guide: DCF p.94", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 165, "so": 7}, {"id": "S710", "src": "supp", "section": "Discounted Cash Flow (DCF) – Assumptions and Analysis", "topic": "DCF Mechanics", "q": "Which of these is NOT part of the standard Unlevered FCF calculation?", "a": "C. Interest expense is NOT part of UFCF — it's specifically excluded because UFCF is the cash flow available to ALL capital providers (including debt holders, who are the ones receiving the interest).\n\nIncluding interest would double-count: you'd subtract it from operating cash flow AND discount at WACC (which already incorporates cost of debt). The whole point of UFCF/WACC is to value the operations independent of financing.\n\nLevered FCF includes interest because it's the cash flow to equity only.", "tier": 2, "rank": 5710, "links": [{"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book: Intrinsic Valuation p.54", "h": "", "k": "ref"}, {"t": "400Q guide: DCF p.94", "h": "", "k": "ref"}], "type": "trap", "flags": [], "options": ["Capital Expenditures", "Change in Net Working Capital", "Interest Expense", "Taxes on EBIT"], "correct": 2, "n": 166, "so": 7}, {"id": "S804", "src": "supp", "section": "Discounted Cash Flow (DCF) – The Discount Rate", "topic": "WACC", "q": "Why do we use AFTER-TAX cost of debt in WACC?", "a": "Because interest expense is tax-deductible — the IRS effectively subsidizes the cost of debt by reducing the company's tax bill. If a company pays 6% interest and the tax rate is 25%, the effective cost is 6% × (1 − 0.25) = 4.5%.\n\nWACC measures the actual economic cost of capital. Using pre-tax debt would overstate the burden of debt financing.", "tier": 2, "rank": 5804, "links": [{"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book: Intrinsic Valuation p.54", "h": "", "k": "ref"}, {"t": "400Q guide: Discount Rate p.103", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 167, "so": 8}, {"id": "S809", "src": "supp", "section": "Discounted Cash Flow (DCF) – The Discount Rate", "topic": "WACC", "q": "What's the process for getting an unlevered beta from comparable companies?", "a": "1) Identify 5-10 publicly-traded comparable companies.\n2) Pull each comp's levered (observed) beta from Bloomberg / a financial data provider.\n3) Unlever each comp's beta using its own debt/equity ratio and tax rate.\n4) Take the median (or mean) of the unlevered betas.\n5) Relever the median using your TARGET company's debt/equity ratio and tax rate.\n\nResult: a target-specific levered beta that reflects the comp set's business risk re-leveraged to the target's capital structure.", "tier": 2, "rank": 5809, "links": [{"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book: Intrinsic Valuation p.54", "h": "", "k": "ref"}, {"t": "400Q guide: Discount Rate p.103", "h": "", "k": "ref"}], "type": "recall", "flags": [], "n": 168, "so": 8}, {"id": "S810", "src": "supp", "section": "Discounted Cash Flow (DCF) – The Discount Rate", "topic": "WACC", "q": "Of the following, which would generally have the HIGHEST WACC?", "a": "B. The biotech. No debt means 100% of WACC is the cost of equity, which is going to be very high — high beta from clinical risk, no tax shield from debt. WACC could easily be 15%+.\n\nThe utility (A) has cheap debt (investment grade, tax-shielded) and lots of it — WACC maybe 6-7%.\nThe industrial (C) and consumer goods company (D) are in between, probably 7-9%.\n\nKey insight: NO debt does NOT mean LOW WACC. The opposite is often true — debt is cheap, and a heavily-equity-financed risky company has the highest WACC.", "tier": 2, "rank": 5810, "links": [{"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book: Intrinsic Valuation p.54", "h": "", "k": "ref"}, {"t": "400Q guide: Discount Rate p.103", "h": "", "k": "ref"}], "type": "trap", "flags": [], "options": ["A blue-chip utility with stable cash flows and 50% debt", "An early-stage biotech with no debt and binary clinical outcomes", "An investment-grade industrial with 30% debt", "A mature consumer goods company with 40% debt"], "correct": 1, "n": 169, "so": 8}, {"id": "S903", "src": "supp", "section": "Merger Models – Concepts", "topic": "M&A Concepts", "q": "Why do strategic buyers usually pay more than financial buyers?", "a": "Synergies. A strategic can extract cost synergies (eliminate duplicate functions, headcount, real estate) and revenue synergies (cross-selling, expanded distribution) that a financial buyer can't replicate. Those synergies are real value that can be shared with the seller via a higher price.\n\nFinancial buyers don't have synergies to share — they only have what they can do operationally. So their price ceiling is lower.", "tier": 2, "rank": 5903, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book: M&A Concepts p.73", "h": "", "k": "ref"}, {"t": "400Q guide: Merger Models p.107", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 170, "so": 9}, {"id": "S905", "src": "supp", "section": "Merger Models – Concepts", "topic": "M&A Concepts", "q": "What's the difference between revenue and cost synergies?", "a": "Cost synergies: operating expense reductions from combining — duplicate function eliminations, headcount reductions, real estate consolidation, supplier negotiating power, technology rationalization. Usually credible and achievable in 12-24 months.\n\nRevenue synergies: incremental top-line from cross-selling, broader product offering, expanded distribution. Generally less credible — they take longer to materialize, depend on integration execution, and are often discounted heavily by acquirers and the market.", "tier": 2, "rank": 5905, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book: M&A Concepts p.73", "h": "", "k": "ref"}, {"t": "400Q guide: Merger Models p.107", "h": "", "k": "ref"}], "type": "recall", "flags": [], "n": 171, "so": 9}, {"id": "S906", "src": "supp", "section": "Merger Models – Concepts", "topic": "M&A Concepts", "q": "Why are revenue synergies almost always discounted more heavily than cost synergies?", "a": "Three reasons:\n\n1) Execution risk. Cross-selling depends on sales teams, customer behavior, product fit — many things have to go right. Cost synergies are largely under management's control (you can just fire people).\n\n2) Timing. Revenue synergies often take 2-3+ years to materialize, while cost synergies hit in 12-18 months.\n\n3) Track record. Industry data shows revenue synergies systematically underperform initial estimates, while cost synergies (when management is competent) hit reliably.\n\nIn pitchbooks, bankers often present revenue synergies separately and at a deep discount, or treat them as 'upside.'", "tier": 2, "rank": 5906, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book: M&A Concepts p.73", "h": "", "k": "ref"}, {"t": "400Q guide: Merger Models p.107", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 172, "so": 9}, {"id": "S1007", "src": "supp", "section": "LBO Models – Concepts", "topic": "LBO", "q": "Why is debt paydown often called 'free equity' in LBOs?", "a": "Because every dollar of debt repaid transfers ownership of the company from creditors to equity holders, without requiring operational improvement or multiple expansion.\n\nSay you start with $700 debt and $300 equity in a $1,000 enterprise. After 5 years you've paid down $200 of debt: now it's $500 debt and $500 equity in the same $1,000 enterprise. Your equity went from $300 to $500 — a 67% gain — purely from debt amortization. The 'work' was just servicing debt with operating cash flow. That's why predictable cash-flow businesses make great LBO targets.", "tier": 2, "rank": 6007, "links": [{"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "Red Book: Private Equity Investing p.91", "h": "", "k": "ref"}, {"t": "Red Book: LBO Modeling p.104", "h": "", "k": "ref"}, {"t": "400Q guide: LBO p.119", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 173, "so": 11}, {"id": "S1009", "src": "supp", "section": "LBO Models – Concepts", "topic": "LBO", "q": "Why do PE firms care so much about EBITDA QUALITY, not just the absolute number?", "a": "Because debt service depends on real, recurring cash flow — not one-time gains or accounting noise.\n\nQuality concerns: non-recurring revenue (one-time projects), aggressive revenue recognition, capitalized expenses that should be opex, owner-manager perks (excess comp, related-party transactions), unsustainable cost cuts.\n\nQ of E (Quality of Earnings) reports are commissioned in nearly every deal to 'normalize' EBITDA — strip out non-recurring items, add back legitimate owner add-backs, and arrive at a sustainable run-rate number. The price the sponsor pays is anchored on that adjusted number, not the headline.", "tier": 2, "rank": 6009, "links": [{"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "Red Book: Private Equity Investing p.91", "h": "", "k": "ref"}, {"t": "Red Book: LBO Modeling p.104", "h": "", "k": "ref"}, {"t": "400Q guide: LBO p.119", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 174, "so": 11}, {"id": "S1010", "src": "supp", "section": "LBO Models – Concepts", "topic": "LBO", "q": "Which of the following would be the WORST LBO candidate?", "a": "C. Biotech is the worst LBO candidate by a wide margin:\n- Negative cash flow (can't service debt)\n- Binary outcomes (FDA approval / failure) = catastrophic downside risk\n- No collateralizable assets\n- High required reinvestment in R&D\n- Long time to commercialization vs PE hold period\n\nA (franchise restaurant): great LBO target — recurring royalty cash flow, low capex, scalable.\nB (consumer staples): classic LBO — predictable cash flows, modest growth, leverageable.\nD (industrial distributor): also strong — fragmented market = roll-up opportunity for add-on M&A.", "tier": 2, "rank": 6010, "links": [{"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "Red Book: Private Equity Investing p.91", "h": "", "k": "ref"}, {"t": "Red Book: LBO Modeling p.104", "h": "", "k": "ref"}, {"t": "400Q guide: LBO p.119", "h": "", "k": "ref"}], "type": "trap", "flags": [], "options": ["A franchise restaurant chain with predictable royalty streams and low capex", "A consumer staples company with stable margins and 4% organic growth", "An early-stage biotech burning cash on Phase 3 trials with binary outcomes", "An industrial distributor with fragmented competition and add-on opportunities"], "correct": 2, "n": 175, "so": 11}, {"id": "S1102", "src": "supp", "section": "Capital Markets (supplemental)", "topic": "Capital Markets", "q": "When would a company prefer debt over equity even though equity is more flexible?", "a": "When:\n- It has predictable cash flow to service interest\n- Tax shield is meaningful (high tax rate)\n- Stock is undervalued (don't want to issue cheap equity)\n- It wants to avoid signaling cash distress to the market (equity issuance often hammered)\n- Existing shareholders strongly oppose dilution (founders, controlling stake)\n- Its WACC math says more debt lowers cost of capital\n\nGeneral rule: profitable mature companies tilt to debt; growth companies and distressed companies tilt to equity.", "tier": 2, "rank": 6102, "links": [{"t": "Red Book: Debt & LevFin p.112", "h": "", "k": "ref"}, {"t": "Red Book: Equity Financing p.122", "h": "", "k": "ref"}, {"t": "400Q guide: DCM/LevFin p.131", "h": "", "k": "ref"}, {"t": "400Q guide: ECM p.145", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 176, "so": 18}, {"id": "S1104", "src": "supp", "section": "Capital Markets (supplemental)", "topic": "Capital Markets", "q": "What's leveraged finance and what are the main instruments?", "a": "Leveraged finance = debt issued by below-investment-grade (BB+ and below) companies, often to fund LBOs, M&A, or recaps.\n\nMain instruments:\n- Term Loan A (TLA): amortizing, held by banks, lower yield\n- Term Loan B (TLB): minimal amortization, held by institutional investors (CLOs), floating rate\n- High Yield Bonds: fixed-rate, 7-10 year, public market\n- Mezzanine: unsecured subordinated, often with warrants, gap-filler\n- Unitranche: blend of senior + subordinated in one tranche, common in middle-market", "tier": 2, "rank": 6104, "links": [{"t": "Red Book: Debt & LevFin p.112", "h": "", "k": "ref"}, {"t": "Red Book: Equity Financing p.122", "h": "", "k": "ref"}, {"t": "400Q guide: DCM/LevFin p.131", "h": "", "k": "ref"}, {"t": "400Q guide: ECM p.145", "h": "", "k": "ref"}], "type": "recall", "flags": [], "n": 177, "so": 18}, {"id": "S1203", "src": "supp", "section": "Synthesis (supplemental)", "topic": "Synthesis", "q": "Walk me through a typical sell-side M&A process.", "a": "1) Pitch and engagement: bank wins mandate, signs engagement letter.\n2) Preparation: bank builds CIM (Confidential Information Memorandum), management presentation, financial model, data room.\n3) Buyer outreach: target list created with client (typically 50-100 strategics + sponsors). NDA sent. Teaser distributed.\n4) First round: indicative bids from interested parties based on CIM. Bank narrows field.\n5) Second round: management presentations, site visits, data room access. Final bids submitted.\n6) Negotiation and exclusivity: select winning bidder, grant exclusivity (typically 4-6 weeks).\n7) Definitive agreement, signing.\n8) Regulatory approvals, financing close, closing.\n\nTimeline: usually 6-9 months from kickoff to close, longer for regulated industries.", "tier": 2, "rank": 6203, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}], "type": "recall", "flags": [], "n": 178, "so": 19}, {"id": "S1303", "src": "supp", "section": "Market Context (supplemental)", "topic": "Market Context", "q": "The implied equity risk premium is running around 4.2%, below its post-GFC average of ~5.2%. What does that tell you?", "a": "A compressed ERP means equities are priced aggressively — investors are accepting less compensation for equity risk than they historically have. Much of the compression is a fixed-income story: the risk-free rate has risen sharply, so even with solid earnings the 'extra' return for holding stocks over bonds has shrunk. In a DCF, a 4-5% ERP is a defensible build-up input today.", "tier": 2, "rank": 6303, "links": [{"t": "Red Book: General Market Knowledge p.133", "h": "", "k": "ref"}], "type": "concept", "flags": ["dated"], "n": 179, "so": 20}, {"id": "S1306", "src": "supp", "section": "Market Context (supplemental)", "topic": "Market Context", "q": "What is the single biggest structural theme driving power & energy M&A right now?", "a": "AI data-center electricity demand. Data-center power usage has grown dramatically since 2023, creating structural demand for 'firm,' 24/7 dispatchable power (nuclear + gas) and grid infrastructure - and power & utilities deal value rose sharply from 2024 into 2025-26 on the back of it. This is the thread connecting the biggest Energy deals: power scarcity, not renewables hype, is driving deal value. In the interview, cite the trend and the mechanism rather than precise growth percentages unless you've verified them from a current source.", "tier": 2, "rank": 6306, "links": [{"t": "Red Book: General Market Knowledge p.133", "h": "", "k": "ref"}], "type": "recall", "flags": ["dated", "power-theme"], "n": 180, "so": 20}, {"id": "S3002", "src": "supp", "section": "Finance Concepts", "topic": "Core Concepts", "q": "A division's IRR is 10%. The company's overall WACC is 11%, but its WACC for that specific region and industry is 8%. Should the company pursue the project?", "a": "Yes. You always compare IRR to the project- or division-specific WACC, not the company's overall WACC. Here the project IRR of 10% exceeds the relevant 8% WACC, so it creates value.\n\nThe trap is comparing the 10% IRR to the 11% company-wide WACC and rejecting it. The company's blended WACC is irrelevant unless the project's risk profile matches the whole company.\n\nIn practice you'd also weigh qualitative and market factors, but on the numbers alone it clears the hurdle.", "tier": 2, "rank": 8002, "links": [{"t": "BIWS module 01", "h": "", "k": "ref"}, {"t": "Red Book: Corporate Finance Theory p.45", "h": "", "k": "ref"}, {"t": "400Q guide: Finance Concepts p.46", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 181, "so": 0}, {"id": "S3003", "src": "supp", "section": "Finance Concepts", "topic": "Core Concepts", "q": "What factors would cause a company's Present Value to increase, and which factor does NOT affect its IRR?", "a": "Present Value increases if: (1) expected future cash flows rise, (2) the cash flow growth rate rises, or (3) your Discount Rate / opportunity cost falls.\n\nThe key distinction: your Discount Rate does NOT affect IRR. When you compute IRR you are solving for the discount rate that sets NPV to zero, so the discount rate is an output, not an input. IRR is driven by the cash flows, growth rate, the asking price, and the expected exit/selling price.\n\nIn an interview, lead with 'PV depends on the discount rate; IRR does not, because IRR IS a discount rate you're solving for.'", "tier": 2, "rank": 8003, "links": [{"t": "BIWS module 01", "h": "", "k": "ref"}, {"t": "Red Book: Corporate Finance Theory p.45", "h": "", "k": "ref"}, {"t": "400Q guide: Finance Concepts p.46", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 182, "so": 0}, {"id": "S3004", "src": "supp", "section": "Finance Concepts", "topic": "Core Concepts", "q": "You invest $1,000 today and receive $2,000 after 5 years (no cash flows in between). Which is closest to the IRR?", "a": "Correct answer: ~15%. IRR is the compounded annual rate that turns $1,000 into $2,000 over 5 years: $1,000 × (1 + IRR)^5 = $2,000, so (1+IRR)^5 = 2, giving IRR ≈ 14.9%.\n\nMental-math shortcut – the Rule of 72: to double money in 5 years you need roughly 72 / 5 ≈ 14.4% per year, which is right next to the precise 14.9%. Don't fall for the naive 20% (which would be $1,000 × 100% / 5 years and ignores compounding).", "tier": 2, "rank": 8004, "links": [{"t": "BIWS module 01", "h": "", "k": "ref"}, {"t": "Red Book: Corporate Finance Theory p.45", "h": "", "k": "ref"}, {"t": "400Q guide: Finance Concepts p.46", "h": "", "k": "ref"}], "type": "trap", "flags": [], "options": ["10%", "~15%", "20%", "25%"], "correct": 1, "n": 183, "so": 0}, {"id": "S3012", "src": "supp", "section": "Accounting – Concepts", "topic": "Accounting Concepts", "q": "Why is Stock-Based Compensation a non-cash expense, yet still a 'real' cost to investors – unlike Depreciation?", "a": "SBC is non-cash in the period: it reduces Pre-Tax Income and is added back on the Cash Flow Statement, just like Depreciation, and it lowers taxes without using cash.\n\nBut unlike D&A, SBC imposes a real economic cost because it issues new shares, diluting existing owners. If current investors owned 99% before, they might own only 97–98% after.\n\nSo the CFO's claim that SBC 'costs nothing' is only half right – it costs no cash, but it dilutes ownership and makes the company less valuable per share. In an interview, flag that dilution is the catch.", "tier": 2, "rank": 8012, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements p.13", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Concepts p.50", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 184, "so": 1}, {"id": "S3013", "src": "supp", "section": "Accounting – Concepts", "topic": "Accounting Concepts", "q": "Why would a company write down an asset, and what's the financial-statement impact at a high level?", "a": "A company writes down an asset when its value has fallen materially and the Balance Sheet carrying value is no longer accurate – e.g., a factory damaged by a hurricane or made obsolete by new technology.\n\nImpact: it's recorded as an expense on the Income Statement (reducing Pre-Tax Income and Net Income), then added back as a non-cash item on the Cash Flow Statement. On the Balance Sheet, Cash actually rises (tax savings), the asset's value falls, and Retained Earnings falls to balance.\n\nUnlike Depreciation, a write-down is a one-time event – the company doesn't expect to repeat it every year.", "tier": 2, "rank": 8013, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements p.13", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Concepts p.50", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 185, "so": 1}, {"id": "S3017", "src": "supp", "section": "Accounting – Concepts", "topic": "Accounting Concepts", "q": "Under accrual accounting, a customer buys a $1,000 TV on a credit card. What happens at the moment of sale?", "a": "Correct answer: Revenue is recognized immediately and Accounts Receivable increases by $1,000; Cash does not change yet.\n\nUnder accrual accounting, revenue is recorded when earned (delivery), not when cash arrives. The sale hits Revenue right away, but the offsetting entry is Accounts Receivable, not Cash. Only when the payment processor deposits funds does AR convert to Cash.\n\nUnder cash-based accounting (not the case here) nothing would be recorded until the cash actually landed in the bank
