r P/E company that's acquiring → accretive. Lower P/E acquiring higher P/E → dilutive.", "tier": 3, "rank": 5907, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book: Accretion/Dilution p.81", "h": "", "k": "ref"}, {"t": "400Q guide: Merger Calcs p.114", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 308, "so": 10}, {"id": "S908", "src": "supp", "section": "Merger Models – Calculations", "topic": "M&A Calcs", "q": "Acquirer uses 100% cash to buy a target with P/E = 15x. Cost of debt (financing) = 5%, tax rate = 25%. Accretive?", "a": "Yes, accretive.\n\nMath: target earnings yield = 1 / 15 = 6.7%. After-tax cost of debt = 5% × (1 − 0.25) = 3.75%.\n\nYou're 'buying' earnings at a 6.7% yield using debt that costs you 3.75%. Each dollar of debt-funded acquisition generates more earnings than it costs in interest. EPS rises.\n\nRule of thumb for cash deals: accretive if target's earnings yield (1/P/E) > after-tax cost of debt used to fund it.", "tier": 3, "rank": 5908, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book: Accretion/Dilution p.81", "h": "", "k": "ref"}, {"t": "400Q guide: Merger Calcs p.114", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 309, "so": 10}, {"id": "S909", "src": "supp", "section": "Merger Models – Concepts", "topic": "M&A Concepts", "q": "When would a strategic buyer NOT pay more than a financial buyer for a given target?", "a": "Several scenarios:\n\n1) No real synergies. If the target's business is completely orthogonal to the strategic's operations, there's nothing to extract — the strategic loses its premium-paying ability.\n\n2) Antitrust constraints. The deal that would extract maximum synergies might not clear regulators, so the strategic can't realize them.\n\n3) Integration risk. If the strategic has a poor M&A track record or the target's culture is incompatible, the board may want to discount the bid.\n\n4) Stretched balance sheet. The strategic might not have the capacity to fund the deal at the level a sponsor (with a fresh equity check and leverage) can.\n\n5) Strategic shift. If the target doesn't fit the strategic's go-forward strategy, they exit the auction early.", "tier": 3, "rank": 5909, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book: M&A Concepts p.73", "h": "", "k": "ref"}, {"t": "400Q guide: Merger Models p.107", "h": "", "k": "ref"}], "type": "compare", "flags": [], "n": 310, "so": 9}, {"id": "S1008", "src": "supp", "section": "LBO Models – Concepts", "topic": "LBO", "q": "Of the three return drivers (debt paydown, EBITDA growth, multiple expansion), which is most controllable for a PE firm? Which is least?", "a": "Most controllable: Debt paydown. As long as the business generates cash, you direct it to pay down debt. Fully within management's control given a stable business.\n\nMiddle: EBITDA growth. Partly controllable through ops improvements, pricing, M&A. But also depends on market conditions.\n\nLeast controllable: Multiple expansion. Depends on entry/exit timing, market conditions, sentiment, comparable transactions at exit. PE firms typically do NOT underwrite multiple expansion — if the deal only works at a higher exit multiple, it's a red flag.", "tier": 3, "rank": 6008, "links": [{"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "Red Book: Private Equity Investing p.91", "h": "", "k": "ref"}, {"t": "Red Book: LBO Modeling p.104", "h": "", "k": "ref"}, {"t": "400Q guide: LBO p.119", "h": "", "k": "ref"}], "type": "compare", "flags": [], "n": 311, "so": 11}, {"id": "S1105", "src": "supp", "section": "Capital Markets (supplemental)", "topic": "Capital Markets", "q": "A profitable company growing 30% YoY needs $500M to fund expansion. Debt or equity? Why?", "a": "Depends on a few factors, but the lean is probably equity (or a mix), here's why:\n\n- Heavy debt strains a high-growth company that needs flexibility to reinvest. Fixed interest payments compete with growth capex.\n- Lenders apply tighter terms (lower leverage multiples) to growth companies because cash flow is being reinvested, not held in reserve.\n- High-growth companies often trade at premium multiples, making equity issuance less dilutive in $ terms than it looks.\n- Equity also gives them a balance sheet cushion for future opportunities.\n\nMix often makes sense: $200-300M of debt + $200-300M of equity, preserving optionality.", "tier": 3, "rank": 6105, "links": [{"t": "Red Book: Debt & LevFin p.112", "h": "", "k": "ref"}, {"t": "Red Book: Equity Financing p.122", "h": "", "k": "ref"}, {"t": "400Q guide: DCM/LevFin p.131", "h": "", "k": "ref"}, {"t": "400Q guide: ECM p.145", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 312, "so": 18}, {"id": "S1107", "src": "supp", "section": "Capital Markets (supplemental)", "topic": "Capital Markets", "q": "Why might a company issue convertible bonds instead of straight debt or straight equity?", "a": "Convertibles are debt that converts into equity at a pre-set price/ratio, usually at a premium to the current stock.\n\nWhy issue them:\n- Lower coupon than straight debt (the conversion option has value to investors)\n- Less dilution than an immediate equity issuance (conversion happens later, often after the stock has appreciated)\n- Useful for high-growth or volatile-stock companies (high implied volatility makes the conversion option valuable to investors, lowering the coupon further)\n- Avoids the negative signaling of an outright equity raise\n\nWhy issue them carefully: if the stock rises, conversion is dilutive; if it falls, you still owe the principal. Often paired with a 'call spread' (capped call) to hedge the dilution.", "tier": 3, "rank": 6107, "links": [{"t": "Red Book: Debt & LevFin p.112", "h": "", "k": "ref"}, {"t": "Red Book: Equity Financing p.122", "h": "", "k": "ref"}, {"t": "400Q guide: DCM/LevFin p.131", "h": "", "k": "ref"}, {"t": "400Q guide: ECM p.145", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 313, "so": 18}, {"id": "S1201", "src": "supp", "section": "Synthesis (supplemental)", "topic": "Synthesis", "q": "Your DCF produces an Enterprise Value 30% above the current trading multiple. What does that tell you?", "a": "Three main possibilities:\n\n1) The market is wrong — stock is undervalued, and a buy recommendation could be warranted (a contrarian view). Rare to bet on.\n\n2) Your DCF assumptions are too optimistic — projection growth, margins, or terminal value too aggressive. Stress-test by lowering revenue growth 2-3 pts and re-checking.\n\n3) There's missing information the market sees that you don't — concentration risk, regulatory threat, contract loss, management departure. Re-check the equity story.\n\nGood analysts present BOTH numbers, explain the gap, and identify what assumptions would need to be true for one or the other to be right. Triangulation > false precision.", "tier": 3, "rank": 6201, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}], "type": "compare", "flags": [], "n": 314, "so": 19}, {"id": "S1204", "src": "supp", "section": "Synthesis (supplemental)", "topic": "Synthesis", "q": "When would you anchor your valuation on DCF vs. trading comps vs. precedent transactions in a real engagement?", "a": "DCF anchors when: business has predictable cash flows, the analyst has high conviction on assumptions, intrinsic story matters more than market quirks. Common for mature, cash-generating companies; less common for early-stage or cyclical businesses.\n\nTrading comps anchor when: pricing for a minority transaction (IPO, follow-on, sale of a non-controlling stake) where control premium isn't relevant. Or when liquid comparable set exists.\n\nPrecedent transactions anchor when: pricing a controlling stake or whole-company sale where control premiums are relevant. Most relevant in M&A advisory.\n\nIn practice: present a 'football field' showing the range from all methods. Argue for where in that range the actual price lands based on facts of the deal. Never pick one number — always pick a range and defend it.", "tier": 3, "rank": 6204, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}], "type": "compare", "flags": [], "n": 315, "so": 19}, {"id": "S1205", "src": "supp", "section": "Synthesis (supplemental)", "topic": "Synthesis", "q": "When might a seller prefer to sell to a financial sponsor (PE) instead of a strategic, even if the strategic offers a higher price?", "a": "Several scenarios:\n\n1) Continuity for management/employees. PE typically retains management and brand. A strategic often consolidates and lays off duplicate functions.\n\n2) Speed and certainty of close. PE can move fast with no antitrust concerns. Strategic deals can drag for regulatory review.\n\n3) Second bite at the apple. PE often offers management an equity rollover — owner sells 70% now, keeps 30% in the new entity, sells again when PE exits in 5 years. Strategics rarely offer this.\n\n4) Independence and brand preservation. Founder-sellers often emotionally prefer their company to remain standalone.\n\n5) Deal certainty in financing. PE has committed equity from the fund; strategics may have board / financing risk.\n\n6) Confidentiality during process — fewer competitive concerns sharing data with a non-competitor.", "tier": 3, "rank": 6205, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 316, "so": 19}, {"id": "S1304", "src": "supp", "section": "Market Context (supplemental)", "topic": "Market Context", "q": "Roughly what EV/EBITDA multiples do profitable industrials vs. oil & gas E&P companies trade at, and why the gap?", "a": "Avoid quoting one precise multiple - levels move and vary hugely by subsector. The reliable directional answer: oil & gas E&P trades among the LOWEST EV/EBITDA multiples of any sector (typically mid-single digits), while diversified industrials trade at a meaningful premium with a very wide range - high-quality compounders and aerospace names at the top, heavy cyclicals far lower.\n\nWhy the gap: cash-flow quality and durability. E&P is cyclical, capital-intensive, and commodity-priced (often valued on NAV as much as on multiples), while the best industrials have recurring aftermarket revenue and pricing power.\n\nAlways give a range, frame it as order-of-magnitude, and verify current sector multiples (e.g., Damodaran's sector data or a comps screen) shortly before the interview rather than memorizing a number.", "tier": 3, "rank": 6304, "links": [{"t": "Red Book: General Market Knowledge p.133", "h": "", "k": "ref"}], "type": "compare", "flags": ["dated", "power-theme"], "n": 317, "so": 20}, {"id": "S3007", "src": "supp", "section": "Finance Concepts", "topic": "Core Concepts", "q": "A friend pitches a real estate deal promising 10% annual returns. Should you invest?", "a": "It depends entirely on your opportunity cost and the risk relative to your alternatives – 10% in isolation tells you nothing.\n\nIf you could earn 12% elsewhere at the SAME risk, this deal makes no sense. If your best alternative at comparable risk is 7%, the deal looks attractive.\n\nThe most common mistake people make is failing to risk-adjust: a 10% return on something far riskier than your alternatives may actually be a bad deal. The right framing is always 'return per unit of risk versus my next-best option.'", "tier": 3, "rank": 8007, "links": [{"t": "BIWS module 01", "h": "", "k": "ref"}, {"t": "Red Book: Corporate Finance Theory p.45", "h": "", "k": "ref"}, {"t": "400Q guide: Finance Concepts p.46", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 318, "so": 0}, {"id": "S3010", "src": "supp", "section": "Accounting – Concepts", "topic": "Accounting Concepts", "q": "How do Prepaid Expenses, Accounts Payable, and Accrued Expenses differ, and why is a Prepaid Expense an Asset?", "a": "Prepaid Expenses: paid in cash already, but NOT yet incurred as an expense (not yet on the IS). It's an Asset because when it later hits the IS it will reduce future taxes – a future benefit.\n\nAccounts Payable & Accrued Expenses: incurred as an expense already (on the IS), but NOT yet paid in cash. They're Liabilities because paying them later will reduce cash.\n\nAP vs. Accrued Expenses: AP is for specific invoiced items (e.g., a legal bill); Accrued Expenses is for recurring items without an invoice yet (e.g., utilities, wages). Prepaid is the mirror image of AP – cash out first vs. expense first.", "tier": 3, "rank": 8010, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements p.13", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Concepts p.50", "h": "", "k": "ref"}], "type": "compare", "flags": [], "n": 319, "so": 1}, {"id": "S3014", "src": "supp", "section": "Accounting – Concepts", "topic": "Accounting Concepts", "q": "A company sells equipment for $85 that was carried at $100 on the Balance Sheet, recording a $15 Loss. Why is that Loss treated as a non-cash expense?", "a": "Because you did not actually lose any cash this period – you RECEIVED $85 in cash from the buyer. The 'Loss' simply reflects that in some prior period you paid more than $85 for the equipment.\n\nNon-cash adjustments are about what happens in the current period. This period, cash went up by $85 (plus the tax savings on the $15 Loss). So you reverse the $15 Loss on the Cash Flow Statement because it didn't consume cash now.\n\nThe full proceeds ($85) show up in Cash Flow from Investing; the $15 Loss is added back in CFO.", "tier": 3, "rank": 8014, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements p.13", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Concepts p.50", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 320, "so": 1}, {"id": "S3016", "src": "supp", "section": "Accounting – Concepts", "topic": "Accounting Concepts", "q": "A company prepays a full year of rent to get a 10% discount. Does this boost its cash flow?", "a": "Not in the short term. By paying 12 months of rent in one month, the company has a large immediate cash outflow. On the Income Statement in Month 1 it still records only one month of rent expense; the rest sits in Prepaid Expenses (an Asset). The full prepayment shows as a negative 'Change in Prepaid Expenses' on the Cash Flow Statement.\n\nSince a 10% discount is only just over one month of rent, near-term cash flow drops sharply.\n\nIn the long term, the discount improves cash flow once the timing difference unwinds over the year.", "tier": 3, "rank": 8016, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements p.13", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Concepts p.50", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 321, "so": 1}, {"id": "S3022", "src": "supp", "section": "Accounting – Concepts", "topic": "Cash Flow Statement", "q": "A company in distress sells a factory carried at $100 for $80, recording a $20 Loss (40% tax). What is the total change in cash, and where does each piece show up?", "a": "Cash increases by $88.\n\nIncome Statement: $20 Loss → Pre-Tax Income down $20, Net Income down $12 (at 40% tax).\n\nCash Flow Statement: start with Net Income down $12, add back the $20 non-cash Loss (+$8 so far in CFO), then show the full $80 proceeds in Cash Flow from Investing. Net: –$12 + $20 + $80 = +$88.\n\nIntuition: the company gets $80 of proceeds PLUS $8 of tax savings from the Loss ($20 × 40%), so cash rises by $88, not just $80.", "tier": 3, "rank": 8022, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements p.13", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Concepts p.50", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 322, "so": 1}, {"id": "S3024", "src": "supp", "section": "Accounting – Concepts", "topic": "Cash Flow Statement", "q": "A subscription company collects a full year of cash upfront from customers. Why does it do this and what's the cash flow impact?", "a": "It collects upfront because of the time value of money – cash sooner is always better – and because it has the market power to demand it (often sweetened with a discount or bonus).\n\nThis boosts cash flow now. It corresponds to Deferred Revenue: when DR increases, it appears as a positive item in Cash Flow from Operations, raising cash even though the revenue hasn't been recognized yet.\n\nLater, as the service is delivered and revenue is recognized, Deferred Revenue declines, which shows up as a negative on the CFS. So the cash benefit is front-loaded relative to the accounting revenue.", "tier": 3, "rank": 8024, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements p.13", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Concepts p.50", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 323, "so": 1}, {"id": "S3027", "src": "supp", "section": "Accounting – Calculations", "topic": "Statement Linkages", "q": "Operating Expenses increase by $100 (40% tax). Walk me through all three statements.", "a": "Income Statement: OpEx up $100 → Pre-Tax Income down $100 → Net Income down $60 (at 40% tax).\n\nCash Flow Statement: Net Income down $60. No non-cash or other adjustments, so cash at the bottom is down $60.\n\nBalance Sheet: Cash down $60, so Assets down $60. Retained Earnings down $60 (lower Net Income), so L&E down $60. Both sides balance.\n\nIntuition: it's a plain cash expense – no add-backs, no Balance Sheet asset changes. This is the simplest 'true cash item' case; the only effect is a $60 after-tax hit to cash and equity.", "tier": 3, "rank": 8027, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements p.13", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Calcs p.59", "h": "", "k": "ref"}], "type": "walkthrough", "flags": [], "n": 324, "so": 2}, {"id": "S3028", "src": "supp", "section": "Accounting – Calculations", "topic": "Statement Linkages", "q": "A company swaps an employee's $100 cash salary for $120 of stock options (40% tax). Walk me through the statements.", "a": "Think of it as cash OpEx down $100 (salary gone) and a new $120 non-cash SBC expense – net OpEx up $20.\n\nIncome Statement: expenses up $20 → Pre-Tax Income down $20 → Net Income down $12.\n\nCash Flow Statement: Net Income down $12, but add back the full $120 of SBC (non-cash) → cash up $108.\n\nBalance Sheet: Cash up $108 (Assets +$108). On L&E, Retained Earnings down $12 (lower NI) but Common Stock & APIC up $120 (SBC) → L&E up $108. Balances.\n\nIntuition: the firm saves cash and gets a tax shield – but its share count rises (dilution), which is the real cost.", "tier": 3, "rank": 8028, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements p.13", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Calcs p.59", "h": "", "k": "ref"}], "type": "walkthrough", "flags": [], "n": 325, "so": 2}, {"id": "S3032", "src": "supp", "section": "Accounting – Calculations", "topic": "Statement Linkages", "q": "If you could keep only two of the three financial statements to assess a company, which would you keep and why?", "a": "Keep the Income Statement and the Balance Sheet.\n\nReason: given a beginning and ending Balance Sheet for the same period plus the Income Statement, you can reconstruct the Cash Flow Statement entirely – Net Income from the IS, non-cash items and working-capital changes from comparing the two Balance Sheets.\n\nThe reverse is much harder: you cannot easily rebuild an Income Statement from the Balance Sheet and Cash Flow Statement alone. So the IS + BS pair is the more powerful combination.", "tier": 3, "rank": 8032, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements p.13", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Calcs p.59", "h": "", "k": "ref"}], "type": "compare", "flags": [], "n": 326, "so": 2}, {"id": "S3036", "src": "supp", "section": "Accounting – Calculations", "topic": "Accounting Calcs", "q": "A company has $1,000 revenue, $200 COGS, $700 operating expenses, no D&A or interest, and a 40% tax rate. Calculate EBIT, Pre-Tax Income, taxes, and Net Income.", "a": "Revenue $1,000 – COGS $200 = Gross Profit $800.\nGross Profit $800 – OpEx $700 = Operating Income (EBIT) $100.\nNo interest, so Pre-Tax Income = EBIT = $100.\nTaxes = 40% × $100 = $40.\nNet Income = $100 – $40 = $60.\n\nSo EBIT = $100, Pre-Tax Income = $100, Taxes = $40, Net Income = $60.\n\nMental-math tip: with no D&A or interest, EBIT = EBITDA = Pre-Tax Income here, and Net Income is just EBIT × (1 – tax rate) = $100 × 0.6 = $60.", "tier": 3, "rank": 8036, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statement Analysis p.27", "h": "", "k": "ref"}, {"t": "Red Book: Advanced Accounting p.35", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Calcs p.59", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 327, "so": 2}, {"id": "S3038", "src": "supp", "section": "Accounting – Calculations", "topic": "Accounting Calcs", "q": "A company has EBITDA of $500, D&A of $100, interest expense of $50, and a 25% tax rate. What is its Net Income?", "a": "EBITDA $500 – D&A $100 = EBIT $400.\nEBIT $400 – Interest $50 = Pre-Tax Income $350.\nTaxes = 25% × $350 = $87.5.\nNet Income = $350 – $87.5 = $262.5.\n\nMental-math tip: Net Income = Pre-Tax Income × (1 – tax rate) = $350 × 0.75. Take 3/4 of $350: $350 – $87.5 = $262.5. Walking EBITDA → EBIT → Pre-Tax → Net Income (subtract D&A, then interest, then tax) is the standard chain interviewers expect you to recite cleanly.", "tier": 3, "rank": 8038, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statement Analysis p.27", "h": "", "k": "ref"}, {"t": "Red Book: Advanced Accounting p.35", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Calcs p.59", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 328, "so": 2}, {"id": "S3039", "src": "supp", "section": "Accounting – Calculations", "topic": "Accounting Calcs", "q": "A company writes down half of $400 of acquisition Goodwill in Year 2 (40% tax). Walk through the statements and give the ending Goodwill balance.", "a": "Half of $400 = a $200 Goodwill write-down; ending Goodwill = $200.\n\nIncome Statement: $200 write-down → Pre-Tax Income down $200 → Net Income down $120 (40% tax).\n\nCash Flow Statement: Net Income down $120, add back the $200 non-cash write-down → cash up $80.\n\nBalance Sheet: Cash up $80, Goodwill down $200 → Assets down $120. Retained Earnings down $120 → L&E down $120. Balances.\n\nIntuition: the write-down is non-cash and shields taxes, so cash rises $80 ($200 × 40%). (Advanced note: Goodwill impairments are often not deductible for cash-tax purposes, so a DTL may be involved in real life – don't raise this unprompted.)", "tier": 3, "rank": 8039, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statement Analysis p.27", "h": "", "k": "ref"}, {"t": "Red Book: Advanced Accounting p.35", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Calcs p.59", "h": "", "k": "ref"}], "type": "walkthrough", "flags": [], "n": 329, "so": 2}, {"id": "S3040", "src": "supp", "section": "Accounting – Calculations", "topic": "Accounting Calcs", "q": "An acquirer pays $1,000 for a company whose Common Shareholders' Equity is $400. It allocates $200 to identifiable intangible assets. How much Goodwill is created?", "a": "Goodwill = Purchase Price – Seller's Equity – Identifiable Intangibles allocated (and any asset write-ups).\n\n$1,000 – $400 = $600 'gap' over book equity. You first allocate $200 to identifiable intangibles (patents, trademarks, customer relationships), leaving $400.\n\nGoodwill = $400.\n\nThe purpose of Goodwill and intangibles is to make the Balance Sheet balance after you wipe out the seller's $400 equity but pay $1,000 cash – the $600 gap must be parked somewhere on the Assets side.", "tier": 3, "rank": 8040, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statement Analysis p.27", "h": "", "k": "ref"}, {"t": "Red Book: Advanced Accounting p.35", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Calcs p.59", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 330, "so": 2}, {"id": "S3041", "src": "supp", "section": "Accounting – Calculations", "topic": "Accounting Calcs", "q": "Working Capital rises from $50 to $200. What is the Change in Working Capital shown on the Cash Flow Statement, and what's the cash impact?", "a": "On the Cash Flow Statement the Change in Working Capital is recorded as Old WC – New WC = $50 – $200 = –$150.\n\nSo it's a $150 USE of cash. When operating Working Capital increases, the company has tied up cash (e.g., more Inventory or Receivables), reducing cash flow. When WC decreases, it FREES UP cash.\n\nThe sign trap: simple subtraction (new – old = +$150) looks positive, but the CFS convention flips it because rising operating assets consume cash. Always reason from 'is this a source or use of cash?'", "tier": 3, "rank": 8041, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statement Analysis p.27", "h": "", "k": "ref"}, {"t": "Red Book: Advanced Accounting p.35", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Calcs p.59", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 331, "so": 2}, {"id": "S3043", "src": "supp", "section": "Accounting – Calculations", "topic": "Accounting Calcs", "q": "A company's ROA rose from 10% to 15% while its ROE fell from 25% to 18% over five years. What could explain this?", "a": "Both ratios have Net Income on top, so the divergence must come from the denominators (Total Assets for ROA, Equity for ROE).\n\nThe rising ROA means assets grew slower than (or shrank relative to) Net Income. The falling ROE means Equity grew faster than Net Income.\n\nA likely cause: the company keeps issuing equity to fund a cash-burning business. New stock boosts Equity and props up cash, but Total Assets don't grow much because the raised cash just offsets operating losses. So Equity inflates (dragging ROE down) while assets stay lean (lifting ROA).\n\nSanity check for interviews: since Equity ≤ Total Assets, ROE can never fall below ROA (when both use Net Income) — the two can converge, but never cross.", "tier": 3, "rank": 8043, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statement Analysis p.27", "h": "", "k": "ref"}, {"t": "Red Book: Advanced Accounting p.35", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Calcs p.59", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 332, "so": 2}, {"id": "S3044", "src": "supp", "section": "Accounting – Calculations", "topic": "Accounting Calcs", "q": "Would you expect a retailer or an airline to have a higher Asset Turnover Ratio?", "a": "The retailer, generally. Asset Turnover = Revenue / Average Assets, so it measures how efficiently assets generate sales.\n\nRetailers are less asset-dependent – they sell inventory and frequently LEASE their stores rather than owning huge fixed-asset bases, so they spin a lot of revenue off a relatively small asset base.\n\nAirlines are extremely asset-heavy: revenue depends entirely on owning (or operating) costly aircraft and infrastructure, so the denominator is large and turnover is lower. The rule of thumb: capital-intensive businesses have low asset turnover.", "tier": 3, "rank": 8044, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statement Analysis p.27", "h": "", "k": "ref"}, {"t": "Red Book: Advanced Accounting p.35", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Calcs p.59", "h": "", "k": "ref"}], "type": "compare", "flags": [], "n": 333, "so": 2}, {"id": "S3047", "src": "supp", "section": "Equity Value & Enterprise Value – Calculations", "topic": "EV / Equity Value", "q": "A company has Current Equity Value of $200, Cash of $50, and Debt of $100. It spends $25 of Cash to buy PP&E. How do Equity Value and Enterprise Value change?", "a": "Starting Enterprise Value = Equity Value + Debt – Cash = $200 + $100 – $50 = $250.\n\nEquity Value does NOT change: from Equity Value's perspective, Cash and PP&E are both just Assets, so swapping one for the other is neutral.\n\nEnterprise Value INCREASES by $25: the company converted a non-core Asset (Cash) into a core-business Asset (PP&E). Recompute with Cash now $25: $200 + $100 – $25 = $275.\n\nResult: P/E unchanged, EV/EBITDA rises (EV up, EBITDA roughly unchanged).", "tier": 3, "rank": 8047, "links": [{"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Corporate Finance Theory p.45", "h": "", "k": "ref"}, {"t": "400Q guide: EV/Equity Value p.71", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 334, "so": 4}, {"id": "S3048", "src": "supp", "section": "Equity Value & Enterprise Value – Calculations", "topic": "EV / Equity Value", "q": "A company issues $200 million of new shares. How do Equity Value, Enterprise Value, P/E, and EV/EBITDA change?", "a": "Equity Value increases by $200M (new shares).\n\nEnterprise Value is UNCHANGED: the $200M of new Cash is a non-core Asset that exactly offsets the higher Equity Value (EV = Equity Value + Debt – Cash; both Equity Value and Cash rise $200M).\n\nMultiples: P/E increases (Equity Value up, Net Income unchanged in the short run). EV/EBITDA is unchanged (EV flat, EBITDA flat).\n\nThis is the canonical example of why financing events move Equity Value but not Enterprise Value.", "tier": 3, "rank": 8048, "links": [{"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Corporate Finance Theory p.45", "h": "", "k": "ref"}, {"t": "400Q guide: EV/Equity Value p.71", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 335, "so": 4}, {"id": "S3051", "src": "supp", "section": "Equity Value & Enterprise Value – Calculations", "topic": "EV / Equity Value", "q": "A company issues a press release saying it now expects 20% revenue growth instead of 10%. How do Equity Value and Enterprise Value change?", "a": "Both increase. This is an OPERATIONAL change – it makes the core business more valuable.\n\nEnterprise Value rises because the core-business Assets are now expected to generate higher growth and thus more cash flow.\n\nEquity Value also rises because Equity Value reflects ALL Assets, and those Assets are now worth more given the higher expected growth.\n\nIntuition: a positive operational surprise typically lifts the share price, which is exactly a higher Equity Value, and a higher Enterprise Value alongside it. Operational changes move both; financing changes move only Equity Value.", "tier": 3, "rank": 8051, "links": [{"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Corporate Finance Theory p.45", "h": "", "k": "ref"}, {"t": "400Q guide: EV/Equity Value p.71", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 336, "so": 4}, {"id": "S3056", "src": "supp", "section": "Equity Value & Enterprise Value – Concepts", "topic": "EV / Equity Value", "q": "Why does Enterprise Value NOT necessarily represent the true cost to acquire a company?", "a": "Three reasons:\n\n(1) Debt: the buyer may not have to repay the seller's Debt 1-for-1; in ~99% of cases they repay or refinance it, but exceptions exist.\n\n(2) Cash: the buyer doesn't necessarily 'get' the entire Cash balance – the business needs a minimum operating Cash level, so Cash may not reduce the effective price dollar-for-dollar.\n\n(3) Fees: Enterprise Value excludes M&A advisory, legal, accounting, and financing fees, which add to the real acquisition cost.\n\nSo Enterprise Value is a clean theoretical measure of operating value, not the literal check the buyer writes.", "tier": 3, "rank": 8056, "links": [{"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Corporate Finance Theory p.45", "h": "", "k": "ref"}, {"t": "400Q guide: EV/Equity Value p.71", "h": "", "k": "ref"}], "type": "compare", "flags": [], "n": 337, "so": 3}, {"id": "S3060", "src": "supp", "section": "Valuation Methodologies", "topic": "Valuation Methods", "q": "When are Public Comps or Precedent Transactions more useful than a DCF?", "a": "When the company is early-stage and you cannot reasonably forecast its future cash flows – or when there's no plausible path to positive cash flow at all – a DCF breaks down, so you lean on market-based methods.\n\nThey're also more useful when the DCF itself runs into problems: you can't reliably estimate the Discount Rate, or cash flows fluctuate wildly and resist forecasting.\n\nConversely, the DCF shines for mature companies with stable, predictable cash flows, or when good comparables and precedent deals simply don't exist.", "tier": 3, "rank": 8060, "links": [{"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Relative Valuation p.65", "h": "", "k": "ref"}, {"t": "400Q guide: Valuation Methodologies p.81", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 338, "so": 5}, {"id": "S3066", "src": "supp", "section": "Valuation Metrics and Multiples", "topic": "Valuation Multiples", "q": "Graphing peer EV/EBITDA multiples against revenue growth, EBITDA margins, and EBITDA growth – which metric most likely correlates strongest with the multiples?", "a": "EBITDA growth rate. Since value depends on cash-flow growth, the operational metric closest to cash-flow growth will correlate best – and EBITDA growth is nearer to cash-flow growth than revenue growth is.\n\nEBITDA margins matter little unless they're CHANGING – only changing margins produce different growth rates. Revenue growth has some correlation, but it's stronger with EV/Revenue multiples than EV/EBITDA.\n\nThe principle: match the growth metric to the multiple's basis, and remember that growth (not level) of the relevant metric is what drives valuation multiples.", "tier": 3, "rank": 8066, "links": [{"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Relative Valuation p.65", "h": "", "k": "ref"}, {"t": "400Q guide: Metrics & Multiples p.88", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 339, "so": 6}, {"id": "S3067", "src": "supp", "section": "Valuation Metrics and Multiples", "topic": "Valuation Multiples", "q": "A company has EV/EBITDA of 12x, Enterprise Value of $12,000, EBITDA of $1,000, Unlevered FCF of $500, and a 10% Discount Rate. What FCF growth rate does the market imply?", "a": "Use Company Value = Cash Flow / (Discount Rate – Growth Rate), with Enterprise Value and Unlevered FCF:\n\n$12,000 = $500 / (10% – g)\n$12,000 × (10% – g) = $500\n$1,200 – $12,000g = $500\n$12,000g = $700\ng = 5.8%.\n\nSo the market is pricing in ~5.8% long-term FCF growth. You'd then compare that to your own growth view: if you think the company can only grow ~3%, it looks overvalued; if you expect 8%, it may be cheap. This 'implied growth from the multiple' check is a powerful sanity test.", "tier": 3, "rank": 8067, "links": [{"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Relative Valuation p.65", "h": "", "k": "ref"}, {"t": "400Q guide: Metrics & Multiples p.88", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 340, "so": 6}, {"id": "S3068", "src": "supp", "section": "Valuation Metrics and Multiples", "topic": "Valuation Multiples", "q": "Why pair Equity Value with Net Income (P/E) but Enterprise Value with EBITDA – what's the matching rule?", "a": "The rule: the numerator's investor scope must match the denominator's investor scope.\n\nEnterprise Value reflects ALL investors, so it pairs with metrics available to all investors and computed BEFORE interest – EBITDA, EBIT, Revenue, Unlevered FCF.\n\nEquity Value reflects only common shareholders, so it pairs with metrics available only to equity holders and computed AFTER interest – Net Income (P/E), Levered FCF, EPS.\n\nThe classic error is mixing them, e.g., EV/Net Income or Equity Value/EBITDA – those are apples-to-oranges because interest expense (which belongs to debt holders) is in one but not the other.", "tier": 3, "rank": 8068, "links": [{"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Relative Valuation p.65", "h": "", "k": "ref"}, {"t": "400Q guide: Metrics & Multiples p.88", "h": "", "k": "ref"}], "type": "compare", "flags": [], "n": 341, "so": 6}, {"id": "S3075", "src": "supp", "section": "Discounted Cash Flow (DCF) – Assumptions and Analysis", "topic": "DCF Mechanics", "q": "Using the Gordon Growth Method, a company's final-year FCF is $100, the Discount Rate is 10%, and the Terminal Growth Rate is 2%. What is the Terminal Value?", "a": "Terminal Value = Final-Year FCF × (1 + g) / (Discount Rate – g).\n\n= $100 × (1 + 2%) / (10% – 2%)\n= $102 / 8%\n= $1,275.\n\nMental-math tip: the denominator (Discount Rate – g) drives almost everything – here 8%, so the multiple is ~1/0.08 = 12.5x applied to next year's FCF ($102). Note this is the value as of the END of the forecast period; you'd still discount it back to present value. Don't forget the (1 + g) in the numerator – it grows final-year FCF into the first Terminal Period year.", "tier": 3, "rank": 8075, "links": [{"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book: Intrinsic Valuation p.54", "h": "", "k": "ref"}, {"t": "400Q guide: DCF p.94", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 342, "so": 7}, {"id": "S3088", "src": "supp", "section": "Discounted Cash Flow (DCF) – The Discount Rate", "topic": "WACC", "q": "A company is 50% Equity and 50% Debt. Cost of Equity is 12%, pre-tax Cost of Debt is 6%, and the tax rate is 25%. What is its WACC?", "a": "Correct answer: 8.25%.\n\nWACC = Cost of Equity × %Equity + Cost of Debt × (1 – Tax) × %Debt.\n= 12% × 0.50 + 6% × (1 – 0.25) × 0.50\n= 6.0% + (6% × 0.75 × 0.50)\n= 6.0% + (4.5% × 0.50)\n= 6.0% + 2.25% = 8.25%.\n\nThe trap is 9.0% – that's what you get if you forget the (1 – Tax) adjustment on Debt (12% × 0.5 + 6% × 0.5 = 9%). Always tax-affect the Cost of Debt, never the Cost of Equity.", "tier": 3, "rank": 8088, "links": [{"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book: Intrinsic Valuation p.54", "h": "", "k": "ref"}, {"t": "400Q guide: Discount Rate p.103", "h": "", "k": "ref"}], "type": "trap", "flags": [], "options": ["9.0%", "8.25%", "7.5%", "6.75%"], "correct": 1, "n": 343, "so": 8}, {"id": "S3201", "src": "supp", "section": "Merger Models – Concepts", "topic": "M&A Concepts", "q": "Compare the Cost of Equity used in a merger model (cost of stock) to the Cost of Equity used in a WACC calculation. Why are they different?", "a": "In a merger model, the Cost of Stock = Buyer Net Income / Buyer Equity Value = the reciprocal of the buyer's P/E multiple. A buyer at 20x P/E has a 5% cost of stock.\n\nIn WACC, Cost of Equity = Risk-Free Rate + Beta x Equity Risk Premium (CAPM).\n\nThey differ because you are measuring different things. In the merger model you care about the deal's impact on EPS - how much each newly issued share 'costs' the buyer in earnings dilution - so the relevant figure is earnings yield (1 / P/E). In WACC you care about the overall discount rate / theoretical required return on equity.\n\nLead with: 'In M&A I use earnings yield, 1 over P/E, because I'm measuring EPS impact, not a theoretical discount rate.'", "tier": 3, "rank": 8201, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book: M&A Concepts p.73", "h": "", "k": "ref"}, {"t": "400Q guide: Merger Models p.107", "h": "", "k": "ref"}], "type": "compare", "flags": [], "n": 344, "so": 9}, {"id": "S3204", "src": "supp", "section": "Merger Models – Concepts", "topic": "M&A Concepts", "q": "From the SELLER's perspective, when is being paid in stock preferable to being paid in cash, and when is cash better?", "a": "The seller balances taxes vs. certainty of payment vs. future upside.\n\nCash (and debt-funded cash) means immediate payment, immediate capital gains taxes, and no upside if the buyer's stock rises - but also no downside if it falls. Better when the seller is uncertain about the buyer's prospects or wants certainty.\n\nStock means the seller defers taxes until shares are sold AND keeps upside if the buyer's stock rises - but bears downside if it falls. Better when the buyer is large and stable and the seller is confident in the buyer's prospects.\n\nLead with the framing: 'Cash and debt are equivalent to the seller - immediate payment, immediate tax. The real choice is cash vs. stock, and it comes down to the seller's confidence in the buyer and tax timing.'", "tier": 3, "rank": 8204, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book: M&A Concepts p.73", "h": "", "k": "ref"}, {"t": "400Q guide: Merger Models p.107", "h": "", "k": "ref"}], "type": "compare", "flags": [], "n": 345, "so": 9}, {"id": "S3205", "src": "supp", "section": "Merger Models – Concepts", "topic": "M&A Concepts", "q": "An acquirer has Equity Value $1B, Cash $50M, EBITDA $100M, Net Income $50M, Debt/EBITDA of 2x. Peers run at 4x Debt/EBITDA. It wants to buy a company for a Purchase Equity Value of $500M (target has $50M EBITDA, no debt). How would you fund the deal?", "a": "Step 1 - Cash: The acquirer has only $50M of cash, which is likely close to its minimum operating balance for a company this size. So realistically use little or no cash.\n\nStep 2 - Debt capacity: Combined EBITDA = $100M + $50M = $150M. At the 4x peer level, total debt could be 4 x $150M = $600M. The acquirer already has 2x x $100M = $200M of debt, so it can raise an additional $600M - $200M = $400M of new debt.\n\nStep 3 - Stock: The remaining $500M - $400M = $100M is funded with stock.\n\nCheck on stock: Acquirer P/E = $1,000 / $50 = 20x, so cost of stock = 5%, fairly cheap. If the after-tax cost of debt exceeds 5% (i.e. pre-tax rate above ~8.3% at 40% tax) stock would actually be cheaper, but with no rate given, assume debt is cheaper.\n\nAnswer: roughly $400M debt + $100M stock (and slightly less stock if any cash is used).", "tier": 3, "rank": 8205, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book: M&A Concepts p.73", "h": "", "k": "ref"}, {"t": "400Q guide: Merger Models p.107", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 346, "so": 9}, {"id": "S3209", "src": "supp", "section": "Merger Models – Concepts", "topic": "M&A Concepts", "q": "An acquirer trades at a very high P/E (say 50x) and a target trades at 20x. The interviewer asks: 'On paper, stock looks like the cheapest way for this buyer to pay. Is that real, and what's the catch?'", "a": "On paper it IS cheapest by the EPS math: cost of stock = 1 / P/E = 1/50 = 2%, which is likely below the after-tax cost of debt or cash. A 100% stock deal at these multiples will be strongly accretive because the buyer's 2% cost of stock is far below the seller's ~5% yield (1/20).\n\nThe catch: 'cheap stock' relies on the buyer's lofty multiple being sustained. If the market re-rates the buyer down (or the deal signals the buyer thinks its own stock is overvalued - a classic negative signal), the apparent cheapness evaporates. High-multiple acquirers issuing stock can also invite scrutiny that they're using inflated currency.\n\nLead with the math (it's accretive and cheapest by 1/P/E), then deliver the catch: 'It's only cheap as long as the high multiple holds, and using richly-valued stock can itself signal management thinks the shares are overpriced.'", "tier": 3, "rank": 8209, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book: M&A Concepts p.73", "h": "", "k": "ref"}, {"t": "400Q guide: Merger Models p.107", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 347, "so": 9}, {"id": "S3231", "src": "supp", "section": "LBO Models – Calculations", "topic": "LBO", "q": "What's the approximate IRR if a PE firm invests $500 of equity, receives a $250 dividend in Year 2, and sells for $1,000 of equity proceeds in Year 3?", "a": "Total cash back = $250 + $1,000 = $1,250 on $500 invested = 2.5x MoM.\n\nIf all $1,250 arrived in Year 3, 2.5x in 3 years would be between doubling (~25%) and tripling (~45%) - call it ~35%.\n\nBut $250 of it arrived early, in Year 2, which boosts the IRR above that. So the true IRR is higher - approximate it as 'between 35% and 40%' (actual ~39%).\n\nKey insight: a dividend recap pulls cash forward, which raises IRR meaningfully even though MoM is unchanged. Whenever cash comes early, nudge your IRR estimate UP from the naive final-year figure.", "tier": 3, "rank": 8231, "links": [{"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "Red Book: Private Equity Investing p.91", "h": "", "k": "ref"}, {"t": "Red Book: LBO Modeling p.104", "h": "", "k": "ref"}, {"t": "400Q guide: LBO p.119", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 348, "so": 12}, {"id": "S3233", "src": "supp", "section": "LBO Models – Concepts", "topic": "LBO", "q": "In an LBO, would you rather have an extra dollar of EBITDA at exit or an extra dollar of debt paydown during the hold - assuming a 10x exit multiple?", "a": "An extra dollar of EBITDA is worth more - it's magnified by the exit multiple (here ~$10 of equity value), while a dollar of debt paydown adds ~$1 of equity value.", "tier": 3, "rank": 8233, "links": [{"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "Red Book: Private Equity Investing p.91", "h": "", "k": "ref"}, {"t": "Red Book: LBO Modeling p.104", "h": "", "k": "ref"}, {"t": "400Q guide: LBO p.119", "h": "", "k": "ref"}], "type": "trap", "flags": [], "options": ["An extra dollar of debt paydown - it directly reduces net debt dollar-for-dollar", "An extra dollar of EBITDA - it is magnified by the exit multiple (a 10x exit means ~$10 of extra equity value), versus ~$1 from debt paydown", "They are equivalent - both add exactly one dollar of equity proceeds", "An extra dollar of debt paydown, because it also lowers interest expense and compounds"], "correct": 1, "n": 349, "so": 11}, {"id": "S3238", "src": "supp", "section": "LBO Models – Calculations", "topic": "LBO", "q": "Could a PE firm earn a 20% IRR buying a company for $1B enterprise value and selling it for the SAME $1B enterprise value after 5 years - zero EBITDA growth, zero multiple expansion?", "a": "Yes - through debt paydown alone.\n\nA 20% 5-year IRR requires a 2.5x MoM. Suppose the firm funds the $1B with $600M debt and $400M equity. Over the 5 years the company repays ALL $600M of debt from its cash flow and generates no excess cash.\n\nAt exit, EV is still $1B but net debt is $0, so equity proceeds = $1,000M - $0 = $1,000M.\n\nMoM = $1,000M / $400M = 2.5x = ~20% IRR over 5 years.\n\nThis is the purest illustration that LEVERAGE + DEBT PAYDOWN can drive strong returns even with a flat enterprise value. The equity holder captures the value transferred from lenders to themselves as the debt is retired.", "tier": 3, "rank": 8238, "links": [{"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "Red Book: Private Equity Investing p.91", "h": "", "k": "ref"}, {"t": "Red Book: LBO Modeling p.104", "h": "", "k": "ref"}, {"t": "400Q guide: LBO p.119", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 350, "so": 12}, {"id": "S3239", "src": "supp", "section": "Capital Markets (supplemental)", "topic": "Capital Markets", "q": "Distinguish a bond's Coupon Rate, Current Yield, and Yield to Maturity (YTM).", "a": "Coupon Rate: the fixed interest paid on PAR value. A 6% coupon on a $1,000 par bond pays $60/year, always.\n\nCurrent Yield: annual coupon / current MARKET price. If that bond trades at $1,080, current yield = $60 / $1,080 = ~5.6%. It reflects today's price but ignores the gain/loss to maturity.\n\nYield to Maturity (YTM): the IRR of holding the bond to maturity, using the current market price as the purchase price. It assumes you hold to maturity, all payments are made in full and on time, and you reinvest cash flows at the same rate. It captures BOTH the coupon income and any pull-to-par gain/loss.\n\nKey relationships: at a PREMIUM (price > par), Coupon > Current Yield > YTM. At a DISCOUNT (price < par), Coupon < Current Yield < YTM. At par, all three are equal.", "tier": 3, "rank": 8239, "links": [{"t": "Red Book: Debt & LevFin p.112", "h": "", "k": "ref"}, {"t": "Red Book: Equity Financing p.122", "h": "", "k": "ref"}, {"t": "400Q guide: DCM/LevFin p.131", "h": "", "k": "ref"}, {"t": "400Q guide: ECM p.145", "h": "", "k": "ref"}], "type": "compare", "flags": [], "n": 351, "so": 18}, {"id": "S3240", "src": "supp", "section": "Capital Markets (supplemental)", "topic": "Capital Markets", "q": "You buy a $100 par bond at a 5% discount (price = $95). Coupon is 8%, maturity is 5 years. Approximate the YTM.", "a": "Use the approximation:\nYTM = (Annual Interest + (Redemption Value - Price) / Years) / ((Redemption Value + Price) / 2)\n\nPlug in: annual interest = $8, redemption = $100, price = $95, years = 5.\nYTM = (8 + (100 - 95)/5) / ((100 + 95)/2)\nYTM = (8 + 1) / 97.5\nYTM = 9 / 97.5 = ~9.2%\n\nIntuition / mental math: you earn 8% per year in coupon and 'amortize' the $5 discount over 5 years (~$1/yr = ~1% on price), so ~8% + ~1% = ~9%. Since the average price is just under $100, the answer is just above 9% - say 'between 9% and 10%, closer to 9%.'", "tier": 3, "rank": 8240, "links": [{"t": "Red Book: Debt & LevFin p.112", "h": "", "k": "ref"}, {"t": "Red Book: Equity Financing p.122", "h": "", "k": "ref"}, {"t": "400Q guide: DCM/LevFin p.131", "h": "", "k": "ref"}, {"t": "400Q guide: ECM p.145", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 352, "so": 18}, {"id": "S3242", "src": "supp", "section": "Capital Markets (supplemental)", "topic": "Capital Markets", "q": "Intuitively, what do a bond's Duration and Convexity measure, and how do investors use them?", "a": "Duration is the first derivative of price with respect to yield - it tells you approximately how much a bond's price changes (in %) for a small change in yield. A duration of 5 means a +1% yield move drops the price ~5%. You can also read it as: the weighted-average time to receive the bond's cash flows.\n\nConvexity is the second derivative - it captures the CURVATURE that duration (a straight-line estimate) misses. Because the price-yield relationship is convex, duration overstates price drops and understates price gains for large moves; convexity corrects for that. Positive convexity is good for the bondholder.\n\nHow investors use them: both measure interest-rate risk. Higher duration = bigger price swings when rates move. Portfolio managers target a duration to control rate exposure and use convexity to refine the estimate for larger rate moves and to compare bonds with similar durations.", "tier": 3, "rank": 8242, "links": [{"t": "Red Book: Debt & LevFin p.112", "h": "", "k": "ref"}, {"t": "Red Book: Equity Financing p.122", "h": "", "k": "ref"}, {"t": "400Q guide: DCM/LevFin p.131", "h": "", "k": "ref"}, {"t": "400Q guide: ECM p.145", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 353, "so": 18}, {"id": "S3243", "src": "supp", "section": "Capital Markets (supplemental)", "topic": "Capital Markets", "q": "Three companies want to raise capital: a regulated utility, a freight railroad, and a branded pharma company. Which fits best with 100% debt, which 50/50 debt/equity, and which 100% equity? Explain.", "a": "Frame it around risk and the lender's #1 goal: don't lose money.\n\n100% Debt - the UTILITY. Demand for power/water is steady, often a regulated local monopoly, highly predictable cash flows, low growth. Lenders love predictability - ideal debt issuer.\n\n50/50 - the RAILROAD. Riskier than a utility (freight volumes and pricing swing with the economy) but still relatively predictable across cycles, and it has huge hard-asset collateral (track, locomotives, real estate). Supports meaningful but not full leverage.\n\n100% Equity - the BRANDED PHARMA. Highly risky: revenues depend on patents that expire, requiring constant reinvention; binary outcomes (a blockbuster vs. a failed pipeline). Too uncertain for lenders, but big upside suits equity investors.\n\nThe principle: match leverage to cash-flow predictability and collateral - the more stable and asset-backed, the more debt it can carry.", "tier": 3, "rank": 8243, "links": [{"t": "Red Book: Debt & LevFin p.112", "h": "", "k": "ref"}, {"t": "Red Book: Equity Financing p.122", "h": "", "k": "ref"}, {"t": "400Q guide: DCM/LevFin p.131", "h": "", "k": "ref"}, {"t": "400Q guide: ECM p.145", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 354, "so": 18}, {"id": "S3244", "src": "supp", "section": "Capital Markets (supplemental)", "topic": "Capital Markets", "q": "Walk me through a Debt vs. Equity analysis to recommend financing for a company.", "a": "Step 1 - Profile the company: is it a growth company (favors equity) or a mature/value company (favors debt)? Compute its after-tax cost of debt vs. cost of equity and how WACC would shift with more of each.\n\nStep 2 - If it's a growth company or equity is cheaper (rare - only for high-multiple names), lean toward equity, e.g., a follow-on offering for a public company.\n\nStep 3 - If debt is cheaper or it's a value company, build projections under the anticipated debt terms INCLUDING covenants, and stress-test downside cases (lower growth, weaker margins).\n\nStep 4 - Decision: if the company stays within covenant limits (e.g., Debt/EBITDA, EBITDA/Interest) even in the downside, recommend debt. If it breaches in stress cases, recommend a mix of debt and equity, or a convertible bond (especially if the cash interest on straight debt is too heavy).\n\nLead with: 'Profile first - growth vs. value - then test whether it can carry debt through a downturn without breaching covenants.'", "tier": 3, "rank": 8244, "links": [{"t": "Red Book: Debt & LevFin p.112", "h": "", "k": "ref"}, {"t": "Red Book: Equity Financing p.122", "h": "", "k": "ref"}, {"t": "400Q guide: DCM/LevFin p.131", "h": "", "k": "ref"}, {"t": "400Q guide: ECM p.145", "h": "", "k": "ref"}], "type": "walkthrough", "flags": [], "n": 355, "so": 18}, {"id": "S3245", "src": "supp", "section": "Capital Markets (supplemental)", "topic": "Capital Markets", "q": "Briefly walk me through the IPO process for a client.", "a": "Goal: get the client a fair valuation, recruit solid long-term institutional investors, and support the share price post-listing.\n\n1) Meet the client; gather financial, industry, and customer information.\n2) With other bankers and lawyers, draft the registration statement (the S-1 in the U.S.), which markets the company to investors.\n3) File with the SEC; receive comments and revise until clear.\n4) Roadshow (a few weeks): pitch the company to institutional investors and gather pricing indications / build the order book.\n5) Price the deal at the end of the roadshow, allocate and sell shares at the IPO price, and the stock begins trading.\n\nThe hardest part: balancing the client's price expectations against investors' - you want a modest first-day pop (neither too high, which leaves money on the table, nor too low, which signals weak demand). Mention that the goal is 'priced to trade up modestly.'", "tier": 3, "rank": 8245, "links": [{"t": "Red Book: Debt & LevFin p.112", "h": "", "k": "ref"}, {"t": "Red Book: Equity Financing p.122", "h": "", "k": "ref"}, {"t": "400Q guide: DCM/LevFin p.131", "h": "", "k": "ref"}, {"t": "400Q guide: ECM p.145", "h": "", "k": "ref"}], "type": "walkthrough", "flags": [], "n": 356, "so": 18}, {"id": "S3246", "src": "supp", "section": "Capital Markets (supplemental)", "topic": "Capital Markets", "q": "Explain Primary vs. Secondary shares in an IPO or follow-on offering, and why the mix matters.", "a": "Primary shares are NEW shares the company issues; investors pay cash to the COMPANY. They dilute existing holders but raise capital the company can deploy.\n\nSecondary shares are EXISTING shares sold by current holders (founders, early investors, PE) to new investors; the company receives NO cash and there's no dilution - it's just a change of ownership.\n\nWhy the mix matters: a healthy offering balances the two. If an IPO is, say, 90% secondary, new investors will reasonably wonder why so many insiders are rushing for the exits rather than holding - a negative signal about confidence. A primary-heavy deal signals the company wants growth capital. Bankers keep the split in a market-acceptable range to protect perception.\n\nOne-liner: 'Primary = new shares, company gets cash, dilutive; secondary = existing shares, holders get cash, non-dilutive. Too much secondary looks like insiders cashing out.'", "tier": 3, "rank": 8246, "links": [{"t": "Red Book: Debt & LevFin p.112", "h": "", "k": "ref"}, {"t": "Red Book: Equity Financing p.122", "h": "", "k": "ref"}, {"t": "400Q guide: DCM/LevFin p.131", "h": "", "k": "ref"}, {"t": "400Q guide: ECM p.145", "h": "", "k": "ref"}], "type": "compare", "flags": [], "n": 357, "so": 18}, {"id": "S3248", "src": "supp", "section": "Capital Markets (supplemental)", "topic": "Capital Markets", "q": "What are the trade-offs of going public via a SPAC versus a traditional IPO?", "a": "SPAC advantages:\n- Faster: months vs. a year-plus for a traditional IPO.\n- Lighter regulatory burden / more flexibility to share projections.\n- No IPO pricing discount - the target negotiates the best deal it can directly with the sponsor.\n- Price certainty earlier in the process (a negotiated valuation).\n\nSPAC disadvantages:\n- More dilution - the sponsor's 'promote' (typically ~20% for little capital) plus warrants dilute the target's shareholders.\n- Fees are often the same or higher once everything's counted.\n- Reputational discount - markets often view SPAC-listed companies as lower quality, leading to weak/mixed post-deal stock performance.\n- Redemption risk - SPAC shareholders can redeem, shrinking the cash actually delivered (often backfilled with a PIPE).\n\nInterview framing: 'SPAC = faster, more certain price, but more dilution and a quality stigma. Traditional IPO = slower and a pricing discount, but cleaner and better-regarded.'", "tier": 3, "rank": 8248, "links": [{"t": "Red Book: Debt & LevFin p.112", "h": "", "k": "ref"}, {"t": "Red Book: Equity Financing p.122", "h": "", "k": "ref"}, {"t": "400Q guide: DCM/LevFin p.131", "h": "", "k": "ref"}, {"t": "400Q guide: ECM p.145", "h": "", "k": "ref"}], "type": "compare", "flags": [], "n": 358, "so": 18}, {"id": "S3249", "src": "supp", "section": "Capital Markets (supplemental)", "topic": "Capital Markets", "q": "Why is a convertible bond NOT necessarily 'cheaper' than straight debt, even though its coupon is lower?", "a": "The CASH cost is lower - the convertible carries a below-market coupon, so the company pays less cash interest each year. That's why people call it cheap.\n\nBut the TOTAL economic cost is higher because of the embedded conversion option. At and above the conversion price, the bond behaves like equity: bondholders convert into shares, diluting existing shareholders. That dilution is a real cost the low coupon doesn't capture. You're effectively selling a call option on your stock cheaply.\n\nSo: a convertible is cheaper than straight debt only on a cash-coupon basis, but more expensive once you price in the conversion/dilution. It IS usually cheaper than issuing straight equity, because of its bond (liability) component and downside protection.\n\nInterview phrasing: 'Lower cash coupon, but you're giving away an equity option - account for the dilution and it's not actually cheaper than debt.'", "tier": 3, "rank": 8249, "links": [{"t": "Red Book: Debt & LevFin p.112", "h": "", "k": "ref"}, {"t": "Red Book: Equity Financing p.122", "h": "", "k": "ref"}, {"t": "400Q guide: DCM/LevFin p.131", "h": "", "k": "ref"}, {"t": "400Q guide: ECM p.145", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 359, "so": 18}, {"id": "S3257", "src": "supp", "section": "Synthesis (supplemental)", "topic": "Synthesis", "q": "Why does Goodwill get created in an M&A deal and in an LBO, and how is its role different between the two?", "a": "Goodwill is the plug in purchase accounting: Purchase Equity Value (or the equity consideration) minus the fair value of the target's net identifiable assets (after writing assets up/down to fair value and booking identifiable intangibles). It exists to make the acquirer's balance sheet balance after the target's old equity is wiped out.\n\nIn M&A (strategic deal): goodwill sits on the combined company's balance sheet indefinitely, tested annually for impairment. It's a permanent feature of consolidation.\n\nIn an LBO: goodwill is created the same way when the PE firm's HoldCo acquires the company, but it matters LESS analytically - it's a non-cash balance-sheet item that doesn't affect cash flow, debt paydown, or the IRR/MoM math that drives the deal. PE returns hinge on cash flow, leverage, and the exit multiple, not on goodwill.\n\nSynthesis point: same accounting mechanic, different relevance - central to consolidated reporting in M&A, largely a bookkeeping plug in an LBO.", "tier": 3, "rank": 8257, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 360, "so": 19}, {"id": "S3260", "src": "supp", "section": "Synthesis (supplemental)", "topic": "Synthesis", "q": "An acquirer uses 100% cash for an acquisition. What happens to its Enterprise Value, all else equal?", "a": "C. Enterprise Value INCREASES - by roughly the target's purchase enterprise value (the full purchase price, plus any assumed debt net of acquired cash). Mechanically: cash falls by the purchase price, and less cash means higher EV in the bridge; nothing offsets this, because the operating business acquired is a Net Operating Asset, which ADDS to enterprise value rather than netting against it. That's why Combined EV = Buyer's standalone EV + Seller's purchase EV, regardless of funding method.\n\nThe trap is the 'offset' logic in B: acquired operating assets are not a negative item in the EV formula - only cash is. Contrast with raising debt and letting the proceeds sit in cash (debt up, cash up, EV unchanged): there, no operating assets change. Here they do.", "tier": 3, "rank": 8260, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}], "type": "trap", "flags": [], "options": ["EV decreases by the amount of cash spent, because cash leaves the balance sheet", "EV is essentially unchanged - spending cash raises EV (less cash), but that's offset by the operating assets/business acquired at fair value", "EV increases by the full purchase price, since the company is now larger", "EV increases only by the goodwill created in the deal"], "correct": 2, "n": 361, "so": 19}, {"id": "S3264", "src": "supp", "section": "Synthesis (supplemental)", "topic": "Synthesis", "q": "An interviewer says: 'Depreciation increases by $10 for a company with a 25% tax rate. Now also tell me how that same change matters differently inside an LBO model.' Walk through both.", "a": "Base 3-statement effect (25% tax):\n- Income Statement: pre-tax income falls $10; taxes fall $2.50 (25% x $10); net income falls $7.50.\n- Cash Flow Statement: start with net income down $7.50, add back the $10 of non-cash depreciation, so cash from operations rises $2.50 (the tax savings).\n- Balance Sheet: cash up $2.50 (assets); PP&E down $10 (assets); net assets down $7.50. Equity (retained earnings) down $7.50. Balances.\n- Net effect: the depreciation 'tax shield' adds $2.50 of cash.\n\nWhy it matters MORE in an LBO: that incremental cash from the depreciation tax shield flows into 'cash flow available for debt repayment,' so it accelerates DEBT PAYDOWN. Faster paydown means less debt at exit, higher equity proceeds, and a higher IRR. In a cash-flow-and-leverage-driven LBO, the tax shield isn't just an accounting curiosity - it's fuel for deleveraging.\n\nSynthesis takeaway: the same $2.50 tax shield is a footnote in standard accounting but a direct IRR lever in an LBO because every dollar of cash compounds through debt reduction.", "tier": 3, "rank": 8264, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 362, "so": 19}, {"id": "S3267", "src": "supp", "section": "Market Context (supplemental)", "topic": "Market Context", "q": "Walk me through a recent deal you've been following. (Coach me on the structure of a strong answer.)", "a": "Use a tight 5-part structure (aim for ~90 seconds):\n1) The deal in one line: 'Acquirer X agreed to buy Target Y for ~$Zbn, an all-cash/stock deal at roughly an A% premium / ~B-x EV/EBITDA.'\n2) Strategic rationale: WHY - 2-3 reasons (consolidation/scale, new geography or product, vertical integration, defensive). Tie to the industry's dynamics.\n3) Financing & structure: cash vs. stock vs. debt, whether it's accretive/dilutive, any antitrust or regulatory angle.\n4) Your VIEW: do you think it's a good deal? Take a defensible stance - 'I think the multiple is full but the synergies justify it because...' Show judgment, not just facts.\n5) Tie-back: what it signals about the sector and why it interests you.\n\nThe trap: reciting press-release facts with no opinion. Interviewers want to see you THINK like a banker - rationale, price, and a view. Pick a deal in a sector you can speak to (for you, aerospace/defense, energy, or industrials), and know the approximate size, premium, structure, and the buyer's logic cold.", "tier": 3, "rank": 8267, "links": [{"t": "Red Book: General Market Knowledge p.133", "h": "", "k": "ref"}], "type": "walkthrough", "flags": ["dated"], "n": 363, "so": 20}, {"id": "S3271", "src": "supp", "section": "Market Context (supplemental)", "topic": "Market Context", "q": "An interviewer asks: 'If you ran a fund, would you rather buy an industrials business today using more leverage or less? Defend it.' Walk through how you'd reason in the current environment.", "a": "Frame the trade-off, take a stance, defend it:\n\nThe case for MORE leverage: amplifies returns and is the easiest lever a sponsor controls; industrials often have hard-asset collateral and steady cash flows that support debt. Attractive if financing is available at reasonable cost and the business has predictable demand.\n\nThe case for LESS leverage (likely the better answer in a higher-rate / uncertain environment): when debt is more expensive, heavy interest burden eats the cash flow needed for capex and debt paydown, and it magnifies downside if the cycle turns. Industrials are cyclical, so excessive leverage into a potential slowdown is dangerous. Lower leverage preserves flexibility for add-ons and downturns, and forces returns to come from EBITDA growth and operational improvement (higher-quality returns) rather than financial engineering.\n\nMy stance: 'In the current environment I'd lean toward moderate leverage on a cyclical industrial - enough to enhance returns, but with cushion to survive a downturn and fund add-ons. I'd rather earn my return from buy-and-build and margin improvement than bet on cheap debt and multiple expansion.'\n\nThe point interviewers want: show you understand leverage cuts both ways and that you tailor it to the cycle and cost of debt.", "tier": 3, "rank": 8271, "links": [{"t": "Red Book: General Market Knowledge p.133", "h": "", "k": "ref"}], "type": "scenario", "flags": ["dated"], "n": 364, "so": 20}, {"id": "S3274", "src": "supp", "section": "Market Context (supplemental)", "topic": "Market Context", "q": "Defense prime A wants to acquire a smaller autonomy/space-tech company B. Walk me through how you'd think about this deal as the banker - rationale, valuation, structure, and risks.", "a": "Rationale (lead here): A wants next-generation capability - autonomy, space, sensors - faster than it can build internally; it's a 'buy vs. build' decision favoring acquisition to win modernization-focused programs and add growth to a slower-growing core. Possibly defensive (keep the tech from a rival prime).\n\nValuation: B is likely a higher-growth, possibly pre- or early-profit company, so EV/EBITDA may not work - use EV/Revenue, a DCF on a longer ramp, and precedent tech/defense deals. Expect a premium for scarce capability; the prime can justify it with revenue synergies (pulling B's tech into A's program pipeline and customer relationships).\n\nStructure & financing: A is likely cash/balance-sheet rich, so probably cash or a cash/stock mix; accretion/dilution matters to A's public shareholders, but a small high-growth target won't move A's EPS much. Consider earn-outs to bridge valuation gaps on unproven tech.\n\nRisks / deal considerations: national-security review (e.g., CFIUS if any foreign ownership in B), antitrust if it reduces competition for a program, integration and talent-retention risk (autonomy/space talent is mobile), program-execution and contract-novation risk, and reliance on government budgets.\n\nMy view: 'Strategically sound - primes consistently acquire capability to stay on the leading edge of modernization. I'd watch the price for unproven tech and structure earn-outs, and I'd flag regulatory review early.' Tie to your defense fluency.", "tier": 3, "rank": 8274, "links": [{"t": "Red Book: General Market Knowledge p.133", "h": "", "k": "ref"}], "type": "scenario", "flags": ["dated"], "n": 365, "so": 20}, {"id": "S3279", "src": "supp", "section": "Market Context (supplemental)", "topic": "Market Context", "q": "An interviewer asks about a hypothetical large industrials carve-out (a conglomerate spinning off or selling a division). Why do companies do carve-outs, and how would you think about it as a banker?", "a": "Why companies carve out a division (sell or spin):\n1) Focus / 'conglomerate discount': the market often values a focused pure-play higher than a diversified conglomerate; separating units can unlock value as each is re-rated on its own merits.\n2) Strategic fit: shed a non-core or slower-growth division to concentrate capital and management attention on the core.\n3) Raise capital / de-lever: a sale generates cash to pay down debt, fund growth, or return to shareholders.\n4) Different optimal owners: a division may be worth more to a strategic or a sponsor than inside the parent (a better operator or a buy-and-build platform).\n\nBanker considerations:\n- Standalone financials: carve-outs require building 'carve-out financials' - allocating shared costs, stranded costs, and the standalone cost structure - which heavily affects valuation. This is where a lot of the work (and risk) lives.\n- Sale vs. spin vs. IPO: a sale gives cash and certainty; a spin is tax-efficient and distributes shares to existing holders; an equity carve-out IPOs a minority stake.\n- Buyer universe: strategics seeking the asset vs. sponsors (carve-outs are a classic PE play because of operational improvement potential).\n- Transition complexity: TSAs (transition services agreements), separating IT/operations, and customer/contract continuity.\n\nMy framing: 'Carve-outs unlock value by putting an asset with its best owner and removing the conglomerate discount - the analytical crux is getting the standalone, cost-allocated financials right, then choosing sale vs. spin vs. IPO based on the parent's goals for cash, taxes, and control.'", "tier": 3, "rank": 8279, "links": [{"t": "Red Book: General Market Knowledge p.133", "h": "", "k": "ref"}], "type": "scenario", "flags": ["dated"], "n": 366, "so": 20}, {"id": "S3502", "src": "supp", "section": "Accounting – Calculations", "topic": "Accounting Calcs", "q": "The same company reports under US GAAP and IFRS. Why is its EBITDA different in the two sets of financials, even though the business is identical?", "a": "Leases. Under US GAAP, operating lease rent is an Operating Expense, so it reduces EBITDA. Under IFRS 16, every lease is treated finance-style: the cost shows up as Depreciation plus Interest, and BOTH are excluded from EBITDA.\n\nUsing the guide's numbers: a lease with $160 of annual rent (PV $1,200, 5% rate) reduces US GAAP EBITDA by the full $160. Under IFRS, the Income Statement instead shows $120 of Depreciation ($1,200 / 10 years) and $60 of initial Interest ($1,200 x 5%) — a $180 total pre-tax hit, but zero of it touches EBITDA.\n\nSo IFRS EBITDA is HIGHER by the full rent amount, and the gap is biggest for lease-heavy businesses — retailers, airlines, restaurants, shipping.\n\nNote that Net Income also differs slightly: under IFRS the early-year expense is $180 vs. $160 under US GAAP (front-loading), so IFRS Net Income is a bit lower early in the lease term and higher later. Free cash flow presentation differs too — the lease principal repayment sits in Financing under IFRS, flattering Cash Flow from Operations.", "tier": 3, "rank": 8502, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statement Analysis p.27", "h": "", "k": "ref"}, {"t": "Red Book: Advanced Accounting p.35", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Calcs p.59", "h": "", "k": "ref"}], "type": "compare", "flags": [], "n": 367, "so": 2}, {"id": "S3506", "src": "supp", "section": "Valuation Methodologies", "topic": "Valuation Methods", "q": "What is a 'football field,' and how would you construct one for a client?", "a": "A football field is the summary chart of a valuation: one horizontal bar per methodology, each showing the implied valuation range (per share or enterprise value), so the client can see where the ranges overlap and triangulate a view.\n\nConstruction:\n\n1. Run each methodology and convert it into a range. For Comparable Public Companies and Precedent Transactions, the convention is to apply the 25th percentile and 75th percentile multiples (with the median marked) of each key multiple — e.g., TEV/EBITDA, TEV/Revenue, P/E — to your company's metrics. If the median LTM TEV/EBITDA is 7x and your company has $100M of LTM EBITDA, the midpoint implied EV is $700M.\n\n2. For the DCF, the range comes from sensitivity tables — typically WACC vs. terminal growth rate or exit multiple.\n\n3. Add supplemental bars where relevant: the 52-week trading range and analyst price targets (for public companies), an M&A premiums analysis, and an LBO analysis as the 'floor' — the max a PE firm could pay and still hit its target IRR.\n\n4. Plot all bars against a common axis, draw a line at the current share price (if public), and use the overlap zone to frame the recommendation.\n\nWhat interviewers want you to say: the football field is a communication tool, not a calculation — the judgment is in which methodologies you weight. Precedents and premiums matter most in a sale process (control value); trading comps and DCF matter most for an unaffected or standalone view.", "tier": 3, "rank": 8506, "links": [{"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Relative Valuation p.65", "h": "", "k": "ref"}, {"t": "400Q guide: Valuation Methodologies p.81", "h": "", "k": "ref"}], "type": "walkthrough", "flags": [], "n": 368, "so": 5}, {"id": "S3511", "src": "supp", "section": "Valuation Methodologies", "topic": "Valuation Methods", "q": "How do you value a private company? Walk me through everything that changes versus valuing a public company.", "a": "The methodologies are the same — comps, precedents, DCF — but several inputs and outputs change because there's no share price.\n\n1. Clean up the financials first. Private companies often have non-standard statements: above-market owner compensation, personal expenses run through the business, related-party arrangements. You normalize these to get a true earnings base.\n\n2. No market cap, so everything keys off multiples. The output of your valuation is an implied value from EV-based multiples (TEV/EBITDA, TEV/Revenue) applied to the company's metrics — there's no current share price to compare against, and in a deal the purchase price is set as a multiple, typically on a cash-free, debt-free basis, rather than as a share-price premium.\n\n3. Apply discounts. You typically discount the implied valuation for lack of liquidity (no ready market for the shares), and potentially for key-person dependence and smaller size relative to the public comps. The size of the discount is negotiated and situation-specific — don't quote a hard universal number, but be ready to explain WHY each discount exists.\n\n4. DCF changes — this is the technical heart of the answer. The company has no share price, so no observable Beta and no market-value capital structure. You take the median capital structure of the comparable public companies to re-lever Beta and weight WACC, you often add a size or illiquidity premium to the Cost of Equity (effectively a higher Beta or an explicit premium), and if you can't get Cost of Debt from filings, you use the comps' costs or estimate a credit spread over the risk-free rate.\n\n5. Deal extras. Private deals frequently include earnouts, escrows, and management retention pools — mechanisms that bridge valuation gaps and keep sellers aligned, because the buyer has less public information to rely on.", "tier": 3, "rank": 8511, "links": [{"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Relative Valuation p.65", "h": "", "k": "ref"}, {"t": "400Q guide: Valuation Methodologies p.81", "h": "", "k": "ref"}], "type": "walkthrough", "flags": [], "n": 369, "so": 5}, {"id": "S3514", "src": "supp", "section": "Merger Models – Concepts", "topic": "M&A Concepts", "q": "Your deal includes a $50M earnout payable if the target hits EBITDA targets over 3 years. An analyst asks how it shows up in the merger model and the acquirer's financials. What's the right treatment under US GAAP?", "a": "C is correct. Under purchase accounting (ASC 805), contingent consideration is recorded at its estimated FAIR VALUE on the closing date — not zero, and not the maximum payout. That fair value (say the $50M maximum is probability-weighted and discounted to $30M) counts as part of total consideration transferred, so it increases Goodwill in the purchase price allocation just like cash or stock consideration.\n\nAfter close, a liability-classified earnout is remeasured to fair value every reporting period, and the CHANGES run through the Income Statement. The counterintuitive part interviewers love: if the target performs WELL, the earnout liability grows, producing an expense; if the target underperforms, the buyer books a GAIN from writing the liability down — earnings go up because the acquisition is going badly.\n\nIn the merger model itself: include the earnout's fair value in the Sources & Uses and the Goodwill calculation, carry the liability on the pro forma Balance Sheet, and model the cash payment in the year(s) it's expected to be paid — the payment settles the liability and does not hit EPS at face value.\n\nA is the trap (that was roughly the OLD pre-2009 treatment under earlier standards); B confuses fair value with maximum exposure; D describes nothing in current GAAP.", "tier": 3, "rank": 8514, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book: M&A Concepts p.73", "h": "", "k": "ref"}, {"t": "400Q guide: Merger Models p.107",
