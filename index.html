he projections, deduct the change in Lease Liabilities, deduct Lease Liabilities in the bridge, and count Leases in WACC, but this adds significant work and barely changes the results.", "tip": null, "tier": 3, "rank": 77, "links": [{"t": "400Q guide p.100", "h": "", "k": "ref"}, {"t": "Generalist PDF p.57", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book p.62", "h": "", "k": "ref"}], "rbq": ["How should operating leases be treated in a DCF valuation?"], "n": 244, "so": 7}, {"id": "Q018", "src": "400", "section": "Accounting – Concepts", "q": "What are “Deferred Taxes,” and how do they affect the statements?", "a": "“Deferred Taxes” represent cases where the “Book Taxes” shown on the Income Statement do not represent what the company pays in Cash Taxes to the government in the period. They typically arise due to Income Statement expenses that are not tax-deductible despite appearing above Pre-Tax Income. In some cases, they arise because of additional amounts that are deductible beyond what is shown on the IS. For example, items such as Stock-Based Compensation and Asset Impairments are not deductible for cash-tax purposes until “the second step” of the process (when employees exercise their options and receive shares or when an asset is sold at a loss). So, these items initially create negative Deferred Taxes because the company pays more in Cash Taxes than its Income Statement suggests; later, they become deductible, and Deferred Taxes turn positive.", "tip": null, "tier": 3, "rank": 101, "links": [{"t": "400Q guide p.53", "h": "", "k": "ref"}, {"t": "Generalist PDF p.10", "h": "", "k": "ref"}, {"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements & Accrual Concepts p.13", "h": "", "k": "ref"}], "rbq": [], "n": 245, "so": 1}, {"id": "Q019", "src": "400", "section": "Accounting – Concepts", "q": "A junior accountant in your department asks about how to fund the company’s operations via external sources and how they impact the financial statements. What do you say?", "a": "Debt and Equity are the two main methods of funding a company’s operations with outside money. Debt is initially cheaper for most companies, so most companies prefer to use Debt… up to a reasonable level. To do this, the company must be able to service its Debt by paying for the interest expense and possible principal repayments; if it can’t, it must use Equity instead. Both Equity and Debt issuances show up only on the Cash Flow Statement initially (in Cash Flow from Financing), and they boost the company’s Cash balance. With Equity, the company’s share count increases immediately after issuance, which means that existing investors get diluted (i.e., they own a smaller percentage of the company). With Debt, the company must pay interest, which will be recorded on its Income Statement, reducing its Net Income and Cash, and it must eventually repay the full balance.", "tip": null, "tier": 3, "rank": 102, "links": [{"t": "400Q guide p.53", "h": "", "k": "ref"}, {"t": "Generalist PDF p.10", "h": "", "k": "ref"}, {"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements & Accrual Concepts p.13", "h": "", "k": "ref"}], "rbq": [], "n": 246, "so": 1}, {"id": "Q020", "src": "400", "section": "Accounting – Concepts", "q": "Your firm recently acquired another company for $1,000 and created Goodwill of $400 and Other Intangible Assets of $200 on the Balance Sheet. A junior accountant in your department asks you why your firm did this – how would you respond?", "a": "You must create Goodwill and Other Intangible Assets after an acquisition to ensure the Balance Sheet remains in balance. In an acquisition, you write down the seller’s Common Shareholders’ Equity and then combine its Assets and Liabilities with the acquirer's. If you’ve paid exactly what the seller’s CSE is worth – e.g., you paid $1,000 in cash, and the seller has $1,000 in CSE, there are no problems. However, most acquirers pay premiums for target companies, meaning the Balance Sheet will go out of balance. For example, if the seller had $400 in CSE, the acquirer’s Balance Sheet would go out of balance immediately because the Assets side would decrease by $1,000, but the L&E side would decrease by only $400. To plug the gap, you create “Other Intangible Assets” to represent the values of items such as patents, trademarks, intellectual property, and customer relationships ($200 in this case). Goodwill plugs the remaining gap of $400 and ensures that the Balance Sheet balances.", "tip": null, "tier": 3, "rank": 103, "links": [{"t": "400Q guide p.54", "h": "", "k": "ref"}, {"t": "Generalist PDF p.11", "h": "", "k": "ref"}, {"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book p.21", "h": "", "k": "ref"}], "rbq": ["What is goodwill and how is it created?"], "n": 247, "so": 1}, {"id": "Q022", "src": "400", "section": "Accounting – Concepts", "q": "What’s the difference between Deferred Tax Assets and Deferred Tax Liabilities? How do Net Operating Losses (NOLs) factor in?", "a": "DTAs and DTLs relate to temporary differences between the book and tax bases of assets and liabilities. Deferred Tax Assets represent potential future cash-tax savings for the company, while Deferred Tax Liabilities represent additional cash-tax payments in the future. DTLs often arise because of different Depreciation methods, such as when companies accelerate Depreciation for tax purposes, reducing their tax burden in the near term but increasing it in the future. They may also be created in acquisitions. DTAs may arise when the company loses money (i.e., negative Pre-Tax Income) in the current period and, therefore, accumulates a Net Operating Loss (NOL). They are also created when the company deducts an expense for Book-Tax purposes but cannot deduct it for Cash-Tax purposes (e.g., Stock-Based Compensation). NOLs are a component of the DTA; they equal approximately the Tax Rate * NOL Balance.", "tip": null, "tier": 3, "rank": 104, "links": [{"t": "400Q guide p.55", "h": "", "k": "ref"}, {"t": "Generalist PDF p.12", "h": "", "k": "ref"}, {"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book p.36", "h": "", "k": "ref"}], "rbq": ["GAAP . What are deferred tax assets (DTAs)?", "What are deferred tax liabilities (DTLs)?"], "n": 248, "so": 1}, {"id": "Q023", "src": "400", "section": "Accounting – Concepts", "q": "How do you calculate Free Cash Flow (FCF), and what does it mean?", "a": "There are different types of Free Cash Flow, but one simple definition is Cash Flow from Operations (CFO) minus CapEx. FCF represents a company’s “discretionary cash flow” – how much cash flow it generates from its core business after paying for the cost of its funding sources, such as interest on Debt. It’s defined this way because most items in CFO on the Cash Flow Statement are required, while most of the CFI and CFF sections are optional or non-recurring (except for CapEx). A positive and growing FCF means the company doesn’t need outside funding sources to continue operating, and it could spend its cash flow in different ways: Hiring employees, re- investing in the business, acquiring other companies, or returning money to the shareholders with Dividends or Stock Repurchases. Negative or declining FCF means the company may need to raise outside funding, restructure, cut expenses, or grow tremendously to survive.", "tip": null, "tier": 3, "rank": 105, "links": [{"t": "400Q guide p.55", "h": "", "k": "ref"}, {"t": "Generalist PDF p.12", "h": "", "k": "ref"}, {"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements & Accrual Concepts p.13", "h": "", "k": "ref"}], "rbq": [], "n": 249, "so": 1}, {"id": "Q026", "src": "400", "section": "Accounting – Concepts", "q": "In its filings, a company states that EBITDA is a “proxy” for its Cash Flow from Operations. The company’s EBITDA has been positive, growing at 20% for the past three years. However, the company recently ran low on Cash and filed for bankruptcy. How could this have happened?", "a": "EBITDA stands for “Earnings Before Interest, Taxes, Depreciation & Amortization” and is typically based on a company’s Operating Income plus Depreciation & Amortization from the Cash Flow Statement (with adjustments for various non-recurring items). Although EBITDA can be a “proxy” for CFO, it is not a perfect representation of a company’s cash flow. For example, it excludes CapEx, Acquisitions, the Interest Expense, the Change in Working Capital, and one-time/non-recurring expenses. High numbers in any of these categories (e.g., a failed acquisition) could have turned the company’s cash flow negative and created this situation, even if its EBITDA looked fine.", "tip": null, "tier": 3, "rank": 106, "links": [{"t": "400Q guide p.57", "h": "", "k": "ref"}, {"t": "Generalist PDF p.14", "h": "", "k": "ref"}, {"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book p.27", "h": "", "k": "ref"}], "rbq": ["Is EBITDA a good proxy for operating cash flow?"], "n": 250, "so": 1}, {"id": "Q028", "src": "400", "section": "Accounting – Concepts", "q": "What are the advantages and disadvantages of ROE, ROA, and ROIC for measuring company performance?", "a": "These metrics all measure how efficiently a company uses its Equity, Assets, or Invested Capital to generate after-tax profits, but the nuances differ. ROE and ROA are both affected by capital structure (the company’s Cash and Debt and Net Interest Expense) because they use Net Income in the numerator and Average Equity or Average Assets in the denominator. However, they’re also closer to reality because Net Income appears directly on a company’s financial statements and affects its Cash balance. Since NOPAT is a hypothetical metric that doesn’t appear on the statements, ROIC is further removed from the company’s Cash position, even though it has the advantage of being capital structure-neutral. Regarding ROE vs. ROA, ROA tends to be more useful for companies that depend heavily on their Assets to generate Net Income (e.g., banks and insurance firms), while ROE is more of a general-purpose metric that could apply to many industries.", "tip": null, "tier": 3, "rank": 107, "links": [{"t": "400Q guide p.58", "h": "", "k": "ref"}, {"t": "Generalist PDF p.15", "h": "", "k": "ref"}, {"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book p.32", "h": "", "k": "ref"}, {"t": "Red Book p.33", "h": "", "k": "ref"}], "rbq": ["What does return on assets (ROA) and return on equity (ROE) each measure?", "What are some shortcomings of the ROA and ROE metrics for comparison purposes?"], "n": 251, "so": 1}, {"id": "Q030", "src": "400", "section": "Accounting – Calculations", "q": "You go into a job interview, and the interviewer points out that every single Interview Guide has a question about how Depreciation going up by $10 affects the statements. So, he asks you to walk through a $10 *decrease* in Depreciation, assuming a 25% tax rate.", "a": "This question mostly tests whether you are a human or an NPC: • IS: A $10 reduction in Depreciation means Pre-Tax Income is up by $10. Net Income is up by $7.5 at a 25% tax rate. • CFS: Net Income is up by $7.5, and now you add back *$10 less* of Depreciation, which means that Cash at the bottom is down by $2.5. • BS: Cash is down by $2.5, and Net PP&E is up by $10 because of the reduced Depreciation, so Total Assets are up by $7.5. On the L&E side, Equity is up by $7.5 due to the increased Net Income, so both sides balance. • Intuition: The company loses a $2.5 tax benefit by recording a lower Depreciation number, so its Cash balance falls by $2.5.", "tip": "General rule behind this: any $X change in a non-cash expense moves Cash by X × t in the same direction as the expense (the tax shield). $10 less D&A at 25% → Cash down $2.50. Works for any non-cash line.", "tier": 3, "rank": 109, "links": [{"t": "400Q guide p.60", "h": "", "k": "ref"}, {"t": "Generalist PDF p.17", "h": "", "k": "ref"}, {"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book p.21", "h": "", "k": "ref"}], "rbq": ["How would a $10 increase in depreciation flow through the financial statements?"], "n": 252, "so": 2}, {"id": "Q037", "src": "400", "section": "Accounting – Calculations", "q": "A company with 1000 shares issues 500 new shares worth $1.00 on January 1 to fund its business. Then, it decides to issue Dividends per Share of $0.10 to all its shareholders at the end of the year. Walk me through both steps SEPARATELY on the statements.", "a": "In Step 1, the company issues 500 * $1.00 = $500 worth of new Equity. This does not appear on the Income Statement because it is a long-term action that does not affect shareholder income in the current period. Instead, it appears on the CFS under Cash Flow from Financing, boosting Cash by $500, and on the Balance Sheet, Cash and Equity are both up by $500. In Step 2, the company issues 1500 * $0.10 = $150 of Dividends. These Dividends go to all the shareholders, not just the new ones! • IS: No changes because Common Dividends do not appear on the IS. • CFS: The Common Dividends are a negative $150 here, so Cash is down by $150. • BS: Cash is down by $150 on the Assets side, and Equity is down by $150 on the L&E side, so both sides are down by $150, and the BS balances. • Intuition: The company has distributed $150 to its shareholders, reducing its Cash and Equity capital.", "tip": null, "tier": 3, "rank": 110, "links": [{"t": "400Q guide p.65", "h": "", "k": "ref"}, {"t": "Generalist PDF p.22", "h": "", "k": "ref"}, {"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements & Accrual Concepts p.13", "h": "", "k": "ref"}], "rbq": [], "n": 253, "so": 2}, {"id": "Q038", "src": "400", "section": "Accounting – Calculations", "q": "A company issues $200 of Debt at a 10% interest rate. Walk me through the entire first year on the statements, including the initial issuance and the full interest payment. COMBINE both steps.", "a": "In the first step, nothing changes on the IS because Debt issuances only appear on the CFS. So, Debt on the L&E side increases by $200, and Cash increases by $200 on the Assets side to balance it. In the second step, the company records Interest on this Debt. The combined steps are: • IS: There’s an interest expense of $200 * 10% = $20, so Pre-Tax Income is down by $20, and Net Income is down by $15 at a 25% tax rate. • CFS: Net Income is down by $15, but the Debt issuance is a +$200 to cash flow, so Cash is up by $185. • BS: Cash is up by $185, so Total Assets are up by $185. On the L&E side, Debt is up by $200, and Equity is down by $15 due to the Net Income reduction, so both sides are up by $185 and balance. • Intuition: The company has raised $200 in new funding, paid $20 in interest on it, and received a $5 tax benefit, so its Cash is up by $185.", "tip": null, "tier": 3, "rank": 111, "links": [{"t": "400Q guide p.65", "h": "", "k": "ref"}, {"t": "Generalist PDF p.22", "h": "", "k": "ref"}, {"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements & Accrual Concepts p.13", "h": "", "k": "ref"}], "rbq": [], "n": 254, "so": 2}, {"id": "Q054", "src": "400", "section": "Equity Value & Enterprise Value – Concepts", "q": "Can you explain the proper treatment of pensions in Enterprise Value?", "a": "Only Defined-Benefit Pension plans factor in because Defined-Contribution Plans do not appear on the Balance Sheet. You should add the Unfunded or Underfunded portion, i.e., MAX(0, Pension Liabilities – Pension Assets), in the TEV bridge because the employees represent another investor group when they are promised future payments. They agree to lower pay and benefits today in exchange for fixed payments once they retire, and the company must fund the pension and invest the funds appropriately. If contributions into the pension plan are tax-deductible, you should multiply the unfunded portion by (1 – Tax Rate) in the Enterprise Value bridge.", "tip": null, "tier": 3, "rank": 112, "links": [{"t": "400Q guide p.74", "h": "", "k": "ref"}, {"t": "Generalist PDF p.31", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book p.45", "h": "", "k": "ref"}, {"t": "Red Book p.46", "h": "", "k": "ref"}], "rbq": ["What is the difference between enterprise value and equity value?", "What is enterprise value and how do you calculate it?"], "n": 255, "so": 3}, {"id": "Q058", "src": "400", "section": "Equity Value & Enterprise Value – Concepts", "q": "You are comparing Companies A and B. Each operates in the same industry with the same revenue, EBITDA, and other financial metrics. Company A is financed with 100% Equity, and Company B is financed with 50% Equity and 50% Debt. In theory, their Enterprise Values should be the same. Will they be the same in real life?", "a": "No, most likely not. Although people claim that Enterprise Value is “capital structure-neutral,” it’s more accurate to say that it is less affected by capital structure than Equity Value. The specific issue is that a company’s capital structure affects its Discount Rate because a shifting Debt and Equity mix changes its risk and potential returns. Using more Debt increases the company’s default risk, which affects all the investors – even the common shareholders. So, if investors value these companies based on their future cash flows and separate Discount Rates (WACC), the Discount Rate differential could explain valuation differences. The companies’ “Current” Enterprise Values might still be close, but you will see more of a difference with the “Implied” versions, which may grow over time.", "tip": null, "tier": 3, "rank": 113, "links": [{"t": "400Q guide p.76", "h": "", "k": "ref"}, {"t": "Generalist PDF p.33", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Relative Valuation p.65", "h": "", "k": "ref"}], "rbq": [], "n": 256, "so": 3}, {"id": "Q075", "src": "400", "section": "Valuation Methodologies", "q": "Can you walk me through how you use Public Comps and Precedent Transactions in a valuation?", "a": "First, you select the companies and transactions based on industry, size, and geography (and time for the transactions). Then, you determine the appropriate metrics and multiples for each set – for example, revenue, revenue growth, EBITDA, EBITDA margins, and revenue and EBITDA multiples – and calculate them for all the companies and transactions. Next, you calculate the minimum, 25th percentile, median, 75th percentile, and maximum for each valuation multiple in the set. Finally, you apply these numbers to the financial metrics of the company you’re analyzing to estimate its Implied Value. For example, if the company you’re valuing has $100 million in LTM EBITDA, and the median LTM TEV / EBITDA multiple in a set of comparable companies is 7x, then the company’s implied Enterprise Value is $700 million. You then calculate its Implied Value for all the other multiples to get a range of possible values.", "tip": "Level check: precedents run ~20–30% above comps (control premium + synergies). If asked why a precedent multiple looks high, that's the first answer, before deal-specific factors.", "tier": 3, "rank": 115, "links": [{"t": "400Q guide p.83", "h": "", "k": "ref"}, {"t": "Generalist PDF p.40", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book p.47", "h": "", "k": "ref"}, {"t": "Red Book p.68", "h": "", "k": "ref"}], "rbq": ["What are the most common valuation methods used in finance?", "If the market matters most when valuing public companies, do we even need a comps analysis?"], "n": 257, "so": 5}, {"id": "Q092", "src": "400", "section": "Valuation Metrics and Multiples", "q": "What are the advantages and disadvantages of TEV / EBITDA vs. TEV / EBIT vs. P / E?", "a": "TEV / EBITDA is better when you want to ignore the company’s CapEx and capital structure completely. TEV / EBIT is better when you want to ignore capital structure but partially factor in CapEx (via the Depreciation, which comes from CapEx in previous years). So, TEV / EBITDA is more about normalizing companies and is more useful in industries where CapEx is not a huge value driver, while TEV / EBIT is better when you want the implied values to have some relationship with CapEx. The P / E multiple is affected by different tax rates, capital structures, non-core business activities, and more, so it is less useful for “normalization” purposes than the others (though it has the advantage of being widely understood). P / E is more important in specific industries, such as banks and insurance firms, that use Equity Value as the leading valuation metric.", "tip": "Yield flip: a multiple is 1 ÷ yield. P/E 20x = 5% earnings yield; EV/EBITDA 10x = 10% EBITDA yield. Comparing an earnings yield to an after-tax debt cost answers cash-deal accretion questions instantly.", "tier": 3, "rank": 116, "links": [{"t": "400Q guide p.90", "h": "", "k": "ref"}, {"t": "Generalist PDF p.47", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Relative Valuation p.65", "h": "", "k": "ref"}], "rbq": [], "n": 258, "so": 6}, {"id": "Q110", "src": "400", "section": "Discounted Cash Flow (DCF) – Assumptions and Analysis", "q": "Should you add back Stock-Based Compensation to calculate Free Cash Flow? It’s a non- cash add-back on the Cash Flow Statement.", "a": "No! You should consider SBC a cash expense in the context of a valuation because it creates additional shares and dilutes the existing investors. So, it’s not just a simple “timing difference” line item like CapEx and D&A. As a real-life example, imagine owning a house, renting it out, and paying someone to manage the tenants for you. Instead of paying them a salary, you give them a 1% stake in your house each year. If you now sell your house after 10 years, you only get 90% of the proceeds rather than 100%. You may not have paid this manager in cash, but you still paid them! SBC works the same way but with a company's existing shareholders and their ownership.", "tip": null, "tier": 3, "rank": 120, "links": [{"t": "400Q guide p.98", "h": "", "k": "ref"}, {"t": "Generalist PDF p.55", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book p.49", "h": "", "k": "ref"}], "rbq": ["What does free cash flow (FCF) represent?"], "n": 259, "so": 7}, {"id": "Q117", "src": "400", "section": "Discounted Cash Flow (DCF) – Assumptions and Analysis", "q": "You have just finished building a DCF for a new client. What are some potential “warning signs” that your assumptions may not be correct?", "a": "First, the company’s revenue and FCF growth should always decline and fall to very low levels by the end of the forecast period (right around GDP growth or inflation). Second, the PV of the Terminal Value might account for far too much value, such as 95% of the total; if this is the case, you should extend the forecasts so the FCF contributes more. If this happens, you should also check the Implied Terminal Growth Rates and Multiples. Third, you may be double-counting items; if you deduct an expense in UFCF, it should not appear in the Enterprise Value bridge. Finally, be careful with the margin, CapEx, and D&A assumptions. The margins should stabilize further into the forecast period, and CapEx should remain ahead of D&A even into the Terminal Period if you are assuming continued growth.", "tip": null, "tier": 3, "rank": 121, "links": [{"t": "400Q guide p.100", "h": "", "k": "ref"}, {"t": "Generalist PDF p.57", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book: Intrinsic Valuation p.54", "h": "", "k": "ref"}], "rbq": [], "n": 260, "so": 7}, {"id": "Q122", "src": "400", "section": "Discounted Cash Flow (DCF) – Assumptions and Analysis", "q": "You have just finished building a DCF model. Will it make more of a difference to change the average revenue growth rate from 10% to 5% or to change the Discount Rate from 10% to 5%?", "a": "Most likely, changing the Discount Rate from 10% to 5% will make a bigger difference because the Discount Rate affects both the PV of the Cash Flows and the PV of the Terminal Value, and a 5% vs. 10% difference is very significant because it compounds over time. Changing the revenue growth from 10% to 5% will reduce the company’s Cash Flows and Terminal Value, but not by quite the same factor; the Year 10 revenue will be ~35% lower, which may not even translate into a 35% difference in FCF.", "tip": null, "tier": 3, "rank": 122, "links": [{"t": "400Q guide p.102", "h": "", "k": "ref"}, {"t": "Generalist PDF p.59", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book p.59", "h": "", "k": "ref"}], "rbq": ["WACC is an often-used criterion for deciding whether a project should be pursued. Which would have more of an impact on a DCF , the discount rate or sales growt", "DCF model, but the discount rate's impact would far exceed that of operational assumptions such as the sales growth rate. How is the terminal value calculated?"], "n": 261, "so": 7}, {"id": "Q136", "src": "400", "section": "Merger Models – Concepts", "q": "Walk me through a merger model (accretion/dilution analysis).", "a": "In a merger model, you start by projecting the financial statements of the Buyer and Seller. Then, you estimate the Purchase Price and the mix of Cash, Debt, and Stock used to fund the deal. You create a Sources & Uses schedule and Purchase Price Allocation schedule to estimate the after-effects of the deal on the financial statements. Then, you combine the Balance Sheets of the Buyer and Seller, reflecting the Cash, Debt, and Stock used, new Goodwill created, and any write-ups and write-downs. You then combine the Income Statements, reflecting the Foregone Interest on Cash, Interest Paid on New Debt, and Synergies. The Combined Net Income equals the Combined Pre-Tax Income times (1 – Buyer’s Tax Rate), and the Combined EPS equals the Combined Net Income divided by (Buyer’s Existing Share Count + New Shares Issued in the Deal). The EPS accretion/dilution equals the percentage difference between this Combined EPS and the Buyer’s standalone EPS.", "tip": null, "tier": 3, "rank": 126, "links": [{"t": "400Q guide p.108", "h": "", "k": "ref"}, {"t": "Generalist PDF p.65", "h": "", "k": "ref"}, {"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book p.81", "h": "", "k": "ref"}, {"t": "Red Book p.89", "h": "", "k": "ref"}], "rbq": ["What does accretion/dilution analysis tell you about the attractiveness of a transaction?", "Can you name a scenario when the post-deal EPS accretion/dilution would not be a significant consideration?"], "n": 262, "so": 9}, {"id": "Q139", "src": "400", "section": "Merger Models – Concepts", "q": "That sounds complicated. Are there any shortcuts for guesstimating whether an M&A deal will be accretive or dilutive?", "a": "If it is a 100% Stock deal, you can compare the Buyer’s P / E multiple to the Seller’s P / E multiple at the purchase price. If the Buyer’s multiple is higher, the deal will be accretive. This works because the reciprocals of the P / E multiples in a 100% Stock deal are the Weighted Cost of Acquisition and the Seller’s Yield. For example, let’s say the Buyer’s P / E multiple is 10x, and the Weighted Cost of Acquisition is 10%. If the Seller’s Current Equity Value is $1000, the Buyer pays a 20% premium, and the Seller’s Net Income is $200, its P / E multiple at the purchase price is $1200 / $200 = 6x. Therefore, a 100% Stock version of this deal is accretive because the Seller’s Yield is 1 / 6 = 16.7%, which is higher than the Weighted Cost of Acquisition.", "tip": "These shortcuts assume same tax rates and no premium-driven write-ups. Flag the assumptions as you use them — precision about limits impresses more than the shortcut itself.", "tier": 3, "rank": 127, "links": [{"t": "400Q guide p.109", "h": "", "k": "ref"}, {"t": "Generalist PDF p.66", "h": "", "k": "ref"}, {"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book p.81", "h": "", "k": "ref"}, {"t": "Red Book p.83", "h": "", "k": "ref"}], "rbq": ["In all-stock deals, how can you determine whether an acquisition will be accretive or dilutive?", "EPS – which is ultimately the question being answered: \"Will this deal be accretive or dilutive?"], "n": 263, "so": 9}, {"id": "Q142", "src": "400", "section": "Merger Models – Concepts", "q": "How does an Acquirer determine the mix of Cash, Debt, and Stock to use in a deal?", "a": "Since Cash is the cheapest for most Acquirers, they’ll use all they can before moving to the other funding sources. So, you might assume that the Cash Available equals the Acquirer’s current Cash balance minus its Minimum Cash balance, also factoring in the Target’s Cash and Minimum Cash when applicable. After that, Debt tends to be the next cheapest option. An Acquirer might be able to raise Debt to the level where its Debt / EBITDA remains in-line with peer companies’. So, if it’s levered at 2x EBITDA now, and similar companies have 5x Debt / EBITDA, it might be able to raise an additional 3x EBITDA worth of Debt. Again, you may also factor in the Target’s Debt and EBITDA if they are significant. Finally, there’s no strict limit on the amount of Stock an Acquirer might issue, but few companies would issue enough shares to lose control of the company, and some Acquirers will issue Stock only up to the point at which the deal turns dilutive.", "tip": null, "tier": 3, "rank": 128, "links": [{"t": "400Q guide p.110", "h": "", "k": "ref"}, {"t": "Generalist PDF p.67", "h": "", "k": "ref"}, {"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book p.82", "h": "", "k": "ref"}, {"t": "Red Book p.83", "h": "", "k": "ref"}], "rbq": ["Therefore, the target's shareholders have downside protection if the share price falls post-closing. When might an acquirer prefer to pay for a target company u", "Since the acquirer doesn't have to assume the debt on the seller’s balance sheet or get to use its cash, the acquirer is just paying the seller for the company'"], "n": 264, "so": 9}, {"id": "Q143", "src": "400", "section": "Merger Models – Concepts", "q": "Are there cases where EPS accretion/dilution is NOT important? What other analyses could you look at to assess M&A deals?", "a": "Yes, there are many cases where EPS accretion/dilution is less important. For example, if the Buyer is private or has negative EPS as a standalone entity, it won't care whether the deal is accretive or dilutive. It also makes little difference if the Buyer is far bigger than the Seller (e.g., 10x – 100x its size). Besides EPS accretion/dilution, you can also analyze the deal's qualitative merits, compare the IRR to the Discount Rate, and value the Seller plus the Synergies and compare that to the Equity Purchase Price. You can also create a Contribution Analysis to determine how much the Buyer and Seller \"contribute\" to each financial metric and then compare the contribution percentages to their respective ownership percentages, assuming it’s a 100% Stock deal. Value Creation Analysis to determine how the Buyer’s share price will change after the deal closes may also be useful, especially if the Buyer + Seller together will resemble a larger, more valuable public company.", "tip": null, "tier": 3, "rank": 129, "links": [{"t": "400Q guide p.111", "h": "", "k": "ref"}, {"t": "Generalist PDF p.68", "h": "", "k": "ref"}, {"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book p.89", "h": "", "k": "ref"}], "rbq": ["Can you name a scenario when the post-deal EPS accretion/dilution would not be a significant consideration?"], "n": 265, "so": 9}, {"id": "Q174", "src": "400", "section": "LBO Models – Concepts", "q": "How do you use an LBO model to value a company, and why does it set the \"floor valuation\"?", "a": "You use it to value a company by setting a targeted IRR, such as 25%, and then using Goal Seek in Excel to determine the price the PE firm could pay to achieve that IRR. For example, if the exit multiple is 11x, which means $1,000 in Exit Equity Proceeds for the PE firm, Goal Seek might tell you that the firm could pay $328 in Investor Equity to achieve a 25% IRR over 5 years. At a 50 / 50 Debt / Equity split, that means a Purchase Enterprise Value of $656 (ignoring fees). This method produces a “floor valuation” because it tells you the maximum amount a PE firm could pay to realize a minimum IRR. Other methodologies are not constrained in the same way.", "tip": "Why the floor: the sponsor pays the MOST it can while still hitting its required IRR with no synergies — a financial buyer's ceiling is below a strategic's. Common follow-up: 'when is the LBO value NOT the floor?' — frothy credit markets or no strategic bidders.", "tier": 3, "rank": 131, "links": [{"t": "400Q guide p.125", "h": "", "k": "ref"}, {"t": "Generalist PDF p.82", "h": "", "k": "ref"}, {"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "Red Book p.104", "h": "", "k": "ref"}, {"t": "Red Book p.105", "h": "", "k": "ref"}], "rbq": ["Why is LBO analysis used as a floor valuation when analyzing company value using several valuation methodologies?", "Walk me through the mechanics of building an LBO model."], "n": 266, "so": 11}, {"id": "Q175", "src": "400", "section": "LBO Models – Concepts", "q": "Would you rather achieve a high IRR or a high MoM multiple in a leveraged buyout?", "a": "It depends on the time frame. Over a short period, such as 6 months, a high IRR, such as 50%, is meaningless because you’ve barely made money (~1.25x multiple). But over a long period, such as 10 years, a high MoM multiple, such as 3x, means less because it corresponds to a ~12% IRR. Limited Partners judge private equity funds by their IRRs, but they also don’t want the money to be returned to them too quickly. So, the best answer is: “PE firms care more about IRR because that’s how they’re measured, but over short time frames, it’s better to earn a high multiple, and over longer time frames, it’s better to earn a high IRR. Also, if the PE firm has already exceeded its hurdle rate, it will focus more on MoM multiples.”", "tip": "Pegs (5-year hold): 2.0x ≈ 15%, 2.5x ≈ 20%, 3.0x ≈ 25%, 4.0x ≈ 32%. Memorize these — every paper LBO ends by converting MOIC to IRR, and pausing to compute it kills the finish.", "tier": 3, "rank": 132, "links": [{"t": "400Q guide p.125", "h": "", "k": "ref"}, {"t": "Generalist PDF p.82", "h": "", "k": "ref"}, {"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "Red Book p.91", "h": "", "k": "ref"}, {"t": "Red Book p.106", "h": "", "k": "ref"}], "rbq": ["If you're given the multiple of money (MoM) of an investment and the number of years the investment was held, what is the formula to calculate the internal rate", "What is a leveraged buyout (LBO)?"], "n": 267, "so": 11}, {"id": "Q053", "src": "400", "section": "Equity Value & Enterprise Value – Concepts", "q": "Why do you subtract Equity Investments and add Noncontrolling Interests in the Enterprise Value calculation?", "a": "The short, simple answer is that Equity Investments (< 50% stakes the parent company owns in others) are considered non-core assets, and Noncontrolling Interests (when a parent owns more than 50% in another company, the portion it does not own) are considered another “investor group” (the minority shareholders of this other company). The longer answer is that you also do this for comparability purposes. For example, let’s say that Company A owns 30% of Company B and 75% of Company C. Company A’s EBITDA includes 0% of Company B’s EBITDA but 100% of Company C’s EBITDA due to accounting rules around the consolidation of the financial statements. However, Company A’s Equity Value reflects 30% of Company B and 75% of Company C. Therefore, to use Enterprise Value with EBITDA in metrics such as TEV / EBITDA, you must adjust Enterprise Value to reflect 0% of Company B and 100% of Company C. To do this, you subtract the Equity Investments, which represent 30% of Company B, and you add the Noncontrolling Interests, which represent the 25% of Company C that Company A does not own.", "tip": null, "tier": 3, "rank": 142, "links": [{"t": "400Q guide p.74", "h": "", "k": "ref"}, {"t": "Generalist PDF p.31", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book p.45", "h": "", "k": "ref"}, {"t": "Red Book p.46", "h": "", "k": "ref"}], "rbq": ["Why do we add minority interest to equity value in the calculation of enterprise value?", "Enterprise Value = Equity Value + Net Debt + Preferred Stock + Minority Interest How do you calculate equity value from enterprise value?"], "n": 268, "so": 3}, {"id": "Q068", "src": "400", "section": "Equity Value & Enterprise Value – Calculations", "q": "Now assume the Inventory is sold for $200 and walk me through how the *entire* process from beginning to end affects Equity Value and Enterprise Value.", "a": "On the Income Statement, Revenue is up by $200, and Pre-Tax Income is up by $100 (due to the $100 of Inventory now being recognized as COGS). Net Income increases by $75 at a 25% tax rate. On the CFS, Net Income is up by $75, and there are no other net changes (Inventory went up by $100 and then went down by $100), so Cash is up by $75 at the bottom. On the Balance Sheet, Cash is up by $75 on the Assets side, and CSE is up by $75 on the L&E side. Since CSE is up by $75, Eq Val increases by $75. NOA does not change because Cash is not an Operating Asset, and no Operating Liabilities change, so TEV stays the same. Intuition: This 2-step process represents the company generating Net Income and letting it sit in Cash; that process does not make its core business more valuable, so TEV does not increase.", "tip": null, "tier": 3, "rank": 144, "links": [{"t": "400Q guide p.79", "h": "", "k": "ref"}, {"t": "Generalist PDF p.36", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book p.45", "h": "", "k": "ref"}, {"t": "Red Book p.46", "h": "", "k": "ref"}], "rbq": ["What is the difference between enterprise value and equity value?", "Enterprise Value = Equity Value + Net Debt + Preferred Stock + Minority Interest How do you calculate equity value from enterprise value?"], "n": 269, "so": 4}, {"id": "Q069", "src": "400", "section": "Equity Value & Enterprise Value – Calculations", "q": "A company has 200 outstanding shares at a current price of $10.00. It also has 50 options at an exercise price of $8.00 each. What is its Diluted Equity Value?", "a": "The Basic Equity Value is 200 * $10.00 = $2,000. To calculate the diluted shares, note that the options are all “in the money” – their exercise price is less than the current share price – and apply the Treasury Stock Method. When these options are exercised, 50 new shares are created. The investors paid the company $8.00 to exercise each option, so the company gets $400 in cash. It uses that cash to buy back $400 / $10.00 = 40 of the new shares, so the diluted share count is 200 + 50 – 40 = 210, and the Diluted Equity Value is $2,100.", "tip": "TSM shortcut: net new shares = options × (1 − strike ÷ price). 100 options, $10 strike, $20 price → 100 × 0.5 = 50 net shares. One line of mental math replaces the whole buyback narrative.", "tier": 3, "rank": 145, "links": [{"t": "400Q guide p.80", "h": "", "k": "ref"}, {"t": "Generalist PDF p.37", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book p.45", "h": "", "k": "ref"}], "rbq": ["Equity Value = Latest Closing Share Price × Total Diluted Shares Outstanding How do you calculate the fully diluted number of shares outstanding?", "NPV\") projects consistently while having low risk associated with its cash flows. What is equity value and how is it calculated?"], "n": 270, "so": 4}, {"id": "Q098", "src": "400", "section": "Valuation Metrics and Multiples", "q": "Company A has a P / E multiple of 15x, with a Net Income of $120 and a TEV / EBITDA multiple of 15x. Its EBITDA is $150. Company B has the same 15x P / E multiple but a Net Income of $100, a TEV / EBITDA of 10x, and an EBITDA of $200. Which one has a higher Net Debt balance?", "a": "Company A’s Equity Value is 15x * $120 = $1800, and its Enterprise Value is 15x * $150 = $2250. Company B’s Equity Value is 15x * $100 = $1500, and its Enterprise Value is 10x * $200 = $2000. Therefore, Company A’s Net Debt is $2250 – $1800 = $450, and Company B’s Net Debt is $2000 – $1500 = $500, so Company B has a higher balance.", "tip": null, "tier": 3, "rank": 148, "links": [{"t": "400Q guide p.92", "h": "", "k": "ref"}, {"t": "Generalist PDF p.49", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book p.69", "h": "", "k": "ref"}, {"t": "Red Book p.71", "h": "", "k": "ref"}], "rbq": ["When should you value a company using a revenue multiple vs. EBITDA?", "Net income, however , represents the residual value that flows just to equity shareholders. Why might one company trade at a higher multiple than another?"], "n": 271, "so": 6}, {"id": "Q118", "src": "400", "section": "Discounted Cash Flow (DCF) – Assumptions and Analysis", "q": "Why do you use the mid-year convention in a DCF, and how does it affect the results?", "a": "You use it because a company’s cash flows do not arrive 100% at the end of each year – the company generates cash flow throughout each year. Using 1, 2, 3, 4, etc., for the discount periods implies that one full year must pass for the first cash flow to arrive (and then another full year after that for the next one). If you use 0.5, 1.5, 2.5, 3.5, etc., instead, you assume that only half a year passes before the first cash flow is generated, which is closer to real life. A full year still separates each subsequent cash flow, but they now arrive in the middle of each year. A DCF using the mid-year convention will produce higher implied values because the discount periods are lower, and money in 0.5 years is worth more today than money in 1.0 years.", "tip": "Magnitude: mid-year convention raises the valuation ~2–4% (cash flows discounted half a period less). Knowing the size of the effect, not just the direction, is what reads as associate-level.", "tier": 3, "rank": 149, "links": [{"t": "400Q guide p.100", "h": "", "k": "ref"}, {"t": "Generalist PDF p.57", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book p.60", "h": "", "k": "ref"}, {"t": "Red Book p.61", "h": "", "k": "ref"}], "rbq": ["What is the purpose of using a mid-year convention in a DCF model?", "Could you give me an example of when the mid-year convention might be inappropriate?"], "n": 272, "so": 7}, {"id": "Q119", "src": "400", "section": "Discounted Cash Flow (DCF) – Assumptions and Analysis", "q": "Why might you include a “stub period” in a DCF, and what does it mean?", "a": "You might include a “stub period” if you’re valuing a company midway through the year and it has already reported some of its financial results. A DCF is based on expected future cash flow, so you should subtract these previously reported results and adjust the discount periods as well. For example, maybe it’s September 30th, and the company’s fiscal year ends on December 31st. The company’s future cash flow for this year will be generated between September 30th and December 31st. Therefore, you should exclude the cash flow from January 1st to September 30th in your projections since that part of the year has already passed. So, in the first year, you would include only the projected FCF from September 30th to December 31st. To discount the FCF in those 3 months, you would use 0.25 for the discount period because 3 months is 25% of the year. You would then use 1.25 for the discount period of the next year, 2.25 for the year after that, and so on.", "tip": null, "tier": 3, "rank": 150, "links": [{"t": "400Q guide p.101", "h": "", "k": "ref"}, {"t": "Generalist PDF p.58", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book: Intrinsic Valuation p.54", "h": "", "k": "ref"}], "rbq": [], "n": 273, "so": 7}, {"id": "Q132", "src": "400", "section": "Discounted Cash Flow (DCF) – The Discount Rate", "q": "What are the formulas for un-levering and re-levering Beta, and what do they mean?", "a": "Unlevered Beta = Levered Beta / (1 + Debt / Equity * (1 – Tax Rate) + Preferred Stock / Equity) Levered Beta = Unlevered Beta * (1 + Debt / Equity * (1 – Tax Rate) + Preferred Stock / Equity) You use a “1 +” before the Debt / Equity * (1 – Tax Rate) term to ensure that Unlevered Beta is always less than or equal to Levered Beta. You multiply the Debt / Equity term by (1 – Tax Rate) because the tax-deductibility of interest reduces the risk of Debt. When you move from Levered Beta to Unlevered Beta, you divide by the “risk from leverage” term to remove it and reduce Beta accordingly; it’s the opposite when moving from Unlevered to Levered Beta. You un-lever and re-lever Beta because when you calculate WACC in a DCF, you want to isolate the “inherent business risk” and then take that risk and add the company-specific risk from leverage for the company you’re valuing.", "tip": "Formula you must know cold: Unlevered β = Levered β ÷ (1 + (1−t) × D/E). Relever with the target's structure. Follow-up is always 'why unlever?' — to strip each comp's capital-structure risk before applying your own.", "tier": 3, "rank": 153, "links": [{"t": "400Q guide p.105", "h": "", "k": "ref"}, {"t": "Generalist PDF p.62", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book p.58", "h": "", "k": "ref"}], "rbq": ["What are the formulas used to unlever and relever beta?", "What is the impact of leverage on the beta of a company?"], "n": 274, "so": 8}, {"id": "Q144", "src": "400", "section": "Merger Models – Concepts", "q": "How do the assumptions for a cash-free, debt-free deal for a private Seller differ from those of a standard M&A deal for a public Seller?", "a": "In a cash-free, debt-free deal, the Seller’s existing Cash and Debt balances go to $0 when the deal closes and are immediately replaced with new Cash and Debt balances. The Cash is brought up to the Seller’s Minimum Cash, and the new Debt balance is usually the same as the old one because it is simply replaced with a new issuance. If Debt > Cash, the Seller uses its Cash balance to repay as much Debt as it can, and the remaining Debt is deducted from the proceeds to the selling shareholders (i.e., they earn less because they must repay some of the Debt). If Cash > Debt, the Seller repays its entire Debt balance using its Cash, and it distributes the remaining Cash to shareholders as the deal closes, which reduces its Equity Value. In these types of deals, the purchase price is based on a multiple such as TEV / EBITDA or TEV / Revenue rather than a share-price premium because the Seller is private. Also, the Uses side of the Sources & Uses schedule is based on the Purchase Enterprise Value, the Seller’s Minimum Cash, and the Transaction/Financing Fees. The Sources side is standard and includes the usual Cash, Debt, and Stock line items.", "tip": null, "tier": 3, "rank": 154, "links": [{"t": "400Q guide p.111", "h": "", "k": "ref"}, {"t": "Generalist PDF p.68", "h": "", "k": "ref"}, {"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book p.82", "h": "", "k": "ref"}], "rbq": ["What does it mean when a transaction is done on a “cash-free, debt-free” basis?"], "n": 275, "so": 9}, {"id": "Q182", "src": "400ind", "section": "Industrials (400Q industry section)", "q": "Walk me through how you would forecast an airline's cash flows, including its key metrics and drivers.", "a": "Airlines are unique in the industrials space because their customers are mostly consumers rather than companies or governments.\n\nTo forecast an airline's cash flows, start with Available Seat Kilometers (ASK) or Available Seat Miles (ASM) as the top-line driver. Then, assume a load factor and say that the Revenue Passenger Kilometers = ASK × Load Factor.\n\nPassenger Revenue equals the RPK times the Passenger Yield, or Revenue per RPK. There may be Ancillary Revenue from sources such as freight/cargo delivery as well.\n\nExpenses are divided into Fuel Costs and Non-Fuel Costs (staff, maintenance, rent, etc.).\n\nThe Cash Flow Statement follows the usual format, starting with Net Income and adding back a potentially very large Depreciation & Amortization expense, adjusting for Deferred Taxes and the Change in Working Capital, and deducting all forms of CapEx.", "tip": null, "tier": 3, "rank": 9182, "links": [{"t": "400Q guide p.165", "h": "", "k": "ref"}, {"t": "Red Book: Industrials p.246", "h": "", "k": "ref"}], "n": 276, "so": 13}, {"id": "Q186", "src": "400ind", "section": "Financial Sponsors Group (400Q industry section)", "q": "What are the key metrics and valuation multiples for a financial sponsor?", "a": "You can still value financial sponsors with traditional multiples, like TEV / EBITDA and P / E, and a traditional DCF, but Assets Under Management (AUM) and the TEV / AUM multiple are also quite important.\n\n'Fee-Related Earnings' (FRE, or management fees) vs. 'Performance Fees' (carried interest) are other important metrics, as is the split between AUM and permanent capital (the capital that must be returned to investors within a specific time frame vs. the amount held/invested on an open-ended basis).\n\nTo evaluate individual funds held at a financial sponsor, you can use metrics such as Total Value to Paid-In Capital (TVPI), Distributions to Paid-In Capital (DPI), and Residual Value to Paid-In Capital (RVPI). TVPI tells you how much the fund has already returned to investors plus the value of the remaining assets held, all divided by the investors' cash contributions. TVPI can be split into DPI (distributions so far) and RVPI (the remaining value or 'residual value'). They indicate how much the fund has returned in cash vs. its potential future returns if you believe its portfolio company valuations.", "tip": "TVPI = DPI + RVPI. 'DPI is the only one you can spend' is the line LPs use — realized cash vs. marks.", "tier": 3, "rank": 9186, "links": [{"t": "400Q guide p.159", "h": "", "k": "ref"}, {"t": "BIWS module 04 (LBO)", "h": "", "k": "ref"}, {"t": "Red Book: Private Equity Investing p.91", "h": "", "k": "ref"}], "n": 277, "so": 14}, {"id": "Q187", "src": "400ind", "section": "Financial Sponsors Group (400Q industry section)", "q": "Suppose that you are valuing a single private equity firm that uses the same strategy and targets the same size company in each of its separate funds. Why would you use a Sum-of-the-Parts (SOTP) valuation, given that there are no different business segments?", "a": "Although there are no different business segments, there are different earnings sources: the management fees charged on each fund's committed capital and the performance fees (carried interest) charged on each fund's returns.\n\nThe management fees ('Fee-Related Earnings') are more stable and predictable, so they are often valued at higher multiples, such as ~20x vs. only ~10x for the performance fees.\n\nIn SOTP valuations for financial sponsors, you value each income stream separately and then add them to the firm's Net Asset Value from its most recent Balance Sheet to determine its Implied Value.", "tip": null, "tier": 3, "rank": 9187, "links": [{"t": "400Q guide p.159", "h": "", "k": "ref"}, {"t": "BIWS module 04 (LBO)", "h": "", "k": "ref"}, {"t": "Red Book: Private Equity Investing p.91", "h": "", "k": "ref"}], "n": 278, "so": 14}, {"id": "Q194", "src": "400ind", "section": "Private Companies (400Q industry section)", "q": "How does the WACC calculation change for a private company?", "a": "You still calculate the Risk-Free Rate, Equity Risk Premium, Cost of Debt, and Cost of Preferred Stock in the same ways.\n\nIf you cannot determine the Cost of Debt from the firm's filings, you could use the comparable public companies' costs or estimate its credit default spread and add it to the Risk-Free Rate to estimate the Cost of Debt.\n\nThe Cost of Equity calculation changes because private companies do not have share prices or market caps, and their Equity tends to be riskier than public companies'. So, you often use higher values for Beta when calculating the Cost of Equity (i.e., you may add a risk or illiquidity premium), and you use the median capital structure of the comparable public companies when re-levering Beta and calculating WACC.\n\nPrivate companies do not have easy-to-determine current capital structures or historical Betas, so you must rely on the data from comparable companies.", "tip": null, "tier": 3, "rank": 9194, "links": [{"t": "400Q guide p.183", "h": "", "k": "ref"}, {"t": "BIWS module 05 (M&A)", "h": "", "k": "ref"}], "n": 279, "so": 15}, {"id": "Q195", "src": "400ind", "section": "Private Companies (400Q industry section)", "q": "How might the acquisition of a private company be different from a public company deal?", "a": "You still combine the financial statements, create Goodwill based on the Equity Purchase Price minus the seller's Book Value (and other adjustments), factor in the new shares, new interest on Debt, and foregone interest on Cash, and calculate EPS accretion/dilution.\n\nThe main difference is that the purchase price is based on a multiple, such as TEV / EBITDA or TEV / Revenue, instead of a share-price premium. Also, deals are typically done on a cash-free, debt-free basis, with the Sources & Uses schedule based on the Purchase Enterprise Value.\n\nBuyers frequently use 'Earnouts' to defer some of the purchase price and make it contingent on the seller achieving certain financial goals. Terms such as Escrows and Management Retention Pools are also common in many private company acquisitions for similar reasons: the Buyer wants to reduce the risk and ensure the management teams of both companies are aligned.", "tip": "Live example: Vertiv / UIG (Sep 2026) — $1.45B upfront plus up to $1.15B earnout, so ~44% of the price is contingent. An earnout that pays out in full means EBITDA grew, so the effective multiple falls even though the price rises.", "tier": 3, "rank": 9195, "links": [{"t": "400Q guide p.184", "h": "", "k": "ref"}, {"t": "BIWS module 05 (M&A)", "h": "", "k": "ref"}], "n": 280, "so": 15}, {"id": "R07", "src": "rb", "section": "Industrials (Red Book ch.)", "q": "What are some basic unit economics for a truck transportation company you would look at to forecast revenue?", "a": "Start with the historical metrics: the average number of shipment orders (hauls) per year, the average length of each haul in miles, and total annual shipping revenue. From those you can back into average revenue per mile driven.\n\nTo add specificity, look at the number of clients the company works with consistently, the current pipeline of shipment orders, and the number of new client contracts it could win in the years ahead. Alternatively, forecast revenue on a per-driver, per-truck, or per-project basis.", "tip": "Revenue = loads × miles per load × revenue per mile. In 2026 the swing variable is revenue per mile: truckload spot rates ran ~$3.20/mile, +38% y/y, as capacity exited after a 42-month freight recession — that's the number to quote.", "tier": 3, "rank": 9507, "links": [{"t": "Red Book p.249", "h": "", "k": "ref"}, {"t": "400Q guide: Industrials p.164", "h": "", "k": "ref"}], "n": 281, "so": 16}, {"id": "R08", "src": "rb", "section": "Industrials (Red Book ch.)", "q": "What are some of the cost drivers you would look at for a truck transportation company?", "a": "Trucking, like many industrials sub-sectors, has a high-cost structure.\n\nThe most important costs to forecast are driver-related: the total number of drivers and their compensation, usually paid per mile or hourly rather than as a set salary.\n\nThen CapEx needs: the number of existing trucks, the average age of the fleet, the average life-cycle of each truck, and average annual repair costs.\n\nOther items — sales & marketing, insurance, rent — matter less than those two.", "tip": null, "tier": 3, "rank": 9508, "links": [{"t": "Red Book p.249", "h": "", "k": "ref"}, {"t": "400Q guide: Industrials p.164", "h": "", "k": "ref"}], "n": 282, "so": 16}, {"id": "R13", "src": "rb", "section": "Industrials (Red Book ch.)", "q": "Why might NAV be preferable to a DCF for shipping companies?", "a": "Unlike most industries, shipping company balance sheets carry real assets for which there are comparable assets with observable market values. The NAV approach essentially recalculates the balance sheet at fair market values of the assets.\n\nThat simply isn't feasible for most industries, which is why a DCF is used for them instead.\n\nValuation is driven by daily revenue, charter rates and vessel asset values, which in turn depend on two things: supply and demand for the commodities being shipped (crude and refined products, LNG, dry bulk, containerized freight) and supply and demand for vessels themselves — ships 'on the water' and the global order book. Ships take ~18 months to build, so oversupply tends to arrive just as demand rolls over; timing is everything.", "tip": null, "tier": 3, "rank": 9513, "links": [{"t": "Red Book p.255", "h": "", "k": "ref"}, {"t": "400Q guide: Industrials p.164", "h": "", "k": "ref"}], "n": 283, "so": 16}, {"id": "S104", "src": "supp", "section": "Finance Concepts", "topic": "Core Concepts", "q": "Someone offers you $1,000 today or $1,200 in 3 years. Your discount rate is 8%. Which do you take?", "a": "Take the $1,000 today.\n\nPV of $1,200 in 3 years at 8% = $1,200 / (1.08)³ = $1,200 / 1.26 ≈ $953.\n\nSince $953 < $1,000, today's money is worth more. Said another way: $1,000 invested at 8% for 3 years grows to $1,000 × 1.26 = $1,260, beating the $1,200 offer.", "tier": 3, "rank": 5104, "links": [{"t": "BIWS module 01", "h": "", "k": "ref"}, {"t": "Red Book: Corporate Finance Theory p.45", "h": "", "k": "ref"}, {"t": "400Q guide: Finance Concepts p.46", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 284, "so": 0}, {"id": "S107", "src": "supp", "section": "Finance Concepts", "topic": "Core Concepts", "q": "PE shop has two options. Project A: 25% IRR on $1M equity. Project B: 15% IRR on $10M equity. Which does the firm take?", "a": "Probably Project B, if they can deploy the capital. PE firms ultimately care about absolute dollars of value creation (carry is on dollars, not percentages) and they have to deploy fund capital — leaving $9M sitting on the sidelines while earning 25% on $1M is bad fund-level math.\n\nProject A's 25% IRR is impressive but on too small a base. Project B generates more absolute return AND deploys more of the fund. The exception: if Project A scales (you can do 9 more of them), or capital is severely constrained, then A wins. Always ask 'what's my alternative use of the $9M?'", "tier": 3, "rank": 5107, "links": [{"t": "BIWS module 01", "h": "", "k": "ref"}, {"t": "Red Book: Corporate Finance Theory p.45", "h": "", "k": "ref"}, {"t": "400Q guide: Finance Concepts p.46", "h": "", "k": "ref"}], "type": "compare", "flags": [], "n": 285, "so": 0}, {"id": "S206", "src": "supp", "section": "Accounting – Concepts", "topic": "Accounting Concepts", "q": "A company books $500 of revenue in December under accrual accounting but doesn't receive the cash until February. What appears on the Dec 31 balance sheet?", "a": "On Dec 31: Accounts Receivable increases $500 (asset, current). Retained Earnings increases by Net Income from this sale (revenue $500 minus any related expenses and tax). No cash change yet.\n\nWhen cash arrives in February: AR decreases $500, Cash increases $500. Net Income was already recognized in December — that's the whole point of accrual accounting.", "tier": 3, "rank": 5206, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements p.13", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Concepts p.50", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 286, "so": 1}, {"id": "S207", "src": "supp", "section": "Accounting – Concepts", "topic": "Accounting Concepts", "q": "Two profitable companies. Both have $100M Net Income. Company A has +$80M cash flow from operations. Company B has -$20M. How is that possible?", "a": "Working capital and non-cash items.\n\nCompany B is probably growing fast: AR is ballooning (sales not yet collected), inventory is building, prepaid expenses up — all of which absorb cash. Or they have huge non-cash gains in Net Income that don't bring cash (like a one-time mark-to-market gain).\n\nCompany A is generating cash: collecting receivables, possibly running negative working capital (collect from customers before paying suppliers — think Amazon), with healthy non-cash addbacks.\n\nThis is exactly why the CFS matters: NI ≠ cash.", "tier": 3, "rank": 5207, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements p.13", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Concepts p.50", "h": "", "k": "ref"}], "type": "compare", "flags": [], "n": 287, "so": 1}, {"id": "S305", "src": "supp", "section": "Accounting – Calculations", "topic": "Statement Linkages", "q": "Accounts Receivable increases by $50 (no other change). What happens to the cash flow statement?", "a": "Cash from Operations decreases by $50. Mechanically: under the indirect method, an increase in AR is a use of cash — you recorded the revenue but didn't collect it yet. So you subtract the $50 increase from Net Income to get to actual cash.\n\nNo change to investing or financing. Net change in cash is -$50.", "tier": 3, "rank": 5305, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements p.13", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Calcs p.59", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 288, "so": 2}, {"id": "S306", "src": "supp", "section": "Accounting – Calculations", "topic": "Statement Linkages", "q": "If depreciation increases by $10, walk me through all three statements. Assume 40% tax rate.", "a": "IS: pre-tax income down $10, taxes down $4, Net Income down $6.\n\nCFS: NI down $6, plus add back $10 of D&A (non-cash) = cash up $4.\n\nBS: Cash up $4, PP&E down $10 (left side down $6). Retained Earnings down $6 (right side down $6). Balances.\n\nThe $4 net cash gain is the tax shield from the deduction.", "tier": 3, "rank": 5306, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements p.13", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Calcs p.59", "h": "", "k": "ref"}], "type": "walkthrough", "flags": [], "n": 289, "so": 2}, {"id": "S307", "src": "supp", "section": "Accounting – Calculations", "topic": "Statement Linkages", "q": "If the Cash Flow Statement is the 'truest' view of business health, why do investment bankers spend so much time on the income statement?", "a": "Because the IS shows underlying profitability and trends that cash flow can mask, especially in growing or capital-intensive businesses. A company investing heavily in growth might show negative cash flow but excellent unit economics and improving margins on the IS — that's a great business in disguise.\n\nAlso: most multiples (P/E, EV/EBITDA) are anchored on IS metrics. And forecasting starts on the IS. Smart analysts use both: the IS for the business story, the CFS for the truth check.", "tier": 3, "rank": 5307, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements p.13", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Calcs p.59", "h": "", "k": "ref"}], "type": "compare", "flags": [], "n": 290, "so": 2}, {"id": "S309", "src": "supp", "section": "Accounting – Calculations", "topic": "Statement Linkages", "q": "Company repurchases $100 of its own stock for cash. Walk me through the three statements.", "a": "IS: no change. Treasury buybacks aren't expenses.\n\nCFS: Financing activities down $100.\n\nBS: Cash down $100. Treasury Stock (contra-equity) up $100, which reduces Shareholders' Equity by $100. Balances.", "tier": 3, "rank": 5309, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements p.13", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Calcs p.59", "h": "", "k": "ref"}], "type": "walkthrough", "flags": [], "n": 291, "so": 2}, {"id": "S401", "src": "supp", "section": "Accounting – Calculations", "topic": "Accounting Calcs", "q": "Company buys $100 of equipment for cash on Dec 31. Assume no depreciation Year 1, then 5-year straight-line and 40% tax rate Year 2. Walk through all three statements both years.", "a": "YEAR 1 — IS: no change (capex isn't an expense). CFS: investing cash flow down $100. BS: Cash down $100, PP&E up $100. Balances.\n\nYEAR 2 — IS: $20 depreciation, pre-tax income down $20, taxes down $8, Net Income down $12. CFS: NI down $12, + add back $20 D&A = cash up $8. BS: Cash up $8, PP&E down $20 (left side down $12); Retained Earnings down $12 (right side down $12). Balances.", "tier": 3, "rank": 5401, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statement Analysis p.27", "h": "", "k": "ref"}, {"t": "Red Book: Advanced Accounting p.35", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Calcs p.59", "h": "", "k": "ref"}], "type": "walkthrough", "flags": [], "n": 292, "so": 2}, {"id": "S402", "src": "supp", "section": "Accounting – Calculations", "topic": "Accounting Calcs", "q": "$100 inventory write-down. Walk through the three statements. (40% tax rate)", "a": "IS: COGS up $100, pre-tax income down $100, taxes down $40, Net Income down $60.\n\nCFS: NI down $60, + add back $100 non-cash write-down = cash up $40.\n\nBS: Cash up $40, Inventory down $100 (left side down $60); Retained Earnings down $60 (right side down $60). Balances.", "tier": 3, "rank": 5402, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statement Analysis p.27", "h": "", "k": "ref"}, {"t": "Red Book: Advanced Accounting p.35", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Calcs p.59", "h": "", "k": "ref"}], "type": "walkthrough", "flags": [], "n": 293, "so": 2}, {"id": "S404", "src": "supp", "section": "Accounting – Calculations", "topic": "Accounting Calcs", "q": "Inventory increases by $50 due to slower turnover (no other change). Walk through the statements.", "a": "IS: no change yet — inventory build is a balance sheet event, not a sale.\n\nCFS: Cash from Operations down $50 (increase in inventory is a use of cash).\n\nBS: Cash down $50, Inventory up $50 (left side flat). Right side unchanged. Balances. Note: this is why fast-growing companies often run negative operating cash flow — WC build absorbs cash even when profitable.", "tier": 3, "rank": 5404, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statement Analysis p.27", "h": "", "k": "ref"}, {"t": "Red Book: Advanced Accounting p.35", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Calcs p.59", "h": "", "k": "ref"}], "type": "walkthrough", "flags": [], "n": 294, "so": 2}, {"id": "S407", "src": "supp", "section": "Accounting – Calculations", "topic": "Accounting Calcs", "q": "Deferred Revenue increases by $50 (customer prepaid for a service to be delivered next period). Walk through the impact.", "a": "IS: no change — revenue isn't recognized until earned.\n\nCFS: Cash from Operations up $50 (increase in deferred revenue is a source of cash — you got cash but haven't earned it yet).\n\nBS: Cash up $50, Deferred Revenue (liability) up $50. Balances.\n\nThis is why SaaS companies with strong cash collections often show CFO well above NI — the prepaid subscriptions hit cash before they hit revenue.", "tier": 3, "rank": 5407, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statement Analysis p.27", "h": "", "k": "ref"}, {"t": "Red Book: Advanced Accounting p.35", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Calcs p.59", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 295, "so": 2}, {"id": "S408", "src": "supp", "section": "Accounting – Calculations", "topic": "Accounting Calcs", "q": "Two companies each bought $100 of equipment. Company A uses straight-line depreciation (5 yrs). Company B uses accelerated (2x DDB). After Year 1, who reports higher Net Income? Higher cash flow?", "a": "Higher Net Income: Company A (straight-line, $20 depreciation Year 1 vs Company B's $40 under 2x DDB). Lower depreciation = higher pre-tax income = higher NI.\n\nHigher cash flow: Company B. Accelerated depreciation gives a larger tax shield in Year 1 — more taxes deferred to later years. Total cash over the asset's life is identical; B just gets more of it earlier.\n\nClassic GAAP-vs-tax tradeoff, and why deferred tax liabilities exist.", "tier": 3, "rank": 5408, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statement Analysis p.27", "h": "", "k": "ref"}, {"t": "Red Book: Advanced Accounting p.35", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Calcs p.59", "h": "", "k": "ref"}], "type": "compare", "flags": [], "n": 296, "so": 2}, {"id": "S505", "src": "supp", "section": "Equity Value & Enterprise Value – Calculations", "topic": "EV / Equity Value", "q": "A company has $1B market cap, $200M total debt, $50M cash, $30M preferred stock, no minority interest. What's its EV?", "a": "EV = $1,000 + $200 + $30 − $50 = $1,180M ($1.18B).", "tier": 3, "rank": 5505, "links": [{"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Corporate Finance Theory p.45", "h": "", "k": "ref"}, {"t": "400Q guide: EV/Equity Value p.71", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 297, "so": 4}, {"id": "S506", "src": "supp", "section": "Equity Value & Enterprise Value – Concepts", "topic": "EV / Equity Value", "q": "Companies A and B have identical operations, EBITDA, and EV/EBITDA multiples. A has $500M debt and $0 cash; B has $0 debt and $500M cash. Which has the higher Equity Value?", "a": "Company B, by $1,000M.\n\nSame EV (say, $2,000M). \nFor A: Equity Value = EV − Debt + Cash = $2,000 − $500 + $0 = $1,500.\nFor B: Equity Value = EV − Debt + Cash = $2,000 − $0 + $500 = $2,500.\n\nDifference: $1,000M. The leverage matters for equity holders. Even though the operating businesses are identical, B's equity is worth substantially more because of the cash net of debt.", "tier": 3, "rank": 5506, "links": [{"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Corporate Finance Theory p.45", "h": "", "k": "ref"}, {"t": "400Q guide: EV/Equity Value p.71", "h": "", "k": "ref"}], "type": "compare", "flags": [], "n": 298, "so": 3}, {"id": "S509", "src": "supp", "section": "Equity Value & Enterprise Value – Calculations", "topic": "EV / Equity Value", "q": "Treasury Stock Method walkthrough: Company has 100M basic shares outstanding, share price $50. There are 10M options outstanding with $30 strike. What's the diluted share count?", "a": "Step 1: Are options in-the-money? Strike $30 < market $50, so yes — all 10M count.\n\nStep 2: Assume exercise → company receives 10M × $30 = $300M in proceeds.\n\nStep 3: Assume the company uses proceeds to buy back stock at $50 → repurchases $300M / $50 = 6M shares.\n\nStep 4: Net dilution = 10M options exercised − 6M shares repurchased = 4M new shares.\n\nDiluted shares = 100M + 4M = 104M.", "tier": 3, "rank": 5509, "links": [{"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Corporate Finance Theory p.45", "h": "", "k": "ref"}, {"t": "400Q guide: EV/Equity Value p.71", "h": "", "k": "ref"}], "type": "walkthrough", "flags": [], "n": 299, "so": 4}, {"id": "S510", "src": "supp", "section": "Equity Value & Enterprise Value – Calculations", "topic": "EV / Equity Value", "q": "A company issues $500M of new equity and uses the proceeds to pay down $500M of debt. What happens to EV? What happens to Equity Value?", "a": "EV: unchanged. Pure capital structure swap — debt down $500, equity value up $500, cash unchanged. Net to EV = 0.\n\nEquity Value: increases by $500M from the issuance (more shares × same price, roughly, assuming no signaling effect). But on a per-share basis, the new shares dilute existing holders — total equity up, but each share owns a smaller piece of a less-leveraged company.\n\nLesson: operations are what they are. Capital structure shuffles move value between debt and equity holders without changing EV.", "tier": 3, "rank": 5510, "links": [{"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Corporate Finance Theory p.45", "h": "", "k": "ref"}, {"t": "400Q guide: EV/Equity Value p.71", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 300, "so": 4}, {"id": "S605", "src": "supp", "section": "Valuation Metrics and Multiples", "topic": "Valuation Multiples", "q": "Company A trades at 25x P/E and 18x EV/EBITDA. Company B trades at 10x P/E and 12x EV/EBITDA. What might explain the divergence in relative multiples?", "a": "Most likely: capital structure. Divide the multiples: A's P/E is ~1.4x its EV/EBITDA (25/18), while B's is ~0.83x (10/12). That ratio equals (Equity Value/EV) × (EBITDA/Net Income). Since EBITDA always sits well above Net Income (taxes, D&A), B's low ratio means its Equity Value must be a thin slice of its EV — B carries substantial net debt. A's Equity Value makes up nearly all of its EV — A is lightly levered.\n\nIntuition: adding debt shrinks Equity Value proportionally more than interest expense shrinks Net Income (for normal multiples and borrowing costs), so leverage drags P/E down relative to EV/EBITDA.\n\nOther possibilities: A has lower D&A as a % of EBITDA (capital-light) or a lower effective tax rate, both of which improve EBITDA-to-Net-Income conversion. But capital structure is by far the most common driver and the answer the interviewer is fishing for.", "tier": 3, "rank": 5605, "links": [{"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Relative Valuation p.65", "h": "", "k": "ref"}, {"t": "400Q guide: Metrics & Multiples p.88", "h": "", "k": "ref"}], "type": "compare", "flags": [], "n": 301, "so": 6}, {"id": "S606", "src": "supp", "section": "Valuation Metrics and Multiples", "topic": "Valuation Multiples", "q": "You're asked to value a SaaS company with $200M revenue, -$50M EBITDA, growing 80% YoY. What multiples do you use?", "a": "EV/Revenue is the workhorse — EBITDA is negative so EV/EBITDA is meaningless. Often paired with EV/ARR (annual recurring revenue) for SaaS specifically.\n\nLook at forward (NTM) multiples given the high growth rate. Also consider growth-adjusted multiples (EV/Revenue ÷ growth rate) to compare companies growing at different speeds. A separate, related screen is the Rule of 40: revenue growth % + profit margin % should exceed 40 — this company is at 80% + (−25%) = 55, comfortably clearing the bar despite the losses.\n\nBenchmark against high-growth SaaS comps (similar growth, similar net retention) — those companies often trade at 10-15x+ NTM revenue depending on the cycle.", "tier": 3, "rank": 5606, "links": [{"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Relative Valuation p.65", "h": "", "k": "ref"}, {"t": "400Q guide: Metrics & Multiples p.88", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 302, "so": 6}, {"id": "S705", "src": "supp", "section": "Discounted Cash Flow (DCF) – Assumptions and Analysis", "topic": "DCF Mechanics", "q": "Company has $50M projected EBITDA in Year 5. You're using a 9x exit multiple. What's the Terminal Value?", "a": "TV = $50M × 9 = $450M. (This is the undiscounted terminal value at end of Year 5; you still need to discount it back to today at WACC.)", "tier": 3, "rank": 5705, "links": [{"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book: Intrinsic Valuation p.54", "h": "", "k": "ref"}, {"t": "400Q guide: DCF p.94", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 303, "so": 7}, {"id": "S707", "src": "supp", "section": "Discounted Cash Flow (DCF) – Assumptions and Analysis", "topic": "DCF Mechanics", "q": "Your DCF terminal value is 90% of total enterprise value. What's wrong, and how do you fix it?", "a": "That's too high — typical TV is 60-80% of total EV. At 90%, your explicit projection period is doing almost no work, which means:\n\n1) Your projection period might be too short. Extend from 5 to 10 years so more cash flow is captured explicitly.\n2) Your growth assumptions in the projection period might be too low, suppressing PV of years 1-5.\n3) Your terminal growth rate might be too high or your exit multiple too aggressive.\n\nFix: extend the projection period if the business is in early-stage or transition, OR sanity-check the terminal assumptions against the implied perpetuity growth / implied exit multiple cross-check.", "tier": 3, "rank": 5707, "links": [{"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book: Intrinsic Valuation p.54", "h": "", "k": "ref"}, {"t": "400Q guide: DCF p.94", "h": "", "k": "ref"}], "type": "compare", "flags": [], "n": 304, "so": 7}, {"id": "S805", "src": "supp", "section": "Discounted Cash Flow (DCF) – The Discount Rate", "topic": "WACC", "q": "Beta = 1.2, Risk-Free Rate = 4%, Equity Risk Premium = 6%. What's the Cost of Equity?", "a": "Cost of Equity = 4% + 1.2 × 6% = 4% + 7.2% = 11.2%.", "tier": 3, "rank": 5805, "links": [{"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book: Intrinsic Valuation p.54", "h": "", "k": "ref"}, {"t": "400Q guide: Discount Rate p.103", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 305, "so": 8}, {"id": "S806", "src": "supp", "section": "Discounted Cash Flow (DCF) – The Discount Rate", "topic": "WACC", "q": "Capital structure: 60% equity (cost 12%), 40% debt (pre-tax cost 6%). Tax rate 25%. What's WACC?", "a": "WACC = 0.60 × 12% + 0.40 × 6% × (1 − 0.25)\n      = 7.2% + 0.40 × 4.5%\n      = 7.2% + 1.8%\n      = 9.0%", "tier": 3, "rank": 5806, "links": [{"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book: Intrinsic Valuation p.54", "h": "", "k": "ref"}, {"t": "400Q guide: Discount Rate p.103", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 306, "so": 8}, {"id": "S807", "src": "supp", "section": "Discounted Cash Flow (DCF) – The Discount Rate", "topic": "WACC", "q": "Two companies in the same industry. Company A: 80% equity / 20% debt. Company B: 50% equity / 50% debt. Same business, same risk. Which has the lower WACC? Why?", "a": "Company B (more leveraged) likely has lower WACC, all else equal.\n\nReason: debt is cheaper than equity (lower risk, tax-deductible). More debt weight in the capital structure pulls the blended cost down.\n\nHowever, this only holds up to a point. Beyond optimal leverage, financial distress costs creep in — cost of debt rises (lenders demand higher rates), cost of equity rises (more risk to equity holders), and WACC starts climbing again. The famous 'U-shaped' WACC curve.", "tier": 3, "rank": 5807, "links": [{"t": "BIWS module 06", "h": "", "k": "ref"}, {"t": "Red Book: Intrinsic Valuation p.54", "h": "", "k": "ref"}, {"t": "400Q guide: Discount Rate p.103", "h": "", "k": "ref"}], "type": "compare", "flags": [], "n": 307, "so": 8}, {"id": "S907", "src": "supp", "section": "Merger Models – Calculations", "topic": "M&A Calcs", "q": "Acquirer P/E = 10x. Target P/E = 15x. All-stock deal. Is it accretive or dilutive?", "a": "Dilutive.\n\nWhy: the acquirer issues its 10x stock (10% earnings yield) to buy 15x earnings (6.7% earnings yield). The acquirer 'gives up' more earnings per share issued than it gains per share acquired, so combined EPS falls.\n\nRule of thumb: in all-stock deals, the highe
