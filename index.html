{"t": "400Q guide: Merger Calcs p.114", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 423, "so": 10}, {"id": "S911", "src": "supp", "section": "Merger Models – Calculations", "topic": "M&A Calcs", "q": "What are the key pro forma adjustments in a merger model?", "a": "1) Eliminate target's existing equity — replaced by purchase consideration.\n2) Write up tangible and intangible assets to fair value; new Goodwill = purchase price − fair value of net assets acquired.\n3) Layer in new financing — cash used (reduces cash), debt raised (increases debt + interest), stock issued (increases share count). All have downstream effects.\n4) Add transaction expenses (advisory, legal, accounting) — typically expensed or amortized depending on category.\n5) Add financing fees on new debt — capitalized and amortized.\n6) Recognize synergies — typically phased in over 1-3 years; cost synergies start near deal close, revenue synergies later.\n7) Recompute taxes on combined entity, factoring in deal financing.\n8) Recompute pro forma share count (basic + diluted) including new shares issued.", "tier": 4, "rank": 5911, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book: Accretion/Dilution p.81", "h": "", "k": "ref"}, {"t": "400Q guide: Merger Calcs p.114", "h": "", "k": "ref"}], "type": "walkthrough", "flags": [], "n": 424, "so": 10}, {"id": "S1005", "src": "supp", "section": "LBO Models – Calculations", "topic": "LBO", "q": "Paper LBO: $1,000 EV, $200 EBITDA (5x entry), 50% debt / 50% equity, 5-year hold, exit at same 5x multiple, EBITDA grows to $300, $100 of debt is paid down. What's the MOIC and approximate IRR?", "a": "Entry equity: $1,000 × 50% = $500.\n\nExit EV: $300 × 5x = $1,500.\nExit debt: $500 entry debt − $100 paid down = $400.\nExit equity: $1,500 − $400 = $1,100.\n\nMOIC: $1,100 / $500 = 2.2x.\nIRR: ~17% (rule of thumb: 2x in 5 years ≈ 15%, 2.5x ≈ 20%, so 2.2x ≈ 17%).", "tier": 4, "rank": 6005, "links": [{"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "Red Book: Private Equity Investing p.91", "h": "", "k": "ref"}, {"t": "Red Book: LBO Modeling p.104", "h": "", "k": "ref"}, {"t": "400Q guide: LBO p.119", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 425, "so": 12}, {"id": "S1006", "src": "supp", "section": "LBO Models – Calculations", "topic": "LBO", "q": "In the previous question, what happens to MOIC and IRR if you double the entry leverage to 75% debt / 25% equity (everything else equal)?", "a": "Entry equity: $1,000 × 25% = $250.\nEntry debt: $750.\n\nAssume the company still pays down $100 of debt (similar cash flow). Exit debt: $750 − $100 = $650.\nExit EV: $300 × 5x = $1,500 (unchanged).\nExit equity: $1,500 − $650 = $850.\n\nMOIC: $850 / $250 = 3.4x.\nIRR: ~28% (3.4x in 5 yrs).\n\nThe LBO firm's nominal return roughly doubled. Caveat: more interest expense eats into cash flow available for debt paydown, increases default risk, and lenders may not even agree to that much leverage. In practice, the gain is real but smaller than this simple calc suggests.", "tier": 4, "rank": 6006, "links": [{"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "Red Book: Private Equity Investing p.91", "h": "", "k": "ref"}, {"t": "Red Book: LBO Modeling p.104", "h": "", "k": "ref"}, {"t": "400Q guide: LBO p.119", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 426, "so": 12}, {"id": "S1202", "src": "supp", "section": "Synthesis (supplemental)", "topic": "Synthesis", "q": "You're advising a buyer considering a target with negative EBITDA and rapid revenue growth. How do you frame valuation?", "a": "Standard EBITDA multiples are useless here. Frame around:\n\n1) Revenue multiples vs growth-stage comps (EV/Revenue, EV/ARR if SaaS), tied to growth rate.\n2) Path-to-profitability — what does steady-state EBITDA look like at maturity? Build a 'cycle-end' EBITDA estimate and apply normalized multiples to it.\n3) DCF with explicit assumptions — when does the company turn cash-flow positive? What does it need to look like in 5-7 years to justify the price?\n4) Strategic value — what synergies does the acquirer specifically capture? (Distribution, customer overlap, etc.) Sometimes synergies justify what comps can't.\n5) Sponsor / strategic precedents — what have similar growth-stage assets sold for?\n\nAvoid: forcing an EBITDA multiple. Acknowledge: a lot of this is judgment, not math.", "tier": 4, "rank": 6202, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 427, "so": 19}, {"id": "S1206", "src": "supp", "section": "Synthesis (supplemental)", "topic": "Synthesis", "q": "CEO asks you (the banker): 'Should we acquire this competitor or build the capability internally?' How do you frame your advice?", "a": "Frame around four lenses:\n\n1) Time-to-value: M&A is faster (immediate scale, customers, capabilities); build is slower but risks are clearer.\n\n2) Risk and execution: acquisitions carry integration risk, cultural risk, and the chance of overpaying. Build carries the risk that you fail to develop the capability or competitors get there first.\n\n3) Cost: compare total acquisition cost (including premium and integration costs) vs. internal build cost (R&D, hiring, time-to-market opportunity cost).\n\n4) Strategic fit: does the target give you something hard to replicate (network effects, regulatory licenses, key talent, customer base)? Or is it something you can credibly build?\n\nFraming: 'M&A is typically the right answer when speed-to-market matters, the asset is hard to replicate, and you can pay a price that delivers more value than the build alternative.' Then quantify the value of speed and the cost of failure.", "tier": 4, "rank": 6206, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 428, "so": 19}, {"id": "S3029", "src": "supp", "section": "Accounting – Calculations", "topic": "Statement Linkages", "q": "A company acquires another for $1,000 cash; the seller's Equity was $500 with $100 of identifiable intangibles (5-year life). Walk through the statements from just after close to the end of Year 1, considering only Goodwill and intangibles.", "a": "The 'gap' between price and seller Equity is $500 → $100 to Other Intangible Assets and $400 to Goodwill. Intangibles amortize $20/year ($100 / 5).\n\nIncome Statement: Amortization up $20 → Pre-Tax Income down $20 → Net Income down $12 (40% tax).\n\nCash Flow Statement: Net Income down $12, add back $20 non-cash Amortization → cash up $8.\n\nBalance Sheet: Cash up $8, Other Intangibles down $20 → Assets down $12. Retained Earnings down $12 → L&E down $12. Balances.\n\nNote: Goodwill is not amortized; it only moves if impaired. The cash actually rises because the non-cash amortization shields taxes.", "tier": 4, "rank": 8029, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements p.13", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Calcs p.59", "h": "", "k": "ref"}], "type": "walkthrough", "flags": [], "n": 429, "so": 2}, {"id": "S3030", "src": "supp", "section": "Accounting – Calculations", "topic": "Statement Linkages", "q": "A customer orders a product, paying $100 cash upfront before delivery; the product costs $60 to make and is held in inventory. Walk me through the statements at the moment of the order (40% tax).", "a": "At the order/payment date, before delivery, you cannot recognize revenue yet.\n\nIncome Statement: no change – no revenue, no COGS recognized yet, so Net Income is unchanged.\n\nCash Flow Statement: Net Income unchanged, but Deferred Revenue increases by $100 (cash collected, not yet earned) → +$100 in CFO. Cash up $100.\n\nBalance Sheet: Cash up $100 (Assets +$100). On L&E, Deferred Revenue (a Liability) up $100 → L&E +$100. Balances. (Inventory of $60 was already on the books from production; making the product itself didn't change Net Income.)\n\nIntuition: cash arrives before profit – a classic Deferred Revenue timing difference.", "tier": 4, "rank": 8030, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements p.13", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Calcs p.59", "h": "", "k": "ref"}], "type": "walkthrough", "flags": [], "n": 430, "so": 2}, {"id": "S3034", "src": "supp", "section": "Accounting – Calculations", "topic": "Accounting Calcs", "q": "A company buys a $100 factory using $100 of debt. What happens INITIALLY (Day 0) on the three statements?", "a": "At purchase, before any depreciation or interest:\n\nIncome Statement: no change – buying an asset and raising debt don't hit the IS yet.\n\nCash Flow Statement: Cash Flow from Investing shows –$100 (CapEx for the factory); Cash Flow from Financing shows +$100 (debt raised). Net change in cash = $0.\n\nBalance Sheet: PP&E up $100, Cash unchanged (net) → Assets up $100. Debt up $100 → Liabilities up $100. Balances.\n\nIntuition: you've swapped financing for a productive asset – no profit impact and no net cash change on Day 0. The IS effects (depreciation, interest) come in later years.", "tier": 4, "rank": 8034, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statement Analysis p.27", "h": "", "k": "ref"}, {"t": "Red Book: Advanced Accounting p.35", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Calcs p.59", "h": "", "k": "ref"}], "type": "walkthrough", "flags": [], "n": 431, "so": 2}, {"id": "S3035", "src": "supp", "section": "Accounting – Calculations", "topic": "Accounting Calcs", "q": "One year later, that company pays 10% interest on the $100 debt and depreciates the factory $10 (40% tax). Walk me through the statements.", "a": "Income Statement: Interest expense $10 and Depreciation $10 → Pre-Tax Income down $20 → Net Income down $12 (40% tax).\n\nCash Flow Statement: Net Income down $12, add back $10 non-cash Depreciation → cash down $2. (Interest is a real cash expense already in Net Income; no add-back.)\n\nBalance Sheet: Cash down $2 and PP&E down $10 (depreciation) → Assets down $12. Retained Earnings down $12 → L&E down $12. Balances.\n\nIntuition: interest is a true cash cost, but depreciation is non-cash and partially offsets via the tax shield, so cash only falls $2 even though Net Income fell $12.", "tier": 4, "rank": 8035, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statement Analysis p.27", "h": "", "k": "ref"}, {"t": "Red Book: Advanced Accounting p.35", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Calcs p.59", "h": "", "k": "ref"}], "type": "walkthrough", "flags": [], "n": 432, "so": 2}, {"id": "S3037", "src": "supp", "section": "Accounting – Calculations", "topic": "Accounting Calcs", "q": "A company issues $100 in stock to fund operations. Walk through the three statements, then explain how it differs from raising $100 of debt.", "a": "Stock issuance:\nIncome Statement: no change (issuing equity doesn't hit the IS).\nCash Flow Statement: +$100 in Cash Flow from Financing → cash up $100.\nBalance Sheet: Cash up $100 (Assets +$100); Common Stock & APIC up $100 (L&E +$100). Balances.\n\nDifference vs. debt: a debt raise also shows +$100 in CFF and +$100 cash, but the offsetting Balance Sheet entry is Debt (a Liability) instead of equity. The lasting difference is the 'after-effect': equity raises the share count (dilution) with no required payments, while debt requires interest (which hits the IS, lowering Net Income and cash) and eventual repayment of principal.", "tier": 4, "rank": 8037, "links": [{"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statement Analysis p.27", "h": "", "k": "ref"}, {"t": "Red Book: Advanced Accounting p.35", "h": "", "k": "ref"}, {"t": "400Q guide: Accounting Calcs p.59", "h": "", "k": "ref"}], "type": "walkthrough", "flags": [], "n": 433, "so": 2}, {"id": "S3049", "src": "supp", "section": "Equity Value & Enterprise Value – Calculations", "topic": "EV / Equity Value", "q": "A company raises $200 million of Debt and uses it to acquire another company for $200 million; the target's Common Shareholders' Equity is also $200 million. How does everything change?", "a": "Step 1 – raise $200M Debt: neither Equity Value nor Enterprise Value changes (extra Cash offsets extra Debt).\n\nStep 2 – acquire a company for $200M: the acquired business is a core-business Asset, so Enterprise Value increases by $200M. Equity Value does not change (it spent Cash, a non-core Asset, to gain a core Asset – from Equity Value's view both are just Assets).\n\nResult: P/E unchanged, EV/EBITDA increases. (If the target's equity had been only $100M, you'd book $100M of Goodwill/intangibles – but those are core Assets too, so the answer is identical.)", "tier": 4, "rank": 8049, "links": [{"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Corporate Finance Theory p.45", "h": "", "k": "ref"}, {"t": "400Q guide: EV/Equity Value p.71", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 434, "so": 4}, {"id": "S3207", "src": "supp", "section": "Merger Models – Concepts", "topic": "M&A Concepts", "q": "A buyer is weighing whether to 'refinance' or 'repay' the target's existing debt. Walk me through what each means and how each affects the deal funding.", "a": "'Assuming/Refinancing' debt: the buyer replaces the seller's existing debt with new debt of the same amount and similar terms. Economically, the debt simply rolls - it does NOT increase the funds the buyer must raise, because the new debt pays off the old. The existing debt costs the buyer nothing extra upfront.\n\n'Repaying' debt: the buyer uses deal funding (cash/new debt/stock) to pay off the seller's debt entirely and does not re-borrow. This DOES increase the purchase price / funds required, because the buyer must source the cash to retire that debt.\n\nWhy it matters: this is exactly why Purchase Enterprise Value isn't automatically the 'true cost.' If debt is refinanced, the seller's existing debt drops out of the real price; if it's repaid, it adds to it.\n\nLead with the one-liner: 'Refinancing rolls the debt and is cost-neutral upfront; repaying retires it and increases funds required.'", "tier": 4, "rank": 8207, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book: M&A Concepts p.73", "h": "", "k": "ref"}, {"t": "400Q guide: Merger Models p.107", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 435, "so": 9}, {"id": "S3217", "src": "supp", "section": "Merger Models – Calculations", "topic": "M&A Calcs", "q": "Take the all-stock deal from before (A: 10 shares at $25, NI $10; buys B for $150 with NI $10). Now A is twice as large - Equity Value $500, Net Income $20, share price $50, still 10 shares. Will the all-stock deal be MORE or LESS accretive, and what's the new accretion?", "a": "Intuition first: LESS accretive. The bigger the buyer is relative to the target, the more every combined figure is weighted toward the buyer's own standalone numbers - so the cheap 15x target moves combined EPS less, and the Combined P/E sits closer to the buyer's 25x.\n\nMath:\nA's EPS = $20 / 10 = $2.00.\nNew shares = $150 / $50 = 3. Combined shares = 10 + 3 = 13.\nCombined Net Income = $20 + $10 = $30 (same tax, no cash/debt).\nCombined EPS = $30 / 13 = $2.31.\nAccretion = $2.31 / $2.00 - 1 = ~15%.\n\nSo accretion falls from 25% (when A was smaller) to ~15%. Key takeaway for interviews: a relatively larger buyer makes an accretive stock deal LESS accretive.", "tier": 4, "rank": 8217, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book: Accretion/Dilution p.81", "h": "", "k": "ref"}, {"t": "400Q guide: Merger Calcs p.114", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 436, "so": 10}, {"id": "S3226", "src": "supp", "section": "LBO Models – Calculations", "topic": "LBO", "q": "A PE firm buys a $200M EBITDA company using 50% debt at a 6x entry multiple. EBITDA grows to $300M by Year 3, exit multiple unchanged. The company pays interest and required principal but generates no extra cash. What is the MINIMUM IRR?", "a": "Entry: EV = $200M x 6x = $1,200M. Equity = $600M, Debt = $600M.\nExit (Year 3): EV = $300M x 6x = $1,800M.\n\nMinimum IRR occurs when equity proceeds are minimized, i.e. when the LEAST debt is paid down. The worst (minimum) case is that no debt is repaid: $600M still outstanding.\n\nEquity proceeds (min) = $1,800M - $600M = $1,200M.\nMoM = $1,200 / $600 = 2.0x over 3 years.\n\n2x in 3 years is a ~25% IRR (technically ~26%).\n\nSo the minimum IRR is ~25%. (If it repaid ALL the debt, proceeds would be the full $1,800M = 3x = ~45% IRR, so the range here is roughly 25%-45%.)", "tier": 4, "rank": 8226, "links": [{"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "Red Book: Private Equity Investing p.91", "h": "", "k": "ref"}, {"t": "Red Book: LBO Modeling p.104", "h": "", "k": "ref"}, {"t": "400Q guide: LBO p.119", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 437, "so": 12}, {"id": "S3227", "src": "supp", "section": "LBO Models – Calculations", "topic": "LBO", "q": "You buy a $100 EBITDA business at 10x, plan to exit in 5 years at 10x. You use 5x Debt/EBITDA and the company repays 50% of that debt over 5 years. By how much must EBITDA grow over 5 years to earn a 20% IRR?", "a": "Target return: a 20% 5-year IRR sits between 2x (~15%) and 3x (~25%), so target a 2.5x MoM.\n\nEntry: EV = $100 x 10x = $1,000. Debt = 5x x $100 = $500. Equity = $1,000 - $500 = $500.\n\nProceeds needed = 2.5 x $500 = $1,250.\n\nDebt repaid = 50% x $500 = $250, so $250 of debt remains at exit.\nRequired Exit Enterprise Value = equity proceeds + remaining debt = $1,250 + $250 = $1,500.\n\nExit multiple stays at 10x, so required exit EBITDA = $1,500 / 10 = $150.\n\nEBITDA must grow from $100 to $150 - a 50% increase over 5 years (~8.4% per year).", "tier": 4, "rank": 8227, "links": [{"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "Red Book: Private Equity Investing p.91", "h": "", "k": "ref"}, {"t": "Red Book: LBO Modeling p.104", "h": "", "k": "ref"}, {"t": "400Q guide: LBO p.119", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 438, "so": 12}, {"id": "S3230", "src": "supp", "section": "LBO Models – Calculations", "topic": "LBO", "q": "A PE firm buys a company at an 8x multiple ($200 EBITDA) using 50% debt, hopes to sell in 3 years but can't find a buyer, so it IPOs instead. EBITDA grows to $240, all debt is repaid in 3 years, and it sells its stake evenly across Years 3-5 at a 10x multiple. Approximate IRR.", "a": "Entry: EV = $200 x 8x = $1,600. Equity = $800, Debt = $800.\n\nExit proceeds: EV at exit = $240 x 10x = $2,400. All debt repaid, so equity proceeds = $2,400. MoM = $2,400 / $800 = 3x.\n\nTiming adjustment - the key trick: in an IPO exit the stake is sold gradually. Selling evenly across Years 3, 4, and 5 means the average year proceeds are received is Year 4.\n\n3x in 3 years = ~45%, 3x in 5 years = ~25%. With an average receipt year of 4, the IRR lands in between - approximate ~35% (actual ~32%).\n\nThe lesson: for IPO exits and dividend recaps, weight the IRR by the AVERAGE year cash is received, not the final year.", "tier": 4, "rank": 8230, "links": [{"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "Red Book: Private Equity Investing p.91", "h": "", "k": "ref"}, {"t": "Red Book: LBO Modeling p.104", "h": "", "k": "ref"}, {"t": "400Q guide: LBO p.119", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 439, "so": 12}, {"id": "S3237", "src": "supp", "section": "LBO Models – Calculations", "topic": "LBO", "q": "How does an add-on acquisition (buy-and-build / multiple arbitrage) boost LBO returns? Give the intuition with numbers.", "a": "A platform company bought at, say, 12x EBITDA acquires smaller add-ons at lower multiples - often 6x-8x - because small private targets command lower valuations. The acquired EBITDA is then valued at the platform's higher exit multiple. That gap is 'multiple arbitrage.'\n\nNumbers: platform has $100 EBITDA valued at 12x = $1,200. Buy an add-on with $20 EBITDA for 7x = $140. Combined EBITDA = $120. At a 12x exit, that $20 of acquired EBITDA is now worth 12x x $20 = $240 - instantly creating $240 - $140 = $100 of value, before any operational improvement.\n\nAdditional boosts: cost synergies raise combined margins, and a larger company often commands a higher exit multiple itself (scale premium).\n\nThis is why fragmented, growing industries make ideal LBO targets - they offer a deep pipeline of cheap add-ons.", "tier": 4, "rank": 8237, "links": [{"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "Red Book: Private Equity Investing p.91", "h": "", "k": "ref"}, {"t": "Red Book: LBO Modeling p.104", "h": "", "k": "ref"}, {"t": "400Q guide: LBO p.119", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 440, "so": 12}, {"id": "S3255", "src": "supp", "section": "Synthesis (supplemental)", "topic": "Synthesis", "q": "A strategic and a PE firm are both bidding for the same target. Why can the strategic usually pay a higher price, and how does that connect valuation, synergies, and the LBO 'floor'?", "a": "The strategic can usually pay more for two linked reasons:\n\n1) Synergies: a strategic in the same industry can cut duplicate costs and cross-sell, raising the target's post-deal cash flows. Those synergies justify a higher price - a portion of synergy value can be paid to the seller. A financial sponsor generally has no operating synergies (just financial engineering and operational improvement).\n\n2) Return constraint: the PE firm is bound by a target IRR (say 20-25%) over a finite hold and must use leverage, which caps what it can pay - this is why the LBO sets the 'floor' valuation. The strategic isn't return-constrained the same way; it can hold forever and value the asset on its own cash flows plus synergies.\n\nSynthesis answer: 'The DCF/comps give a standalone range; the LBO sets the floor because the sponsor is IRR-constrained; the strategic sits at the top because synergies let it justify a higher number. That's why auctions often clear to strategics.' The exception: a sponsor with a strong platform for add-ons (buy-and-build) can sometimes out-bid via multiple arbitrage.", "tier": 4, "rank": 8255, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 441, "so": 19}, {"id": "S3256", "src": "supp", "section": "Synthesis (supplemental)", "topic": "Synthesis", "q": "A company does an all-debt acquisition that is EPS-accretive in Year 1. Walk me through how that single transaction flows through all three financial statements in the first year.", "a": "Income Statement: add the target's revenue, expenses, and pre-tax income. Subtract new interest expense on the acquisition debt. Add any incremental D&A from asset write-ups (PP&E/intangibles stepped up in purchase accounting). The net effect on net income, divided by the SAME share count (no stock issued), gives the new EPS - accretive here because the target's after-tax earnings exceed the after-tax interest cost.\n\nCash Flow Statement: start from the higher combined net income; add back the incremental D&A (non-cash); the financing section shows the new debt raised and the cash used to buy the target (the actual acquisition outflow sits in investing). Net change in cash reflects deal funding and ongoing operations.\n\nBalance Sheet: Assets rise from the target's assets plus newly created Goodwill (purchase price over fair value of net identifiable assets) and asset write-ups. Liabilities rise by the new debt. Equity is roughly unchanged (no stock issued; retained earnings grow by combined net income). It balances because new Assets (target assets + goodwill + write-ups) = new Debt + acquired equity eliminated in consolidation.\n\nThe trap: forgetting the write-up D&A on the IS and the goodwill plug on the BS. Tie it together: 'Debt funds it, goodwill balances it, write-up D&A drags EPS slightly, but the deal still clears because earnings yield beats the after-tax cost of debt.'", "tier": 4, "rank": 8256, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 442, "so": 19}, {"id": "S3258", "src": "supp", "section": "Synthesis (supplemental)", "topic": "Synthesis", "q": "You're told a deal is accretive to EPS but DESTROYS value, and another is dilutive to EPS but CREATES value. How is each possible? Which matters more?", "a": "Accretive but value-destructive: a buyer can fund a deal cheaply (e.g., low-coupon debt or high-multiple stock) so combined EPS rises, yet still overpay relative to the target's intrinsic worth or pursue a poor strategic fit. EPS accretion is an accounting/financing artifact; it says nothing about whether the price was below the target's true value (NPV / IRR vs. WACC).\n\nDilutive but value-creative: a buyer might pay with expensive stock (low P/E) or take on near-term integration costs that depress Year-1 EPS, while acquiring an asset whose long-term cash flows have an IRR well above WACC. The deal creates value even though it dents near-term EPS.\n\nWhich matters more: in FINANCE THEORY, value creation (IRR > WACC, paying below intrinsic value) is what matters. In PRACTICE, EPS still moves the stock short-term because shareholders fixate on it. The sophisticated answer: 'EPS is a short-term signal that affects the share price; value creation is the real economic test. A good banker tracks both and explains the gap to the client.'", "tier": 4, "rank": 8258, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 443, "so": 19}, {"id": "S3259", "src": "supp", "section": "Synthesis (supplemental)", "topic": "Synthesis", "q": "Both a DCF and an LBO discount future cash flows, and both an LBO and a merger model involve a buyer paying for a target. Tie these three analyses together - what question does each really answer?", "a": "DCF: 'What is this company intrinsically WORTH, based on the present value of its unlevered free cash flows at WACC plus a terminal value?' Output: an intrinsic value range, independent of any buyer.\n\nLBO: 'What is the MOST a financial sponsor could PAY and still hit its target IRR over a finite hold using leverage?' Output: a return-constrained maximum price - the valuation FLOOR. It's a buyer-specific, return-driven lens, not an intrinsic-worth lens.\n\nMerger model: 'If a STRATEGIC buys this target, what happens to the buyer's EPS (accretion/dilution), given a funding mix and synergies?' Output: not a valuation - it's an impact analysis on the acquirer's earnings.\n\nThe synthesis: DCF and comps frame the intrinsic value; the LBO bounds the floor (sponsor's max); the merger model tells the strategic buyer whether the deal helps or hurts its EPS. Together they tell a client what the asset is worth, what a sponsor would pay, and what a strategic acquisition would do to its earnings.", "tier": 4, "rank": 8259, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}], "type": "compare", "flags": [], "n": 444, "so": 19}, {"id": "S3261", "src": "supp", "section": "Synthesis (supplemental)", "topic": "Synthesis", "q": "A company is deciding between (a) an all-stock acquisition and (b) a leveraged dividend recap of itself. Compare how each affects EPS, leverage, and shareholder value.", "a": "All-stock acquisition: issues NEW shares, so the share count rises - dilutive to EPS unless the target's earnings yield exceeds the buyer's cost of stock (1/P-E). Leverage is unchanged (no new debt). It adds the target's business and any synergies, growing the company; value creation depends on whether the price beats intrinsic value.\n\nLeveraged dividend recap: the company raises NEW DEBT and pays the cash out as a special dividend. EPS FALLS: interest expense on the new debt drags net income while the share count is unchanged (only if the proceeds instead funded a buyback could per-share metrics rise - a recap pays a dividend, it doesn't retire shares). Leverage jumps sharply. No new business is added - it simply returns capital and re-risks the balance sheet. Shareholders get cash now but own a more levered, riskier company.\n\nSynthesis answer: 'The acquisition is about GROWTH and uses equity currency (dilutive but expands the business); the recap is about RETURNING CAPITAL and uses debt (boosts leverage and risk, returns cash now). One bets on a target's future cash flows; the other monetizes the existing balance sheet's debt capacity.'", "tier": 4, "rank": 8261, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 445, "so": 19}, {"id": "S3262", "src": "supp", "section": "Synthesis (supplemental)", "topic": "Synthesis", "q": "Same EBITDA, same target. Explain why a DCF, a comps analysis, and an LBO can each produce a different value - and which you'd lead with in a fairness opinion for a board.", "a": "Why they differ:\n- DCF reflects the target's OWN projected cash flows and WACC - it can be high or low depending on growth/margin assumptions and terminal value. Most sensitive to assumptions.\n- Comps/precedent transactions reflect what the MARKET is paying for similar companies right now (comps) or what acquirers paid (precedents, which include control premiums). Precedents usually sit highest because of premiums and synergies.\n- LBO reflects what a SPONSOR could pay given a target IRR and leverage - typically the FLOOR, because it's return-constrained.\n\nSo you'd expect, roughly: LBO at the low end, public comps in the middle, DCF wherever the assumptions land, and precedent transactions at the top (premiums + synergies).\n\nWhat to lead with for a board fairness opinion: present a 'football field' of ALL methods as a range, but anchor on PRECEDENT TRANSACTIONS and PUBLIC COMPS for a sale, because they reflect realizable market/control prices - what a buyer would actually pay - while using the DCF for intrinsic support. The board cares what someone will really pay, so market-based methods lead, DCF supports.", "tier": 4, "rank": 8262, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 446, "so": 19}, {"id": "S3265", "src": "supp", "section": "Synthesis (supplemental)", "topic": "Synthesis", "q": "Tie together WACC, the M&A 'weighted cost of acquisition,' and an LBO's targeted IRR. All three involve a cost or required return - how do they differ and connect?", "a": "All three are 'hurdle' concepts but answer different questions:\n\nWACC: the blended after-tax required return on a company's capital (debt + equity), used as the DCF discount rate. It's the cost of financing the whole firm - a theoretical, intrinsic-value tool.\n\nM&A weighted cost of acquisition: the blended after-tax cost of the specific funding used for ONE deal - % cash x cost of cash + % debt x cost of debt + % stock x cost of stock (where cost of stock = 1/P-E, an earnings-yield view, NOT CAPM). Compared against the seller's earnings yield to judge accretion/dilution. It's an EPS-impact tool, not a valuation discount rate.\n\nLBO targeted IRR: the sponsor's required return on its EQUITY over a finite hold (e.g., 20-25%), well ABOVE WACC because equity is the riskiest, most levered slice and PE demands an illiquidity/risk premium. It's used to back into the maximum price (the floor).\n\nConnection: WACC values the firm; the weighted cost of acquisition tests a deal's earnings impact; the LBO IRR sets the sponsor's price ceiling. They're all 'required return' ideas but applied to firm value, EPS, and sponsor equity respectively - and they use cost of equity differently (CAPM in WACC, 1/P-E in M&A, an explicit high target in LBO).", "tier": 4, "rank": 8265, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}], "type": "concept", "flags": [], "n": 447, "so": 19}, {"id": "S3427", "src": "supp", "section": "Power / data-center theme (supplemental)", "topic": "Energy & Power", "q": "Walk me through a power-sector deal that captures the AI demand theme. (Model answer: Constellation Energy / Calpine.)", "a": "Background: Constellation agreed to acquire Calpine in January 2025 in a cash-and-stock deal — roughly $16.4B of equity value and about $26.6B including assumed debt (some sources cite ~$29B; verify the exact headline figure before quoting it). The deal closed in 2025.\n\nStrategic logic: it combined the largest US nuclear fleet (Constellation) with the largest gas and geothermal fleet (Calpine), creating the biggest US clean-and-dispatchable independent power producer. The thesis is firm capacity for AI-driven load growth: data centers need around-the-clock power, and nuclear plus flexible gas is exactly that product. It also diversified Constellation by geography and fuel, and management framed it as EPS-accretive.\n\nWhy this deal is a great interview answer: (1) it is the cleanest M&A expression of the decade's defining power theme — Constellation is also the counterparty on the Microsoft Three Mile Island/Crane restart PPA and Meta's 1.1 GW Clinton PPA, so one company connects the M&A and the hyperscaler-PPA stories; (2) the cash-and-stock structure lets you discuss consideration mix — cash adds leverage and locks value for sellers, stock preserves balance-sheet capacity and shares upside; (3) it frames the merchant-vs-regulated discussion — buying merchant generation is a bet that tight capacity markets and data-center demand keep power prices and spark spreads strong.\n\nRisks to volunteer: merchant power price exposure if the AI load forecast disappoints, integration of a huge gas fleet, and regulatory/market-power review in key regions. Pair it with NRG-LS Power (~$12B for ~13 GW of gas plants, May 2025) as the asset-deal comparison — bought below replacement cost, valued on $/kW.", "tier": 4, "rank": 8427, "links": [{"t": "Red Book: General Market Knowledge p.133", "h": "", "k": "ref"}], "type": "scenario", "flags": ["dated", "power-theme"], "n": 448, "so": 21}, {"id": "S3530", "src": "supp", "section": "Market Context (supplemental)", "topic": "Market Context", "q": "Tell me about a deal that captures the power/data-center theme. (Model answer: NRG Energy / LS Power.)", "a": "Four-part structure again: background, rationale, terms, opinion. Figures as of mid-2026 — verify current details and deal status before an interview.\n\nBackground: In May 2025, NRG Energy agreed to acquire LS Power's generation portfolio for roughly $12 billion — approximately 13 GW of gas-fired generation plus the CPower demand-response platform — roughly DOUBLING NRG's generation capacity in one transaction.\n\nRationale — this is the AI-power thesis in its purest form: data-center load growth is tightening power markets, especially PJM and ERCOT, and existing dispatchable gas plants have become scarce, strategic assets. Critically, NRG bought OPERATING plants at a price widely framed as below replacement cost — owning steel in the ground today beats spending more, and waiting years, to build new capacity into a market that needs power now.\n\nWhy it's a great interview deal: (1) it's an ASSET portfolio acquisition rather than corporate M&A — so the valuation conversation is $/kW against replacement cost and capacity-market economics, not P/E accretion; (2) it pairs naturally with the broader theme set — Constellation/Calpine on the corporate side, hyperscaler nuclear PPAs (Microsoft–Constellation, AWS–Talen, Meta–Constellation) on the contracting side; (3) it shows you understand WHY gas is winning this cycle: data centers need firm, dispatchable, 24/7 power, and renewables alone can't contract for that profile.\n\nOpinion (have one): strategically coherent and well-timed if load growth materializes as forecast; the risks are paying a cyclical-peak price for merchant gas exposure if AI demand forecasts disappoint, capacity-market and regulatory intervention as prices spike, and long-term carbon/transition risk on an enlarged gas fleet.\n\nFor an energy-focused candidate: this deal sits exactly at the energy/power intersection an energy-group interviewer will expect you to own — be ready to discuss spark spreads and why IPPs outperform regulated utilities when power markets tighten.", "tier": 4, "rank": 8530, "links": [{"t": "Red Book: General Market Knowledge p.133", "h": "", "k": "ref"}], "type": "scenario", "flags": ["dated", "power-theme"], "n": 449, "so": 20}, {"id": "J19", "src": "live", "section": "Real interview — Jefferies Round 1", "topic": "Real interview", "type": "walkthrough", "q": "How would an asset sale affect a company's pro forma leverage ratio?", "a": "It depends on what the asset sells for relative to current leverage, and what happens to the proceeds.\n\nPro forma leverage = (Debt – after-tax proceeds used to repay debt) ÷ (EBITDA – divested EBITDA)\n\nIf the proceeds repay debt, leverage falls only if the sale multiple is above current Debt/EBITDA.\nExample: Debt $400, EBITDA $100 (4.0x). The asset has $20 of EBITDA.\n• Sell at 6x ($120): $280 / $80 = 3.5x. Leverage falls.\n• Sell at 3x ($60): $340 / $80 = 4.25x. Leverage rises, even though debt went down.\n• Sell at exactly 4x: unchanged.\n\nIf proceeds go to a buyback or dividend instead, debt stays put while EBITDA falls, so leverage always rises. Taxes on the gain and fees reduce net proceeds, which raises the breakeven multiple.", "tip": "This is the leverage twin of IB 400 #399–400 (Q093/Q094, p.91), which asks about EV/EBITDA. Same intuition: compare the asset's multiple with the company's.", "tier": 4, "rank": 9818, "links": [{"t": "400Q guide: Asset sale (#8) p.91", "h": "", "k": "ref"}, {"t": "Jefferies R1 question list (Google Doc)", "h": "https://docs.google.com/document/d/1FkSL5OiLUkbFibMx5mcNKLGjU26kEgpVamN6fPJXPdw/edit?tab=t.0", "k": "web"}], "n": 450, "so": 22}, {"id": "J21", "src": "live", "section": "Real interview — Jefferies Round 1", "topic": "Real interview", "type": "concept", "q": "How does the sale affect the numerator and denominator of the leverage ratio?", "a": "Numerator (debt or net debt): falls by the net, after-tax proceeds applied to repay debt. If the proceeds sit on the balance sheet as cash, net debt falls by the same amount, but gross debt doesn't. Watch which definition the covenants use. If proceeds go to buybacks or dividends, the numerator doesn't change.\n\nDenominator (EBITDA): falls by the divested EBITDA, plus any stranded costs.\n\nBoth shrink, so which falls proportionally more decides the outcome. The breakeven is a sale multiple (on after-tax proceeds) equal to the current leverage multiple. Sell above it and leverage improves; sell below it and leverage gets worse.", "tip": "Finish on the breakeven sentence. It's the whole answer compressed.", "tier": 4, "rank": 9820, "links": [{"t": "400Q guide: Asset sale (#8) p.91", "h": "", "k": "ref"}, {"t": "Jefferies R1 question list (Google Doc)", "h": "https://docs.google.com/document/d/1FkSL5OiLUkbFibMx5mcNKLGjU26kEgpVamN6fPJXPdw/edit?tab=t.0", "k": "web"}], "n": 451, "so": 22}, {"id": "J22", "src": "live", "section": "Real interview — Jefferies Round 1", "topic": "Real interview", "type": "scenario", "q": "Would you recommend that the company sell the asset? Why or why not?", "a": "I'd frame it on value, balance sheet, and strategy.\n\nValue: is the sale multiple above the multiple the market gives the asset inside our company (roughly our own trading multiple)? Selling above it unlocks value; selling below it destroys value unless we have to.\nBalance sheet: does it delever us toward our target, protect the rating, or fix a covenant or maturity problem? A sale below our multiple can still be right if it avoids distress.\nStrategy and earnings: is the asset non-core, slower-growing, or lower-margin? Compare the lost EBITDA and earnings against interest saved or what we'd earn reinvesting the proceeds. Watch tax leakage, stranded costs and dis-synergies.\n\nMy answer: yes, if it's non-core and sells at or above our multiple with proceeds used to delever or reinvest at higher returns. No, if it's a core growth asset being sold cheaply just to make the leverage ratio look better.", "tip": "There's no right answer; they're grading the framework. Give a recommendation with conditions, not just 'it depends.'", "tier": 4, "rank": 9821, "links": [{"t": "400Q guide: Asset sale (#8) p.91", "h": "", "k": "ref"}, {"t": "Jefferies R1 question list (Google Doc)", "h": "https://docs.google.com/document/d/1FkSL5OiLUkbFibMx5mcNKLGjU26kEgpVamN6fPJXPdw/edit?tab=t.0", "k": "web"}], "n": 452, "so": 22}, {"id": "G03", "src": "live", "section": "Real interview — gotchas (MS, Guggenheim)", "topic": "Brainteaser / gotcha", "type": "trap", "q": "(Guggenheim, follow-up) Based on your answer, which company would screen cheaper on an EV/EBITDA basis, meaning a lower EV/EBITDA multiple?", "a": "On a simple screen, Company A (the owner) usually looks cheaper. Its EBITDA is inflated relative to B's because rent isn't deducted, so the same-ish Enterprise Value divided by a bigger EBITDA gives a lower multiple.\n\nThe gotcha: it's an accounting artifact, not a real difference in value.\n• A's EV includes the debt it used to buy the fleet. B's lease obligation is economically debt, but under US GAAP it's usually left out of EV, which pushes B's EV down too. So the comparison isn't apples-to-apples on either side.\n• To compare fairly, put both on the same basis. Either use EV including lease liabilities over EBITDAR, adding back rent, or capitalize B's leases (e.g., the lease liability, or rent × 7–8x as a rule of thumb) and add them to EV.\n\nAfter adjusting, two businesses with identical economics should trade at roughly the same multiple.", "tip": "Answer the screen first (A looks cheaper), then say 'but that's misleading' and show the fix. Getting walked to the answer is fine; they want to see you notice the mismatch.", "tier": 4, "rank": 9824, "links": [{"t": "400Q guide: Leases in EV p.74", "h": "", "k": "ref"}], "n": 453, "so": 23}, {"id": "Q040", "src": "400", "section": "Accounting – Calculations", "q": "A company that follows U.S. GAAP signs a 10-year Operating Lease on January 1. It will pay $160 in Rent each year. Assuming a 5% Discount Rate, walk me through the financial statements over this entire year. For simplicity, you may “round” and assume the Present Value of the lease payments equals $1,200.", "a": "Initially, the company records the Operating Lease Assets and Liabilities on its Balance Sheet ($1,200 on both sides), and then it records the $160 Rental Expense on its Income Statement. The 5% Discount Rate means that the initial “Interest Expense” is 5% * $1,200 = $60, so the “Depreciation” equals $160 – $60 = $100. Since the lease payments are constant, the Lease Principal Repayment equals the Depreciation here: • IS: Operating Expenses are up by $160 due to the Rent, so Pre-Tax Income falls by $160, and Net Income falls by $120 at a 25% tax rate. • CFS: Net Income is down by $120, but Operating Lease Assets and Liabilities increase by $1,200, which offset each other. Then, they both decrease by $100, which is also an offset. So, Cash is down by $120 at the bottom. • BS: On the Assets side, Cash is down by $120, and Operating Lease Assets are up by $1,100, so Total Assets are up by $980. On the L&E side, the Operating Lease Liabilities are up by $1,100, and Equity is down by $120, so the L&E side is up by $980, and both sides balance. • Intuition: Cash is down by $120 because this is a simple $160 cash expense with $40 in tax savings. The Lease Asset and Lease Liability are created and then decrease by the same $100 (they will decrease by larger amounts over time).", "tip": null, "tier": 5, "rank": 165, "links": [{"t": "400Q guide p.66", "h": "", "k": "ref"}, {"t": "Generalist PDF p.23", "h": "", "k": "ref"}, {"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book p.40", "h": "", "k": "ref"}], "rbq": ["What is the accounting treatment for operating leases?"], "n": 454, "so": 2}, {"id": "Q041", "src": "400", "section": "Accounting – Calculations", "q": "Now walk through the same scenario, but under IFRS rather than U.S. GAAP (or pretend it is a Finance Lease under U.S. GAAP).", "a": "Under IFRS, the company records Depreciation of $1,200 / 10 = $120 per year and an initial Interest Expense of $1,200 * 5% = $60. The Lease Principal Repayment = Cash Rental Expense – Interest Expense = $160 – $60 = $100. • IS: Depreciation is up by $120, and the Interest Expense is up by $60, so Pre-Tax Income is down by $180, and Net Income falls by $135 at a 25% tax rate. • CFS: Net Income is down by $135, but you add back the $120 of Depreciation and record the $1,200 additions to the Lease Assets and Liabilities (which offset each other). Also, you record a negative $100 for the Lease Principal Repayment. Cash is down by $115 at the bottom. • BS: Cash is down by $115, and the Lease Assets are up by $1,080 due to the initial $1,200 increase and the $120 of Depreciation, so Total Assets are up by $965. On the other side, the Lease Liabilities are up by $1,100, and Equity is down by $135 due to the reduced Net Income, so both sides are up by $965 and balance. • Intuition: Cash is down by $115 because the total Cash Lease Expense here is $160, but the company gets a tax benefit for the $180 of Lease Interest + Lease Depreciation that appears on the Income Statement. So, ($160) + $180 * 25% = ($115).", "tip": null, "tier": 5, "rank": 166, "links": [{"t": "400Q guide p.67", "h": "", "k": "ref"}, {"t": "Generalist PDF p.24", "h": "", "k": "ref"}, {"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book p.26", "h": "", "k": "ref"}, {"t": "Red Book p.39", "h": "", "k": "ref"}], "rbq": ["What is the accounting treatment for operating leases?", "What is the accounting treatment for finance leases?"], "n": 455, "so": 2}, {"id": "Q044", "src": "400", "section": "Accounting – Calculations", "q": "At the end of this first year, the company sells its factories for $220 and uses the proceeds to repay its remaining Debt principal after realizing there is little demand for its products. Walk through this step SEPARATELY from the previous two. Assume that the Net PP&E balance is $180, and the Debt is $190 because of changes in the previous step.", "a": "The Net PP&E selling price is $220, and its Book Value is $180, so we record a Gain of $40: • IS: The Realized Gain of $40 increases Pre-Tax Income by $40 and Net Income by $30 at a 25% tax rate. • CFS: Net Income is up by $30, but the $40 Gain is non-cash, so it’s reversed in the CFO section. Then, in Cash Flow from Investing, the full sale proceeds of $220 are recorded as a cash inflow. The $190 Debt repayment is shown as a negative in Cash Flow from Financing. So, Cash at the bottom is up by $20. • BS: Cash is up by $20, and Net PP&E is down by $180, so Total Assets are down by $160. On the L&E side, Debt is down by $190, and CSE is up by $30 because of the increased Net Income, so both sides are down by $160 and balance. • Intuition: The Realized Gain would normally boost Cash by $30 after taxes. However, this full $30 does not flow into Cash because the Debt Repayment exceeds the reduction in Net PP&E by $10. As a result, Cash is up by $20 instead of $30.", "tip": null, "tier": 5, "rank": 167, "links": [{"t": "400Q guide p.69", "h": "", "k": "ref"}, {"t": "Generalist PDF p.26", "h": "", "k": "ref"}, {"t": "BIWS module 02", "h": "", "k": "ref"}, {"t": "Red Book: Financial Statements & Accrual Concepts p.13", "h": "", "k": "ref"}], "rbq": [], "n": 456, "so": 2}, {"id": "Q070", "src": "400", "section": "Equity Value & Enterprise Value – Calculations", "q": "A company has 10,000 shares outstanding and a current share price of $20.00. It also has 100 options at an exercise price of $10.00, 50 Restricted Stock Units (RSUs), and 100 convertible bonds at a conversion price of $10.00 and a par value of $100. What is its Diluted Equity Value?", "a": "For this type of question, you should ask to write down the numbers. Since the options are in-the-money, you assume they get exercised, so 100 new shares are created. The company receives 100 * $10.00, or $1,000, in proceeds. Its share price is $20.00, so it can repurchase 50 shares with these proceeds. There are now 50 net additional shares outstanding. You add the 50 RSUs as if they were common shares, so now there’s a total of 100 additional shares outstanding. The company’s share price of $20.00 exceeds the conversion price of $10.00, so the convertible bonds can convert into shares. Divide the par value by the conversion price to determine the shares per bond: $100 / $10.00 = 10 new shares per bond There are 100 individual convertible bonds, so they create 100 * 10 = 1,000 new shares. These changes create 1,100 additional shares, so the diluted share count is now 11,100, and the Diluted Equity Value is 11,100 * $20.00, or $222,000.", "tip": "For converts: shares per bond = par ÷ conversion price. Convert if price > conversion price; if converted, EXCLUDE the bonds from Net Debt — double-counting converts is the classic error here.", "tier": 5, "rank": 168, "links": [{"t": "400Q guide p.80", "h": "", "k": "ref"}, {"t": "Generalist PDF p.37", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book p.45", "h": "", "k": "ref"}, {"t": "Red Book p.47", "h": "", "k": "ref"}], "rbq": ["Equity Value = Latest Closing Share Price × Total Diluted Shares Outstanding How do you calculate the fully diluted number of shares outstanding?", "How are convertible bonds and preferred equity with a convertible feature accounted for when calculating enterprise value?"], "n": 457, "so": 4}, {"id": "Q090", "src": "400", "section": "Valuation Metrics and Multiples", "q": "A company has $100 in Revenue, a 15% EBIT margin, and D&A that is 5% of its Revenue. The company’s Equity Value is $100, and it has $20 of Cash, $40 of Debt, and $30 in Lease Liabilities. What is its TEV / EBITDA multiple?", "a": "EBITDA = $100 * 15% + $100 * 5% = $20. TEV = $100 – $20 + 40 = $120. Therefore, TEV / EBITDA = 6x. The treatment of the Lease Liabilities here is uncertain because we don’t know if this company follows U.S. GAAP or IFRS or if these are Operating or Finance Leases. To explain the correct treatment, you must request these details (see the next question).", "tip": null, "tier": 5, "rank": 169, "links": [{"t": "400Q guide p.89", "h": "", "k": "ref"}, {"t": "Generalist PDF p.46", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book p.27", "h": "", "k": "ref"}, {"t": "Red Book p.71", "h": "", "k": "ref"}], "rbq": ["D&A) and non-recurring items. EBITDA Margin = EBITDA Revenue What do the phrases “above the line” and “below the line” mean?", "When should you value a company using a revenue multiple vs. EBITDA?"], "n": 458, "so": 6}, {"id": "Q091", "src": "400", "section": "Valuation Metrics and Multiples", "q": "For clarity, the company I just described followed U.S. GAAP, and the Lease Liabilities were for Operating Leases. Now, imagine that this company followed IFRS rather than U.S. GAAP. How would the EBIT margin and D&A percentages change, and how would the TEV / EBITDA change?", "a": "Under IFRS, the EBIT margin would be higher because only one component of the Operating Lease Expense would be deducted: The Lease Depreciation. Under U.S. GAAP, the entire Rental Expense is deducted. The D&A percentage would also be higher because D&A under IFRS includes Lease Depreciation as well. So, the EBITDA margin would be higher under IFRS because it would exclude or add back the entire Operating Lease Expense so that the EBITDA would be higher than $15. The TEV / EBITDA multiple would likely stay about the same because under IFRS, you would add the Lease Liabilities to calculate Enterprise Value (you would need more numbers to predict the exact change).", "tip": null, "tier": 5, "rank": 170, "links": [{"t": "400Q guide p.90", "h": "", "k": "ref"}, {"t": "Generalist PDF p.47", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book: Relative Valuation p.65", "h": "", "k": "ref"}], "rbq": [], "n": 459, "so": 6}, {"id": "Q099", "src": "400", "section": "Valuation Metrics and Multiples", "q": "A company’s Operating Income is $100, and it has a $500 Debt balance at a 4% interest rate. It also has Cash of $100, currently earning 0% interest. If the company’s Equity Value is $600, its P / E multiple is 12x, and its tax rate is 25%, what can you conclude about its Enterprise Value?", "a": "An Equity Value of $600 and a P / E multiple of 12x means the company’s “apparent” Net Income is $600 / 12 = $50. The company’s Operating Income is $100, and it pays $500 * 4% = $20 in Interest Expense per year, with no Interest Income. So, its Pre-Tax Income is $80, and its Net Income “should be” $60 at a 25% tax rate. However, it is clearly lower than that, so the most likely explanation is that the company has Preferred Stock in its capital structure. For example, if the company had $10 in Preferred Dividends, the Net Income would be $60, and the Net Income to Common would be $50 (which you use in the P / E multiple). We don’t know the exact amount of Preferred Stock, but the company’s Enterprise Value must be higher than $600 – $100 + $500 = $1000 due to it.", "tip": null, "tier": 5, "rank": 171, "links": [{"t": "400Q guide p.93", "h": "", "k": "ref"}, {"t": "Generalist PDF p.50", "h": "", "k": "ref"}, {"t": "BIWS module 03", "h": "", "k": "ref"}, {"t": "Red Book p.69", "h": "", "k": "ref"}], "rbq": ["Why would it be incorrect to use enterprise value and net income in a multiple?"], "n": 460, "so": 6}, {"id": "Q151", "src": "400", "section": "Merger Models – Calculations", "q": "Company A has a P / E of 11x, a Debt Interest Rate of 8%, a Cash Interest Rate of 4%, and a Tax Rate of 25%. It wants to acquire Company B at a purchase P / E multiple of 20x using 1/3 Stock, 1/3 Debt, and 1/3 Cash. Will the deal be accretive?", "a": "Company A’s After-Tax Cost of Stock is 1 / 11, or ~9%, its After-Tax Cost of Debt is 8% * (1 – 25%) = 6%, and its After-Tax Cost of Cash is 4% * (1 – 25%) = 3%. Company B’s Purchase Yield is 1 / 20, or 5%. The Weighted Cost of Acquisition is 9% * 1/3 + 6% * 1/3 + 3% * 1/3 = 3% + 2% + 1% = 6%. The deal will be dilutive since the Weighted Cost exceeds Company B’s Purchase Yield.", "tip": null, "tier": 5, "rank": 172, "links": [{"t": "400Q guide p.115", "h": "", "k": "ref"}, {"t": "Generalist PDF p.72", "h": "", "k": "ref"}, {"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book: Accretion/Dilution Modeling p.81", "h": "", "k": "ref"}], "rbq": [], "n": 461, "so": 10}, {"id": "Q152", "src": "400", "section": "Merger Models – Calculations", "q": "Company A, with a current P / E multiple of 20x, acquires Company B for a P / E purchase multiple of 10x using 100% Debt. What interest rate on Debt would make the deal dilutive? Assume a 25% tax rate.", "a": "Company B’s Yield is 1 / 10, or 10%, so the After-Tax Cost of Debt must be above 10% for the deal to be dilutive. At a 25% tax rate, 10% / (1 – 25%) = ~13.3%, which you can round to “Around 13%” (mental math: 75% of 10% is 7.5%, but we’re trying to find the number that 10% is 75% of  So it must be higher by at least 2.5%, which you can round up to ~13%). Most companies do not pay 13% interest rates on their Debt, so a 100% Debt will almost certainly be accretive.", "tip": null, "tier": 5, "rank": 173, "links": [{"t": "400Q guide p.115", "h": "", "k": "ref"}, {"t": "Generalist PDF p.72", "h": "", "k": "ref"}, {"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book: Accretion/Dilution Modeling p.81", "h": "", "k": "ref"}], "rbq": [], "n": 462, "so": 10}, {"id": "Q153", "src": "400", "section": "Merger Models – Calculations", "q": "Company A has an Equity Value of $2,000 and a Net Income of $200. Company B has a Purchase Equity Value of $1,200 and a Net Income of $100. How much in Synergies must be realized for a 100% Stock deal to be accretive?", "a": "Company A’s P / E is $2,000 / $200 = 10x, so its Cost of Stock is 1 / 10 = 10%. Company B’s Purchase P / E is $1,200 / $100 = 12x, so its Yield is 1 / 12, or ~8.3%. Therefore, without Synergies, this deal would be slightly dilutive. Company B’s Purchase Yield must exceed 10% for the deal to turn accretive. This means its Purchase P / E multiple must be below 10x, which means its Net Income must be above $120 (since $1,200 / $120 = 10x). Therefore, there must be $20 in After-Tax Synergies for this deal to be accretive. At a 25% tax rate, that means ~$27 in Pre-Tax Synergies.", "tip": null, "tier": 5, "rank": 174, "links": [{"t": "400Q guide p.116", "h": "", "k": "ref"}, {"t": "Generalist PDF p.73", "h": "", "k": "ref"}, {"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book: Accretion/Dilution Modeling p.81", "h": "", "k": "ref"}], "rbq": [], "n": 463, "so": 10}, {"id": "Q154", "src": "400", "section": "Merger Models – Calculations", "q": "Continuing with this same example, Company A is paying a 20% premium for Company B, so Company B’s Current Equity Value is $1,000. Suppose the market doesn’t “like” this 20% premium, and investors sell off Company A’s stock. How would Company A’s stock price change? Assume it has 200 shares outstanding at $10.00 per share and assume that Company B gets a fixed share count in the deal.", "a": "The Combined Equity Value in a deal normally equals the Acquirer’s Equity Value + Stock Issued in the Deal, so it’s $2,000 + $1,200 = $3,200 here before the market’s reaction. If the market does not believe in this premium, the Combined Equity Value will fall by the premium paid, so it will go from $3,200 to $3,000 here. We know that Company A has 200 shares and that Company B gets $1,200 / $10.00 = 120 shares because the question states “fixed share count.” Therefore, the post-market-reaction share price is $3,000 / 320 = ~$9.38, which you could round to “between $9.00 and $10.00” (mental math: $3,000 / 300 = $10.00 and $3,000 / ~333 = $9.00). The intuition is that this drop of $0.62 is ~6.2% of Company A’s share price, and $200 is ~6.2% of the $3,200 Combined Equity Value.", "tip": null, "tier": 5, "rank": 175, "links": [{"t": "400Q guide p.116", "h": "", "k": "ref"}, {"t": "Generalist PDF p.73", "h": "", "k": "ref"}, {"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book p.83", "h": "", "k": "ref"}, {"t": "Red Book p.84", "h": "", "k": "ref"}], "rbq": ["How do you calculate the transaction value?", "How do you calculate the offer value in an M&A deal?"], "n": 464, "so": 10}, {"id": "Q155", "src": "400", "section": "Merger Models – Calculations", "q": "Continuing with the same scenario, your co-worker reviews the changes and claims that Company A's share price would not have fallen if this had been a 100% Cash or Debt deal. Are they correct?", "a": "No. In this case of a “disappearing purchase premium,” both the Combined Equity Value and the Combined Enterprise Value fall by the purchase premium regardless of the financing. In this example, Company B still gets a $1,200 Purchase Equity Value in a 100% Cash deal, even if the market disapproves of this 20% premium. So, Company A still pays $1,200 of Cash to do the deal, which means the Combined Cash balance is lower by $1,200. That normally boosts the Combined Enterprise Value by $1,200. But in this case, Company A’s Equity Value will fall by $200 to reflect the “disappeared purchase premium,” so the Combined Enterprise Value will be up by $1,000 rather than $1,200. The only difference is that if it’s a 100% Cash or Debt deal, Company A’s share price falls by $1.00 rather than $0.62 since $200 / 200 shares = $1.00.", "tip": null, "tier": 5, "rank": 176, "links": [{"t": "400Q guide p.117", "h": "", "k": "ref"}, {"t": "Generalist PDF p.74", "h": "", "k": "ref"}, {"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "Red Book: Accretion/Dilution Modeling p.81", "h": "", "k": "ref"}], "rbq": [], "n": 465, "so": 10}, {"id": "Q177", "src": "400", "section": "LBO Models – Calculations", "q": "A PE firm acquires a business for a 12x EBITDA multiple, using 5x Debt / EBITDA, and plans to sell it in 5 years. The company’s initial EBITDA is $100, which grows to $200 by Year 5. If there’s no Debt repayment and no additional Cash generation, what exit multiple do we need for a 25% IRR?", "a": "Initially, we buy the company for an Enterprise Value of $1,200 using Debt of $500 and Investor Equity of $700. To realize a 25% IRR over 5 years, we need to triple our money by earning $2,100 in proceeds at the end. No Debt is repaid, so we need to sell the company for an Exit Enterprise Value of $2,600. Therefore, if EBITDA grows to $200 by Year 5, we need an exit multiple of $2,600 / $200 = 13x.", "tip": null, "tier": 5, "rank": 177, "links": [{"t": "400Q guide p.127", "h": "", "k": "ref"}, {"t": "Generalist PDF p.84", "h": "", "k": "ref"}, {"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "Red Book: LBO Modeling p.104", "h": "", "k": "ref"}], "rbq": [], "n": 466, "so": 12}, {"id": "Q178", "src": "400", "section": "LBO Models – Calculations", "q": "Now assume the company repays 75% of the initial Debt balance over 5 years. What exit multiple do we need for a 25% 5-year IRR?", "a": "75% of $500 in Debt is $375, which means that $125 in Debt remains at the end. We still contributed $700 in Investor Equity initially and, therefore, need to earn back $2,100 in proceeds at the end. So, we must sell the company for an Exit Enterprise Value of $2,100 + $125 = $2,225. As a result, we need an exit multiple of $2,225 / $200 = 11.1x (you can round this to 11x since $2,200 / $200 = 11x).", "tip": null, "tier": 5, "rank": 178, "links": [{"t": "400Q guide p.127", "h": "", "k": "ref"}, {"t": "Generalist PDF p.84", "h": "", "k": "ref"}, {"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "Red Book p.100", "h": "", "k": "ref"}, {"t": "Red Book p.105", "h": "", "k": "ref"}], "rbq": ["A private equity firm has tripled its initial investment in five years, estimate the IRR?", "DCF and comps approaches. When analyzing the viability of undertaking an LBO, how do private equity firms estimate the company's value in the exit year?"], "n": 467, "so": 12}, {"id": "Q179", "src": "400", "section": "LBO Models – Calculations", "q": "You’re reviewing the output of an LBO model that a co-worker built. In the model, the 5- year IRR is 20%, and the company’s EBITDA grows from $100 to $150 over the holding period. The EBITDA purchase multiple is 10x, and the exit multiple is 11x. If the PE firm uses 5x Debt / EBITDA in the initial deal, how much Debt does the company repay over time?", "a": "A 20% IRR over 5 years means the MoM multiple is approximately 2.5x. The Purchase TEV is $100 * 10x = $1,000, and $100 * 5x = $500 of Debt is used, so the Investor Equity is $500. Therefore, the PE firm must earn back $500 * 2.5x = $1,250 in exit equity proceeds. The Exit TEV is $150 * 11 = $150 * 10 + $150 = $1,500 + $150 = $1,650, which means that $400 of Net Debt remains at the end. Assuming Cash stays the same, the company must repay $100 of the initial Debt balance over this period.", "tip": null, "tier": 5, "rank": 179, "links": [{"t": "400Q guide p.127", "h": "", "k": "ref"}, {"t": "Generalist PDF p.84", "h": "", "k": "ref"}, {"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "Red Book p.105", "h": "", "k": "ref"}], "rbq": ["DCF and comps approaches. When analyzing the viability of undertaking an LBO, how do private equity firms estimate the company's value in the exit year?"], "n": 468, "so": 12}, {"id": "Q180", "src": "400", "section": "LBO Models – Calculations", "q": "A PE firm acquires a business for a 10x EBITDA multiple, using 6x Debt / EBITDA, and plans to sell it in 5 years. The company’s initial EBITDA is $100, which grows to $150 by Year 5. Approximately $300 of Debt is also repaid during the holding period, while Cash stays the same. What exit multiple does the firm need for a 25% IRR?", "a": "Initially, we buy the company for an Enterprise Value of $1,000 using Debt of $600 and Investor Equity of $400. To realize a 25% IRR over 5 years, we need to triple our money by earning $1,200 in proceeds at the end. Of the $600 in initial Debt, $300 is repaid, so the ending Debt balance is $300. Ignoring Cash for simplicity, the Exit Enterprise Value must be $1,200 + $300 = $1,500. Therefore, if EBITDA grows to $150 by Year 5, we need an exit multiple of $1,500 / $150 = 10x, which is the same as the purchase multiple.", "tip": null, "tier": 5, "rank": 180, "links": [{"t": "400Q guide p.128", "h": "", "k": "ref"}, {"t": "Generalist PDF p.85", "h": "", "k": "ref"}, {"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "Red Book: LBO Modeling p.104", "h": "", "k": "ref"}], "rbq": [], "n": 469, "so": 12}, {"id": "S3263", "src": "supp", "section": "Synthesis (supplemental)", "topic": "Synthesis", "q": "A target carries a large Net Operating Loss (NOL) balance and an underfunded pension. How do these affect (1) what a strategic acquirer would pay in M&A and (2) a PE firm's LBO returns?", "a": "NOLs (tax assets): they shelter future taxable income, raising after-tax cash flow.\n- M&A: a strategic with taxable income can USE the NOLs to reduce taxes, adding value - though Section 382 limits how fast acquired NOLs can be used after a change of control, so the benefit is capped/spread out. A buyer may pay somewhat more for usable NOLs.\n- LBO: NOLs are valuable to a sponsor too (more cash flow to pay down debt), but the highly levered structure already generates an interest tax shield that may absorb much of the taxable income, reducing the marginal benefit of the NOLs. Still a modest positive.\n\nUnderfunded pension (a debt-like liability): it's a future cash obligation.\n- M&A: treated as 'murky' - it doesn't raise the upfront purchase price, but it's a real long-term cost the buyer assumes, so a careful buyer treats it like debt and reduces the price it's willing to pay (effectively adding it to enterprise value).\n- LBO: a sponsor is especially wary - it's a fixed cash drain competing with debt service, hurting cash flow available for debt paydown and thus IRR. It also reduces debt capacity. Sponsors discount the price accordingly or avoid such targets.\n\nSynthesis: NOLs are a value-additive tax asset (more useful to a profitable strategic; partly redundant with an LBO's tax shield); the underfunded pension is a debt-like drag that lowers the price both buyers will pay - and bites a sponsor harder because it competes with leverage.", "tier": 5, "rank": 8263, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 470, "so": 19}, {"id": "S3266", "src": "supp", "section": "Synthesis (supplemental)", "topic": "Synthesis", "q": "A buyer pays for a target 50% with stock and 50% with debt. The target's purchase P/E is 18x; the buyer's P/E is 12x and its after-tax cost of debt is 4%. Is the deal accretive, and what does the combined leverage and balance sheet picture look like?", "a": "Accretion test - weighted cost of acquisition vs. seller's yield:\n- Cost of stock = 1/12 = ~8.3%.\n- After-tax cost of debt = 4%.\n- Weighted cost = 50% x 8.3% + 50% x 4% = 4.15% + 2.0% = ~6.15%.\n- Seller's yield = 1/18 = ~5.6%.\n\nWeighted cost (~6.15%) > seller's yield (~5.6%), so the deal is DILUTIVE. The cheap debt isn't enough to offset the expensive stock (buyer's low 12x multiple = high 8.3% cost of stock) against a richly priced 18x target.\n\nBalance sheet / leverage: the debt half raises the combined company's debt and leverage (Debt/EBITDA up), increasing interest and risk. The stock half raises share count and equity, diluting existing holders. Assets rise by the target's assets + goodwill (purchase price over fair value of net assets) + any write-ups.\n\nSynthesis point: the funding mix simultaneously drives EPS (dilutive here), leverage (up via the debt portion), and ownership (diluted via the stock portion). To make it accretive the buyer would need to shift toward debt, find synergies to lift the seller's effective yield, or negotiate a lower purchase multiple.", "tier": 5, "rank": 8266, "links": [{"t": "BIWS module 05", "h": "", "k": "ref"}, {"t": "BIWS module 04", "h": "", "k": "ref"}, {"t": "BIWS module 06", "h": "", "k": "ref"}], "type": "scenario", "flags": [], "n": 471, "so": 19}];
const NOTES = [{"topic": "Core Finance Concepts", "pdf": "01 Core-Concepts.pdf", "pages": "30 pp", "href": "01%20Core-Concepts.pdf", "body": "<p>These are the building blocks behind every technical question. You rarely get asked them head-on, but you cannot answer DCF, LBO, or merger questions without them. Master the intuition, not just the formulas.</p><h4>What Financial Modeling Actually Is</h4><p>A financial model is a simplified blueprint of a business used to make a decision: should we buy this stock, do this deal, or lend this money? You forecast revenue, expenses, and cash flow, then judge whether the implied assumptions are realistic. A model never <em>dictates</em> a decision; it quantifies a view so you can defend it with numbers. Three core model types map to three jobs: valuation (DCF, comps), merger models (M&A advisory), and LBO models (private equity).</p><h4>Time Value of Money</h4><p>A dollar today is worth more than a dollar tomorrow because you can invest it and because of risk and inflation. This single idea drives all of valuation: future cash flows must be <b>discounted</b> back to today.</p><ul><li><b>Future Value:</b> FV = PV x (1 + r)^n</li><li><b>Present Value:</b> PV = FV / (1 + r)^n</li><li>Higher discount rate or longer time horizon means a lower present value.</li></ul><p><em>Mental-math tip:</em> the Rule of 72 — money doubles in roughly 72 / r years. At a 10% return, capital doubles in about 7.2 years; useful for sanity-checking LBO returns.</p><h4>PV, NPV, IRR, and WACC</h4><p>These four terms describe the same machinery from different angles.</p><ul><li><b>NPV</b> = sum of all discounted cash flows minus upfront cost. Positive NPV means value-creating.</li><li><b>IRR</b> is the discount rate that sets NPV to zero — the annualized return implied by the cash flows. You accept a project when IRR exceeds the required return (the hurdle rate).</li><li><b>WACC</b> (Weighted Average Cost of Capital) is the blended required return of all investors — debt and equity — and is the standard discount rate for a company's unlevered cash flows. WACC = (E/V) x Cost of Equity + (D/V) x Cost of Debt x (1 - Tax Rate).</li></ul><p><em>Trap:</em> interviewers love asking why you tax-affect the cost of debt — because interest is tax-deductible, so the after-tax cost is lower. Equity has no such shield, which is one reason cost of equity is higher than cost of debt.</p><h4>The Most Important Formula in Finance</h4><p>Any cash-generating asset is worth the present value of its expected future cash flows. The compact version for a growing perpetuity is the Gordon Growth model:</p><table><tr><th>Concept</th><th>Formula</th></tr><tr><td>Value of a perpetuity</td><td>Value = Cash Flow / Discount Rate</td></tr><tr><td>Growing perpetuity</td><td>Value = CF x (1 + g) / (r - g)</td></tr></table><p>This is exactly the logic behind a DCF terminal value. The takeaway: value rises with higher cash flow and growth, and falls with higher risk (a higher discount rate). If r is less than or equal to g the formula breaks, which is why your long-term growth rate must stay below the discount rate (and below long-run GDP, roughly 2-3%).</p><h4>Why Modeling Is Hard</h4><p>The math is simple arithmetic; the difficulty is in the <b>assumptions</b>. Small changes in growth, margins, or the discount rate swing the output dramatically. Good analysts stress-test drivers and present a range, not a single false-precision number. <em>Interview tip:</em> when asked to value a company with no data, default to 'I would project its cash flows and discount them back, or apply a multiple to a peer set' — that one sentence shows you understand the whole edifice.</p>"}, {"topic": "Accounting & The 3 Statements", "pdf": "02 Basic-Accounting-3-Statements.pdf", "pages": "90 pp", "href": "02%20Basic-Accounting-3-Statements.pdf", "body": "<p>The three statements are the most heavily tested topic in any IB interview. You must be able to link them in your sleep and trace a single change all the way through. This is table stakes for an associate.</p><h4>The Three Statements and What They Do</h4><ul><li><b>Income Statement:</b> shows profitability over a period. Top line is Revenue; subtract COGS to get Gross Profit, subtract operating expenses to get Operating Income (EBIT), subtract interest and taxes to reach Net Income. It is accrual-based, not cash.</li><li><b>Balance Sheet:</b> a snapshot at a point in time. Assets = Liabilities + Shareholders' Equity. It must always balance.</li><li><b>Cash Flow Statement:</b> reconciles accrual Net Income to actual cash. Three sections: Cash Flow from Operations, Investing, and Financing. It exists because the income statement contains non-cash items and timing differences.</li></ul><h4>How They Link</h4><p>Net Income flows from the bottom of the income statement to the top of the Cash Flow Statement and into Retained Earnings on the balance sheet. The ending cash balance from the CFS feeds the cash line on the balance sheet. Depreciation reduces net income but is added back on the CFS because it is non-cash. PP&E, debt, and equity changes link investing and financing to the balance sheet.</p><h4>The Classic Question: Depreciation Increases by $10</h4><p>This is the single most common technical question. Assume a 40% tax rate.</p><ul><li><b>Income Statement:</b> Pre-tax income falls $10, taxes fall $4, so Net Income falls $6.</li><li><b>Cash Flow Statement:</b> Net Income down $6, but add back the $10 non-cash depreciation, so cash from operations rises $4. Cash at the bottom is up $4.</li><li><b>Balance Sheet:</b> Cash up $4 on the assets side; PP&E down $10 (accumulated depreciation), so assets fall $6 net. On the other side, Retained Earnings falls $6 from lower Net Income. Both sides down $6 — it balances.</li></ul><p><em>The lesson:</em> a non-cash expense saves you cash equal to the expense times the tax rate. That $4 is the depreciation tax shield, which reappears in DCF and LBO.</p><h4>Working Capital and Cash vs. Accrual</h4><p>Working capital is Current Assets (excluding cash) minus Current Liabilities (excluding debt). An <b>increase</b> in working capital (e.g., rising receivables or inventory) is a <b>use</b> of cash; a decrease is a source. This is why a growing company can be profitable yet cash-starved. Revenue is recognized when earned, not when cash is received — that gap lives in accounts receivable and deferred revenue.</p><h4>Other High-Frequency Traps</h4><ul><li><b>Inventory up $10 (cash purchase):</b> no income statement impact yet; CFS shows cash down $10 from the working capital build; balance sheet has inventory up $10 and cash down $10 — balances. Once sold, COGS hits the income statement.</li><li><b>Most important statement?</b> The Cash Flow Statement — you cannot fake cash, and it tells you whether the business is actually self-funding.</li><li><b>Negative shareholders' equity:</b> common after an LBO or large buybacks; not necessarily distress.</li><li><b>Accrued expenses and deferred revenue:</b> both create timing differences between earnings and cash.</li></ul><p><em>Interview tip:</em> always state your tax rate assumption out loud and walk the statements in order — Income Statement, then Cash Flow, then Balance Sheet — and finish by confirming the balance sheet balances. That structure alone signals competence.</p><h4>Visual: How the three statements link</h4><svg viewBox='0 0 660 250' xmlns='http://www.w3.org/2000/svg' style='width:100%;max-width:660px;font-family:inherit'>\n<rect x='10' y='20' width='180' height='90' rx='8' fill='var(--cream)' stroke='var(--navy)' stroke-width='1.5'/>\n<text x='100' y='42' text-anchor='middle' font-size='13' font-weight='700' fill='var(--navy)'>Income Statement</text>\n<text x='100' y='62' text-anchor='middle' font-size='10.5' fill='var(--ink)'>Revenue − Expenses</text>\n<text x='100' y='78' text-anchor='middle' font-size='10.5' fill='var(--ink)'>= Net Income</text>\n<text x='100' y='96' text-anchor='middle' font-size='9.5' fill='var(--muted)'>(accrual, over a period)</text>\n<rect x='240' y='20' width='180' height='90' rx='8' fill='var(--cream)' stroke='var(--navy)' stroke-width='1.5'/>\n<text x='330' y='42' text-anchor='middle' font-size='13' font-weight='700' fill='var(--navy)'>Cash Flow Stmt</text>\n<text x='330' y='60' text-anchor='middle' font-size='10' fill='var(--ink)'>NI + non-cash (D&amp;A, SBC)</text>\n<text x='330' y='75' text-anchor='middle' font-size='10' fill='var(--ink)'>± ΔWC → CFO + CFI + CFF</text>\n<text x='330' y='94' text-anchor='middle' font-size='10' fill='var(--ink)'>= Net change in cash</text>\n<rect x='470' y='20' width='180' height='90' rx='8' fill='var(--cream)' stroke='var(--navy)' stroke-width='1.5'/>\n<text x='560' y='42' text-anchor='middle' font-size='13' font-weight='700' fill='var(--navy)'>Balance Sheet</text>\n<text x='560' y='62' text-anchor='middle' font-size='10.5' fill='var(--ink)'>Assets = Liabilities + Equity</text>\n<text x='560' y='80' text-anchor='middle' font-size='9.5' fill='var(--muted)'>(snapshot at a point in time)</text>\n<path d='M190 50 L236 50' stroke='var(--accent)' stroke-width='2' marker-end='url(#ah)'/>\n<text x='213' y='44' text-anchor='middle' font-size='9' fill='var(--accent)' font-weight='600'>NI</text>\n<path d='M420 50 L466 50' stroke='var(--accent)' stroke-width='2' marker-end='url(#ah)'/>\n<text x='443' y='44' text-anchor='middle' font-size='9' fill='var(--accent)' font-weight='600'>cash</text>\n<path d='M100 110 C 100 190, 470 190, 545 112' stroke='var(--green)' stroke-width='2' fill='none' marker-end='url(#ah2)'/>\n<text x='330' y='178' text-anchor='middle' font-size='10' fill='var(--green)' font-weight='600'>Net Income → Retained Earnings (Equity)</text>\n<path d='M560 110 C 560 215, 330 230, 330 114' stroke='var(--amber)' stroke-width='2' fill='none' marker-end='url(#ah3)' stroke-dasharray='4 3'/>\n<text x='452' y='225' text-anchor='middle' font-size='10' fill='
